<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wallet500 Performance Monitor</title><style>body{margin:0;background:#03070c;color:#eef8ff;font:14px Arial}.w{max-width:1100px;margin:auto;padding:14px}.p{border:1px solid #18364c;background:#07131e;padding:14px;margin-bottom:10px}.g{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.k,.r{border:1px solid #24475f;background:#081722;padding:10px}.m{color:#86a3b7;font-size:10px}.n{font-size:24px;font-weight:800;margin-top:6px}.ok{color:#55e4ad}.bad{color:#ff7380}.r{margin-top:8px}.top{display:flex;justify-content:space-between}.mini{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:6px}.mini div{border:1px solid #273843;padding:6px}@media(max-width:760px){.g{grid-template-columns:repeat(2,1fr)}.mini{grid-template-columns:1fr 1fr}}</style></head><body><div class="w"><div class="p"><h1>WALLET500 PERFORMANCE MONITOR</h1><div class="m">Separate $1 cohort and market-quality monitor</div></div><div class="g"><div class="k"><div class="m">VERIFIED</div><div id="a" class="n">—</div></div><div class="k"><div class="m">MARKET READY</div><div id="b" class="n ok">—</div></div><div class="k"><div class="m">BLOCKED</div><div id="c" class="n bad">—</div></div><div class="k"><div class="m">VALUE</div><div id="d" class="n">—</div></div><div class="k"><div class="m">ROI</div><div id="e" class="n">—</div></div></div><div class="p"><h3>MARKET READY</h3><div id="good">Loading…</div></div><div class="p"><h3>BLOCKED NOW</h3><div id="bad">Loading…</div></div></div><script>const $=x=>document.getElementById(x),m=v=>'$'+Number(v||0).toFixed(4),sh=x=>x?x.slice(0,8)+'…'+x.slice(-5):'—';function row(x,ok){return `<div class="r"><div class="top"><b>${(x.chain||'').toUpperCase()} ${sh(x.token)}</b><b class="${ok?'ok':'bad'}">${Number(x.current_return_pct||0).toFixed(2)}%</b></div><div class="mini"><div>ENTRY<br>${m(x.entry_price_usd)}</div><div>NOW<br>${m(x.current_price_usd)}</div><div>LIQ<br>${m(x.liquidity_usd)}</div><div>VOL H1<br>${m(x.volume_h1)}</div></div><div class="m">${(x.block_reasons||[]).join(' · ')||x.execution_status}</div></div>`}async function main(){const r=await fetch('../data/realizable-performance.json?v='+Date.now(),{cache:'no-store'});const x=await r.json();$('a').textContent=x.verified_rows_seen;$('b').textContent=x.market_execution_plausible_count;$('c').textContent=x.not_realizable_now_count;$('d').textContent=m(x.market_execution_plausible_value_usd);$('e').textContent=Number(x.market_execution_plausible_roi_pct||0).toFixed(2)+'%';$('good').innerHTML=(x.plausible_rows||[]).slice(0,100).map(y=>row(y,true)).join('')||'—';$('bad').innerHTML=(x.blocked_rows||[]).slice(0,100).map(y=>row(y,false)).join('')||'—'}main();setInterval(main,60000)</script></body></html>
