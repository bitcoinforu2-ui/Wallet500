<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#05080d">
<title>Wallet500 Live</title>
<style>
:root{--bg:#05080d;--card:#0b121b;--line:#203040;--txt:#f3f7fb;--mut:#91a3b4;--g:#44dfa1;--r:#ff6677;--y:#ffc857;--b:#43bfff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font-family:Arial,sans-serif}.w{max-width:980px;margin:auto;padding:12px}header,.box,.coin{background:var(--card);border:1px solid var(--line);border-radius:12px}header{padding:16px}h1{font-size:25px;margin:0}.sub{color:var(--mut);margin-top:5px}.status{margin-top:10px;font-weight:800}.green{color:var(--g)}.red{color:var(--r)}.yellow{color:var(--y)}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}.box{padding:12px}.lab{font-size:11px;color:var(--mut)}.num{font-size:25px;font-weight:900;margin-top:5px;direction:ltr;text-align:right}.coins{display:grid;gap:9px}.coin{padding:13px}.top{display:flex;justify-content:space-between;gap:10px;align-items:center}.name{font-size:18px;font-weight:900}.chain{font-size:11px;color:var(--mut)}.roi{font-size:26px;font-weight:900;direction:ltr}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}.v{border-top:1px solid var(--line);padding-top:7px;font-size:14px;direction:ltr;text-align:right}.pair{font:10px monospace;color:var(--mut);word-break:break-all;margin-top:10px;direction:ltr;text-align:left}.links{display:flex;gap:7px;margin-top:10px;flex-wrap:wrap}.links a{display:inline-block;padding:8px 11px;border:1px solid #236286;border-radius:8px;color:#7bd6ff;text-decoration:none;font-weight:800;font-size:12px}.meta{font-size:11px;color:var(--mut);margin:10px 0}.empty{padding:20px;text-align:center;color:var(--mut)}.gate{margin-top:8px;font-size:11px;font-weight:800}.badcoin{border-color:#66303a}@media(max-width:650px){.kpis{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr 1fr}.num{font-size:22px}}
</style>
</head>
<body><div class="w">
<header><h1>WALLET500 · ניסוי LIVE</h1><div class="sub">$1 לכל כניסה · Exact Pair · Liquidity ≥ $50K · נתוני DexScreener חיים</div><div id="status" class="status yellow">טוען נתונים…</div></header>
<section class="kpis">
<div class="box"><div class="lab">מטבעות בניסוי</div><div class="num" id="count">—</div></div>
<div class="box"><div class="lab">ברי־מסחר עכשיו</div><div class="num" id="tradable">—</div></div>
<div class="box"><div class="lab">חסומי Survival</div><div class="num" id="blocked">—</div></div>
<div class="box"><div class="lab">תשואה על marks זמינים</div><div class="num" id="roi">—</div></div>
</section>
<div class="meta" id="meta">—</div><section class="coins" id="coins"></section>
</div>
<script>
const MIN_LIQ=50000;
const $=x=>document.getElementById(x),usd=n=>n==null?'—':'$'+Number(n).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:8}),pc=n=>(Number(n)>=0?'+':'')+Number(n||0).toFixed(2)+'%',cc=n=>Number(n)>0?'green':Number(n)<0?'red':'yellow',short=x=>x?String(x).slice(0,8)+'…'+String(x).slice(-6):'—';
async function data(n){let r=await fetch('../data/'+n+'?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error(n+' '+r.status);return r.json()}
function dex(c,p){return'https://dexscreener.com/'+String(c).toLowerCase()+'/'+p}
function explorer(c,t){c=String(c).toLowerCase();return c==='solana'?'https://solscan.io/token/'+t:c==='ethereum'?'https://etherscan.io/token/'+t:'https://bscscan.com/token/'+t}
async function mark(p){try{let u='https://api.dexscreener.com/latest/dex/pairs/'+String(p.chain).toLowerCase()+'/'+p.pair_address,r=await fetch(u+'?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error(r.status);let j=await r.json(),x=(j.pairs||[]).find(a=>String(a.pairAddress).toLowerCase()===String(p.pair_address).toLowerCase());if(!x)throw Error('exact_pair_unavailable');let price=Number(x.priceUsd||0),liq=Number(x.liquidity?.usd||0),vol=Number(x.volume?.h1||0),cost=Number(p.cost_usd||1),val=Number(p.quantity||0)*price,roi=cost?(val/cost-1)*100:0;let pairExact=String(x.pairAddress).toLowerCase()===String(p.pair_address).toLowerCase();let tradable=pairExact&&price>0&&liq>=MIN_LIQ;return{...p,quote_ok:true,pairExact,tradable,price,val,roi,liq,vol,symbol:x.baseToken?.symbol||short(p.token),gate:tradable?'VERIFIED_TRADABLE':'FAILED_SURVIVAL'} }catch(e){return{...p,quote_ok:false,pairExact:false,tradable:false,gate:'UNRESOLVED_EXACT_PAIR',err:String(e.message||e)}}}
function card(p){let r=Number(p.roi||0),state=p.tradable?'LIVE':p.quote_ok?'FAILED SURVIVAL':'UNRESOLVED',cls=p.tradable?'green':'red';return`<article class="coin ${p.tradable?'':'badcoin'}"><div class="top"><div><div class="name">#${p.rank||'—'} ${p.symbol||short(p.token)}</div><div class="chain">${String(p.chain||'').toUpperCase()} · השקעה $${Number(p.cost_usd||1).toFixed(2)}</div></div><div class="roi ${p.quote_ok?cc(r):'yellow'}">${p.quote_ok?pc(r):'לא זמין'}</div></div><div class="grid"><div><div class="lab">מחיר כניסה</div><div class="v">${usd(p.entry_price_usd)}</div></div><div><div class="lab">מחיר עכשיו</div><div class="v">${p.quote_ok?usd(p.price):'—'}</div></div><div><div class="lab">שווי $1</div><div class="v">${p.quote_ok?usd(p.val):'—'}</div></div><div><div class="lab">נזילות עכשיו</div><div class="v ${p.tradable?'green':'red'}">${p.quote_ok?usd(p.liq):'—'}</div></div><div><div class="lab">ווליום H1</div><div class="v">${p.quote_ok?usd(p.vol):'—'}</div></div><div><div class="lab">מצב</div><div class="v ${cls}">${state}</div></div></div><div class="gate ${cls}">${p.tradable?'✓ Exact Pair + Liquidity ≥ $50K':'✕ לא נחשב Verified Tradable'}</div><div class="pair">PAIR ${p.pair_address||'—'}</div><div class="links"><a target="_blank" rel="noopener" href="${dex(p.chain,p.pair_address)}">פתח ב‑DexScreener ↗</a><a target="_blank" rel="noopener" href="${explorer(p.chain,p.token)}">Explorer ↗</a></div></article>`}
async function main(){try{let l=await data('blocked-cohort-paper-ledger.json');if(l.mode!=='PAPER_ONLY_REVALIDATED_TOP10_EXPERIMENT_V2')throw Error('mode');let ps=await Promise.all((l.positions||[]).map(mark)),tradable=ps.filter(x=>x.tradable),blocked=ps.filter(x=>!x.tradable),marked=ps.filter(x=>x.quote_ok),cost=marked.reduce((a,x)=>a+Number(x.cost_usd||1),0),val=marked.reduce((a,x)=>a+Number(x.val||0),0),roi=cost?(val/cost-1)*100:0;$('count').textContent=ps.length+' / 10';$('tradable').textContent=tradable.length+' / '+ps.length;$('tradable').className='num '+(tradable.length?'green':'yellow');$('blocked').textContent=blocked.length;$('blocked').className='num '+(blocked.length?'red':'green');$('roi').textContent=pc(roi);$('roi').className='num '+cc(roi);$('coins').innerHTML=ps.length?ps.map(card).join(''):'<div class="empty">עדיין אין כניסות מאומתות.</div>';$('meta').textContent='Exact-pair marks '+marked.length+'/'+ps.length+' · Verified tradable '+tradable.length+' · Liquidity gate $50,000 · עדכון '+new Date().toLocaleString();$('status').textContent=blocked.length?'● SURVIVAL GATE ACTIVE · '+blocked.length+' אינן ברות־מסחר כרגע':'● LIVE · כל ה‑Exact Pairs עוברים Survival';$('status').className='status '+(blocked.length?'yellow':'green')}catch(e){$('status').textContent='● שגיאת נתונים: '+e.message;$('status').className='status red';$('coins').innerHTML='<div class="empty">הדאש ממתין לנתוני הניסוי.</div>'}}
main();setInterval(main,60000)
</script></body></html>
