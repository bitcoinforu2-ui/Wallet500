<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#05080d"><title>Wallet500 Live</title><style>:root{--bg:#05080d;--card:#0b121b;--line:#203040;--txt:#f3f7fb;--mut:#91a3b4;--g:#44dfa1;--r:#ff6677;--y:#ffc857;--b:#43bfff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font-family:Arial,sans-serif}.w{max-width:980px;margin:auto;padding:12px}header,.box,.coin{background:var(--card);border:1px solid var(--line);border-radius:12px}header{padding:16px}h1{font-size:25px;margin:0}.sub{color:var(--mut);margin-top:5px}.status{margin-top:10px;font-weight:800}.green{color:var(--g)}.red{color:var(--r)}.yellow{color:var(--y)}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}.box{padding:12px}.lab{font-size:11px;color:var(--mut)}.num{font-size:25px;font-weight:900;margin-top:5px;direction:ltr;text-align:right}.coins{display:grid;gap:9px}.coin{padding:13px}.top{display:flex;justify-content:space-between;gap:10px;align-items:center}.name{font-size:18px;font-weight:900}.chain{font-size:11px;color:var(--mut)}.roi{font-size:26px;font-weight:900;direction:ltr}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}.v{border-top:1px solid var(--line);padding-top:7px;font-size:14px;direction:ltr;text-align:right}.pair{font:10px monospace;color:var(--mut);word-break:break-all;margin-top:10px;direction:ltr;text-align:left}.links{display:flex;gap:7px;margin-top:10px;flex-wrap:wrap}.links a{display:inline-block;padding:8px 11px;border:1px solid #236286;border-radius:8px;color:#7bd6ff;text-decoration:none;font-weight:800;font-size:12px}.meta{font-size:11px;color:var(--mut);margin:10px 0}.empty{padding:20px;text-align:center;color:var(--mut)}@media(max-width:650px){.kpis{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr 1fr}.num{font-size:22px}}</style></head><body><div class="w"><header><h1>WALLET500 · ניסוי LIVE</h1><div class="sub">$1 לכל כניסה · Exact Pair · נתוני DexScreener חיים</div><div id="status" class="status yellow">טוען נתונים…</div></header><section class="kpis"><div class="box"><div class="lab">מטבעות בניסוי</div><div class="num" id="count">—</div></div><div class="box"><div class="lab">שווי נוכחי</div><div class="num" id="value">—</div></div><div class="box"><div class="lab">רווח / הפסד</div><div class="num" id="pnl">—</div></div><div class="box"><div class="lab">תשואה כוללת</div><div class="num" id="roi">—</div></div></section><div class="meta" id="meta">—</div><section class="coins" id="coins"></section></div><script>const $=x=>document.getElementById(x),usd=n=>'$'+Number(n||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:8}),pc=n=>(Number(n)>=0?'+':'')+Number(n||0).toFixed(2)+'%',cc=n=>Number(n)>0?'green':Number(n)<0?'red':'yellow',short=x=>x?String(x).slice(0,8)+'…'+String(x).slice(-6):'—';async function data(n){let r=await fetch('../data/'+n+'?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error(n+' '+r.status);return r.json()}function dex(c,p){return'https://dexscreener.com/'+String(c).toLowerCase()+'/'+p}function explorer(c,t){c=String(c).toLowerCase();return c==='solana'?'https://solscan.io/token/'+t:c==='ethereum'?'https://etherscan.io/token/'+t:'https://bscscan.com/token/'+t}async function mark(p){try{let u='https://api.dexscreener.com/latest/dex/pairs/'+String(p.chain).toLowerCase()+'/'+p.pair_address,r=await fetch(u+'?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error(r.status);let j=await r.json(),x=(j.pairs||[]).find(a=>String(a.pairAddress).toLowerCase()===String(p.pair_address).toLowerCase());if(!x)throw Error('pair');let price=Number(x.priceUsd||0),val=Number(p.quantity||0)*price,cost=Number(p.cost_usd||1);return{...p,ok:true,price,val,roi:(val/cost-1)*100,liq:Number(x.liquidity?.usd||0),vol:Number(x.volume?.h1||0),symbol:x.baseToken?.symbol||short(p.token)}}catch(e){return{...p,ok:false}}}function card(p){let r=Number(p.roi||0);return`<article class="coin"><div class="top"><div><div class="name">#${p.rank||'—'} ${p.symbol||short(p.token)}</div><div class="chain">${String(p.chain||'').toUpperCase()} · השקעה $${Number(p.cost_usd||1).toFixed(2)}</div></div><div class="roi ${p.ok?cc(r):'yellow'}">${p.ok?pc(r):'לא זמין'}</div></div><div class="grid"><div><div class="lab">מחיר כניסה</div><div class="v">${usd(p.entry_price_usd)}</div></div><div><div class="lab">מחיר עכשיו</div><div class="v">${p.ok?usd(p.price):'—'}</div></div><div><div class="lab">שווי $1</div><div class="v">${p.ok?usd(p.val):'—'}</div></div><div><div class="lab">נזילות</div><div class="v">${p.ok?usd(p.liq):'—'}</div></div><div><div class="lab">ווליום H1</div><div class="v">${p.ok?usd(p.vol):'—'}</div></div><div><div class="lab">מצב</div><div class="v ${p.ok?'green':'red'}">${p.ok?'LIVE':'UNRESOLVED'}</div></div></div><div class="pair">PAIR ${p.pair_address||'—'}</div><div class="links"><a target="_blank" rel="noopener" href="${dex(p.chain,p.pair_address)}">פתח ב‑DexScreener ↗</a><a target="_blank" rel="noopener" href="${explorer(p.chain,p.token)}">Explorer ↗</a></div></article>`}async function main(){try{let l=await data('blocked-cohort-paper-ledger.json');if(l.mode!=='PAPER_ONLY_REVALIDATED_TOP10_EXPERIMENT_V2')throw Error('mode');let ps=await Promise.all((l.positions||[]).map(mark)),live=ps.filter(x=>x.ok),cost=live.reduce((a,x)=>a+Number(x.cost_usd||1),0),val=live.reduce((a,x)=>a+x.val,0),pnl=val-cost,roi=cost?pnl/cost*100:0;$('count').textContent=ps.length+' / 10';$('value').textContent=usd(val);$('pnl').textContent=(pnl>=0?'+':'')+usd(pnl);$('pnl').className='num '+cc(pnl);$('roi').textContent=pc(roi);$('roi').className='num '+cc(roi);$('coins').innerHTML=ps.length?ps.map(card).join(''):'<div class="empty">עדיין אין כניסות מאומתות.</div>';$('meta').textContent='LIVE '+live.length+'/'+ps.length+' · Eligible עכשיו '+Number(l.eligible_revalidated_pool||0)+' · עדכון '+new Date().toLocaleString();$('status').textContent=live.length===ps.length&&ps.length?'● LIVE · כל ה‑Exact Pairs מחוברים':'● PARTIAL · חלק מהמחירים לא זמינים';$('status').className='status '+(live.length===ps.length&&ps.length?'green':'yellow')}catch(e){$('status').textContent='● שגיאת נתונים: '+e.message;$('status').className='status red';$('coins').innerHTML='<div class="empty">הדאש ממתין לנתוני הניסוי.</div>'}}main();setInterval(main,60000)</script></body></html>
