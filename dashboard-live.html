<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#05080d">
<title>Wallet500 · Live Radar</title>
<style>
:root{--bg:#05080d;--card:#0b121b;--line:#203040;--txt:#f4f7fb;--mut:#91a3b4;--g:#45dfa1;--r:#ff6677;--y:#ffc857;--o:#ff9f43;--b:#43bfff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font-family:Arial,sans-serif}.w{max-width:1050px;margin:auto;padding:12px 12px 80px}.hero,.box,.coin{background:var(--card);border:1px solid var(--line);border-radius:14px}.hero{padding:16px}.hero h1{font-size:27px;margin:0}.sub{color:var(--mut);margin-top:7px;line-height:1.45}.status{margin-top:10px;font-weight:900}.green{color:var(--g)}.red{color:var(--r)}.yellow{color:var(--y)}.orange{color:var(--o)}.blue{color:var(--b)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}.box{padding:11px}.lab{font-size:11px;color:var(--mut)}.num{font-size:24px;font-weight:900;margin-top:5px;direction:ltr;text-align:right}.toolbar{display:flex;gap:7px;overflow:auto;padding:5px 0 10px;scrollbar-width:none}.toolbar button{white-space:nowrap;background:#0d1721;color:var(--txt);border:1px solid #294257;border-radius:999px;padding:9px 12px;font-weight:800}.toolbar button.on{border-color:#4cbddd;color:#7bdcff;background:#0c1d28}.sectionTitle{display:flex;justify-content:space-between;align-items:end;margin:10px 2px 8px}.sectionTitle h2{font-size:19px;margin:0}.meta{font-size:11px;color:var(--mut)}
.coins{display:grid;gap:9px}.coin{padding:13px}.coin.hot{border-color:#7a343d}.coin.early{border-color:#765e26}.coin.verified{border-color:#25634c}.coin.watch{border-color:#275b78}.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.name{font-size:19px;font-weight:900;direction:ltr;text-align:right}.source{font-size:11px;color:var(--mut);margin-top:3px}.badge{font-size:11px;font-weight:900;border:1px solid currentColor;border-radius:999px;padding:5px 8px;white-space:nowrap}.score{font-size:24px;font-weight:900;direction:ltr}.why{margin-top:9px;font-size:13px;line-height:1.45}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}.v{border-top:1px solid var(--line);padding-top:6px;font-size:14px;direction:ltr;text-align:right}.timeline{margin-top:10px;padding:8px;border:1px solid #1f3445;border-radius:9px;font-size:11px;color:#bed0df;line-height:1.55}.pair{font:10px monospace;color:var(--mut);word-break:break-all;margin-top:8px;direction:ltr;text-align:left}.links{display:flex;gap:7px;margin-top:8px;flex-wrap:wrap}.links a,.links .disabled{display:inline-block;padding:7px 10px;border:1px solid #236286;border-radius:8px;color:#7bd6ff;text-decoration:none;font-weight:800;font-size:11px}.links .disabled{border-color:#4a4f55;color:#7f8992;background:#0a0f14;cursor:not-allowed}.empty{padding:28px;text-align:center;color:var(--mut);border:1px dashed #294057;border-radius:12px}.warn{padding:9px 11px;border:1px solid #6e5926;border-radius:10px;color:var(--y);font-size:12px;margin-bottom:9px;display:none}
@media(max-width:650px){.kpis{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr 1fr}.num{font-size:22px}.hero h1{font-size:24px}.name{font-size:17px}}
</style>
<style id="w500-sticky-rubric-source">/* W500_FIXED_RUBRIC_V2 */#w500-experiment-rubric{position:fixed!important;top:0!important;left:0!important;right:0!important;width:100%!important;z-index:2147483000!important;background:rgba(2,8,13,.99)!important;box-shadow:0 4px 14px rgba(0,0,0,.55)!important;-webkit-overflow-scrolling:touch!important;box-sizing:border-box!important}body{padding-top:46px!important}</style>
</head>
<body><div class="w">
<section class="hero"><h1>🔥 מה קורה עכשיו · LIVE RADAR</h1><div class="sub">100% מטבעות ותיקים בלבד. כל מטבע גלוי חייב לעבור AGE VERIFIED ≥ 180 DAYS. גיל לא ידוע, זהות עמומה או מטבע צעיר נחסמים לפני התצוגה.</div><div id="status" class="status yellow">טוען תמונת מצב…</div></section>
<section class="kpis"><div class="box"><div class="lab">🔥 HOT</div><div class="num" id="hot">—</div></div><div class="box"><div class="lab">🟠 EARLY REVIVAL</div><div class="num" id="early">—</div></div><div class="box"><div class="lab">🟢 VERIFIED DEX</div><div class="num" id="verified">—</div></div><div class="box"><div class="lab">✅ AGE VERIFIED 180D+</div><div class="num" id="total">—</div></div></section>
<div id="warn" class="warn"></div>
<div class="toolbar"><button class="on" data-f="ALL">הכל</button><button data-f="HOT">🔥 HOT</button><button data-f="EARLY">🟠 EARLY REVIVAL</button><button data-f="VERIFIED">🟢 VERIFIED</button><button data-f="WATCH">👀 WATCH</button></div>
<div class="sectionTitle"><h2>מטבעות ותיקים שהמערכת מזהה בהם פעילות</h2><div id="meta" class="meta">—</div></div><section id="coins" class="coins"></section>
</div>
<script>
const $=id=>document.getElementById(id), pc=n=>(Number(n)>=0?'+':'')+Number(n||0).toFixed(2)+'%', usd=n=>n==null||!isFinite(Number(n))?'—':'$'+Number(n).toLocaleString(undefined,{maximumFractionDigits:Number(n)<1?8:2});let FILTER='ALL';
async function data(name){const tries=['data/'+name,'../data/'+name,'/Wallet500/data/'+name];let last;for(const p of tries){try{const r=await fetch(p+'?v='+Date.now(),{cache:'no-store'});if(r.ok)return await r.json();last=Error(name+' '+r.status)}catch(e){last=e}}throw last||Error(name)}
function cleanSymbol(s){return String(s||'').replace(/USDT$/,'')||'UNKNOWN'}
function mature(x){return x?.market_age_verified===true&&Number(x?.market_age_min_days||0)>=180}
function cexStatus(a){const score=Number(a.cex_revival_score||a.score||0),acc=Number(a.price_acceleration_coherent_pct??a.price_acceleration_max_pct??0),ch=Number(a.change_24h_max_pct||0);if(score>=75&&Number(a.confirmations||0)>=2)return'HOT';if(score>=55||acc>=2||ch>=8)return'EARLY';return'WATCH'}
function dexStatus(r){if(r.qualification==='QUALIFIED'&&r.live_survival_gate==='ACTIVE'&&r.pair_identity_locked===true&&String(r.pair_address||'').toLowerCase()===String(r.locked_pair_address||'').toLowerCase())return'VERIFIED';return'WATCH'}
function statusMeta(s){return s==='HOT'?['🔥 HOT','red','hot']:s==='EARLY'?['🟠 EARLY REVIVAL','orange','early']:s==='VERIFIED'?['🟢 VERIFIED','green','verified']:['👀 WATCH','blue','watch']}
function refMarket(a){const ms=a.markets||[];return ms.slice().sort((x,y)=>Number(y.volume_24h||0)-Number(x.volume_24h||0))[0]||{}}
function cexRow(a){const m=refMarket(a),mil=a.milestones||{};return{kind:'CEX',status:cexStatus(a),symbol:cleanSymbol(a.symbol),score:Number(a.cex_revival_score||a.score||0),price:Number(m.price||0)||null,change:Number(a.change_24h_max_pct||m.change_24h_pct||0),acc:Number(a.price_acceleration_coherent_pct??a.price_acceleration_max_pct??0),vol:Number(m.volume_24h||0),confirmations:Number(a.confirmations||0),why:(a.reasons||[]).slice(0,3),exchanges:a.exchanges||[],firstSeen:mil.first_seen,firstAnomaly:mil.first_anomaly,firstAlert:mil.first_alert,generated:a.generated_at,dexUrl:a.dex_url||a.dexscreener_url||null,dexIdentityVerified:a.dex_identity_verified===true||a.dex_verified===true,ageVerified:a.market_age_verified===true,ageDays:Number(a.market_age_min_days||0),ageEvidence:a.market_age_evidence_at,ageSource:a.market_age_evidence_source}}
function dexRow(r){return{kind:'DEX',status:dexStatus(r),symbol:r.base_token_symbol||String(r.token||'').slice(0,10),score:Number(r.anomaly_score||0),price:Number(r.price_usd||0)||null,change:Number(r.live_current_return_pct||r.price_change_h1||0),acc:Number(r.price_change_m5||0),vol:Number(r.live_volume_h1||r.volume_h1||0),liq:Number(r.live_liquidity_usd||r.liquidity_usd||0),why:(r.reasons||r.qualification_reasons||[]).slice(0,3),chain:r.chain,pair:r.pair_address,token:r.token,dex:r.dex,url:r.url,observed:r.observed_at,qualified:r.qualified_at,ageVerified:r.market_age_verified===true,ageDays:Number(r.market_age_min_days||0),ageEvidence:r.market_age_evidence_at,ageSource:r.market_age_evidence_source}}
function timeText(x){if(!x)return'—';const t=x.observed_at||x;try{return new Date(t).toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'})}catch(e){return'—'}}
function verifiedDexLink(x){if(x.kind==='DEX'&&x.url)return x.url;if(x.kind==='CEX'&&x.dexIdentityVerified&&x.dexUrl)return x.dexUrl;return null}
function card(x){const [label,color,cls]=statusMeta(x.status);let timeline='';if(x.kind==='CEX'){timeline=`<div class="timeline"><b>ציר זיהוי:</b> FIRST SEEN ${timeText(x.firstSeen)} · FIRST ANOMALY ${timeText(x.firstAnomaly)} · FIRST ALERT ${timeText(x.firstAlert)}<br><b>AGE VERIFIED:</b> ≥ ${Math.floor(x.ageDays)} days · בורסות: ${(x.exchanges||[]).join(', ')||'—'}</div>`}else{timeline=`<div class="timeline"><b>DEX evidence:</b> observed ${timeText(x.observed)} · qualified ${timeText(x.qualified)} · Exact Pair ${x.status==='VERIFIED'?'LOCKED ✓':'לא מאומת מלא'}<br><b>AGE VERIFIED:</b> ≥ ${Math.floor(x.ageDays)} days</div>`}
const dexHref=verifiedDexLink(x);const links=`<div class="links">${dexHref?`<a target="_blank" rel="noopener" href="${dexHref}">DexScreener ↗</a>`:`<span class="disabled" title="אין contract/pair מאומת למטבע הזה">DEX לא אומת</span>`}</div>`;const pair=x.kind==='DEX'?`<div class="pair">PAIR ${x.pair||'—'}</div>`:'';return`<article class="coin ${cls}"><div class="top"><div><div class="name">${x.symbol}</div><div class="source">${x.kind==='CEX'?'CEX REVIVAL · '+x.confirmations+' confirmations':'MATURE DEX · '+String(x.chain||'').toUpperCase()+' · '+(x.dex||'DEX')} · AGE ≥ ${Math.floor(x.ageDays)}d</div></div><div style="text-align:left"><div class="badge ${color}">${label}</div><div class="score ${color}">${Math.round(x.score)}/100</div></div></div><div class="why"><b>למה ברדאר:</b> ${(x.why||[]).join(' · ')||'אות מערכת פעיל'}</div><div class="grid"><div><div class="lab">מחיר עכשיו</div><div class="v">${usd(x.price)}</div></div><div><div class="lab">שינוי / מומנטום</div><div class="v ${x.change>=0?'green':'red'}">${pc(x.change)}</div></div><div><div class="lab">Acceleration</div><div class="v">${pc(x.acc)}</div></div><div><div class="lab">${x.kind==='DEX'?'Liquidity':'Volume 24H'}</div><div class="v">${usd(x.kind==='DEX'?x.liq:x.vol)}</div></div></div>${timeline}${pair}${links}</article>`}
function render(rows){const filtered=FILTER==='ALL'?rows:rows.filter(x=>x.status===FILTER);$('coins').innerHTML=filtered.length?filtered.map(card).join(''):'<div class="empty">אין כרגע מטבע ותיק ומאומת בקטגוריה הזאת.</div>'}
async function main(){let errors=[];let cex=null,dex=null;try{cex=await data('cex-revival-radar.json')}catch(e){errors.push('CEX Radar לא נטען')}try{dex=await data('active-qualified-candidates.json')}catch(e){errors.push('DEX candidates לא נטען')}const rows=[];if(cex){if(cex.age_gate?.status!=='ENFORCED_FAIL_CLOSED'||Number(cex.age_gate?.minimum_market_age_days||0)!==180){errors.push('CEX AGE GATE 180D לא מאומת — CEX נחסם מהתצוגה')}else if(Array.isArray(cex.alerts)){rows.push(...cex.alerts.filter(mature).slice(0,25).map(a=>cexRow({...a,generated_at:cex.generated_at})))}}if(Array.isArray(dex)){const matureDex=dex.filter(mature);if(dex.length&&matureDex.length<dex.length)errors.push((dex.length-matureDex.length)+' מועמדי DEX נחסמו כי גיל 180D+ לא אומת');rows.push(...matureDex.slice(0,15).map(dexRow))}rows.sort((a,b)=>({HOT:4,EARLY:3,VERIFIED:2,WATCH:1}[b.status]-{HOT:4,EARLY:3,VERIFIED:2,WATCH:1}[a.status])||b.score-a.score);$('hot').textContent=rows.filter(x=>x.status==='HOT').length;$('early').textContent=rows.filter(x=>x.status==='EARLY').length;$('verified').textContent=rows.filter(x=>x.status==='VERIFIED').length;$('total').textContent=rows.length;$('meta').textContent='AGE VERIFIED ≥180d · עדכון '+new Date().toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'});$('status').textContent=rows.length?'● LIVE · '+rows.length+' מטבעות ותיקים מאומתים עם פעילות עכשיו':'● אין כרגע אות Revival ותיק שעבר את כל האימותים';$('status').className='status '+(rows.length?'green':'yellow');$('warn').style.display=errors.length?'block':'none';$('warn').textContent=errors.join(' · ')+' — מטבע לא מאומת לא מוצג.';render(rows);window.__rows=rows}
document.querySelectorAll('.toolbar button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.toolbar button').forEach(x=>x.classList.remove('on'));b.classList.add('on');FILTER=b.dataset.f;render(window.__rows||[])});main();setInterval(main,60000);
</script></body></html>
