name: Wallet500 Engine Dashboard Overlap Audit

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
  pull_request:
    paths:
      - 'dashboard-live-price.js'
      - 'dashboard-live-price-core.js'
      - 'dashboard-truth-overlap.js'
      - 'data/dashboard-live-price-core.js'
      - 'data/dashboard-truth-overlap.js'
      - 'dashboard-revival1000.html'
      - 'dashboard-live.html'
      - 'tools/check_engine_dashboard_overlap.py'
      - 'src/wallet500/revival_pre_t0_evidence_v2.py'
      - '.github/workflows/engine-dashboard-overlap-audit.yml'
  push:
    branches: [main]
    paths:
      - 'dashboard-live-price.js'
      - 'dashboard-live-price-core.js'
      - 'dashboard-truth-overlap.js'
      - 'data/dashboard-live-price-core.js'
      - 'data/dashboard-truth-overlap.js'
      - 'dashboard-revival1000.html'
      - 'dashboard-live.html'
      - 'data/revival-pre-t0-evidence.json'
      - 'data/revival-pre-t0-evidence-ledger.json'
      - 'data/waking-pre-t0-confirmation.json'
      - 'data/revival-holder-latest.json'
      - 'data/real-alerts.json'
      - 'tools/check_engine_dashboard_overlap.py'
      - '.github/workflows/engine-dashboard-overlap-audit.yml'

permissions:
  contents: read

concurrency:
  group: wallet500-engine-dashboard-overlap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python syntax check
        run: python -m py_compile tools/check_engine_dashboard_overlap.py
      - name: Dashboard JavaScript syntax check
        run: |
          node --check dashboard-live-price.js
          node --check dashboard-live-price-core.js
          node --check dashboard-truth-overlap.js
          node --check data/dashboard-live-price-core.js
          node --check data/dashboard-truth-overlap.js
      - name: Structural truth contract on PR
        if: github.event_name == 'pull_request'
        run: python tools/check_engine_dashboard_overlap.py --strict --structural-only
      - name: Live freshness + truth contract
        if: github.event_name != 'pull_request'
        run: python tools/check_engine_dashboard_overlap.py --strict --max-skew-minutes 30
