name: Wallet500 Immutable Performance Tracker

on:
  workflow_run:
    workflows: ["Wallet500 Multi-Chain Live Scan"]
    types: [completed]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/wallet500/performance_tracker.py'
      - 'src/wallet500/realizable_performance.py'
      - 'src/wallet500/cash_verified.py'
      - 'src/wallet500/lifecycle_strategy.py'
      - 'src/wallet500/cohort_research.py'
      - 'src/wallet500/experiment_v1.py'
      - 'src/wallet500/winner_dna.py'
      - 'src/wallet500/revival_historical_dna.py'
      - 'src/wallet500/measurable_bias_experiment.py'
      - 'src/wallet500/quality_shadow.py'
      - 'src/wallet500/hot_healthy_radar.py'
      - 'src/wallet500/address_quality_audit.py'
      - 'scripts/compact_outcome_history.py'
      - 'tests/test_lifecycle_strategy.py'
      - 'tests/test_experiment_v1.py'
      - 'tests/test_research_integrity_v2.py'
      - 'tests/test_revival_historical_dna.py'
      - 'tests/test_compact_outcome_history.py'
      - '.github/workflows/performance-tracker.yml'

permissions:
  contents: write

# Truth-critical measurement must not starve behind high-frequency data publishers.
# Keep this workflow serial in its own queue; publish still fetches/rebases and fails closed on conflicts.
concurrency:
  group: wallet500-performance-publisher
  cancel-in-progress: false
  queue: max

jobs:
  measure:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -e . pytest
      - name: Run lifecycle strategy and research integrity tests
        run: python -m pytest -q tests/test_lifecycle_strategy.py tests/test_experiment_v1.py tests/test_research_integrity_v2.py tests/test_revival_historical_dna.py tests/test_compact_outcome_history.py
      - name: Rebuild immutable Performance Since Discovery
        run: python -m wallet500.performance_tracker
      - name: Update forward lifecycle strategy ledger
        run: python -m wallet500.lifecycle_strategy
      - name: Update first-eligible forward paper ledger
        run: python -m wallet500.realizable_performance
      - name: Audit exact-pair address quality
        run: python -m wallet500.address_quality_audit
      - name: Rank hot healthy exact-pair candidates
        run: python -m wallet500.hot_healthy_radar
      - name: Track delayed-entry shadow cohort
        run: python -m wallet500.quality_shadow
      - name: Run cohort counterfactual and missed-star research
        run: python -m wallet500.cohort_research
      - name: Run prospective Experiment V1
        run: python -m wallet500.experiment_v1
      - name: Run balanced Winner DNA shadow study
        run: python -m wallet500.winner_dna
      - name: Run exact-pair Revival historical DNA study
        run: python -m wallet500.revival_historical_dna
      - name: Run measurable-vs-rest bias study
        run: python -m wallet500.measurable_bias_experiment
      - name: Verify executable cash quotes
        env:
          ZEROX_API_KEY: ${{ secrets.ZEROX_API_KEY }}
        run: python -m wallet500.cash_verified
      - name: Compact outcome history without deleting evidence
        env:
          WALLET500_OUTCOME_HOT_HISTORY: '24'
          WALLET500_OUTCOME_MAX_LIVE_BYTES: '73400320'
          WALLET500_OUTCOME_ARCHIVE_SHARD_BYTES: '16777216'
        run: python scripts/compact_outcome_history.py
      - name: Validate measurement integrity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          paths=[Path('data/outcome-tracker.json'),Path('data/realizable-performance.json'),Path('data/first-eligible-paper-ledger.json'),Path('data/cohort-research.json'),Path('data/experiment-v1-ledger.json'),Path('data/experiment-v1-scoreboard.json'),Path('data/winner-dna-study.json'),Path('data/revival-historical-dna.json'),Path('data/measurable-vs-rest-experiment.json'),Path('data/quality-shadow-summary.json'),Path('data/hot-healthy-radar.json'),Path('data/address-quality-audit.json')]
          for x in paths:
              if not x.exists() or x.stat().st_size == 0: raise SystemExit('FATAL: empty measurement output: '+str(x))
          d,rp,pl,cr,ev,es,wd,rh,mv,qs,hh,aq=[json.loads(x.read_text()) for x in paths]
          total=int(d.get('tracked_tokens') or len((d.get('tokens') or {}))); entries=pl.get('entries') if isinstance(pl.get('entries'),list) else []
          if total<=0: raise SystemExit('FATAL: tracker attempted to publish zero tracked tokens')
          storage=d.get('history_storage') or {}
          if storage.get('mode')!='HOT_TAIL_PLUS_IMMUTABLE_GZIP_JSONL_ARCHIVE': raise SystemExit('FATAL: outcome history compaction contract missing')
          if storage.get('preserves_all_token_records') is not True or storage.get('preserves_all_observations') is not True: raise SystemExit('FATAL: outcome compaction preservation contract invalid')
          ceiling=70*1024*1024
          for p in (Path('data/outcome-tracker.json'),Path('data/signal-outcomes.json')):
              if p.stat().st_size>ceiling: raise SystemExit('FATAL: live outcome file exceeds 70MiB publish ceiling: '+str(p))
          if int(rp.get('paper_entries_count') or 0)!=len(entries): raise SystemExit('FATAL: paper entry count differs from persistent ledger')
          for p in entries:
              if not p.get('entry_at') or not p.get('pair_address') or float(p.get('entry_price_usd') or 0)<=0: raise SystemExit('FATAL: paper entry lacks immutable time/pair/price')
              if float(p.get('entry_liquidity_usd') or 0)<50000: raise SystemExit('FATAL: paper entry below $50K liquidity')
          if int((cr.get('baseline') or {}).get('n') or 0)!=len(entries): raise SystemExit('FATAL: cohort research baseline differs from ledger')
          if any(x.get('production_change') is not False for x in (ev,es,wd,mv,qs,hh,aq)): raise SystemExit('FATAL: research mutated production policy')
          if es.get('method')!='PROSPECTIVE_EXPERIMENT_V1': raise SystemExit('FATAL: experiment v1 method mismatch')
          if wd.get('method')!='WINNER_DNA_SHADOW_V2': raise SystemExit('FATAL: winner DNA method mismatch')
          if rh.get('mode')!='RESEARCH_ONLY_REVIVAL_HISTORICAL_DNA_V1' or rh.get('network')!='solana' or rh.get('production_impact')!='NONE' or rh.get('no_hindsight') is not True: raise SystemExit('FATAL: revival historical DNA truth contract mismatch')
          if mv.get('method')!='MEASURABLE_VS_REST_BIAS_EXPERIMENT_V1': raise SystemExit('FATAL: measurable-vs-rest method mismatch')
          exp_names={x.get('experiment') for x in es.get('experiments') or []}
          if exp_names!={'FIVE_MINUTE_FINGERPRINT','SURVIVOR_FIRST','SOURCE_TOURNAMENT'}: raise SystemExit('FATAL: experiment v1 scoreboard incomplete')
          for r in ev.get('records') or []:
              if r.get('entry_liquidity_usd') is not None and float(r.get('entry_liquidity_usd') or 0)<50000 and r.get('verified_tradable') is True: raise SystemExit('FATAL: experiment counted sub-50k row as verified tradable')
              if not r.get('pair_address'): raise SystemExit('FATAL: experiment record lacks exact pair identity')
          if int(aq.get('total_records_audited') or 0)<=0: raise SystemExit('FATAL: address audit has no records')
          if aq.get('method')!='ADDRESS_QUALITY_AUDIT_V2': raise SystemExit('FATAL: address audit method mismatch')
          if d.get('exact_pair_index_mode')!='CHAIN_TOKEN_PAIR_CASE_SAFE': raise SystemExit('FATAL: performance tracker is not using case-safe chain+token+pair indexing')
          print('INTEGRITY PASS')
          print('STORAGE', storage)
          print('RESEARCH', {'experiment_v1':len(ev.get('records') or []),'winner_dna_status':wd.get('status'),'winner_dna':wd.get('winner_n'),'winner_controls':wd.get('control_n'),'solana_winner_dna':(wd.get('solana_study') or {}).get('status'),'revival_historical_dna':rh.get('counts'),'measured_vs_rest':[mv.get('measured_now_n'),mv.get('rest_n')]})
          PY
      - name: Publish measurement data
        run: |
          set -euo pipefail
          git config user.name 'wallet500-bot'
          git config user.email 'wallet500-bot@users.noreply.github.com'
          git add data/outcome-tracker.json data/signal-outcomes.json data/outcome-archive data/performance-measurement-report.json data/performance-leaderboard.json data/lifecycle-strategy-ledger.json data/lifecycle-strategy-summary.json data/realizable-performance.json data/realizable-performance-summary.json data/cash-verified-performance.json data/cash-verified-summary.json data/first-eligible-paper-ledger.json data/cohort-research.json data/cohort-research.md data/experiment-v1-ledger.json data/experiment-v1-scoreboard.json data/experiment-v1-report.md data/winner-dna-study.json data/revival-historical-dna.json data/measurable-vs-rest-experiment.json data/measurable-vs-rest-experiment.md data/quality-shadow-ledger.json data/quality-shadow-summary.json data/hot-healthy-radar.json data/address-quality-audit.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh performance and research lab outputs'
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort || true
                echo 'FATAL: performance publisher rebase conflict; refusing automatic conflict resolution'
                exit 1
              fi
              if git push origin HEAD:main; then break; fi
              sleep 3
              if [ "$attempt" = 5 ]; then exit 1; fi
            done
          fi
