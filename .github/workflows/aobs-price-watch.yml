name: AOBS 5m Telegram Price Watch

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aobs-price-watch.yml'
      - 'src/wallet500/aobs_price_watch.py'
      - 'src/wallet500/aobs_price_watch_v2.py'
      - 'src/wallet500/aobs_price_watch_v3.py'

permissions:
  contents: write

concurrency:
  group: aobs-price-watch
  cancel-in-progress: true

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate watcher logic
        run: |
          set -euo pipefail
          python -m py_compile src/wallet500/aobs_price_watch.py src/wallet500/aobs_price_watch_v2.py src/wallet500/aobs_price_watch_v3.py
          python src/wallet500/aobs_price_watch_v3.py --self-test

      - name: Fetch exact AOBS pool plus holders and send edge-triggered Telegram alert
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          AOBS_STATE_PATH: data/aobs-price-watch.json
          AOBS_HOLDER_LEDGER_PATH: data/aobs-holder-ledger.json
        run: |
          set -euo pipefail
          python src/wallet500/aobs_price_watch_v3.py

      - name: Persist AOBS price and holder state without CI fan-out
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- data/aobs-price-watch.json data/aobs-holder-ledger.json)" ]; then
            echo 'AOBS state unchanged'
            exit 0
          fi
          git config user.name 'wallet500-aobs-bot'
          git config user.email 'wallet500-aobs-bot@users.noreply.github.com'
          git add data/aobs-price-watch.json
          if [ -f data/aobs-holder-ledger.json ]; then
            git add data/aobs-holder-ledger.json
          fi
          git commit -m 'data: persist AOBS price and holder state [skip ci]'
          for attempt in 1 2 3 4 5; do
            git fetch --depth=20 origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo 'AOBS_STATE_PUBLISH_REBASE_CONFLICT'
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo 'AOBS_STATE_PUBLISH_RETRY_EXHAUSTED'
          exit 1
