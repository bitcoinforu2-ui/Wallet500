name: Wallet500 Pending Confirmation Refresh

on:
  workflow_run:
    workflows:
      - "Wallet500 Broad Wallet Coverage Probe"
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wallet500-candidate-evidence-publisher
  cancel-in-progress: false

jobs:
  refresh:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -e . pytest
      - name: Pending truth tests
        run: |
          python -m pytest -q \
            tests/test_pending_confirmation_truth_normalizer.py \
            tests/test_revival_wallet_coverage_probe.py \
            tests/test_decision_snapshot_guard.py \
            tests/test_real_alerts.py \
            tests/test_real_alerts_revival_bridge.py \
            tests/test_revival_funnel_diagnostics.py \
            tests/test_cross_signal_fusion_v2.py
      - name: Build coherent evidence snapshot
        run: |
          python -m wallet500.candidate_evidence_envelope
          python -m wallet500.pending_confirmation_truth_normalizer
          python -m wallet500.real_alerts
          python -m wallet500.revival_funnel_diagnostics
          python -m wallet500.cross_signal_fusion_v2
          python -m wallet500.decision_snapshot_guard
      - name: Validate no promotion leak
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          e=json.loads(Path('data/candidate-evidence-envelope.json').read_text())
          r=json.loads(Path('data/real-alerts.json').read_text())
          g=json.loads(Path('data/decision-snapshot-integrity.json').read_text())
          p=json.loads(Path('data/revival-wallet-coverage-probe.json').read_text())
          et=e.get('truth_contract') or {}
          pt=p.get('truth_contract') or {}
          if et.get('pending_semantics_missing_or_unverified_only') is not True: raise SystemExit('PENDING_SEMANTICS_INVALID')
          if et.get('verified_not_positive_is_not_pending') is not True: raise SystemExit('VERIFIED_NEUTRAL_SEMANTICS_INVALID')
          if et.get('broad_wallet_probe_is_non_promoting_coverage_only') is not True: raise SystemExit('WALLET_PROBE_ROLE_MISSING')
          if et.get('normalizer_changes_candidate_promotion') is not False: raise SystemExit('PENDING_PROMOTION_LEAK')
          if et.get('normalizer_changes_real_alert_gate') is not False: raise SystemExit('PENDING_REAL_ALERT_LEAK')
          if pt.get('probe_never_changes_candidate_promotion') is not True: raise SystemExit('PROBE_PROMOTION_LEAK')
          if pt.get('probe_never_changes_real_alert_gate') is not True: raise SystemExit('PROBE_REAL_ALERT_LEAK')
          if any(x.get('positive') is not False or x.get('promotion_eligible') is not False for x in p.get('tokens') or []): raise SystemExit('PROBE_ROW_ALPHA_LEAK')
          if g.get('passed') is not True: raise SystemExit('DECISION_SNAPSHOT_GUARD_FAILED')
          rt=r.get('truth_contract') or {}
          if rt.get('minimum_market_age_days')!=180 or rt.get('exact_dex_pair_required') is not True: raise SystemExit('REAL_ALERT_TRUTH_DRIFT')
          if rt.get('evidence_ready_is_visible_but_does_not_auto_promote_to_real_alert') is not True: raise SystemExit('REAL_ALERT_PROMOTION_DRIFT')
          print('PENDING_CONFIRMATION_REFRESH_TRUTH_OK', e.get('counts'), p.get('coverage_verified'))
          PY
      - name: Publish coherent pending-confirmation snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'wallet500-pending-truth-bot'
          git config user.email 'wallet500-pending-truth-bot@users.noreply.github.com'

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            source_sha="$(git rev-parse HEAD)"
            export SOURCE_SHA="$source_sha"

            python -m wallet500.candidate_evidence_envelope
            python -m wallet500.pending_confirmation_truth_normalizer
            python -m wallet500.real_alerts
            python -m wallet500.revival_funnel_diagnostics
            python -m wallet500.cross_signal_fusion_v2
            python -m wallet500.decision_snapshot_guard

            python - <<'PY'
          import hashlib, json, os
          from datetime import datetime, timezone
          from pathlib import Path
          files={
              'candidate_evidence':'data/candidate-evidence-envelope.json',
              'real_alerts':'data/real-alerts.json',
              'revival_funnel':'data/revival-funnel-diagnostics.json',
              'cross_signal_fusion':'data/cross-signal-fusion-v2.json',
              'decision_integrity':'data/decision-snapshot-integrity.json',
          }
          payloads={k:Path(v).read_bytes() for k,v in files.items()}
          guard=json.loads(payloads['decision_integrity'].decode())
          envelope=json.loads(payloads['candidate_evidence'].decode())
          if guard.get('passed') is not True: raise SystemExit('DECISION_PUBLICATION_GUARD_NOT_PASS')
          truth=envelope.get('truth_contract') or {}
          if truth.get('broad_wallet_probe_is_non_promoting_coverage_only') is not True: raise SystemExit('PENDING_WALLET_TRUTH_MISSING')
          if truth.get('normalizer_changes_real_alert_gate') is not False: raise SystemExit('PENDING_WALLET_REAL_ALERT_LEAK')
          run_id=str(os.environ.get('GITHUB_RUN_ID') or '').strip()
          source_sha=str(os.environ.get('SOURCE_SHA') or '').strip()
          proof={
              'version':1,
              'created_at':datetime.now(timezone.utc).isoformat(),
              'status':'VERIFIED_COHERENT_DECISION_SNAPSHOT',
              'producer':'PENDING_CONFIRMATION_REFRESH',
              'workflow_run_id':run_id,
              'source_sha':source_sha,
              'generation_id':f'pending-confirmation:{run_id}:{source_sha}',
              'decision_validation':'PASS',
              'minimum_market_age_days':180,
              'exact_pair_required':True,
              'hashes':{k:hashlib.sha256(v).hexdigest() for k,v in payloads.items()},
              'proof_rule':'ATOMIC_COMMIT_BINDS_REAL_ALERTS_TO_COHERENT_DECISION_SNAPSHOT',
          }
          Path('data/decision-publish-evidence.json').write_text(json.dumps(proof,ensure_ascii=False,indent=2,sort_keys=True)+'\n')
          print('PENDING_DECISION_PUBLICATION_PROOF_READY', proof['generation_id'])
          PY

            git add \
              data/candidate-evidence-envelope.json \
              data/real-alerts.json \
              data/revival-funnel-diagnostics.json \
              data/cross-signal-fusion-v2.json \
              data/decision-snapshot-integrity.json \
              data/decision-publish-evidence.json
            if git diff --cached --quiet; then
              echo 'PENDING_CONFIRMATION_NO_DATA_CHANGE'
              exit 0
            fi
            git commit -m 'data: refresh pending confirmation truth snapshot'
            if git push origin HEAD:main; then
              echo 'PENDING_CONFIRMATION_COHERENT_PUBLISH_OK'
              exit 0
            fi
            sleep 3
          done
          echo '::error::PENDING_CONFIRMATION_COHERENT_PUBLISH_RACE_EXHAUSTED'
          exit 1
