name: Wallet500 Pending Confirmation Refresh

on:
  workflow_run:
    workflows:
      - "Wallet500 Broad Wallet Coverage Probe"
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: wallet500-pending-confirmation-observer
  cancel-in-progress: true

jobs:
  refresh:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -e . pytest
      - name: Pending truth regression
        run: |
          python -m pytest -q \
            tests/test_pending_confirmation_truth_normalizer.py \
            tests/test_revival_wallet_coverage_probe.py \
            tests/test_decision_snapshot_guard.py \
            tests/test_real_alerts.py \
            tests/test_real_alerts_revival_bridge.py \
            tests/test_revival_funnel_diagnostics.py \
            tests/test_cross_signal_fusion_v2.py
      - name: Verify probe remains non-promoting
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('data/revival-wallet-coverage-probe.json').read_text())
          t=p.get('truth_contract') or {}
          if t.get('probe_never_changes_candidate_promotion') is not True: raise SystemExit('PROBE_PROMOTION_LEAK')
          if t.get('probe_never_changes_real_alert_gate') is not True: raise SystemExit('PROBE_REAL_ALERT_LEAK')
          if any(x.get('positive') is not False or x.get('promotion_eligible') is not False for x in p.get('tokens') or []): raise SystemExit('PROBE_ROW_ALPHA_LEAK')
          print('PENDING_PROBE_TRUTH_OK', p.get('coverage_verified'))
          PY
      - name: Delegate canonical recompute to single truth publisher
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run candidate-evidence-envelope.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo 'PENDING_CONFIRMATION_DELEGATED_TO_CANONICAL_PUBLISHER'
