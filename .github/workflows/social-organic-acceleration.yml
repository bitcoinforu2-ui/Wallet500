name: Wallet500 Organic Social Acceleration

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Wallet500 Multi-Chain Live Scan"]
    types: [completed]

permissions:
  contents: write

# This output is also part of the active 6-of-7 war-room snapshot.
# Serialize all writers that can publish the same file so the atomic publisher
# does not repeatedly fail closed on a legitimate concurrent refresh.
concurrency:
  group: wallet500-live-scan-publisher
  cancel-in-progress: false

jobs:
  organic-social:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -e . pytest
      - name: Verify organic social truth rules
        run: python -m pytest -q tests/test_social_organic_acceleration.py
      - name: Build organic social acceleration layer
        run: python -m wallet500.social_organic_acceleration
      - name: Publish organic social analysis atomically
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python scripts/atomic_publish.py \
            --message "data: refresh organic social acceleration" \
            data/social-organic-acceleration.json
