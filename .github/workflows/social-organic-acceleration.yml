name: Wallet500 Organic Social Acceleration

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Wallet500 Multi-Chain Live Scan"]
    types: [completed]

permissions:
  contents: write

# Keep this derived analysis on its own pending slot. The publish step already rebases
# against main and retries pushes, so sharing a concurrency group only causes pending
# runs to be replaced without adding truth protection.
concurrency:
  group: wallet500-organic-social-acceleration
  cancel-in-progress: false

jobs:
  organic-social:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -e . pytest
      - name: Verify organic social truth rules
        run: python -m pytest -q tests/test_social_organic_acceleration.py
      - name: Build organic social acceleration layer
        run: python -m wallet500.social_organic_acceleration
      - name: Publish organic social analysis
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/social-organic-acceleration.json
          if git diff --cached --quiet; then
            echo "No organic-social data changes"
            exit 0
          fi
          git commit -m "data: refresh organic social acceleration"
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Organic-social publish stopped fail-closed: rebase conflict"
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Organic-social publish failed after 3 attempts"
              exit 1
            fi
            sleep $((attempt * 2))
          done
