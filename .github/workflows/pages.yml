name: Deploy Wallet500 Dashboard
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'dashboard-live.html'
      - 'data/**'
      - 'wallet500_option2_emblem.jpg'
      - '.github/workflows/pages.yml'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare single-source live dashboard
        run: |
          cp dashboard-live.html index.html
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='<div class="mark">W</div>'
          new='<div class="logoMark"><img src="wallet500_option2_emblem.jpg" alt="Wallet500"></div>'
          if old not in s:
              raise SystemExit('Expected dashboard logo marker not found')
          s=s.replace(old,new,1)
          css='''.logoMark{width:84px;height:84px;flex:0 0 84px;border:1px solid #1d536e;overflow:hidden;background:#020912;box-shadow:0 0 22px rgba(64,215,255,.18)}.logoMark img{display:block;width:100%;height:100%;object-fit:cover}@media(max-width:760px){.logoMark{width:70px;height:70px;flex-basis:70px}.hero{padding:14px}.brand{gap:10px}}'''
          s=s.replace('</style>',css+'</style>',1)
          p.write_text(s)
          PY
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
