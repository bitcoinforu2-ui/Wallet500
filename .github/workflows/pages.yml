name: Deploy Wallet500 Dashboard

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'dashboard-live.html'
      - 'dashboard-real-alerts.html'
      - 'dashboard-revival1000.html'
      - 'dashboard-performance.html'
      - 'dashboard-engine-control.html'
      - 'dashboard-terminal.html'
      - 'dashboard-live-price.js'
      - 'dashboard-reference-fix.js'
      - '.github/workflows/pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build decision-first Wallet500 site
        run: |
          set -euo pipefail
          fail(){ echo "::error::$1"; exit 1; }
          check_file(){ test -s "$1" || fail "missing or empty: $1"; }
          check_text(){ grep -Fq "$2" "$1" || fail "missing marker [$2] in $1"; }

          rm -rf _site
          mkdir -p _site/live _site/alerts _site/revival _site/performance _site/control _site/terminal
          cp index.html _site/index.html
          cp dashboard-live.html _site/live/index.html
          cp dashboard-real-alerts.html _site/alerts/index.html
          cp dashboard-revival1000.html _site/revival/index.html
          cp dashboard-performance.html _site/performance/index.html
          cp dashboard-engine-control.html _site/control/index.html
          cp dashboard-terminal.html _site/terminal/index.html
          cp dashboard-live-price.js _site/dashboard-live-price.js
          cp dashboard-reference-fix.js _site/dashboard-reference-fix.js
          cp -r data _site/data

          python - <<'PY'
          from pathlib import Path
          import re
          # Old experiment-rubric bootstraps are retired. Strip any already-embedded
          # copies from published pages so deleted/no-result labs cannot reappear.
          for page in Path('_site').rglob('*.html'):
              s=page.read_text(encoding='utf-8')
              s=re.sub(r'<style id="w500-sticky-rubric-source">.*?</style>', '', s, flags=re.S|re.I)
              s=re.sub(r'<style id="w500-rubric-style">.*?</style>', '', s, flags=re.S|re.I)
              s=re.sub(r'<nav id="w500-experiment-rubric"[^>]*>.*?</nav>', '', s, flags=re.S|re.I)
              page.write_text(s,encoding='utf-8')
          PY

          touch _site/.nojekyll
          printf '%s\n' "$GITHUB_SHA" > _site/build.txt

          for f in _site/index.html _site/live/index.html _site/alerts/index.html _site/revival/index.html _site/performance/index.html _site/control/index.html _site/terminal/index.html _site/data/real-alerts.json _site/data/case-study-doge1.json _site/data/revival-1000-latest.json; do
            check_file "$f"
          done
          check_text _site/index.html 'WALLET500 · מסך החלטה'
          check_text _site/index.html 'VETERAN REVIVAL ONLY'
          check_text _site/live/index.html 'LIVE RADAR'
          check_text _site/revival/index.html 'REVIVAL'
          check_text _site/performance/index.html 'LIVE PRICE 5s'
          if grep -R -Fq '/Wallet500/kol/' _site/*.html _site/*/index.html 2>/dev/null; then
            fail 'retired KOL research link leaked into published site'
          fi
          python -m json.tool _site/data/real-alerts.json >/dev/null
          python -m json.tool _site/data/case-study-doge1.json >/dev/null
          python -m json.tool _site/data/revival-1000-latest.json >/dev/null
          echo 'BUILD_VERIFY_OK'

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify public deployment
        run: |
          set -euo pipefail
          BASE='https://bitcoinforu2-ui.github.io/Wallet500/'
          ok=0
          for attempt in $(seq 1 30); do
            build="$(curl -fsSL --max-time 20 "${BASE}build.txt?v=${GITHUB_SHA}" 2>/dev/null || true)"
            root="$(curl -fsSL --max-time 20 "${BASE}?v=${GITHUB_SHA}" 2>/dev/null || true)"
            feed="$(curl -fsSL --max-time 20 "${BASE}data/real-alerts.json?v=${GITHUB_SHA}" 2>/dev/null || true)"
            if [ "$build" = "$GITHUB_SHA" ] && grep -Fq 'WALLET500 · מסך החלטה' <<<"$root" && python -c 'import json,sys; json.load(sys.stdin)' <<<"$feed" >/dev/null 2>&1; then
              ok=1
              break
            fi
            sleep 10
          done
          [ "$ok" -eq 1 ] || { echo 'Public Wallet500 verification failed'; exit 1; }
          echo "PUBLIC_VERIFY_OK ${BASE} build=${GITHUB_SHA}"
