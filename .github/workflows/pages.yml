name: Deploy Wallet500 Dashboard
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'dashboard-live.html'
      - 'data/**'
      - 'wallet500_option2_emblem.jpg'
      - '.github/workflows/pages.yml'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare investor-safe live dashboard
        run: |
          cp dashboard-live.html index.html
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text()
          old='<div class="emblem"><div class="ring"></div><div class="wmark">W<span>V</span></div></div>'
          new='<div class="logoMark"><img src="wallet500_option2_emblem.jpg" alt="Wallet500"></div>'
          if old not in s: raise SystemExit('Expected hero emblem not found')
          s=s.replace(old,new,1)
          css='''.logoMark{position:relative;z-index:2;width:142px;height:142px;overflow:hidden;border:1px solid #2d6f95;background:#020912;box-shadow:0 0 24px #40d7ff44;align-self:flex-start}.logoMark img{display:block;width:100%;height:100%;object-fit:cover}.engine.stale{border-color:#ff7380;background:#1a0709bb;box-shadow:0 0 18px #ff738044}.engine.stale strong{color:#ff7380}.engine.fresh{border-color:#13a789}.qualifiedStrip{margin-top:12px;padding:12px}.qualifiedStrip h2{margin:0 0 8px;font-size:16px}.qualifiedGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.qualifiedCard{border:1px solid #1f5a73;background:#071722;padding:10px;position:relative}.qualifiedCard .qtag{position:absolute;right:0;top:0;background:#0d6b57;padding:3px 6px;font-size:8px;color:#dfffee}.qualifiedCard .qmint{font:11px monospace;color:#e7f7ff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:70px}.qualifiedCard .qscore{font-size:24px;color:#55e4ad;font-weight:900;margin:6px 0}.qualifiedCard .qmeta{display:grid;grid-template-columns:1fr 1fr;gap:4px;font-size:9px}.qualifiedCard .qmeta div{border:1px solid #18364c;padding:5px}.qualifiedCard .qlinks{margin-top:6px;font-size:9px}.qualifiedCard .qlinks a{color:#40d7ff;text-decoration:none;margin-right:8px}.qualifiedEmpty{color:#86a3b7;padding:10px;border:1px solid #18364c}@media(max-width:760px){.hero{grid-template-columns:104px minmax(0,1fr);column-gap:14px;padding-left:24px;padding-right:24px}.logoMark{width:104px;height:104px}.qualifiedGrid{grid-template-columns:1fr}}@media(max-width:390px){.hero{grid-template-columns:96px minmax(0,1fr);column-gap:12px;padding-left:18px;padding-right:18px}.logoMark{width:96px;height:96px}}'''
          s=s.replace('</style>',css+'</style>',1)
          marker='<section class="sec"><div class="head"><h2>LIVE NETWORK INTELLIGENCE · TOP 1–10 PER CHAIN</h2>'
          block='''<section class="qualifiedStrip panel"><h2>LIVE ACTIVE QUALIFIED · CURRENT MARKET STATUS</h2><div class="m" style="margin-bottom:8px">Only candidates still passing the live survival gate are shown here. Failed/dumped candidates remain in audit history and learning, never on the investor live board.</div><div class="qualifiedGrid" id="officialQualified"><div class="qualifiedEmpty">Live revalidation…</div></div></section>'''
          if marker in s: s=s.replace(marker,block+marker,1)
          guard=r'''<script>(function(){let lastEngineAt=null;const fmt=d=>d.toLocaleTimeString([],{hour12:false});function clock(){const stamp=document.getElementById('stamp');if(!stamp||!lastEngineAt)return;const age=Math.max(0,Date.now()-lastEngineAt.getTime()),remain=15*60*1000-age;const mm=Math.max(0,Math.floor(Math.abs(remain)/60000)),ss=Math.max(0,Math.floor((Math.abs(remain)%60000)/1000));stamp.innerHTML='LAST SCAN '+fmt(lastEngineAt)+'<br>'+(remain>0?'NEXT SCAN ~ '+String(mm).padStart(2,'0')+':'+String(ss).padStart(2,'0'):'NEXT SCAN DUE');}async function health(){try{const r=await fetch('data/run-summary.json?health='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('summary '+r.status);const x=await r.json(),engineAt=new Date(x.updated_at),age=(Date.now()-engineAt.getTime())/60000,stale=!Number.isFinite(age)||age>30,box=document.querySelector('.engine'),label=box&&box.querySelector('strong');lastEngineAt=engineAt;if(box){box.classList.toggle('stale',stale);box.classList.toggle('fresh',!stale)}if(label)label.innerHTML=stale?'⚠ STALE DATA':'<span class="pulse"></span>ENGINE LIVE';clock()}catch(e){const box=document.querySelector('.engine'),label=box&&box.querySelector('strong');if(box)box.classList.add('stale');if(label)label.textContent='⚠ DATA CHECK FAILED'}}const cn=c=>c==='bsc'?'BNB':c==='ethereum'?'ETH':'SOL',sh=t=>t?t.slice(0,8)+'…'+t.slice(-5):'—',ex=(c,t)=>c==='solana'?'https://solscan.io/token/'+encodeURIComponent(t):c==='ethereum'?'https://etherscan.io/token/'+encodeURIComponent(t):'https://bscscan.com/token/'+encodeURIComponent(t);async function live(x){const t=x.token||x.mint||'';try{const r=await fetch('https://api.dexscreener.com/latest/dex/tokens/'+encodeURIComponent(t),{cache:'no-store'});if(!r.ok)return null;const d=await r.json(),ps=(d.pairs||[]).filter(p=>p&&p.baseToken&&String(p.baseToken.address).toLowerCase()===String(t).toLowerCase());if(!ps.length)return null;ps.sort((a,b)=>Number(b.liquidity?.usd||0)-Number(a.liquidity?.usd||0));const p=ps[0],price=Number(p.priceUsd||0),liq=Number(p.liquidity?.usd||0),vol=Number(p.volume?.h1||0),buys=Number(p.txns?.h1?.buys||0),sells=Number(p.txns?.h1?.sells||0),m5=Number(p.priceChange?.m5||0),h1=Number(p.priceChange?.h1||0),base=Number(x.price_usd||0),since=base>0?(price/base-1)*100:0;if(!price||liq<20000||vol<15000||buys+sells<50||since<=-20||(h1>=100&&m5<=-15))return null;return {...x,price_usd:price,liquidity_usd:liq,volume_h1:vol,buys_h1:buys,sells_h1:sells,price_change_m5:m5,price_change_h1:h1,live_url:p.url||x.url||''}}catch(e){return null}}async function official(){const box=document.getElementById('officialQualified');if(!box)return;try{const r=await fetch('data/active-qualified-candidates.json?q='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('active '+r.status);const src=await r.json(),checked=(await Promise.all((Array.isArray(src)?src:[]).slice(0,18).map(live))).filter(Boolean);if(!checked.length){box.innerHTML='<div class="qualifiedEmpty">No candidate safely passes the LIVE survival gate right now.</div>';return}box.innerHTML=checked.map(x=>{const t=x.token||x.mint||'',u=x.live_url||x.url||'https://dexscreener.com/search?q='+encodeURIComponent(t);return '<article class="qualifiedCard"><span class="qtag">LIVE ACTIVE</span><div class="qmint">'+sh(t)+'</div><div class="qscore">'+Math.round(Number(x.anomaly_score||0))+'</div><div class="m">'+cn(x.chain)+' · LIVE REVALIDATED</div><div class="qmeta"><div>LIQ<br>$'+Math.round(Number(x.liquidity_usd||0)).toLocaleString()+'</div><div>VOL 1H<br>$'+Math.round(Number(x.volume_h1||0)).toLocaleString()+'</div><div>BUYS<br>'+Number(x.buys_h1||0).toLocaleString()+'</div><div>SELLS<br>'+Number(x.sells_h1||0).toLocaleString()+'</div></div><div class="qlinks"><a target="_blank" rel="noopener" href="'+ex(x.chain,t)+'">Explorer ↗</a><a target="_blank" rel="noopener" href="'+u+'">Dex ↗</a></div></article>'}).join('')}catch(e){box.innerHTML='<div class="qualifiedEmpty">Live qualified feed unavailable.</div>'}}health();official();clock();setInterval(clock,1000);setInterval(health,10000);setInterval(official,30000)})();</script>'''
          s=s.replace('</body>',guard+'</body>',1)
          p.write_text(s)
          PY
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
