name: Deploy Wallet500 Dashboard
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'dashboard-live.html'
      - 'data/**'
      - 'wallet500_option2_emblem.jpg'
      - '.github/workflows/pages.yml'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare single-source live dashboard
        run: |
          cp dashboard-live.html index.html
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='<div class="emblem"><div class="ring"></div><div class="wmark">W<span>V</span></div></div>'
          new='<div class="logoMark"><img src="wallet500_option2_emblem.jpg" alt="Wallet500 Option 2"></div>'
          if old not in s:
              raise SystemExit('Expected current hero emblem not found')
          s=s.replace(old,new,1)
          css='''.logoMark{position:relative;z-index:2;width:112px;height:112px;overflow:hidden;border:1px solid #2d6f95;background:#020912;box-shadow:0 0 24px #40d7ff44}.logoMark img{display:block;width:100%;height:100%;object-fit:cover}@media(max-width:760px){.logoMark{width:68px;height:68px}}@media(max-width:390px){.logoMark{width:58px;height:58px}}'''
          s=s.replace('</style>',css+'</style>',1)
          p.write_text(s)
          PY
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
