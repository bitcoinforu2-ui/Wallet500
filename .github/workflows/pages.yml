# Wallet500 dashboard deployment
name: Deploy Wallet500 Dashboard
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  workflow_run:
    workflows: ['Wallet500 Revival Solana Expanded', 'Wallet500 Revival Solana 500', 'Wallet500 Hybrid Token Profiles']
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'dashboard-live.html'
      - 'dashboard-terminal.html'
      - 'dashboard-performance.html'
      - 'dashboard-backtest.html'
      - 'dashboard-engine-control.html'
      - 'dashboard-revival1000.html'
      - 'dashboard-hybrid.html'
      - 'dashboard-reference-fix.js'
      - 'dashboard-live-price.js'
      - 'wallet500_option2_emblem.jpg'
      - 'data/run-summary.json'
      - 'data/realizable-performance.json'
      - 'data/realizable-performance-summary.json'
      - 'data/paper-truth-summary.json'
      - 'data/paper-portfolio-summary.json'
      - 'data/active-qualified-candidates.json'
      - 'data/external-signal-cohort-summary.json'
      - 'data/external-only-paper-summary.json'
      - 'data/external-only-paper-ledger.json'
      - 'data/experiment-v1-scoreboard.json'
      - 'data/cohort-research.json'
      - 'data/winner-dna-study.json'
      - 'data/measurable-vs-rest-experiment.json'
      - 'data/quality-shadow-summary.json'
      - 'data/revival-1000-latest.json'
      - 'data/revival-1000-state.json'
      - 'data/hybrid-token-profiles.json'
      - '.github/workflows/pages.yml'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Wallet500 site
        run: |
          set -euo pipefail
          fail(){ echo "::error::$1"; exit 1; }
          check_file(){ test -s "$1" || fail "missing or empty: $1"; echo "OK file $1"; }
          check_text(){ grep -Fq "$2" "$1" || fail "missing marker [$2] in $1"; echo "OK marker $1 :: $2"; }
          rm -rf _site
          mkdir -p _site/live _site/terminal _site/performance _site/backtest _site/control _site/hub _site/revival _site/hybrid
          cp index.html _site/index.html
          cp index.html _site/dashboard-hub.html
          cp index.html _site/hub.html
          cp index.html _site/hub/index.html
          cp dashboard-live.html _site/live/index.html
          cp dashboard-terminal.html _site/terminal/index.html
          cp dashboard-performance.html _site/performance/index.html
          cp dashboard-backtest.html _site/backtest/index.html
          cp dashboard-engine-control.html _site/control/index.html
          cp dashboard-revival1000.html _site/revival/index.html
          cp dashboard-hybrid.html _site/hybrid/index.html
          cp dashboard-hybrid.html _site/dashboard-hybrid.html
          cp dashboard-reference-fix.js _site/dashboard-reference-fix.js
          cp dashboard-live-price.js _site/dashboard-live-price.js
          cp -r data _site/data
          if [ -f wallet500_option2_emblem.jpg ]; then cp wallet500_option2_emblem.jpg _site/; fi
          touch _site/.nojekyll
          printf '%s\n' "$GITHUB_SHA" > _site/build.txt
          for f in _site/index.html _site/live/index.html _site/terminal/index.html _site/performance/index.html _site/control/index.html _site/revival/index.html _site/hybrid/index.html _site/dashboard-live-price.js _site/data/run-summary.json _site/data/realizable-performance-summary.json _site/data/external-signal-cohort-summary.json _site/data/revival-1000-latest.json; do check_file "$f"; done
          check_text _site/index.html 'WALLET500 · מצב הפרויקט'
          check_text _site/index.html 'EXTERNAL-ONLY EXPERIMENT'
          check_text _site/live/index.html '<title>Wallet500 Live</title>'
          check_text _site/live/index.html 'Liquidity ≥ $50K'
          check_text _site/performance/index.html 'LIVE PRICE 5s'
          check_text _site/performance/index.html 'RESEARCH LAB — VISUAL'
          check_text _site/performance/index.html 'dashboard-live-price.js'
          check_text _site/terminal/index.html '<title>Wallet500 Terminal</title>'
          check_text _site/control/index.html '<title>Wallet500 Control Center V2</title>'
          check_text _site/revival/index.html '<title>Wallet500 Revival Solana Expanded</title>'
          check_text _site/revival/index.html 'ABSORPTION CANDIDATES · PRE-MOVE WATCH'
          check_text _site/revival/index.html 'EXPANSION: SOLANA NETWORK / CROSS-PLATFORM UNKNOWN'
          check_text _site/hybrid/index.html '<title>Wallet500 Hybrid Token Radar</title>'
          check_text _site/hybrid/index.html 'TRUTH CONTRACT'
          python -m json.tool _site/data/run-summary.json >/dev/null || fail 'invalid run-summary.json'
          python -m json.tool _site/data/realizable-performance-summary.json >/dev/null || fail 'invalid realizable-performance-summary.json'
          python -m json.tool _site/data/external-signal-cohort-summary.json >/dev/null || fail 'invalid external-signal-cohort-summary.json'
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('_site/data/revival-1000-latest.json')
          d=json.loads(p.read_text())
          if d.get('mode') != 'RESEARCH_ONLY_REVIVAL_SOLANA_EXPANDED_V6':
              raise SystemExit(f"revival expanded V6 truth mode missing: {d.get('mode')}")
          if d.get('network') != 'solana':
              raise SystemExit('revival network is not Solana')
          if d.get('network_filter') != 'STRICT_SOLANA_ONLY_PLATFORM_FOOTPRINT':
              raise SystemExit('revival base strict Solana-only footprint contract missing')
          if d.get('asset_filter') != 'SOLANA_ONLY_PLATFORM_NON_STABLE_NON_PEGGED_ONLY':
              raise SystemExit('revival base strict non-pegged asset filter missing')
          if d.get('candidate_cap') is not None:
              raise SystemExit('revival fixed candidate cap must be disabled')
          contract=d.get('discovery_expansion_contract') or {}
          if contract.get('version') != 'REVIVAL_DISCOVERY_ABSORPTION_EXPANSION_V2':
              raise SystemExit('revival discovery expansion V2 contract missing')
          if contract.get('production_portfolio_impact') != 'NONE':
              raise SystemExit('revival expansion production impact must be NONE')
          coins=d.get('coins') or []
          if len(coins) < 100:
              raise SystemExit(f'revival universe too small: {len(coins)}')
          if any(x.get('network') != 'solana' or x.get('network_verified') is not True for x in coins):
              raise SystemExit('non-Solana or unverified asset present in revival data')
          base=[x for x in coins if x.get('source') != 'revival_discovery_state+dexscreener_absorption_expansion']
          expansion=[x for x in coins if x.get('source') == 'revival_discovery_state+dexscreener_absorption_expansion']
          if any(x.get('solana_only_platform_verified') is not True for x in base):
              raise SystemExit('base cross-platform asset present in revival data')
          if any(x.get('solana_only_platform_verified') is not False or x.get('cross_platform_status') != 'UNKNOWN_RESEARCH_ONLY' for x in expansion):
              raise SystemExit('expansion identity truth label invalid')
          if any(x.get('pre_alpha_eligible') for x in expansion):
              raise SystemExit('expansion candidate promoted to PRE-ALPHA')
          if any((x.get('order_flow_absorption') or {}).get('signal') is not True and x.get('absorption_candidate_proxy') is not True for x in expansion):
              raise SystemExit('expansion row missing strict or candidate absorption evidence')
          banned={'USDC','USDT','DAI','USDS','USD1','USDE','PYUSD','FDUSD','TUSD','USDP','GUSD','FRAX','LUSD','CRVUSD','USDD','USDB','USDX','USD0','USDY','EURC','EURS','WBTC','CBBTC','TBTC','LBTC','SOLVBTC','WSOL','BNSOL','JITOSOL','JUPSOL','MSOL','STSOL','VSOL','JLP','SUSDE','SYRUPUSDC','USYC','USTB','BUILD'}
          bad=[str(x.get('symbol') or '').upper() for x in coins if str(x.get('symbol') or '').upper() in banned]
          if bad:
              raise SystemExit(f'forbidden stable/wrapped/pegged asset present: {bad[:10]}')
          c=d.get('counts') or {}
          if c.get('universe') != len(coins):
              raise SystemExit('revival universe count mismatch')
          if c.get('absorption_discovery_expansion_added') != len(expansion):
              raise SystemExit('revival expansion count mismatch')
          print('REVIVAL_SOLANA_EXPANDED_V6_DATA_OK', c)
          hp=Path('_site/data/hybrid-token-profiles.json')
          if hp.exists():
              h=json.loads(hp.read_text())
              if h.get('mode')!='RESEARCH_ONLY_HYBRID_TOKEN_PROFILE_V1' or h.get('contract')!='HYBRID_TOKEN_PROFILE_V1' or h.get('network')!='solana':
                  raise SystemExit('hybrid truth contract invalid')
              rows=h.get('profiles') or []
              if not (100 <= len(rows) <= 500):
                  raise SystemExit(f'hybrid profile count invalid: {len(rows)}')
              print('HYBRID_TOKEN_RADAR_DATA_OK', h.get('counts', {}))
          else:
              print('HYBRID_TOKEN_RADAR_WAITING_FOR_FIRST_SNAPSHOT')
          PY
          echo 'BUILD_VERIFY_OK'
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify public deployment
        shell: bash
        run: |
          set -euo pipefail
          BASE='${{ steps.deployment.outputs.page_url }}'; case "$BASE" in */) ;; *) BASE="$BASE/" ;; esac
          ok=0
          for attempt in $(seq 1 30); do
            build="$(curl -fsSL --max-time 20 "${BASE}build.txt?sha=${GITHUB_SHA}" 2>/dev/null || true)"
            root="$(curl -fsSL --max-time 20 "${BASE}?sha=${GITHUB_SHA}" 2>/dev/null || true)"
            perf="$(curl -fsSL --max-time 20 "${BASE}performance/?sha=${GITHUB_SHA}" 2>/dev/null || true)"
            revival="$(curl -fsSL --max-time 20 "${BASE}revival/?sha=${GITHUB_SHA}" 2>/dev/null || true)"
            hybrid="$(curl -fsSL --max-time 20 "${BASE}hybrid/?sha=${GITHUB_SHA}" 2>/dev/null || true)"
            revival_data="$(curl -fsSL --max-time 20 "${BASE}data/revival-1000-latest.json?sha=${GITHUB_SHA}" 2>/dev/null || true)"
            adapter="$(curl -fsSL --max-time 20 "${BASE}dashboard-live-price.js?sha=${GITHUB_SHA}" 2>/dev/null || true)"
            if [ "$build" = "$GITHUB_SHA" ] && grep -Fq 'EXTERNAL-ONLY EXPERIMENT' <<<"$root" && ! grep -Fq 'ניסוי TOP 10' <<<"$root" && grep -Fq 'LIVE PRICE 5s' <<<"$perf" && grep -Fq 'RESEARCH LAB — VISUAL' <<<"$perf" && grep -Fq 'Wallet500LivePrice' <<<"$adapter" && grep -Fq 'WALLET500 · REVIVAL SOLANA EXPANDED' <<<"$revival" && grep -Fq 'ABSORPTION CANDIDATES · PRE-MOVE WATCH' <<<"$revival" && grep -Fq 'WALLET500 · HYBRID TOKEN RADAR' <<<"$hybrid" && grep -Fq 'TRUTH CONTRACT' <<<"$hybrid" && python -c 'import json,sys; d=json.load(sys.stdin); c=d.get("coins") or []; e=[x for x in c if x.get("source")=="revival_discovery_state+dexscreener_absorption_expansion"]; ok=d.get("mode")=="RESEARCH_ONLY_REVIVAL_SOLANA_EXPANDED_V6" and d.get("network")=="solana" and d.get("candidate_cap") is None and len(c)>=100 and all(x.get("network_verified") is True and x.get("network")=="solana" for x in c) and all(x.get("solana_only_platform_verified") is False and x.get("cross_platform_status")=="UNKNOWN_RESEARCH_ONLY" and x.get("pre_alpha_eligible") is False for x in e); raise SystemExit(0 if ok else 1)' <<<"$revival_data" >/dev/null 2>&1; then ok=1; break; fi
            echo "verify attempt $attempt/30 not ready yet"
            sleep 10
          done
          [ "$ok" -eq 1 ] || { echo 'Public Wallet500 verification failed'; exit 1; }
          echo "PUBLIC_VERIFY_OK root=${BASE} performance=${BASE}performance/ revival=${BASE}revival/ hybrid=${BASE}hybrid/ build=${GITHUB_SHA}"
