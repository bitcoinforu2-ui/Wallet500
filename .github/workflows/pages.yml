# Wallet500 full dashboard hub
# Root and /hub/ must always serve the Intelligence Hub, while /live/ remains the TOP 10 experiment.
name: Deploy Wallet500 Dashboard

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'dashboard-live.html'
      - 'dashboard-performance.html'
      - 'dashboard-backtest.html'
      - 'dashboard-reference-fix.js'
      - 'data/**'
      - 'wallet500_option2_emblem.jpg'
      - '.github/workflows/pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Wallet500 site
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/live _site/performance _site/backtest _site/hub
          cp index.html _site/index.html
          cp index.html _site/hub/index.html
          cp dashboard-live.html _site/live/index.html
          cp dashboard-performance.html _site/performance/index.html
          cp dashboard-backtest.html _site/backtest/index.html
          cp dashboard-reference-fix.js _site/dashboard-reference-fix.js
          cp -r data _site/data
          if [ -f wallet500_option2_emblem.jpg ]; then cp wallet500_option2_emblem.jpg _site/; fi
          touch _site/.nojekyll
          printf '%s\n' "$GITHUB_SHA" > _site/build.txt

          test -s _site/index.html
          test -s _site/hub/index.html
          test -s _site/live/index.html
          test -s _site/performance/index.html
          test -s _site/backtest/index.html
          test -s _site/data/run-summary.json
          grep -Fq 'WALLET500 · INTELLIGENCE HUB' _site/index.html
          grep -Fq 'WALLET500 · INTELLIGENCE HUB' _site/hub/index.html
          grep -Fq 'EXPERIMENT CENTER' _site/index.html
          grep -Fq '$1 ON EVERY DISCOVERY' _site/index.html
          grep -Fq 'HISTORICAL REPLAY 7/30/90' _site/index.html
          grep -Eq 'LIVE EXACT PAIRS|10 VERIFIED ENTRIES' _site/live/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify public deployment
        shell: bash
        run: |
          set -euo pipefail
          BASE='${{ steps.deployment.outputs.page_url }}'
          case "$BASE" in */) ;; *) BASE="$BASE/" ;; esac

          ok=0
          for attempt in $(seq 1 24); do
            build="$(curl -fsSL --max-time 20 "${BASE}build.txt?sha=${GITHUB_SHA}" 2>/dev/null || true)"
            root="$(curl -fsSL --max-time 20 "${BASE}?sha=${GITHUB_SHA}" 2>/dev/null || true)"
            hub="$(curl -fsSL --max-time 20 "${BASE}hub/?sha=${GITHUB_SHA}" 2>/dev/null || true)"
            if [ "$build" = "$GITHUB_SHA" ] \
              && grep -Fq 'WALLET500 · INTELLIGENCE HUB' <<<"$root" \
              && grep -Fq 'EXPERIMENT CENTER' <<<"$root" \
              && grep -Fq '$1 ON EVERY DISCOVERY' <<<"$root" \
              && grep -Fq 'HISTORICAL REPLAY 7/30/90' <<<"$root" \
              && grep -Fq 'WALLET500 · INTELLIGENCE HUB' <<<"$hub"; then
              ok=1
              break
            fi
            sleep 10
          done
          [ "$ok" -eq 1 ] || { echo 'Public root/hub verification failed'; exit 1; }

          live="$(curl -fsSL --max-time 20 "${BASE}live/?sha=${GITHUB_SHA}")"
          perf="$(curl -fsSL --max-time 20 "${BASE}performance/?sha=${GITHUB_SHA}")"
          back="$(curl -fsSL --max-time 20 "${BASE}backtest/?sha=${GITHUB_SHA}")"
          grep -Eq 'LIVE EXACT PAIRS|10 VERIFIED ENTRIES' <<<"$live"
          test -n "$perf"
          test -n "$back"
          curl -fsSL --max-time 20 "${BASE}data/run-summary.json?sha=${GITHUB_SHA}" | python -m json.tool >/dev/null
          echo "PUBLIC_VERIFY_OK ${BASE} build=${GITHUB_SHA}"
