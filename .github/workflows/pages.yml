# force redeploy: exact-pair link integrity hardened
name: Deploy Wallet500 Dashboard

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'dashboard-live.html'
      - 'dashboard-performance.html'
      - 'dashboard-backtest.html'
      - 'dashboard-reference-fix.js'
      - 'data/**'
      - 'wallet500_option2_emblem.jpg'
      - '.github/workflows/pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Wallet500 site
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/performance _site/backtest
          cp dashboard-live.html _site/index.html
          cp dashboard-performance.html _site/performance/index.html
          cp dashboard-backtest.html _site/backtest/index.html
          cp dashboard-reference-fix.js _site/dashboard-reference-fix.js
          python - <<'PY'
          from pathlib import Path

          p=Path('_site/index.html')
          s=p.read_text()

          # Remove the scanner banner from the deployed page.
          start='<section class="scanner panel panelPad">'
          i=s.find(start)
          if i >= 0:
              j=s.find('</section>', i)
              if j < 0:
                  raise SystemExit('scanner section closing tag not found')
              s=s[:i]+s[j+10:]
          for marker in ('SOLANA SCANNER','ETHEREUM SCANNER','BNB SCANNER'):
              if marker in s:
                  raise SystemExit('scanner banner still present: '+marker)

          # Exact-pair link integrity: never trust a free-standing URL and never
          # permit pair_address / locked_pair_address divergence.
          old_link="""function links(x,t){let p=x.pair_address||x.locked_pair_address;if(!p)return'';return`<div class=\"links\"><a href=\"https://dexscreener.com/${String(x.chain).toLowerCase()}/${p}\" target=\"_blank\">DEXSCREENER ↗</a><a href=\"${explorer(x.chain,t)}\" target=\"_blank\">EXPLORER ↗</a></div>`}"""
          new_link="""function links(x,t){let c=String(x.chain||'').toLowerCase(),p=x.pair_address||'',lp=x.locked_pair_address||p;if(!c||!p)return'<div class=\"why\">PAIR LINK BLOCKED · MISSING IDENTITY</div>';if(!['solana','ethereum','bsc'].includes(c))return'<div class=\"why\">PAIR LINK BLOCKED · UNKNOWN CHAIN</div>';if(norm(c,p)!==norm(c,lp)||x.pair_identity_locked===false)return'<div class=\"why\">PAIR LINK BLOCKED · IDENTITY MISMATCH</div>';let dex=`https://dexscreener.com/${c}/${p}`,src=String(x.url||'').replace(/\\/$/,'');if(src&&src.toLowerCase()!==dex.toLowerCase())return'<div class=\"why\">PAIR LINK BLOCKED · SOURCE URL MISMATCH</div>';return`<div class=\"links\"><a href=\"${dex}\" target=\"_blank\" rel=\"noopener noreferrer\" data-chain=\"${c}\" data-pair=\"${p}\">DEXSCREENER ↗</a><a href=\"${explorer(c,t)}\" target=\"_blank\" rel=\"noopener noreferrer\">EXPLORER ↗</a></div>`}"""
          if s.count(old_link) != 1:
              raise SystemExit('expected dashboard link function exactly once')
          s=s.replace(old_link,new_link,1)

          # Do not present holder/cluster-pending research candidates as HIGH POTENTIAL.
          old_potential="""$('potential').innerHTML=q.length?q.map(x=>card(x,P.has(key(x))?'PRODUCTION QUALIFIED · $1 ELIGIBLE':'SURVIVAL PASS · HOLDER/CLUSTER PENDING')).join(''):'<div class=\"candidate\">NO SURVIVAL-QUALIFIED CANDIDATE RIGHT NOW</div>';"""
          new_potential="""$('potential').innerHTML=prod.length?prod.map(x=>card(x,'PRODUCTION QUALIFIED · $1 ELIGIBLE')).join(''):'<div class=\"candidate\">NO FULLY VERIFIED INVESTABLE CANDIDATE RIGHT NOW</div>';"""
          if s.count(old_potential) != 1:
              raise SystemExit('expected HIGH POTENTIAL renderer exactly once')
          s=s.replace(old_potential,new_potential,1)
          s=s.replace('⚡ WALLET500 HIGH POTENTIAL — LIVE','⚡ WALLET500 VERIFIED INVESTABLE — LIVE',1)
          s=s.replace('SURVIVAL PASS ≠ INVESTABLE UNTIL HOLDER/CLUSTER PASS','ONLY FULL PRODUCTION + HOLDER/CLUSTER VERIFIED CANDIDATES',1)

          tag='<script src="dashboard-reference-fix.js?v=2"></script>'
          if tag not in s:
              s=s.replace('</body>', tag+'</body>')

          # Build must fail closed if the old unsafe link path or misleading live renderer survives.
          if 'function links(x,t){let p=x.pair_address||x.locked_pair_address' in s:
              raise SystemExit('unsafe dashboard link function survived build')
          if "q.map(x=>card(x,P.has(key(x))" in s:
              raise SystemExit('pending research still rendered as live high potential')
          for required in ('PAIR LINK BLOCKED · IDENTITY MISMATCH','SOURCE URL MISMATCH','VERIFIED INVESTABLE — LIVE','rel="noopener noreferrer"'):
              if required not in s:
                  raise SystemExit('dashboard hardening marker missing: '+required)

          p.write_text(s)
          PY
          cp -r data _site/data
          if [ -f wallet500_option2_emblem.jpg ]; then
            cp wallet500_option2_emblem.jpg _site/
          fi
          test -s _site/index.html
          test -s _site/performance/index.html
          test -s _site/backtest/index.html
          test -s _site/dashboard-reference-fix.js
          test -s _site/data/run-summary.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
