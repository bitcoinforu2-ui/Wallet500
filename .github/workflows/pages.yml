name: Deploy Wallet500 Dashboard

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'dashboard-live.html'
      - 'dashboard-performance.html'
      - 'data/**'
      - 'wallet500_option2_emblem.jpg'
      - '.github/workflows/pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Wallet500 site
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/performance
          cp dashboard-live.html _site/index.html
          cp dashboard-performance.html _site/performance/index.html
          cp -r data _site/data
          if [ -f wallet500_option2_emblem.jpg ]; then
            cp wallet500_option2_emblem.jpg _site/
          fi
          test -s _site/index.html
          test -s _site/performance/index.html
          test -s _site/data/run-summary.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
