name: Deploy Wallet500 Dashboard
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'dashboard-live.html'
      - 'data/**'
      - 'wallet500_option2_emblem.jpg'
      - '.github/workflows/pages.yml'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare single-source live dashboard
        run: |
          cp dashboard-live.html index.html
          export DASHBOARD_SYNC_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python3 - <<'PY'
          import os
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='<div class="emblem"><div class="ring"></div><div class="wmark">W<span>V</span></div></div>'
          new='<div class="logoMark"><img src="wallet500_option2_emblem.jpg" alt="Wallet500 Option 2"></div>'
          if old not in s:
              raise SystemExit('Expected current hero emblem not found')
          s=s.replace(old,new,1)
          css='''.logoMark{position:relative;z-index:2;width:142px;height:142px;overflow:hidden;border:1px solid #2d6f95;background:#020912;box-shadow:0 0 24px #40d7ff44;align-self:flex-start}.logoMark img{display:block;width:100%;height:100%;object-fit:cover}.engine.stale{border-color:#ff7380;background:#1a0709bb;box-shadow:0 0 18px #ff738044}.engine.stale strong{color:#ff7380}.engine.fresh{border-color:#13a789}.qualifiedStrip{margin-top:12px;padding:12px}.qualifiedStrip h2{margin:0 0 8px;font-size:16px}.qualifiedGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.qualifiedCard{border:1px solid #1f5a73;background:#071722;padding:10px;position:relative}.qualifiedCard .qtag{position:absolute;right:0;top:0;background:#0d6b57;padding:3px 6px;font-size:8px;color:#dfffee}.qualifiedCard .qmint{font:11px monospace;color:#e7f7ff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:70px}.qualifiedCard .qscore{font-size:24px;color:#55e4ad;font-weight:900;margin:6px 0}.qualifiedCard .qmeta{display:grid;grid-template-columns:1fr 1fr;gap:4px;font-size:9px}.qualifiedCard .qmeta div{border:1px solid #18364c;padding:5px}.qualifiedCard .qlinks{margin-top:6px;font-size:9px}.qualifiedCard .qlinks a{color:#40d7ff;text-decoration:none;margin-right:8px}.qualifiedEmpty{color:#86a3b7;padding:10px;border:1px solid #18364c}@media(max-width:760px){.hero{grid-template-columns:104px minmax(0,1fr);column-gap:14px;padding-left:24px;padding-right:24px}.logoMark{width:104px;height:104px}.brand{justify-self:start}.brand h1{margin-left:0}.heroRight{margin-left:-10px;margin-right:-10px}.qualifiedGrid{grid-template-columns:1fr}}@media(max-width:390px){.hero{grid-template-columns:96px minmax(0,1fr);column-gap:12px;padding-left:18px;padding-right:18px}.logoMark{width:96px;height:96px}}'''
          s=s.replace('</style>',css+'</style>',1)
          marker='<section class="sec"><div class="head"><h2>LIVE NETWORK INTELLIGENCE · TOP 1–10 PER CHAIN</h2>'
          qualified='''<section class="qualifiedStrip panel"><h2>OFFICIAL QUALIFIED · LATEST ENGINE RUN</h2><div class="m" style="margin-bottom:8px">Passed the engine quality gate. Live revalidation may change current market status, but cannot erase the verified qualification event.</div><div class="qualifiedGrid" id="officialQualified"><div class="qualifiedEmpty">Loading qualified candidates…</div></div></section>'''
          if marker in s:
              s=s.replace(marker,qualified+marker,1)
          sync=os.environ['DASHBOARD_SYNC_AT']
          guard=f'''<script>(function(){{const DASH_SYNC=new Date({sync!r});function fmt(d){{return d.toLocaleString([],{{hour12:false}})}}async function health(){{try{{const r=await fetch('data/run-summary.json?health='+Date.now(),{{cache:'no-store'}});if(!r.ok)throw Error('summary '+r.status);const x=await r.json(),engineAt=new Date(x.updated_at),age=(Date.now()-engineAt.getTime())/60000,stale=!Number.isFinite(age)||age>30,box=document.querySelector('.engine'),label=box&&box.querySelector('strong'),stamp=document.getElementById('stamp');if(box){{box.classList.toggle('stale',stale);box.classList.toggle('fresh',!stale)}}if(label)label.innerHTML=stale?'⚠ STALE DATA':'<span class="pulse"></span>ENGINE LIVE';if(stamp)stamp.innerHTML='ENGINE '+fmt(engineAt)+'<br>DASH SYNC '+fmt(DASH_SYNC)+(stale?'<br>AGE '+Math.round(age)+'m':'');}}catch(e){{const box=document.querySelector('.engine'),label=box&&box.querySelector('strong');if(box)box.classList.add('stale');if(label)label.textContent='⚠ DATA CHECK FAILED';}}}}async function official(){{const box=document.getElementById('officialQualified');if(!box)return;try{{const r=await fetch('data/qualified-candidates.json?q='+Date.now(),{{cache:'no-store'}});if(!r.ok)throw Error('qualified '+r.status);const a=await r.json();if(!Array.isArray(a)||!a.length){{box.innerHTML='<div class="qualifiedEmpty">No candidate passed the official quality gate in the latest engine run.</div>';return}}const cn=c=>c==='bsc'?'BNB':c==='ethereum'?'ETH':'SOL',sh=t=>t?t.slice(0,8)+'…'+t.slice(-5):'—',ex=(c,t)=>c==='solana'?'https://solscan.io/token/'+encodeURIComponent(t):c==='ethereum'?'https://etherscan.io/token/'+encodeURIComponent(t):'https://bscscan.com/token/'+encodeURIComponent(t);box.innerHTML=a.map(x=>{{const t=x.token||x.mint||'',u=x.url||'https://dexscreener.com/search?q='+encodeURIComponent(t);return '<article class="qualifiedCard"><span class="qtag">OFFICIAL QUALIFIED</span><div class="qmint">'+sh(t)+'</div><div class="qscore">'+Math.round(Number(x.anomaly_score||0))+'</div><div class="m">'+cn(x.chain)+' · risk '+Math.round(Number(x.pump_dump_risk_score||0))+'</div><div class="qmeta"><div>LIQ<br>$'+Math.round(Number(x.liquidity_usd||0)).toLocaleString()+'</div><div>VOL 1H<br>$'+Math.round(Number(x.volume_h1||0)).toLocaleString()+'</div><div>BUYS<br>'+Number(x.buys_h1||0).toLocaleString()+'</div><div>SELLS<br>'+Number(x.sells_h1||0).toLocaleString()+'</div></div><div class="qlinks"><a target="_blank" rel="noopener" href="'+ex(x.chain,t)+'">Explorer ↗</a><a target="_blank" rel="noopener" href="'+u+'">Dex ↗</a></div></article>'}}).join('')}}catch(e){{box.innerHTML='<div class="qualifiedEmpty">Qualified feed unavailable: '+String(e.message||e)+'</div>'}}}}health();official();setInterval(health,15000);setInterval(official,60000);}})();</script>'''
          s=s.replace('</body>',guard+'</body>',1)
          p.write_text(s)
          PY
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
