name: Deploy Wallet500 Dashboard

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Wallet500 Candidate Evidence Envelope"
      - "Wallet500 Social Intelligence V2"
      - "Wallet500 Catalyst Wire"
    types: [completed]
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'dashboard-live.html'
      - 'dashboard-real-alerts.html'
      - 'dashboard-revival1000.html'
      - 'dashboard-performance.html'
      - 'dashboard-engine-control.html'
      - 'dashboard-terminal.html'
      - 'dashboard-social.html'
      - 'dashboard-catalyst-wire.html'
      - 'dashboard-live-price.js'
      - 'dashboard-reference-fix.js'
      - 'wallet500-auth.js'
      - '.github/workflows/pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build live-first Wallet500 site
        run: |
          set -euo pipefail
          fail(){ echo "::error::$1"; exit 1; }
          check_file(){ test -s "$1" || fail "missing or empty: $1"; }
          check_text(){ grep -Fq "$2" "$1" || fail "missing marker [$2] in $1"; }

          rm -rf _site
          mkdir -p _site/live _site/catalyst _site/status _site/alerts _site/revival _site/performance _site/control _site/terminal _site/social

          cp dashboard-live.html _site/index.html
          cp dashboard-live.html _site/live/index.html
          cp dashboard-catalyst-wire.html _site/catalyst/index.html
          cp index.html _site/status/index.html
          cp dashboard-real-alerts.html _site/alerts/index.html
          cp dashboard-revival1000.html _site/revival/index.html
          cp dashboard-performance.html _site/performance/index.html
          cp dashboard-engine-control.html _site/control/index.html
          cp dashboard-terminal.html _site/terminal/index.html
          cp dashboard-social.html _site/social/index.html
          cp dashboard-live-price.js _site/dashboard-live-price.js
          cp dashboard-reference-fix.js _site/dashboard-reference-fix.js
          cp wallet500-auth.js _site/wallet500-auth.js
          cp -r data _site/data

          python - <<'PY'
          from pathlib import Path
          import re

          auth_tag='<script src="/Wallet500/wallet500-auth.js"></script>'
          live_nav='''<nav class="nav"><a href="/Wallet500/">🔥 Live</a><a href="/Wallet500/catalyst/">⚡ Catalyst</a><a href="/Wallet500/alerts/">🚨 Alerts</a><a href="/Wallet500/status/">📊 מצב הפרויקט</a><a href="/Wallet500/revival/">♻ Revival</a><a href="/Wallet500/performance/">💵 ביצועים</a><a href="/Wallet500/social/">📡 Social</a><a href="/Wallet500/control/">⚙ Control</a><a href="/Wallet500/terminal/">🖥 Terminal</a></nav>'''

          for page in Path('_site').rglob('*.html'):
              s=page.read_text(encoding='utf-8')
              s=re.sub(r'<style id="w500-sticky-rubric-source">.*?</style>', '', s, flags=re.S|re.I)
              s=re.sub(r'<style id="w500-rubric-style">.*?</style>', '', s, flags=re.S|re.I)
              s=re.sub(r'<nav id="w500-experiment-rubric"[^>]*>.*?</nav>', '', s, flags=re.S|re.I)
              if page.as_posix() in {'_site/index.html', '_site/live/index.html'}:
                  s=re.sub(r'<div class="nav">.*?</div>|<nav class="nav">.*?</nav>', live_nav, s, count=1, flags=re.S|re.I)
              if auth_tag not in s:
                  if re.search(r'</head\s*>', s, flags=re.I):
                      s=re.sub(r'</head\s*>', auth_tag+'\n</head>', s, count=1, flags=re.I)
                  else:
                      s=auth_tag+'\n'+s
              page.write_text(s,encoding='utf-8')
          PY

          touch _site/.nojekyll
          printf '%s\n' "$GITHUB_SHA" > _site/build.txt

          for f in _site/index.html _site/live/index.html _site/catalyst/index.html _site/status/index.html _site/alerts/index.html _site/revival/index.html _site/performance/index.html _site/control/index.html _site/terminal/index.html _site/social/index.html _site/wallet500-auth.js _site/data/real-alerts.json _site/data/case-study-doge1.json _site/data/revival-1000-latest.json _site/data/catalyst-wire-live.json; do
            check_file "$f"
          done
          check_text _site/index.html 'LIVE RADAR'
          check_text _site/index.html '/Wallet500/catalyst/'
          check_text _site/index.html '/Wallet500/status/'
          check_text _site/index.html '/Wallet500/wallet500-auth.js'
          check_text _site/live/index.html 'LIVE RADAR'
          check_text _site/catalyst/index.html 'CATALYST WIRE LIVE'
          check_text _site/status/index.html 'WALLET500 · מסך החלטה'
          check_text _site/status/index.html 'VETERAN REVIVAL ONLY'
          check_text _site/status/index.html 'FUSION HOT/WARM'
          check_text _site/social/index.html 'SOCIAL INTELLIGENCE V2'
          check_text _site/revival/index.html 'REVIVAL'
          check_text _site/performance/index.html 'LIVE PRICE 5s'
          check_text _site/wallet500-auth.js '639379001638-uc8gc79gokfoe2ltmt29880g56durdmi.apps.googleusercontent.com'
          check_text _site/wallet500-auth.js 'bitcoinforu2@gmail.com'
          if grep -R -Fq '/Wallet500/kol/' _site/*.html _site/*/index.html 2>/dev/null; then
            fail 'retired KOL research link leaked into published site'
          fi
          python -m json.tool _site/data/real-alerts.json >/dev/null
          python -m json.tool _site/data/case-study-doge1.json >/dev/null
          python -m json.tool _site/data/revival-1000-latest.json >/dev/null
          python -m json.tool _site/data/catalyst-wire-live.json >/dev/null
          if test -s _site/data/social-intelligence-v2.json; then python -m json.tool _site/data/social-intelligence-v2.json >/dev/null; fi
          if test -s _site/data/cross-signal-fusion-v2.json; then python -m json.tool _site/data/cross-signal-fusion-v2.json >/dev/null; fi
          echo 'BUILD_VERIFY_OK'

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify public deployment
        run: |
          set -euo pipefail
          BASE='https://bitcoinforu2-ui.github.io/Wallet500/'
          ok=0
          for attempt in $(seq 1 30); do
            build="$(curl -fsSL --max-time 20 "${BASE}build.txt?v=${GITHUB_SHA}" 2>/dev/null || true)"
            root="$(curl -fsSL --max-time 20 "${BASE}?v=${GITHUB_SHA}" 2>/dev/null || true)"
            status="$(curl -fsSL --max-time 20 "${BASE}status/?v=${GITHUB_SHA}" 2>/dev/null || true)"
            social="$(curl -fsSL --max-time 20 "${BASE}social/?v=${GITHUB_SHA}" 2>/dev/null || true)"
            catalyst="$(curl -fsSL --max-time 20 "${BASE}catalyst/?v=${GITHUB_SHA}" 2>/dev/null || true)"
            auth="$(curl -fsSL --max-time 20 "${BASE}wallet500-auth.js?v=${GITHUB_SHA}" 2>/dev/null || true)"
            feed="$(curl -fsSL --max-time 20 "${BASE}data/real-alerts.json?v=${GITHUB_SHA}" 2>/dev/null || true)"
            cfeed="$(curl -fsSL --max-time 20 "${BASE}data/catalyst-wire-live.json?v=${GITHUB_SHA}" 2>/dev/null || true)"
            if [ "$build" = "$GITHUB_SHA" ] && grep -Fq 'LIVE RADAR' <<<"$root" && grep -Fq '/Wallet500/catalyst/' <<<"$root" && grep -Fq 'WALLET500 · מסך החלטה' <<<"$status" && grep -Fq 'google.accounts.id.initialize' <<<"$auth" && grep -Fq 'SOCIAL INTELLIGENCE V2' <<<"$social" && grep -Fq 'CATALYST WIRE LIVE' <<<"$catalyst" && python -c 'import json,sys; json.load(sys.stdin)' <<<"$feed" >/dev/null 2>&1 && python -c 'import json,sys; json.load(sys.stdin)' <<<"$cfeed" >/dev/null 2>&1; then
              ok=1
              break
            fi
            sleep 10
          done
          [ "$ok" -eq 1 ] || { echo 'Public Wallet500 verification failed'; exit 1; }
          echo "PUBLIC_VERIFY_OK ${BASE} build=${GITHUB_SHA}"
