# Wallet500 dashboard deployment
name: Deploy Wallet500 Dashboard
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'dashboard-live.html'
      - 'dashboard-terminal.html'
      - 'dashboard-performance.html'
      - 'dashboard-backtest.html'
      - 'dashboard-engine-control.html'
      - 'dashboard-reference-fix.js'
      - 'wallet500_option2_emblem.jpg'
      - '.github/workflows/pages.yml'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Wallet500 site
        run: |
          set -euo pipefail
          fail(){ echo "::error::$1"; exit 1; }
          check_file(){ test -s "$1" || fail "missing or empty: $1"; echo "OK file $1"; }
          check_text(){ grep -Fq "$2" "$1" || fail "missing marker [$2] in $1"; echo "OK marker $1 :: $2"; }
          rm -rf _site
          mkdir -p _site/live _site/terminal _site/performance _site/backtest _site/control _site/hub
          cp index.html _site/index.html
          cp index.html _site/dashboard-hub.html
          cp index.html _site/hub.html
          cp index.html _site/hub/index.html
          cp dashboard-live.html _site/live/index.html
          cp dashboard-terminal.html _site/terminal/index.html
          cp dashboard-performance.html _site/performance/index.html
          cp dashboard-backtest.html _site/backtest/index.html
          cp dashboard-engine-control.html _site/control/index.html
          cp dashboard-reference-fix.js _site/dashboard-reference-fix.js
          cp -r data _site/data
          if [ -f wallet500_option2_emblem.jpg ]; then cp wallet500_option2_emblem.jpg _site/; fi
          touch _site/.nojekyll
          printf '%s\n' "$GITHUB_SHA" > _site/build.txt
          for f in _site/index.html _site/live/index.html _site/terminal/index.html _site/control/index.html _site/data/run-summary.json _site/data/blocked-cohort-paper-summary.json _site/data/blocked-cohort-paper-ledger.json; do check_file "$f"; done
          check_text _site/index.html 'WALLET500 · מצב הפרויקט'
          check_text _site/live/index.html '<title>Wallet500 Live</title>'
          check_text _site/live/index.html 'Liquidity ≥ $50K'
          check_text _site/terminal/index.html '<title>Wallet500 Terminal</title>'
          check_text _site/control/index.html '<title>Wallet500 Control Center V2</title>'
          python -m json.tool _site/data/run-summary.json >/dev/null || fail 'invalid run-summary.json'
          python -m json.tool _site/data/blocked-cohort-paper-summary.json >/dev/null || fail 'invalid blocked-cohort-paper-summary.json'
          python -m json.tool _site/data/blocked-cohort-paper-ledger.json >/dev/null || fail 'invalid blocked-cohort-paper-ledger.json'
          echo 'BUILD_VERIFY_OK'
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify public deployment
        shell: bash
        run: |
          set -euo pipefail
          BASE='${{ steps.deployment.outputs.page_url }}'; case "$BASE" in */) ;; *) BASE="$BASE/" ;; esac
          ok=0
          for attempt in $(seq 1 30); do
            build="$(curl -fsSL --max-time 20 "${BASE}build.txt?sha=${GITHUB_SHA}" 2>/dev/null || true)"
            root="$(curl -fsSL --max-time 20 "${BASE}?sha=${GITHUB_SHA}" 2>/dev/null || true)"
            live="$(curl -fsSL --max-time 20 "${BASE}live/?sha=${GITHUB_SHA}" 2>/dev/null || true)"
            terminal="$(curl -fsSL --max-time 20 "${BASE}terminal/?sha=${GITHUB_SHA}" 2>/dev/null || true)"
            control="$(curl -fsSL --max-time 20 "${BASE}control/?sha=${GITHUB_SHA}" 2>/dev/null || true)"
            summary="$(curl -fsSL --max-time 20 "${BASE}data/blocked-cohort-paper-summary.json?sha=${GITHUB_SHA}" 2>/dev/null || true)"
            ledger="$(curl -fsSL --max-time 20 "${BASE}data/blocked-cohort-paper-ledger.json?sha=${GITHUB_SHA}" 2>/dev/null || true)"
            if [ "$build" = "$GITHUB_SHA" ] && grep -Fq 'WALLET500 · מצב הפרויקט' <<<"$root" && grep -Fq '<title>Wallet500 Live</title>' <<<"$live" && grep -Fq 'Liquidity ≥ $50K' <<<"$live" && grep -Fq '<title>Wallet500 Terminal</title>' <<<"$terminal" && grep -Fq '<title>Wallet500 Control Center V2</title>' <<<"$control" && python -m json.tool >/dev/null <<<"$summary" && python -m json.tool >/dev/null <<<"$ledger"; then ok=1; break; fi
            echo "verify attempt $attempt/30 not ready yet"
            sleep 10
          done
          [ "$ok" -eq 1 ] || { echo 'Public Wallet500 verification failed'; exit 1; }
          curl -fsSL --max-time 20 "${BASE}data/run-summary.json?sha=${GITHUB_SHA}" | python -m json.tool >/dev/null
          echo "PUBLIC_VERIFY_OK terminal=${BASE}terminal/ live=${BASE}live/ control=${BASE}control/ build=${GITHUB_SHA}"
