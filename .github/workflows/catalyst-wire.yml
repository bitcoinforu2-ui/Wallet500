name: Wallet500 Catalyst Wire

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/wallet500/catalyst_wire.py'
      - 'src/wallet500/catalyst_wire_binance.py'
      - 'src/wallet500/catalyst_identity_guard.py'
      - 'src/wallet500/catalyst_focus.py'
      - 'src/wallet500/catalyst_focus_binance.py'
      - 'src/wallet500/binance_event_intelligence.py'
      - 'src/wallet500/global_listing_intelligence.py'
      - 'src/wallet500/cross_source_correlation.py'
      - 'tests/test_catalyst_wire.py'
      - 'tests/test_catalyst_identity_guard.py'
      - 'tests/test_binance_event_intelligence.py'
      - 'tests/test_catalyst_focus.py'
      - 'tests/test_catalyst_focus_binance.py'
      - 'tests/test_global_listing_evm_core.py'
      - 'tests/test_cross_source_correlation.py'
      - '.github/workflows/catalyst-wire.yml'
  schedule:
    - cron: '*/5 * * * *'
  workflow_run:
    workflows:
      - "Wallet500 Social Intelligence V2"
      - "Wallet500 Global Listing Intelligence"
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'src/wallet500/catalyst_wire.py'
      - 'src/wallet500/catalyst_wire_binance.py'
      - 'src/wallet500/catalyst_identity_guard.py'
      - 'src/wallet500/catalyst_focus.py'
      - 'src/wallet500/catalyst_focus_binance.py'
      - 'src/wallet500/binance_event_intelligence.py'
      - 'src/wallet500/global_listing_intelligence.py'
      - 'src/wallet500/cross_source_correlation.py'
      - 'tests/test_catalyst_wire.py'
      - 'tests/test_catalyst_identity_guard.py'
      - 'tests/test_binance_event_intelligence.py'
      - 'tests/test_catalyst_focus.py'
      - 'tests/test_catalyst_focus_binance.py'
      - 'tests/test_global_listing_evm_core.py'
      - 'tests/test_cross_source_correlation.py'
      - '.github/workflows/catalyst-wire.yml'

permissions:
  contents: write

# Raw discovery and Focus selection share one stateful scheduled run. Raw events are
# never sent to Telegram; only the selective Focus layer receives Telegram credentials.
concurrency:
  group: wallet500-catalyst-wire-source-scan
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Wallet500 and test dependency
        run: pip install -e . pytest
      - name: Lock Catalyst discovery, symbol identity, Binance context, Focus selection, EVM listing and cross-source truth policy
        run: pytest -q tests/test_catalyst_wire.py tests/test_catalyst_identity_guard.py tests/test_binance_event_intelligence.py tests/test_catalyst_focus.py tests/test_catalyst_focus_binance.py tests/test_global_listing_evm_core.py tests/test_cross_source_correlation.py

  wire:
    needs: test
    if: github.event_name != 'pull_request' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Wallet500
        run: pip install -e .

      - name: Run raw official Catalyst discovery with Binance historical context silently
        run: python -m wallet500.catalyst_wire_binance

      - name: Fail closed on CEX symbol-to-contract identity collisions before Focus
        run: python -m wallet500.catalyst_identity_guard

      # Telegram is deliberately available only to the selective Focus layer.
      # Push/workflow_run refreshes update evidence but cannot emit Focus alerts;
      # the 5-minute schedule (or explicit manual run) owns stateful alert delivery.
      - name: Run selective Focus monitor with Binance priority Telegram alerts
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m wallet500.catalyst_focus_binance

      - name: Validate raw event feed boundaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/catalyst-wire-live.json')
          d=json.loads(p.read_text())
          assert d['mode']=='CATALYST_WIRE_EVENT_FIRST_NO_MOMENTUM_WEIGHT'
          assert d['automatic_trade'] is False
          assert set(d['policy']['event_lane_zero_weight'])=={'volume_acceleration','liquidity_growth','holder_growth','wallet_growth'}
          assert d['policy']['official_source_required'] is True
          assert d['policy']['source_link_required_for_telegram'] is True
          identity_guard=d.get('identity_link_guard') or {}
          assert identity_guard.get('fail_closed') is True
          for e in d.get('events',[]):
              if e.get('identity_guard_fail_closed') is True and e.get('symbol_contract_link_verified') is not True:
                  assert e.get('preliminary_filter_pass') is False
                  assert e.get('alert_eligible') is False
                  assert e.get('identity_guard_blocker')=='SYMBOL_TO_CONTRACT_NOT_CANONICALLY_VERIFIED'
              if e.get('alert_eligible'):
                  assert e.get('preliminary_filter_pass') is True
                  assert e.get('forward_new') is True
                  assert e.get('source_url')
              b=e.get('binance_intelligence') or {}
              is_binance=str(e.get('source_owner') or '').lower()=='binance' or str(e.get('source_id') or '').upper().startswith('BINANCE_')
              if is_binance:
                  assert b.get('applicable') is True
                  assert b.get('priority')=='FIRE_PRIORITY'
                  assert b.get('production_effect') is False
                  assert b.get('automatic_buy') is False
                  truth=b.get('truth_contract') or {}
                  assert truth.get('exact_chain_token_identity_required_for_history') is True
                  assert truth.get('pair_mismatch_rejected_when_both_pairs_known') is True
                  assert truth.get('symbol_only_history_never_scores') is True
                  assert truth.get('binance_priority_never_overrides_wallet500_gates') is True
          print('CATALYST_WIRE_TRUTH_OK', d.get('counts'), identity_guard)
          PY

      - name: Validate selective Focus policy when executed
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/catalyst-focus-live.json')
          if not p.exists() or not p.stat().st_size:
              print('CATALYST_FOCUS_NOT_EXECUTED_ON_THIS_TRIGGER')
              raise SystemExit(0)
          d=json.loads(p.read_text())
          assert d['mode']=='SELECTIVE_LISTING_FOCUS_ONLY'
          assert d['policy']['raw_listing_telegram'] is False
          assert d['policy']['silent_watch_before_promotion'] is True
          assert d['policy']['selected_candidates_monitored_until_listing'] is True
          assert d['policy']['followup_only_on_material_change_or_countdown'] is True
          assert d['policy']['focus_score_is_probability'] is False
          assert d['policy']['automatic_trade'] is False
          for x in d.get('new_evaluations',[]):
              if x.get('focus_eligible'):
                  assert x.get('decision_score',0) >= d['policy']['focus_threshold']
                  assert x.get('dex_url')
                  assert (x.get('market') or {}).get('token_identity_verified') is True
                  assert (x.get('market') or {}).get('liquidity_usd',0) >= d['policy']['hard_liquidity_floor_usd']
              b=x.get('binance_intelligence') or {}
              if b.get('applicable'):
                  assert b.get('production_effect') is False
                  assert b.get('automatic_buy') is False
          print('CATALYST_FOCUS_POLICY_OK', d.get('counts'))
          PY

      - name: Persist raw evidence and Focus state atomically
        run: |
          set -euo pipefail
          git config user.name 'wallet500-catalyst-bot'
          git config user.email 'wallet500-catalyst-bot@users.noreply.github.com'
          git add data/catalyst-wire-live.json data/catalyst-wire-ledger.json data/catalyst-wire-state.json
          if test -s data/catalyst-focus-live.json; then git add data/catalyst-focus-live.json; fi
          if test -s data/catalyst-focus-state.json; then git add data/catalyst-focus-state.json; fi
          if git diff --cached --quiet; then
            echo 'No Catalyst/Focus state change'
            exit 0
          fi
          git commit -m 'data: refresh Catalyst Wire and selective Focus [skip ci]'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo 'CATALYST_FOCUS_PUBLISH_REJECTED: rebase conflict'
              exit 1
            fi
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
