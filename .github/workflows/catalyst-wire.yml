name: Wallet500 Catalyst Wire

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths:
      - 'src/wallet500/catalyst_wire.py'
      - 'src/wallet500/catalyst_wire_binance.py'
      - 'src/wallet500/catalyst_identity_guard.py'
      - 'src/wallet500/catalyst_focus.py'
      - 'src/wallet500/catalyst_focus_binance.py'
      - 'src/wallet500/listing_opportunity_router.py'
      - 'tests/test_listing_opportunity_router.py'
      - '.github/workflows/catalyst-wire.yml'

permissions:
  contents: write
concurrency:
  group: wallet500-catalyst-wire-source-scan
  cancel-in-progress: false

jobs:
  wire:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install and test listing router
        run: |
          pip install -e . pytest
          pytest -q tests/test_listing_opportunity_router.py tests/test_catalyst_focus.py tests/test_catalyst_focus_binance.py
      - name: Refresh Catalyst evidence
        run: |
          python -m wallet500.catalyst_wire_binance
          python -m wallet500.catalyst_identity_guard
      - name: Route future and multi-CEX listing opportunities
        run: python -m wallet500.listing_opportunity_router
      - name: Run exact-market Focus and Telegram market alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m wallet500.catalyst_focus_binance
      - name: Telegram immediate discovery notice for new exact future/multi-CEX cases
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import json,os,urllib.parse,urllib.request
          from pathlib import Path
          p=Path('data/listing-opportunity-live.json'); state=Path('data/listing-opportunity-telegram-state.json')
          d=json.loads(p.read_text()); old=json.loads(state.read_text()) if state.exists() else {'sent':[]}; sent=set(old.get('sent') or [])
          tok=os.getenv('TELEGRAM_BOT_TOKEN','').strip(); cid=os.getenv('TELEGRAM_CHAT_ID','').strip(); delivered=[]
          for x in d.get('opportunities',[]):
            if not x.get('telegram_candidate'): continue
            key='|'.join(str(x.get(k) or '') for k in ('asset_key','source_owner','listing_start','lane'))
            if key in sent: continue
            badge='🔥🔥🔥 MULTI-CEX PRE-LISTING' if x.get('exchange_count',0)>=2 else '🔥 PRE-LISTING DISCOVERY'
            text='\n'.join([badge+' · WALLET500',f"{x.get('symbol') or 'UNKNOWN'} · {x.get('lane')}",f"Chain: {x.get('chain')}\nCA: {x.get('contract')}",f"Exchange(s): {', '.join(str(v).upper() for v in x.get('exchanges') or [x.get('source_owner')])}",f"Listing UTC: {x.get('listing_start') or 'unknown'}",f"T-minus: {x.get('minutes_to_listing')} min",'Tracking started immediately · Revival 90d gate does NOT apply to this lane','No automatic buy',str(x.get('source_url') or '')])
            if not tok or not cid: print('TELEGRAM_SECRETS_MISSING'); break
            body=urllib.parse.urlencode({'chat_id':cid,'text':text,'disable_web_page_preview':'true'}).encode(); req=urllib.request.Request(f'https://api.telegram.org/bot{tok}/sendMessage',data=body,method='POST')
            try:
              with urllib.request.urlopen(req,timeout=15) as r: ok=json.loads(r.read().decode()).get('ok') is True
            except Exception as e: ok=False; print(type(e).__name__,e)
            if ok: sent.add(key); delivered.append(key)
          state.write_text(json.dumps({'sent':sorted(sent)[-1000:]},indent=2)); print('LISTING_TELEGRAM_DELIVERED',len(delivered))
          PY
      - name: Persist listing intelligence
        run: |
          git config user.name wallet500-catalyst-bot
          git config user.email wallet500-catalyst-bot@users.noreply.github.com
          git add data/catalyst-wire-live.json data/catalyst-wire-ledger.json data/catalyst-wire-state.json data/listing-opportunity-live.json data/listing-opportunity-telegram-state.json data/catalyst-focus-live.json data/catalyst-focus-state.json 2>/dev/null || true
          if ! git diff --cached --quiet; then git commit -m 'data: refresh listing opportunity intelligence [skip ci]' && git push; fi
