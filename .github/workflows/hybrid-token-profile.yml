name: Wallet500 Hybrid Token Profiles

on:
  workflow_dispatch:
  schedule:
    - cron: '15,45 * * * *'
  push:
    branches: [main]
    paths:
      - 'src/wallet500/hybrid_token_profile.py'
      - 'src/wallet500/hybrid_onchain_evidence.py'
      - 'src/wallet500/hybrid_runner.py'
      - 'src/wallet500/hybrid_research_context.py'
      - 'tests/test_hybrid_token_profile.py'
      - 'tests/test_hybrid_onchain_evidence.py'
      - 'tests/test_hybrid_research_context.py'
      - '.github/workflows/hybrid-token-profile.yml'
      - 'dashboard-hybrid.html'
      - 'data/revival-1000-latest.json'
      - 'data/revival-historical-dna.json'
      - 'data/winner-dna-study.json'

permissions:
  contents: write

concurrency:
  group: wallet500-main-data-publisher
  cancel-in-progress: false

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -e . pytest
      - name: Unit tests
        run: python -m pytest -q tests/test_hybrid_token_profile.py tests/test_hybrid_onchain_evidence.py tests/test_hybrid_research_context.py
      - name: Validate Hybrid Radar truth shell
        run: |
          test -s dashboard-hybrid.html
          grep -Fq '<title>Wallet500 Hybrid Token Radar</title>' dashboard-hybrid.html
          grep -Fq 'TRUTH CONTRACT' dashboard-hybrid.html
          grep -Fq 'NOT_CONNECTED' dashboard-hybrid.html
      - name: Collect rotating exact-mint holder evidence
        env:
          HYBRID_HOLDER_SCAN_BUDGET: '12'
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
        run: |
          if [ -z "${SOLANA_RPC_URL:-}" ]; then
            export SOLANA_RPC_URL='https://api.mainnet-beta.solana.com'
          fi
          python -m wallet500.hybrid_onchain_evidence
      - name: Build exact-address hybrid profiles
        run: python -m wallet500.hybrid_runner
      - name: Validate hybrid truth contract
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          from wallet500.revival_1000 import looks_like_solana_address

          p=Path('data/hybrid-token-profiles.json')
          s=Path('data/hybrid-token-state.json')
          e=Path('data/hybrid-external-evidence.json')
          if not p.exists() or not s.exists() or not e.exists(): raise SystemExit('HYBRID_OUTPUT_MISSING')
          d=json.loads(p.read_text())
          st=json.loads(s.read_text())
          ev=json.loads(e.read_text())
          if d.get('mode')!='RESEARCH_ONLY_HYBRID_TOKEN_PROFILE_V1': raise SystemExit('HYBRID_MODE_INVALID')
          if d.get('contract')!='HYBRID_TOKEN_PROFILE_V1': raise SystemExit('HYBRID_CONTRACT_INVALID')
          if d.get('network')!='solana': raise SystemExit('HYBRID_NETWORK_INVALID')
          if d.get('production_portfolio_impact')!='NONE': raise SystemExit('HYBRID_PRODUCTION_IMPACT_INVALID')
          if d.get('no_hindsight') is not True: raise SystemExit('HYBRID_NO_HINDSIGHT_MISSING')
          if st.get('last_source_generated_at') != d.get('source_generated_at'): raise SystemExit('HYBRID_STATE_SOURCE_MISMATCH')
          timing=d.get('external_evidence_timing_contract') or {}
          if timing.get('market_snapshot_rule')!='MARKET_BASELINE_UPDATES_ONCE_PER_UNIQUE_REVIVAL_SOURCE_TIMESTAMP': raise SystemExit('HYBRID_BASELINE_IDEMPOTENCY_CONTRACT_MISSING')
          if not timing.get('external_fingerprint') or st.get('last_external_fingerprint')!=timing.get('external_fingerprint'): raise SystemExit('HYBRID_EXTERNAL_FINGERPRINT_STATE_MISMATCH')
          try:
              generated=datetime.fromisoformat(str(d.get('generated_at')).replace('Z','+00:00'))
              source_generated=datetime.fromisoformat(str(d.get('source_generated_at')).replace('Z','+00:00'))
              if generated.tzinfo is None: generated=generated.replace(tzinfo=timezone.utc)
              if source_generated.tzinfo is None: source_generated=source_generated.replace(tzinfo=timezone.utc)
          except Exception: raise SystemExit('HYBRID_PROFILE_TIMESTAMP_INVALID')
          if generated < source_generated: raise SystemExit('HYBRID_PROFILE_PRECEDES_MARKET_SOURCE')
          if generated > datetime.now(timezone.utc)+timedelta(minutes=2): raise SystemExit('HYBRID_PROFILE_FUTURE_TIMESTAMP')
          if ev.get('contract')!='HYBRID_EXTERNAL_EVIDENCE_V1' or ev.get('network')!='solana': raise SystemExit('HYBRID_EXTERNAL_CONTRACT_INVALID')
          if ev.get('production_portfolio_impact')!='NONE': raise SystemExit('HYBRID_EXTERNAL_PRODUCTION_IMPACT_INVALID')
          for x in ev.get('observations') or []:
              address=str(x.get('token_address') or '')
              if x.get('network')!='solana' or not looks_like_solana_address(address): raise SystemExit('HYBRID_EXTERNAL_IDENTITY_INVALID')
              h=x.get('holders') or {}
              if h.get('verified') is not True or h.get('contract_match') is not True: raise SystemExit('HYBRID_HOLDER_UNVERIFIED_ROW_PUBLISHED')
              score=float(h.get('anomaly_score') or 0); risk=float(h.get('risk_score') or 0)
              if not (0<=score<=100 and 0<=risk<=100): raise SystemExit('HYBRID_HOLDER_SCORE_RANGE_INVALID')
              try:
                  observed=datetime.fromisoformat(str(x.get('observed_at')).replace('Z','+00:00'))
                  if observed.tzinfo is None: observed=observed.replace(tzinfo=timezone.utc)
              except Exception: raise SystemExit('HYBRID_HOLDER_TIMESTAMP_INVALID')
              if observed > datetime.now(timezone.utc)+timedelta(minutes=2): raise SystemExit('HYBRID_HOLDER_FUTURE_TIMESTAMP')
          rows=d.get('profiles') or []
          if not (100 <= len(rows) <= 500): raise SystemExit(f'HYBRID_PROFILE_COUNT_INVALID:{len(rows)}')
          addresses=[str(x.get('token_address') or '') for x in rows]
          if len(addresses)!=len(set(addresses)): raise SystemExit('HYBRID_DUPLICATE_TOKEN_ADDRESS')
          if any(not looks_like_solana_address(x) for x in addresses): raise SystemExit('HYBRID_INVALID_SOLANA_ADDRESS')
          allowed={'BASELINE_LEARNING','NORMAL','ABNORMAL_ACTIVITY','HYBRID_IGNITION','RISK_DISTRIBUTION'}
          for x in rows:
              if x.get('observed_at') != d.get('generated_at'): raise SystemExit('HYBRID_PROFILE_OBSERVED_AT_MISMATCH')
              raw=float(x.get('hybrid_score_raw') or 0); cov=float(x.get('evidence_coverage_pct') or 0); norm=float(x.get('hybrid_score_verified_normalized') or 0); risk=float(x.get('risk_score') or 0)
              if not (0<=raw<=100 and 0<=cov<=100 and 0<=norm<=100 and 0<=risk<=100): raise SystemExit('HYBRID_SCORE_RANGE_INVALID')
              if raw > cov + 1e-6: raise SystemExit('HYBRID_RAW_SCORE_EXCEEDS_EVIDENCE_COVERAGE')
              if x.get('status') not in allowed: raise SystemExit('HYBRID_STATUS_INVALID')
              ch=x.get('channels') or {}
              for name in ('holders','wallets','social','news'):
                  c=ch.get(name) or {}
                  if c.get('available') is not True and float(c.get('score') or 0)!=0: raise SystemExit(f'HYBRID_UNVERIFIED_{name.upper()}_SCORED')
                  if c.get('available') is True:
                      try:
                          observed=datetime.fromisoformat(str(c.get('observed_at')).replace('Z','+00:00'))
                          if observed.tzinfo is None: observed=observed.replace(tzinfo=timezone.utc)
                      except Exception: raise SystemExit(f'HYBRID_{name.upper()}_TIMESTAMP_INVALID')
                      if observed > generated+timedelta(minutes=2): raise SystemExit(f'HYBRID_{name.upper()}_AFTER_PROFILE_TIMESTAMP')
              if x.get('status')=='HYBRID_IGNITION':
                  if not x.get('baseline_ready') or len(x.get('strong_channels') or [])<2 or raw<35 or norm<70 or risk>=35:
                      raise SystemExit('HYBRID_IGNITION_CONTRACT_BROKEN')
          print('HYBRID_TOKEN_PROFILE_V1_OK', d.get('counts'), 'holder_evidence', ev.get('scan'))
          PY
      - name: Attach past-DNA research context and build Catalyst Scan queue
        run: python -m wallet500.hybrid_research_context
      - name: Validate research context truth contract
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          from wallet500.revival_1000 import looks_like_solana_address
          files=[Path('data/hybrid-token-profiles.json'),Path('data/hybrid-research-context.json'),Path('data/hybrid-catalyst-scan-queue.json'),Path('data/hybrid-catalyst-trigger-ledger.json')]
          for p in files:
              if not p.exists() or p.stat().st_size==0: raise SystemExit('HYBRID_RESEARCH_OUTPUT_MISSING:'+str(p))
          h,ctx,q,l=[json.loads(p.read_text()) for p in files]
          rc=h.get('research_context_contract') or {}
          if rc.get('contract')!='HYBRID_RESEARCH_CONTEXT_V1' or rc.get('production_impact')!='NONE' or rc.get('no_hindsight') is not True: raise SystemExit('HYBRID_RESEARCH_CONTRACT_INVALID')
          if ctx.get('mode')!='RESEARCH_ONLY_HYBRID_RESEARCH_CONTEXT_V1' or ctx.get('production_impact')!='NONE': raise SystemExit('HYBRID_RESEARCH_SUMMARY_INVALID')
          rows=h.get('profiles') or []
          if int((ctx.get('counts') or {}).get('profiles_attached') or 0)!=len(rows): raise SystemExit('HYBRID_RESEARCH_PROFILE_COUNT_MISMATCH')
          for x in rows:
              r=x.get('research_context') or {}
              if r.get('contract')!='HYBRID_RESEARCH_CONTEXT_V1' or r.get('production_impact')!='NONE': raise SystemExit('HYBRID_PROFILE_RESEARCH_CONTEXT_INVALID')
          if q.get('mode')!='RESEARCH_ONLY_CATALYST_SCAN_QUEUE_V1' or q.get('network')!='solana' or q.get('production_impact')!='NONE': raise SystemExit('CATALYST_QUEUE_CONTRACT_INVALID')
          if int(q.get('queue_count') or 0)!=len(q.get('queue') or []): raise SystemExit('CATALYST_QUEUE_COUNT_INVALID')
          if l.get('mode')!='IMMUTABLE_CATALYST_TRIGGER_LEDGER_V1' or l.get('production_impact')!='NONE': raise SystemExit('CATALYST_LEDGER_CONTRACT_INVALID')
          for x in q.get('queue') or []:
              if not looks_like_solana_address(x.get('token_address')) or not looks_like_solana_address(x.get('pair_address')): raise SystemExit('CATALYST_QUEUE_IDENTITY_INVALID')
              fam=set(x.get('trigger_families') or [])
              if len(fam)<2 or not fam.issubset({'MARKET','LIQUIDITY_FLOW','HOLDERS','WALLETS'}): raise SystemExit('CATALYST_QUEUE_INDEPENDENCE_INVALID')
              try:
                  t=datetime.fromisoformat(str(x.get('first_requested_at')).replace('Z','+00:00'))
                  if t.tzinfo is None:t=t.replace(tzinfo=timezone.utc)
              except Exception: raise SystemExit('CATALYST_QUEUE_TIMESTAMP_INVALID')
              if t>datetime.now(timezone.utc)+timedelta(minutes=2): raise SystemExit('CATALYST_QUEUE_FUTURE_TRIGGER')
          print('HYBRID_RESEARCH_CONTEXT_V1_OK',ctx.get('counts'),'queue',q.get('queue_count'))
          PY
      - name: Publish hybrid profiles, evidence, research context, and trigger ledger
        run: |
          set -euo pipefail
          git config user.name 'wallet500-hybrid-bot'
          git config user.email 'wallet500-hybrid-bot@users.noreply.github.com'

          tmp="$(mktemp -d)"
          for f in hybrid-token-profiles.json hybrid-token-state.json hybrid-external-evidence.json hybrid-research-context.json hybrid-catalyst-scan-queue.json hybrid-catalyst-trigger-ledger.json; do cp "data/$f" "$tmp/$f"; done

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            for f in hybrid-token-profiles.json hybrid-token-state.json hybrid-external-evidence.json hybrid-research-context.json hybrid-catalyst-scan-queue.json hybrid-catalyst-trigger-ledger.json; do cp "$tmp/$f" "data/$f"; done
            git add data/hybrid-token-profiles.json data/hybrid-token-state.json data/hybrid-external-evidence.json data/hybrid-research-context.json data/hybrid-catalyst-scan-queue.json data/hybrid-catalyst-trigger-ledger.json
            if git diff --cached --quiet; then
              echo 'HYBRID_NO_DATA_CHANGE'
              exit 0
            fi
            git commit -m 'data: refresh Hybrid profiles, past-DNA context and catalyst queue'
            if git push origin HEAD:main; then
              echo 'HYBRID_PUBLISH_OK'
              exit 0
            fi
            echo "HYBRID_PUBLISH_RETRY attempt=$attempt"
            sleep 3
          done
          echo '::error::HYBRID_PUBLISH_RACE_EXHAUSTED'
          exit 1
