name: Wallet500 CEX Fast Promotion

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Wallet500 CEX Spot Revival Fast Lane"]
    types: [completed]
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/cex-fast-promotion.yml'
      - 'src/wallet500/cex_fast_promotion.py'
      - 'src/wallet500/cex_fast_current_bypass.py'
      - 'src/wallet500/cex_endpoint_fallbacks.py'
      - 'src/wallet500/reentry_active_watch.py'
      - 'scripts/run_cex_action_guarded.py'
      - 'scripts/run_cex_action_resilient.py'
      - 'tests/test_cex_fast_promotion.py'
      - 'tests/test_cex_fast_current_bypass.py'
      - 'tests/test_cex_endpoint_fallbacks.py'
      - 'tests/test_reentry_active_watch.py'
      - 'tests/test_cex_liquidity_context.py'

permissions:
  contents: write

concurrency:
  group: wallet500-cex-fast-promotion
  cancel-in-progress: false

jobs:
  promote:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install and verify strict action, liquidity-context, re-entry and endpoint-fallback contracts
        run: |
          pip install -e . pytest
          python -m pytest -q \
            tests/test_cex_fast_promotion.py \
            tests/test_cex_fast_current_bypass.py \
            tests/test_cex_spot_identity.py \
            tests/test_cex_spot_dynamic_identity_bridge.py \
            tests/test_cex_endpoint_fallbacks.py \
            tests/test_reentry_active_watch.py \
            tests/test_cex_liquidity_context.py
      - name: Refuse stale exact-identity source
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          p=Path('data/cex-spot-identity-radar.json')
          if not p.is_file(): raise SystemExit('CEX_FAST_IDENTITY_SOURCE_MISSING')
          d=json.loads(p.read_text())
          s=str(d.get('generated_at') or '').replace('Z','+00:00')
          if not s: raise SystemExit('CEX_FAST_IDENTITY_SOURCE_TIMESTAMP_MISSING')
          ts=datetime.fromisoformat(s)
          if ts.tzinfo is None: ts=ts.replace(tzinfo=timezone.utc)
          age=(datetime.now(timezone.utc)-ts.astimezone(timezone.utc)).total_seconds()
          if age < -120 or age > 35*60: raise SystemExit(f'CEX_FAST_IDENTITY_SOURCE_STALE age={age:.0f}s')
          print('CEX_FAST_IDENTITY_SOURCE_FRESH', {'age_seconds':round(age,1)})
          PY
      - name: Promote only action-worthy exact assets and send Telegram
        env:
          TELEGRAM_BOT_TOKEN: ''
          TELEGRAM_CHAT_ID: ''
        run: python scripts/run_cex_action_resilient.py
      - name: Validate action-only Telegram and resilient CEX coverage contracts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          alerts=json.loads(Path('data/cex-fast-real-alerts.json').read_text())
          report=json.loads(Path('data/cex-fast-promotion-report.json').read_text())
          truth=alerts.get('truth_contract') or {}
          if report.get('configured') is not False: raise SystemExit('CEX_FAST_DIRECT_TELEGRAM_MUST_BE_DISABLED')
          if report.get('telegram_delivery_enabled') is not False: raise SystemExit('CEX_FAST_DIRECT_TELEGRAM_POLICY_DRIFT')
          if int(report.get('delivered_count') or 0) != 0: raise SystemExit('CEX_FAST_DIRECT_TELEGRAM_DELIVERY_LEAK')
          if truth.get('research_only_alerts_never_delivered') is not True: raise SystemExit('CEX_FAST_RESEARCH_ALERT_LEAK_GUARD_MISSING')
          if truth.get('exact_chain_contract_pair_required') is not True: raise SystemExit('CEX_FAST_EXACT_IDENTITY_GUARD_MISSING')
          if truth.get('cex_dex_current_price_coherence_required') is not True: raise SystemExit('CEX_FAST_PRICE_COHERENCE_GUARD_MISSING')
          if float(truth.get('minimum_market_age_days') or 0) != 90.0: raise SystemExit('CEX_FAST_AGE_POLICY_DRIFT')
          if float(truth.get('minimum_execution_liquidity_usd') or 0) != 15000.0: raise SystemExit('CEX_FAST_LIQUIDITY_POLICY_DRIFT')
          health=report.get('usdc_source_health') or {}
          for source in ('binance','bybit','bitget','coinex'):
              h=health.get(source) or {}
              if h.get('official_endpoint_only') is not True: raise SystemExit(f'CEX_FAST_{source.upper()}_OFFICIAL_SOURCE_GUARD_MISSING')
              if not isinstance(h.get('endpoint_attempts'), list) or not h.get('endpoint_attempts'):
                  raise SystemExit(f'CEX_FAST_{source.upper()}_ENDPOINT_TELEMETRY_MISSING')
              minimum_pool = 1 if source == 'coinex' else 2
              if int(h.get('fallback_pool_size') or 0) < minimum_pool:
                  raise SystemExit(f'CEX_FAST_{source.upper()}_FALLBACK_POOL_TOO_SMALL')
          coverage=health.get('bybit_gap_coverage') or {}
          if coverage.get('ok') is not True:
              raise SystemExit('CEX_FAST_BYBIT_VISIBILITY_GAP_OPEN')
          if coverage.get('geo_restriction_circumvention') is not False:
              raise SystemExit('CEX_FAST_GEO_RESTRICTION_POLICY_DRIFT')
          if coverage.get('regional_bybit_endpoints_used_as_proxy') is not False:
              raise SystemExit('CEX_FAST_REGIONAL_BYBIT_PROXY_POLICY_DRIFT')
          if coverage.get('direct_bybit_available') is not True:
              if coverage.get('coverage_state') != 'INDEPENDENT_TWO_CEX_REDUNDANCY':
                  raise SystemExit('CEX_FAST_BYBIT_COMPENSATION_STATE_INVALID')
              source_health=coverage.get('compensation_source_health') or {}
              if source_health.get('bitget') is not True or source_health.get('coinex') is not True:
                  raise SystemExit('CEX_FAST_BYBIT_TWO_SOURCE_COMPENSATION_INCOMPLETE')
              if int(coverage.get('minimum_independent_compensation_sources') or 0) != 2:
                  raise SystemExit('CEX_FAST_BYBIT_COMPENSATION_POLICY_DRIFT')
          seen=set(); excluded='61v8vbaqagmpgdqi4jcawo1dmbghsyhzodcpqnevpump'
          for row in alerts.get('alerts') or []:
              if row.get('status') != 'REAL_ALERT' or row.get('actionable') is not True or row.get('research_only') is not False: raise SystemExit('CEX_FAST_NON_ACTIONABLE_ALERT_LEAK')
              if row.get('automatic_buy') is not False or row.get('manual_decision_only') is not True: raise SystemExit('CEX_FAST_EXECUTION_POLICY_LEAK')
              if not row.get('chain') or not row.get('token_address') or not row.get('pair_address'): raise SystemExit('CEX_FAST_IDENTITY_FIELDS_MISSING')
              if row.get('blockers'): raise SystemExit('CEX_FAST_BLOCKED_ROW_PUBLISHED')
              key=(str(row.get('chain')).lower(),str(row.get('token_address')).lower())
              if key in seen: raise SystemExit('CEX_FAST_DUPLICATE_CANONICAL_ASSET')
              seen.add(key)
              if key==('solana',excluded): raise SystemExit('CEX_FAST_EXCLUDED_ARC_LEAK')
              if int(row.get('signal_score') or 0)<50: raise SystemExit('CEX_FAST_WEAK_SCORE_TELEGRAM_LEAK')
              since=float(row.get('since_discovery_pct') or 0)
              if since < -12 or since > 12: raise SystemExit('CEX_FAST_BAD_ENTRY_WINDOW_LEAK')
              if float(row.get('current_change_24h_pct') or 0)>35: raise SystemExit('CEX_FAST_CHASE_LEAK')
              if 'best_verified_pool_liquidity_usd' in row:
                  if float(row.get('best_verified_pool_liquidity_usd') or 0) < float(row.get('execution_liquidity_usd') or 0):
                      raise SystemExit('CEX_FAST_BEST_POOL_LT_EXECUTION_PAIR')
                  if row.get('best_verified_pool_check_complete') not in {True, False}:
                      raise SystemExit('CEX_FAST_BEST_POOL_COMPLETENESS_MISSING')
          if int(report.get('error_count') or 0)>0: raise SystemExit(f"CEX_FAST_DELIVERY_ERRORS={report.get('error_count')}")
          print('CEX_FAST_ACTION_ONLY_VALID', {
              'eligible':len(alerts.get('alerts') or []),
              'delivered':report.get('delivered_count'),
              'binance_ok':(health.get('binance') or {}).get('ok'),
              'bybit_direct_ok':(health.get('bybit') or {}).get('ok'),
              'bitget_ok':(health.get('bitget') or {}).get('ok'),
              'coinex_ok':(health.get('coinex') or {}).get('ok'),
              'bybit_gap_coverage':coverage.get('coverage_state'),
          })
          PY
      - name: Persist fast-promotion alert, canonical dedupe state and report
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'wallet500-truth-bot'
          git config user.email 'wallet500-truth-bot@users.noreply.github.com'
          python scripts/serialized_publish.py --github-api-cas --attempts 80 --message 'alerts: persist CEX action-only promotion state' data/cex-fast-real-alerts.json data/cex-fast-promotion-state.json data/cex-fast-current-bypass-state.json data/cex-fast-promotion-report.json
