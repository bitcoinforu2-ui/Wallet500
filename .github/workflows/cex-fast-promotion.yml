name: Wallet500 CEX Fast Promotion

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Wallet500 CEX Spot Revival Fast Lane"]
    types: [completed]
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/cex-fast-promotion.yml'
      - 'src/wallet500/cex_fast_promotion.py'
      - 'src/wallet500/cex_fast_current_bypass.py'
      - 'tests/test_cex_fast_promotion.py'
      - 'tests/test_cex_fast_current_bypass.py'

permissions:
  contents: write

concurrency:
  group: wallet500-cex-fast-promotion
  cancel-in-progress: false

jobs:
  promote:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install and verify strict fast-promotion contracts
        run: |
          pip install -e . pytest
          python -m pytest -q \
            tests/test_cex_fast_promotion.py \
            tests/test_cex_fast_current_bypass.py \
            tests/test_cex_spot_identity.py \
            tests/test_cex_spot_dynamic_identity_bridge.py
      - name: Refuse stale exact-identity source
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          p=Path('data/cex-spot-identity-radar.json')
          if not p.is_file(): raise SystemExit('CEX_FAST_IDENTITY_SOURCE_MISSING')
          d=json.loads(p.read_text())
          s=str(d.get('generated_at') or '').replace('Z','+00:00')
          if not s: raise SystemExit('CEX_FAST_IDENTITY_SOURCE_TIMESTAMP_MISSING')
          ts=datetime.fromisoformat(s)
          if ts.tzinfo is None: ts=ts.replace(tzinfo=timezone.utc)
          age=(datetime.now(timezone.utc)-ts.astimezone(timezone.utc)).total_seconds()
          if age < -120 or age > 35*60: raise SystemExit(f'CEX_FAST_IDENTITY_SOURCE_STALE age={age:.0f}s')
          print('CEX_FAST_IDENTITY_SOURCE_FRESH', {'age_seconds':round(age,1)})
          PY
      - name: Promote only exact verified actionable CEX candidates and send Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -m wallet500.cex_fast_promotion
          python -m wallet500.cex_fast_current_bypass
      - name: Validate no research-only Telegram leakage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          alerts=json.loads(Path('data/cex-fast-real-alerts.json').read_text())
          report=json.loads(Path('data/cex-fast-promotion-report.json').read_text())
          truth=alerts.get('truth_contract') or {}
          if report.get('configured') is not True: raise SystemExit('CEX_FAST_TELEGRAM_NOT_CONFIGURED')
          if truth.get('research_only_alerts_never_delivered') is not True: raise SystemExit('CEX_FAST_RESEARCH_ALERT_LEAK_GUARD_MISSING')
          if truth.get('exact_chain_contract_pair_required') is not True: raise SystemExit('CEX_FAST_EXACT_IDENTITY_GUARD_MISSING')
          if truth.get('cex_dex_current_price_coherence_required') is not True: raise SystemExit('CEX_FAST_PRICE_COHERENCE_GUARD_MISSING')
          if float(truth.get('minimum_market_age_days') or 0) != 90.0: raise SystemExit('CEX_FAST_AGE_POLICY_DRIFT')
          if float(truth.get('minimum_execution_liquidity_usd') or 0) != 15000.0: raise SystemExit('CEX_FAST_LIQUIDITY_POLICY_DRIFT')
          if float(truth.get('late_move_do_not_chase_above_24h_pct') or 0) != 45.0: raise SystemExit('CEX_FAST_CHASE_GUARD_DRIFT')
          if truth.get('canonical_180d_50k_pipeline_unchanged') is not True: raise SystemExit('CEX_FAST_CANONICAL_PIPELINE_LEAK')
          if truth.get('usdc_quote_coverage_enabled') is not True: raise SystemExit('CEX_FAST_USDC_COVERAGE_MISSING')
          if truth.get('current_watch_identity_queue_bypass_enabled') is not True: raise SystemExit('CEX_FAST_CURRENT_WATCH_BYPASS_MISSING')
          if truth.get('current_watch_bypass_requires_strict_dex_identity') is not True: raise SystemExit('CEX_FAST_BYPASS_STRICT_IDENTITY_GUARD_MISSING')
          if truth.get('current_watch_bypass_symbol_only_never_actionable') is not True: raise SystemExit('CEX_FAST_BYPASS_SYMBOL_ONLY_GUARD_MISSING')
          for row in alerts.get('alerts') or []:
              if row.get('status') != 'REAL_ALERT' or row.get('actionable') is not True or row.get('research_only') is not False:
                  raise SystemExit('CEX_FAST_NON_ACTIONABLE_ALERT_LEAK')
              if row.get('automatic_buy') is not False or row.get('manual_decision_only') is not True:
                  raise SystemExit('CEX_FAST_EXECUTION_POLICY_LEAK')
              if not row.get('chain') or not row.get('token_address') or not row.get('pair_address'):
                  raise SystemExit('CEX_FAST_IDENTITY_FIELDS_MISSING')
              if row.get('blockers'):
                  raise SystemExit('CEX_FAST_BLOCKED_ROW_PUBLISHED')
          if int(report.get('error_count') or 0) > 0:
              raise SystemExit(f"CEX_FAST_DELIVERY_ERRORS={report.get('error_count')}")
          bypass=report.get('current_watch_bypass') or {}
          print('CEX_FAST_PROMOTION_VALID', {
              'eligible': report.get('eligible_count'),
              'delivered': report.get('delivered_count'),
              'usdc_markets': report.get('usdc_markets_seen'),
              'usdc_groups': report.get('usdc_groups_seen'),
              'bypass_priority': bypass.get('priority_candidates'),
              'bypass_resolved': bypass.get('strict_resolved'),
              'bypass_eligible': bypass.get('eligible'),
              'bypass_delivered': bypass.get('delivered'),
          })
          PY
      - name: Persist fast-promotion alert, dedupe state and report
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'wallet500-truth-bot'
          git config user.email 'wallet500-truth-bot@users.noreply.github.com'
          python scripts/serialized_publish.py \
            --github-api-cas \
            --attempts 80 \
            --message 'alerts: persist CEX fast promotion state' \
            data/cex-fast-real-alerts.json \
            data/cex-fast-promotion-state.json \
            data/cex-fast-current-bypass-state.json \
            data/cex-fast-promotion-report.json
