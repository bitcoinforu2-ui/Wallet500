name: Wallet500 Verified Snapshot Publisher

on:
  workflow_run:
    workflows: ["Wallet500 Multi-Chain Live Scan"]
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: '2,17,32,47 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/verified-publisher.yml'
      - 'scripts/publish_verified_snapshot.py'
      - 'src/wallet500/decision_generation.py'
      - 'src/wallet500/decision_snapshot_guard.py'
      - 'src/wallet500/truth_input_preflight.py'
      - 'src/wallet500/truth_contract.py'
      - 'src/wallet500/safe_json.py'
      - 'scripts/pipeline_integrity_audit.py'

permissions:
  actions: read
  contents: write

# This is the sole production-authoritative main writer for a complete Live Scan
# snapshot and its generation manifest. Other lanes may publish source/advisory
# data, but must not publish canonical decision surfaces.
concurrency:
  group: wallet500-verified-snapshot-publisher
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Resolve immutable successful Live Scan source run
        id: source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
          EVENT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_run" ] && [ -n "${EVENT_RUN_ID:-}" ]; then
            run_id="$EVENT_RUN_ID"
            event_sha="${EVENT_SHA:-}"
          else
            api="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/live-scan.yml/runs?status=success&per_page=1"
            payload="$(curl --fail --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$api")"
            read -r run_id event_sha < <(PAYLOAD="$payload" python - <<'PY'
          import json, os
          p=json.loads(os.environ['PAYLOAD'])
          runs=p.get('workflow_runs') or []
          if not runs:
              raise SystemExit('No successful Live Scan run available for verified publishing')
          r=runs[0]
          if r.get('conclusion') != 'success':
              raise SystemExit('Resolved Live Scan is not successful')
          print(r['id'], r.get('head_sha') or '')
          PY
            )
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "event_sha=$event_sha" >> "$GITHUB_OUTPUT"
          echo "Resolved verified source run $run_id (event head ${event_sha:-unknown})"

      - name: Download immutable verified snapshot
        uses: actions/download-artifact@v4
        with:
          name: wallet500-verified-snapshot
          path: ${{ runner.temp }}/wallet500-verified-snapshot
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # A scheduled workflow may sit in GitHub's queue while main advances. In that
      # case workflow_run.head_sha describes the event head, while checkout can run
      # against a later default-branch commit. The artifact is the immutable record
      # of what was actually validated, so bind the publisher to its checkout SHA.
      # We still fail closed on run identity, manifest version/status, SHA syntax,
      # and later verify that the checkout SHA is an ancestor of canonical main.
      - name: Resolve immutable artifact checkout provenance
        id: artifact_source
        env:
          SNAPSHOT_DIR: ${{ runner.temp }}/wallet500-verified-snapshot
          EXPECTED_RUN_ID: ${{ steps.source.outputs.run_id }}
          EVENT_SHA: ${{ steps.source.outputs.event_sha }}
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, re
          from pathlib import Path
          p=Path(os.environ['SNAPSHOT_DIR'])/'manifest.json'
          if not p.is_file():
              raise SystemExit('Missing verified snapshot manifest')
          m=json.loads(p.read_text(encoding='utf-8'))
          if m.get('version') != 1:
              raise SystemExit('Unsupported verified snapshot manifest version')
          if str(m.get('source_run_id')) != str(os.environ['EXPECTED_RUN_ID']):
              raise SystemExit('Snapshot source run mismatch')
          if m.get('strict_validation') != 'PASS':
              raise SystemExit('Snapshot strict validation is not PASS')
          sha=str(m.get('source_sha') or '').lower()
          if not re.fullmatch(r'[0-9a-f]{40}', sha):
              raise SystemExit('Snapshot source SHA is invalid')
          event_sha=str(os.environ.get('EVENT_SHA') or '').lower()
          if event_sha and event_sha != sha:
              print(f'provenance_note=EVENT_HEAD_DIFFERS_FROM_VALIDATED_CHECKOUT:{event_sha}:{sha}')
          print(f'source_sha={sha}')
          PY
          cat "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Wallet500 package
        run: |
          set -euo pipefail
          python -m pip install -e .

      - name: Verify immutable artifact source commit belongs to canonical history
        env:
          SOURCE_SHA: ${{ steps.artifact_source.outputs.source_sha }}
          EVENT_SHA: ${{ steps.source.outputs.event_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=200 origin main
          git fetch --no-tags --depth=1 origin "$SOURCE_SHA"
          git cat-file -e "$SOURCE_SHA^{commit}"
          # The validated checkout must be on canonical main history. This prevents
          # accepting an artifact that merely claims an arbitrary repository SHA.
          if ! git merge-base --is-ancestor "$SOURCE_SHA" origin/main; then
            echo "::error::VERIFIED_ARTIFACT_SOURCE_NOT_ON_MAIN_HISTORY source=$SOURCE_SHA"
            exit 1
          fi
          # When GitHub's workflow event head differs because the scheduled job was
          # queued, require that event head is also on the same forward history.
          if [ -n "${EVENT_SHA:-}" ] && [ "$EVENT_SHA" != "$SOURCE_SHA" ]; then
            git fetch --no-tags --depth=200 origin "$EVENT_SHA" || true
            if git cat-file -e "$EVENT_SHA^{commit}" 2>/dev/null; then
              if ! git merge-base --is-ancestor "$EVENT_SHA" "$SOURCE_SHA"; then
                echo "::error::VERIFIED_ARTIFACT_EVENT_HISTORY_DIVERGED event=$EVENT_SHA source=$SOURCE_SHA"
                exit 1
              fi
              echo "VERIFIED_ARTIFACT_QUEUE_ADVANCE event=$EVENT_SHA validated_checkout=$SOURCE_SHA"
            fi
          fi

      - name: Validate and publish verified snapshot atomically
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python scripts/publish_verified_snapshot.py \
            --snapshot-dir "${{ runner.temp }}/wallet500-verified-snapshot" \
            --source-run-id "${{ steps.source.outputs.run_id }}" \
            --source-sha "${{ steps.artifact_source.outputs.source_sha }}"

      - name: Publish coherent generation and input-health manifest
        env:
          LIVE_SOURCE_SHA: ${{ steps.artifact_source.outputs.source_sha }}
          LIVE_SOURCE_RUN: ${{ steps.source.outputs.run_id }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Recompute the decision snapshot guard and manifests from the newest
          # canonical main on every conflict. The guard is part of the generation:
          # a two-day-old PASS must never be treated as evidence for a fresh feed.
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch origin main
            git reset --hard origin/main
            base="$(git rev-parse HEAD)"
            export SOURCE_SHA="$LIVE_SOURCE_SHA"
            export GITHUB_RUN_ID="$LIVE_SOURCE_RUN"
            python -m wallet500.truth_input_preflight
            python -m wallet500.decision_snapshot_guard
            python scripts/pipeline_integrity_audit.py
            python -m wallet500.decision_generation
            set +e
            python scripts/atomic_publish.py \
              --base "$base" \
              --fail-on-newer \
              --message 'data: bind coherent Wallet500 decision generation' \
              data/real-alerts.json \
              data/decision-snapshot-integrity.json \
              data/truth-input-health.json \
              data/pipeline-integrity-audit.json \
              data/decision-generation.json
            rc=$?
            set -e
            if [ "$rc" -eq 0 ]; then
              echo 'VERIFIED_CANONICAL_GENERATION_BOUND'
              exit 0
            fi
            if [ "$rc" -eq 75 ]; then
              delay=$(( attempt * attempt + (RANDOM % 5) ))
              echo "GENERATION_BIND_RETRY attempt=$attempt backoff=${delay}s"
              sleep "$delay"
              continue
            fi
            exit "$rc"
          done
          echo '::error::GENERATION_BIND_RETRIES_EXHAUSTED'
          exit 1
