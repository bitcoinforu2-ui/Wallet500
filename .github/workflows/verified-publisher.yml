name: Wallet500 Verified Snapshot Publisher

on:
  workflow_run:
    workflows: ["Wallet500 Multi-Chain Live Scan"]
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: '2,17,32,47 * * * *'
permissions:
  actions: read
  contents: write

# This is the sole production-authoritative main writer for a complete Live Scan
# snapshot and its generation manifest. It runs from successful Live Scan handoffs
# plus scheduled/manual recovery; ordinary code pushes must not displace a fresh
# pending handoff with a stale recovery publication.
concurrency:
  group: wallet500-verified-snapshot-publisher
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Scheduled/manual recovery must establish ancestry without GitHub's Compare
      # API. On this high-churn repository that endpoint can return 422 while
      # generating a large diff even when both commits are valid. A bounded local
      # history lets git answer the ancestry question directly and fail closed.
      - name: Checkout canonical history for source resolution
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1000

      - name: Resolve immutable successful Live Scan source run
        id: source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
          EVENT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          canonical_tip="$(git rev-parse HEAD)"
          if [ "$EVENT_NAME" = "workflow_run" ] && [ -n "${EVENT_RUN_ID:-}" ]; then
            run_id="$EVENT_RUN_ID"
            event_sha="${EVENT_SHA:-}"
          else
            # Scheduled/manual recovery must not pin itself forever to a successful
            # run whose commit belonged to an abandoned/replaced main history.
            # Examine a bounded newest-first window and select the newest successful
            # Live Scan whose event head is still an ancestor of canonical main.
            api="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/live-scan.yml/runs?status=success&per_page=20"
            candidates="$RUNNER_TEMP/wallet500-live-scan-successes.json"
            pairs="$RUNNER_TEMP/wallet500-live-scan-successes.tsv"
            curl --fail --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$api" > "$candidates"
            CANDIDATES="$candidates" PAIRS="$pairs" python - <<'PY'
          import json, os, re
          from pathlib import Path

          payload=json.loads(Path(os.environ['CANDIDATES']).read_text(encoding='utf-8'))
          rows=[]
          for run in payload.get('workflow_runs') or []:
              if run.get('conclusion') != 'success':
                  continue
              run_id=run.get('id')
              sha=str(run.get('head_sha') or '').strip().lower()
              if run_id and re.fullmatch(r'[0-9a-f]{40}', sha):
                  rows.append(f'{run_id}\t{sha}')
          if not rows:
              raise SystemExit('No successful Live Scan run available for verified publishing')
          Path(os.environ['PAIRS']).write_text('\n'.join(rows) + '\n', encoding='utf-8')
          PY

            run_id=""
            event_sha=""
            checked=0
            while IFS=$'\t' read -r candidate_run candidate_sha; do
              [ -n "$candidate_run" ] || continue
              checked=$((checked + 1))
              # The initial checkout contains the recent canonical main history.
              # If a candidate object is absent, fetch only that object; ancestry
              # still fails closed when the bounded main history cannot prove it.
              if ! git cat-file -e "$candidate_sha^{commit}" 2>/dev/null; then
                git fetch --no-tags --depth=1 origin "$candidate_sha" >/dev/null 2>&1 || {
                  echo "::warning::LIVE_SCAN_COMMIT_FETCH_FAILED run=$candidate_run sha=$candidate_sha"
                  continue
                }
              fi
              if git merge-base --is-ancestor "$candidate_sha" "$canonical_tip" 2>/dev/null; then
                run_id="$candidate_run"
                event_sha="$candidate_sha"
                break
              fi
              echo "::notice::SKIP_DISCONNECTED_SUCCESSFUL_LIVE_SCAN run=$candidate_run sha=$candidate_sha"
            done < "$pairs"

            if [ -z "$run_id" ]; then
              echo "::error::No successful Live Scan on canonical main history in newest window; checked=$checked"
              exit 1
            fi
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "event_sha=$event_sha" >> "$GITHUB_OUTPUT"
          echo "canonical_tip=$canonical_tip" >> "$GITHUB_OUTPUT"
          echo "Resolved verified source run $run_id (event head ${event_sha:-unknown}, canonical tip $canonical_tip)"

      - name: Download immutable verified snapshot
        uses: actions/download-artifact@v4
        with:
          name: wallet500-verified-snapshot
          path: ${{ runner.temp }}/wallet500-verified-snapshot
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # A scheduled workflow may sit in GitHub's queue while main advances. In that
      # case workflow_run.head_sha describes the event head, while checkout can run
      # against a later default-branch commit. The artifact is the immutable record
      # of what was actually validated, so bind the publisher to its checkout SHA.
      # We still fail closed on run identity, manifest version/status, SHA syntax,
      # and verify the source against the immutable canonical tip captured above.
      - name: Resolve immutable artifact checkout provenance
        id: artifact_source
        env:
          SNAPSHOT_DIR: ${{ runner.temp }}/wallet500-verified-snapshot
          EXPECTED_RUN_ID: ${{ steps.source.outputs.run_id }}
          EVENT_SHA: ${{ steps.source.outputs.event_sha }}
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, re
          from pathlib import Path
          p=Path(os.environ['SNAPSHOT_DIR'])/'manifest.json'
          if not p.is_file():
              raise SystemExit('Missing verified snapshot manifest')
          m=json.loads(p.read_text(encoding='utf-8'))
          if m.get('version') != 1:
              raise SystemExit('Unsupported verified snapshot manifest version')
          if str(m.get('source_run_id')) != str(os.environ['EXPECTED_RUN_ID']):
              raise SystemExit('Snapshot source run mismatch')
          if m.get('strict_validation') != 'PASS':
              raise SystemExit('Snapshot strict validation is not PASS')
          sha=str(m.get('source_sha') or '').lower()
          if not re.fullmatch(r'[0-9a-f]{40}', sha):
              raise SystemExit('Snapshot source SHA is invalid')
          event_sha=str(os.environ.get('EVENT_SHA') or '').lower()
          if event_sha and event_sha != sha:
              print(f'provenance_note=EVENT_HEAD_DIFFERS_FROM_VALIDATED_CHECKOUT:{event_sha}:{sha}')
          print(f'source_sha={sha}')
          PY
          cat "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Wallet500 package
        run: |
          set -euo pipefail
          python -m pip install -e .

      - name: Verify immutable artifact source commit belongs to canonical history
        env:
          SOURCE_SHA: ${{ steps.artifact_source.outputs.source_sha }}
          EVENT_SHA: ${{ steps.source.outputs.event_sha }}
          CANONICAL_TIP: ${{ steps.source.outputs.canonical_tip }}
        run: |
          set -euo pipefail
          git cat-file -e "$CANONICAL_TIP^{commit}"
          if ! git cat-file -e "$SOURCE_SHA^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$SOURCE_SHA"
          fi
          git cat-file -e "$SOURCE_SHA^{commit}"

          # Validate against the exact canonical tip used when the source run was
          # selected. Do not replace that proof with a later shallow checkout: on
          # this high-churn repository a valid ancestor can move beyond a shallow
          # boundary within minutes and otherwise produce a false negative.
          if ! git merge-base --is-ancestor "$SOURCE_SHA" "$CANONICAL_TIP" 2>/dev/null; then
            echo "::notice::PROVENANCE_HISTORY_DEEPEN source=$SOURCE_SHA canonical_tip=$CANONICAL_TIP"
            git fetch --no-tags --deepen=2000 origin main || true
          fi
          if ! git merge-base --is-ancestor "$SOURCE_SHA" "$CANONICAL_TIP" 2>/dev/null; then
            echo "::error::VERIFIED_ARTIFACT_SOURCE_NOT_ON_RESOLVED_MAIN_HISTORY source=$SOURCE_SHA canonical_tip=$CANONICAL_TIP"
            exit 1
          fi

          # When GitHub's workflow event head differs because the scheduled job was
          # queued, require that event head is also on the same forward history.
          if [ -n "${EVENT_SHA:-}" ] && [ "$EVENT_SHA" != "$SOURCE_SHA" ]; then
            if ! git cat-file -e "$EVENT_SHA^{commit}" 2>/dev/null; then
              git fetch --no-tags --depth=1 origin "$EVENT_SHA" || true
            fi
            if git cat-file -e "$EVENT_SHA^{commit}" 2>/dev/null; then
              if ! git merge-base --is-ancestor "$EVENT_SHA" "$SOURCE_SHA"; then
                echo "::error::VERIFIED_ARTIFACT_EVENT_HISTORY_DIVERGED event=$EVENT_SHA source=$SOURCE_SHA"
                exit 1
              fi
              echo "VERIFIED_ARTIFACT_QUEUE_ADVANCE event=$EVENT_SHA validated_checkout=$SOURCE_SHA"
            fi
          fi
          echo "VERIFIED_ARTIFACT_PROVENANCE_OK source=$SOURCE_SHA canonical_tip=$CANONICAL_TIP"

      - name: Validate and publish verified snapshot atomically
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python scripts/publish_verified_snapshot.py \
            --snapshot-dir "${{ runner.temp }}/wallet500-verified-snapshot" \
            --source-run-id "${{ steps.source.outputs.run_id }}" \
            --source-sha "${{ steps.artifact_source.outputs.source_sha }}"

      - name: Publish coherent generation and input-health manifest
        env:
          LIVE_SOURCE_SHA: ${{ steps.artifact_source.outputs.source_sha }}
          LIVE_SOURCE_RUN: ${{ steps.source.outputs.run_id }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Recompute the decision snapshot guard and manifests from the newest
          # canonical main on every conflict. The guard is part of the generation:
          # a two-day-old PASS must never be treated as evidence for a fresh feed.
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch origin main
            git reset --hard origin/main
            base="$(git rev-parse HEAD)"
            export SOURCE_SHA="$LIVE_SOURCE_SHA"
            export GITHUB_RUN_ID="$LIVE_SOURCE_RUN"
            python -m wallet500.truth_input_preflight
            python -m wallet500.decision_snapshot_guard
            python scripts/pipeline_integrity_audit.py
            python -m wallet500.decision_generation
            set +e
            python scripts/atomic_publish.py \
              --base "$base" \
              --fail-on-newer \
              --message 'data: bind coherent Wallet500 decision generation' \
              data/real-alerts.json \
              data/decision-snapshot-integrity.json \
              data/truth-input-health.json \
              data/pipeline-integrity-audit.json \
              data/decision-generation.json
            rc=$?
            set -e
            if [ "$rc" -eq 0 ]; then
              echo 'VERIFIED_CANONICAL_GENERATION_BOUND'
              exit 0
            fi
            if [ "$rc" -eq 75 ]; then
              delay=$(( attempt * attempt + (RANDOM % 5) ))
              echo "GENERATION_BIND_RETRY attempt=$attempt backoff=${delay}s"
              sleep "$delay"
              continue
            fi
            exit "$rc"
          done
          echo '::error::GENERATION_BIND_RETRIES_EXHAUSTED'
          exit 1
