name: Wallet500 Verified Snapshot Publisher

on:
  workflow_run:
    workflows: ["Wallet500 Multi-Chain Live Scan"]
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: '2,17,32,47 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/verified-publisher.yml'
      - 'scripts/publish_verified_snapshot.py'

permissions:
  actions: read
  contents: write

# Freshness-first serialized publishing lane. Immutable scan data can never
# overwrite paths changed on main after the scan source SHA.
# Do not cancel an in-flight publisher: frequent workflow_run/schedule triggers
# previously starved publication by repeatedly killing the only run able to
# advance data/publish-evidence.json. Serialization plus source-run watermarking
# already makes queued runs safe and stale runs exit cleanly.
concurrency:
  group: wallet500-verified-snapshot-publisher
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve immutable successful Live Scan source
        id: source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
          EVENT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_run" ] && [ -n "${EVENT_RUN_ID:-}" ] && [ -n "${EVENT_SHA:-}" ]; then
            run_id="$EVENT_RUN_ID"
            source_sha="$EVENT_SHA"
          else
            api="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/live-scan.yml/runs?status=success&per_page=1"
            payload="$(curl --fail --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$api")"
            read -r run_id source_sha < <(PAYLOAD="$payload" python - <<'PY'
          import json, os
          p=json.loads(os.environ['PAYLOAD'])
          runs=p.get('workflow_runs') or []
          if not runs:
              raise SystemExit('No successful Live Scan run available for verified publishing')
          r=runs[0]
          if r.get('conclusion') != 'success':
              raise SystemExit('Resolved Live Scan is not successful')
          print(r['id'], r['head_sha'])
          PY
            )
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "Resolved verified source run $run_id at $source_sha"

      - name: Download immutable verified snapshot
        uses: actions/download-artifact@v4
        with:
          name: wallet500-verified-snapshot
          path: ${{ runner.temp }}/wallet500-verified-snapshot
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Wallet500 package
        run: |
          set -euo pipefail
          python -m pip install -e .

      - name: Prefetch immutable source commit with bounded history
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "${{ steps.source.outputs.source_sha }}"
          git cat-file -e "${{ steps.source.outputs.source_sha }}^{commit}"

      - name: Validate and publish verified snapshot atomically
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python scripts/publish_verified_snapshot.py \
            --snapshot-dir "${{ runner.temp }}/wallet500-verified-snapshot" \
            --source-run-id "${{ steps.source.outputs.run_id }}" \
            --source-sha "${{ steps.source.outputs.source_sha }}"
