name: Policy threshold migration fast

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/policy-threshold-migration-fast.yml'
      - 'scripts/migrate_revival_policy_60d_15k.py'
      - 'scripts/migrate_revival_policy_60d_15k_fixups.py'

permissions:
  contents: write

jobs:
  migrate-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            src
            tests
            docs
            scripts
            .github

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply migration
        run: |
          python scripts/migrate_revival_policy_60d_15k.py
          python scripts/migrate_revival_policy_60d_15k_fixups.py

      - name: Install package and tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Compile engine
        run: python -m compileall -q src/wallet500

      - name: Unit test suite
        run: python -m pytest -q -k 'not repository_live_data_has_no_critical_integrity_findings'

      - name: Commit migration after tests pass
        shell: bash
        run: |
          find src tests -type d -name '__pycache__' -prune -exec rm -rf {} + || true
          rm -rf src/wallet500.egg-info
          if git diff --quiet; then
            echo 'No migration changes detected.'
            exit 0
          fi
          git config user.name 'wallet500-policy-bot'
          git config user.email 'wallet500-policy-bot@users.noreply.github.com'
          git add src tests docs .github/workflows scripts
          git commit -m 'policy: set Revival scope to 60d age and 15k liquidity'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push race on attempt ${attempt}; retrying after rebase..."
            sleep 2
          done
          echo 'Could not publish migration after 5 rebased attempts.'
          exit 1
