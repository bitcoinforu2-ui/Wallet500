  cancel-in-progress: true

jobs:
  deprecated:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Fail closed — obsolete 60d production migration is prohibited
        shell: bash
        run: |
          set -euo pipefail
          echo '::error::DEPRECATED_60D_POLICY_MIGRATION_BLOCKED'
          echo 'Canonical truth is research 90d/$15K and production 180d/$50K with exact identity, exact pair, holder/cluster fail-closed and no automatic buy.'
