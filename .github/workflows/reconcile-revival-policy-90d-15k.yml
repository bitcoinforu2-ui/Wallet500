name: Wallet500 Reconcile Revival Policy 90D 15K

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reconcile-revival-policy-90d-15k.yml'

permissions:
  contents: write

concurrency:
  group: wallet500-reconcile-revival-policy-90d-15k
  cancel-in-progress: false

# Triggered intentionally after dashboard and production-policy audit on 2026-09-09.
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Reconcile all active Revival policy contracts and dashboard identity joins
        run: python scripts/reconcile_revival_policy_90d_15k.py

      - name: Install package and tests
        run: python -m pip install -e . pytest

      - name: Compile engine
        run: python -m compileall -q src/wallet500

      - name: Syntax-check decision dashboards
        run: |
          node --check dashboard-live-price.js
          node --check dashboard-live-price-core.js
          node --check dashboard-truth-overlap.js
          node --check data/dashboard-live-price-core.js
          node --check data/dashboard-truth-overlap.js

      - name: Run policy-critical tests
        run: |
          python -m pytest -q \
            tests/test_revival_90d_telegram.py \
            tests/test_real_alerts.py \
            tests/test_decision_snapshot_guard.py \
            tests/test_production_status.py \
            tests/test_multichain_veteran_revival.py \
            tests/test_catalyst_wire.py \
            tests/test_revival_wallet_evidence.py \
            tests/test_revival_wallet_registry.py \
            tests/test_revival_prewaking_rotation.py \
            tests/test_revival_prewaking_wallet_evidence_v2.py \
            tests/test_revival_prewaking_wallet_retention.py

      - name: Run identity and engine-dashboard audits
        run: |
          python tools/check_engine_dashboard_overlap.py --strict --max-skew-minutes 30
          python tools/check_identity_alignment.py

      - name: Run full unit test suite
        run: python -m pytest -q

      - name: Commit only after every guard passes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'wallet500-policy-bot'
          git config user.email 'wallet500-policy-bot@users.noreply.github.com'
          git rm -f .github/workflows/reconcile-revival-policy-90d-15k.yml
          git add -A
          if git diff --cached --quiet; then
            echo 'REVIVAL_POLICY_ALREADY_CLEAN'
            exit 0
          fi
          git commit -m 'policy: unify active Revival runtime at 90d 15k and chain-token dashboard identity'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              echo 'REVIVAL_POLICY_90D_15K_PUBLISH_OK'
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "REVIVAL_POLICY_PUBLISH_RETRY attempt=$attempt"
            sleep 3
          done
          echo '::error::REVIVAL_POLICY_PUBLISH_RACE_EXHAUSTED'
          exit 1