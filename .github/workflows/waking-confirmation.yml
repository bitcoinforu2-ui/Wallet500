name: Wallet500 Waking Confirmation

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
  push:
    branches: [main]
    paths:
      - 'src/wallet500/waking_confirmation.py'
      - 'src/wallet500/revival_precursor.py'
      - 'src/wallet500/real_alerts.py'
      - 'tests/test_waking_confirmation.py'
      - 'tests/test_revival_precursor.py'
      - 'tests/test_real_alerts.py'
      - '.github/workflows/waking-confirmation.yml'
      - 'data/revival-1000-latest.json'
      - 'data/whale-flow-evidence.json'
      - 'data/derivatives-evidence.json'
      - 'data/paid-visibility-ledger.json'

permissions:
  contents: write

concurrency:
  group: wallet500-waking-publisher
  cancel-in-progress: false
  queue: max

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -e . pytest
      - name: Unit tests
        run: python -m pytest -q tests/test_waking_confirmation.py tests/test_revival_precursor.py tests/test_real_alerts.py
      - name: Scan WAKING holder, wallet, social and news evidence
        env:
          BIRDEYE_API_KEY: ${{ secrets.BIRDEYE_API_KEY }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          COINGECKO_DEMO_API_KEY: ${{ secrets.COINGECKO_DEMO_API_KEY }}
        run: python -m wallet500.waking_confirmation
      - name: Build multi-signal Revival Precursor layer
        run: python -m wallet500.revival_precursor
      - name: Validate Waking and Precursor truth contracts
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          from wallet500.revival_1000 import looks_like_solana_address

          p=Path('data/waking-confirmation-latest.json')
          s=Path('data/waking-confirmation-state.json')
          rp=Path('data/revival-precursor-latest.json')
          rs=Path('data/revival-precursor-state.json')
          if not p.exists() or not s.exists(): raise SystemExit('WAKING_CONFIRMATION_OUTPUT_MISSING')
          if not rp.exists() or not rs.exists(): raise SystemExit('REVIVAL_PRECURSOR_OUTPUT_MISSING')
          d=json.loads(p.read_text()); st=json.loads(s.read_text()); r=json.loads(rp.read_text()); rst=json.loads(rs.read_text())
          if d.get('mode')!='RESEARCH_ONLY_WAKING_CONFIRMATION_V1': raise SystemExit('WAKING_MODE_INVALID')
          if d.get('contract')!='WAKING_CONFIRMATION_V1': raise SystemExit('WAKING_CONTRACT_INVALID')
          if d.get('network')!='solana' or d.get('production_portfolio_impact')!='NONE': raise SystemExit('WAKING_SAFETY_INVALID')
          if d.get('no_hindsight') is not True: raise SystemExit('WAKING_NO_HINDSIGHT_MISSING')
          allowed={'WAKING_UNCONFIRMED_RESEARCH','WAKING_CONFIRMED_RESEARCH','WAKING_STRONG_RESEARCH','WAKING_RISK_RESEARCH'}
          rows=d.get('targets') or []
          if int((d.get('counts') or {}).get('waking_targets') or 0)!=len(rows): raise SystemExit('WAKING_COUNT_MISMATCH')
          for x in rows:
              address=str(x.get('token_address') or '')
              if x.get('network')!='solana' or not looks_like_solana_address(address): raise SystemExit('WAKING_IDENTITY_INVALID')
              if x.get('base_watch_status')!='WAKING_MARKET_ONLY': raise SystemExit('NON_WAKING_TARGET_PRESENT')
              if x.get('confirmation_status') not in allowed: raise SystemExit('WAKING_STATUS_INVALID')
              if x.get('production_portfolio_impact')!='NONE': raise SystemExit('WAKING_ROW_PRODUCTION_IMPACT')
              score=float(x.get('confirmation_score') or 0)
              if not 0<=score<=100: raise SystemExit('WAKING_SCORE_RANGE_INVALID')
              for name,ch in (x.get('channels') or {}).items():
                  if ch.get('verified') is not True and float(ch.get('score') or 0)!=0: raise SystemExit('UNVERIFIED_CHANNEL_SCORED:'+name)
          try:
              t=datetime.fromisoformat(str(d.get('generated_at')).replace('Z','+00:00'))
              if t.tzinfo is None:t=t.replace(tzinfo=timezone.utc)
          except Exception: raise SystemExit('WAKING_TIMESTAMP_INVALID')
          if t>datetime.now(timezone.utc)+timedelta(minutes=2): raise SystemExit('WAKING_FUTURE_TIMESTAMP')
          if st.get('version')!=1: raise SystemExit('WAKING_STATE_VERSION_INVALID')

          if r.get('mode')!='RESEARCH_ONLY_REVIVAL_PRECURSOR_V1': raise SystemExit('PRECURSOR_MODE_INVALID')
          if r.get('contract')!='REVIVAL_PRECURSOR_V1': raise SystemExit('PRECURSOR_CONTRACT_INVALID')
          if r.get('network')!='solana' or r.get('production_portfolio_impact')!='NONE': raise SystemExit('PRECURSOR_SAFETY_INVALID')
          if r.get('no_hindsight') is not True: raise SystemExit('PRECURSOR_NO_HINDSIGHT_MISSING')
          if int(r.get('version') or 0)<2 or int(rst.get('version') or 0)<2: raise SystemExit('PRECURSOR_PAID_ATTENTION_VERSION_MISSING')
          policy=r.get('paid_attention_policy') or {}
          if policy.get('role')!='SUPPORTING_ONLY_NOT_INDEPENDENT_CONFIRMATION': raise SystemExit('PAID_ATTENTION_ROLE_INVALID')
          if float(policy.get('max_precursor_bonus_points') or 99)>7: raise SystemExit('PAID_ATTENTION_BONUS_TOO_LARGE')
          if policy.get('post_promotion_outcomes_used_for_scoring') is not False: raise SystemExit('PAID_ATTENTION_HINDSIGHT_RISK')
          rrows=r.get('targets') or []
          if int((r.get('counts') or {}).get('targets') or 0)!=len(rrows): raise SystemExit('PRECURSOR_COUNT_MISMATCH')
          allowed_precursor={'HIGH_CONVICTION_PRECURSOR','PRE_BREAKOUT_CANDIDATE','EARLY_REVIVAL_WATCH','LATE_MOVE_DO_NOT_CHASE','INSUFFICIENT_PRECURSOR_EVIDENCE','IDENTITY_UNVERIFIED_RESEARCH_ONLY'}
          for x in rrows:
              if x.get('status') not in allowed_precursor: raise SystemExit('PRECURSOR_STATUS_INVALID')
              if x.get('production_portfolio_impact')!='NONE': raise SystemExit('PRECURSOR_ROW_PRODUCTION_IMPACT')
              cov=float(x.get('evidence_coverage_pct') or 0); score=float(x.get('normalized_score_available_evidence') or 0)
              if not 0<=cov<=100 or not 0<=score<=100: raise SystemExit('PRECURSOR_SCORE_RANGE_INVALID')
              fam=x.get('families') or {}
              for name in ('whale_smart_money','derivatives_cex'):
                  f=fam.get(name) or {}
                  if f.get('score') is not None:
                      if name=='whale_smart_money' and 'WHALE_SMART_MONEY_EXACT_MINT' in (x.get('missing_evidence') or []): raise SystemExit('UNVERIFIED_WHALE_SCORED')
                      if name=='derivatives_cex' and 'DERIVATIVES_CANONICAL_MAPPING' in (x.get('missing_evidence') or []): raise SystemExit('UNVERIFIED_DERIVATIVES_SCORED')
              paid=fam.get('paid_attention') or {}; meta=paid.get('meta') or {}
              if paid.get('supporting_only') is not True: raise SystemExit('PAID_ATTENTION_NOT_SUPPORTING_ONLY')
              if meta.get('post_promotion_outcomes_used_for_scoring') is not False: raise SystemExit('PAID_ATTENTION_ROW_HINDSIGHT_RISK')
              ps=paid.get('score'); signals=set(paid.get('signals') or []); bonus=float(x.get('paid_attention_bonus') or 0)
              if bonus<0 or bonus>7: raise SystemExit('PAID_ATTENTION_ROW_BONUS_RANGE')
              if 'PROMOTION_AFTER_BREAKOUT_LATE' in signals:
                  if ps is not None and float(ps)>35: raise SystemExit('LATE_PAID_ATTENTION_NOT_CAPPED')
                  if bonus!=0: raise SystemExit('LATE_PAID_ATTENTION_BONUS_PRESENT')
              if meta.get('exact_pair_timing_verified') is False and ps is not None and float(ps)>30: raise SystemExit('UNVERIFIED_PAID_PAIR_TIMING_OVER_SCORED')
          print('WAKING_CONFIRMATION_V1_VALID',d.get('counts'),d.get('provider_status_counts'))
          print('REVIVAL_PRECURSOR_V2_PAID_ATTENTION_VALID',r.get('counts'))
          PY
      - name: Refresh unified REAL ALERT feed immediately
        run: python -m wallet500.real_alerts
      - name: Publish Waking, Precursor and REAL ALERT snapshots
        run: |
          set -euo pipefail
          git config user.name 'wallet500-waking-bot'
          git config user.email 'wallet500-waking-bot@users.noreply.github.com'
          tmp="$(mktemp -d)"
          for f in waking-confirmation-latest.json waking-confirmation-state.json revival-precursor-latest.json revival-precursor-state.json real-alerts.json; do cp "data/$f" "$tmp/$f"; done
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            for f in waking-confirmation-latest.json waking-confirmation-state.json revival-precursor-latest.json revival-precursor-state.json real-alerts.json; do cp "$tmp/$f" "data/$f"; done
            git add data/waking-confirmation-latest.json data/waking-confirmation-state.json data/revival-precursor-latest.json data/revival-precursor-state.json data/real-alerts.json
            if git diff --cached --quiet; then echo 'WAKING_PRECURSOR_REAL_ALERT_NO_DATA_CHANGE'; exit 0; fi
            git commit -m 'data: refresh Waking Precursor and REAL ALERT intelligence'
            if git push origin HEAD:main; then echo 'WAKING_PRECURSOR_REAL_ALERT_PUBLISH_OK'; exit 0; fi
            echo "WAKING_PRECURSOR_REAL_ALERT_PUBLISH_RETRY attempt=$attempt"; sleep 3
          done
          echo '::error::WAKING_PRECURSOR_REAL_ALERT_PUBLISH_RACE_EXHAUSTED'; exit 1
