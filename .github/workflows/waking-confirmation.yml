name: Wallet500 Waking Confirmation

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
  push:
    branches: [main]
    paths:
      - 'src/wallet500/waking_confirmation.py'
      - 'tests/test_waking_confirmation.py'
      - '.github/workflows/waking-confirmation.yml'
      - 'data/revival-1000-latest.json'

permissions:
  contents: write

concurrency:
  group: wallet500-waking-confirmation
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -e . pytest
      - name: Unit tests
        run: python -m pytest -q tests/test_waking_confirmation.py
      - name: Scan WAKING holder, wallet, social and news evidence
        env:
          BIRDEYE_API_KEY: ${{ secrets.BIRDEYE_API_KEY }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          COINGECKO_DEMO_API_KEY: ${{ secrets.COINGECKO_DEMO_API_KEY }}
        run: python -m wallet500.waking_confirmation
      - name: Validate Waking truth contract
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          from wallet500.revival_1000 import looks_like_solana_address

          p=Path('data/waking-confirmation-latest.json')
          s=Path('data/waking-confirmation-state.json')
          if not p.exists() or not s.exists(): raise SystemExit('WAKING_CONFIRMATION_OUTPUT_MISSING')
          d=json.loads(p.read_text())
          st=json.loads(s.read_text())
          if d.get('mode')!='RESEARCH_ONLY_WAKING_CONFIRMATION_V1': raise SystemExit('WAKING_MODE_INVALID')
          if d.get('contract')!='WAKING_CONFIRMATION_V1': raise SystemExit('WAKING_CONTRACT_INVALID')
          if d.get('network')!='solana' or d.get('production_portfolio_impact')!='NONE': raise SystemExit('WAKING_SAFETY_INVALID')
          if d.get('no_hindsight') is not True: raise SystemExit('WAKING_NO_HINDSIGHT_MISSING')
          allowed={'WAKING_UNCONFIRMED_RESEARCH','WAKING_CONFIRMED_RESEARCH','WAKING_STRONG_RESEARCH','WAKING_RISK_RESEARCH'}
          rows=d.get('targets') or []
          if int((d.get('counts') or {}).get('waking_targets') or 0)!=len(rows): raise SystemExit('WAKING_COUNT_MISMATCH')
          for x in rows:
              address=str(x.get('token_address') or '')
              if x.get('network')!='solana' or not looks_like_solana_address(address): raise SystemExit('WAKING_IDENTITY_INVALID')
              if x.get('base_watch_status')!='WAKING_MARKET_ONLY': raise SystemExit('NON_WAKING_TARGET_PRESENT')
              if x.get('confirmation_status') not in allowed: raise SystemExit('WAKING_STATUS_INVALID')
              if x.get('production_portfolio_impact')!='NONE': raise SystemExit('WAKING_ROW_PRODUCTION_IMPACT')
              score=float(x.get('confirmation_score') or 0)
              if not 0<=score<=100: raise SystemExit('WAKING_SCORE_RANGE_INVALID')
              for name,ch in (x.get('channels') or {}).items():
                  if ch.get('verified') is not True and float(ch.get('score') or 0)!=0:
                      raise SystemExit('UNVERIFIED_CHANNEL_SCORED:'+name)
          try:
              t=datetime.fromisoformat(str(d.get('generated_at')).replace('Z','+00:00'))
              if t.tzinfo is None:t=t.replace(tzinfo=timezone.utc)
          except Exception: raise SystemExit('WAKING_TIMESTAMP_INVALID')
          if t>datetime.now(timezone.utc)+timedelta(minutes=2): raise SystemExit('WAKING_FUTURE_TIMESTAMP')
          if st.get('version')!=1: raise SystemExit('WAKING_STATE_VERSION_INVALID')
          print('WAKING_CONFIRMATION_V1_VALID',d.get('counts'),d.get('provider_status_counts'))
          PY
      - name: Publish Waking confirmation snapshots
        run: |
          set -euo pipefail
          git config user.name 'wallet500-waking-bot'
          git config user.email 'wallet500-waking-bot@users.noreply.github.com'
          tmp="$(mktemp -d)"
          cp data/waking-confirmation-latest.json "$tmp/waking-confirmation-latest.json"
          cp data/waking-confirmation-state.json "$tmp/waking-confirmation-state.json"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp "$tmp/waking-confirmation-latest.json" data/waking-confirmation-latest.json
            cp "$tmp/waking-confirmation-state.json" data/waking-confirmation-state.json
            git add data/waking-confirmation-latest.json data/waking-confirmation-state.json
            if git diff --cached --quiet; then echo 'WAKING_CONFIRMATION_NO_DATA_CHANGE'; exit 0; fi
            git commit -m 'data: refresh Waking confirmation intelligence'
            if git push origin HEAD:main; then echo 'WAKING_CONFIRMATION_PUBLISH_OK'; exit 0; fi
            echo "WAKING_CONFIRMATION_PUBLISH_RETRY attempt=$attempt"; sleep 3
          done
          echo '::error::WAKING_CONFIRMATION_PUBLISH_RACE_EXHAUSTED'; exit 1
