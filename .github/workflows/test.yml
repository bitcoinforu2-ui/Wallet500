name: Wallet500 Tests

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/**'
      - 'data/**/*config*.json'
      - 'data/**/*policy*.json'
      - 'data/**/*sources*.json'
      - 'data/native-asset-identity-registry.json'
      - 'data/native-asset-identity-registry.json'
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/**'
      - 'data/**/*config*.json'
      - 'data/**/*policy*.json'
      - 'data/**/*sources*.json'
  workflow_dispatch:

concurrency:
  group: wallet500-tests-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . pytest
      - run: pytest -q

  recover-stale-consumers:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      # A validated deployment can recover stale consumers immediately. The
      # dispatcher checks active work and never cancels/replaces a production run.
      - name: Recover stale consumers after successful main validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/recover_production_handoffs.py
