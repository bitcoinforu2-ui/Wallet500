name: Wallet500 Tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'tools/**'
      - 'pyproject.toml'
      - 'data/**/*config*.json'
      - 'data/**/*policy*.json'
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'tools/**'
      - 'pyproject.toml'
      - 'data/**/*config*.json'
      - 'data/**/*policy*.json'
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: wallet500-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . pytest
      - run: pytest -q
