name: Wallet500 Paid Secondary Feed

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths:
      - 'src/wallet500/paid_secondary_feed.py'
      - 'tests/test_paid_secondary_feed.py'
      - '.github/workflows/paid-secondary-feed.yml'

permissions:
  contents: write

concurrency:
  group: wallet500-paid-secondary-feed
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            src/wallet500/paid_secondary_feed.py
            tests/test_paid_secondary_feed.py
            data/paid-visibility-ledger.json
            data/paid-fast-redundancy-ledger.json
            data/paid-secondary-feed.json
            .github/workflows/paid-secondary-feed.yml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test runner
        run: python -m pip install -q pytest
      - name: Unit tests
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_paid_secondary_feed.py
      - name: Scan secondary paid feeds
        env:
          PYTHONPATH: src
        run: python -m wallet500.paid_secondary_feed
      - name: Validate strict truth contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/paid-secondary-feed.json')
          if not p.exists() or p.stat().st_size==0: raise SystemExit('PAID_SECONDARY_OUTPUT_MISSING')
          d=json.loads(p.read_text())
          if d.get('mode')!='RESEARCH_ONLY_PAID_SECONDARY_FEED_V1' or d.get('contract')!='PAID_SECONDARY_FEED_V1': raise SystemExit('PAID_SECONDARY_CONTRACT_INVALID')
          if d.get('network')!='solana' or d.get('production_portfolio_impact')!='NONE' or d.get('no_hindsight') is not True: raise SystemExit('PAID_SECONDARY_SAFETY_INVALID')
          if len(d.get('sources') or [])!=3: raise SystemExit('PAID_SECONDARY_SOURCE_COUNT_INVALID')
          for x in d.get('targets') or []:
              if x.get('pair_identity_locked') is not True or not x.get('pair_address'): raise SystemExit('PAID_SECONDARY_PAIR_INVALID')
              if x.get('production_portfolio_impact')!='NONE': raise SystemExit('PAID_SECONDARY_PRODUCTION_IMPACT')
          print('PAID_SECONDARY_FEED_VALID',d.get('counts'))
          PY
      - name: Publish secondary snapshot
        run: |
          set -euo pipefail
          git config user.name 'wallet500-paid-secondary-bot'
          git config user.email 'wallet500-paid-secondary-bot@users.noreply.github.com'
          tmp="$(mktemp -d)"
          cp data/paid-secondary-feed.json "$tmp/paid-secondary-feed.json"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp "$tmp/paid-secondary-feed.json" data/paid-secondary-feed.json
            git add data/paid-secondary-feed.json
            if git diff --cached --quiet; then echo 'PAID_SECONDARY_NO_DATA_CHANGE'; exit 0; fi
            git commit -m 'data: refresh paid secondary feed'
            if git push origin HEAD:main; then echo 'PAID_SECONDARY_PUBLISH_OK'; exit 0; fi
            echo "PAID_SECONDARY_PUBLISH_RETRY attempt=$attempt"; sleep 3
          done
          echo '::error::PAID_SECONDARY_PUBLISH_RACE_EXHAUSTED'; exit 1
