name: Wallet500 Legacy Stage Telegram Policy Audit

# This lane's Telegram delivery was intentionally disabled under the
# FINAL_BUY_ONLY policy. Do not start an independent workflow on every
# research-envelope refresh, nor require that disabled source to be fresh.
# The canonical Unified Watch / FINAL BUY path remains unchanged.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-disabled-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate research-stage Telegram remains disabled
        run: |
          python -m pip install -e . pytest
          python -m pytest -q tests/test_stage_transition_telegram.py
          python - <<'PY'
          from wallet500.stage_transition_telegram import (
              MIN_USER_FACING_STAGE,
          )
          assert MIN_USER_FACING_STAGE == "DISABLED_FINAL_BUY_ONLY"
          print("LEGACY_STAGE_TELEGRAM_DISABLED_POLICY_OK")
          PY
