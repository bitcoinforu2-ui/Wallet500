name: Wallet500 Publisher Queue Hardening
# Retrigger after verifying shared publishers still lacked queue:max on main.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publisher-queue-hardening.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Enable a real queue for every shared main-data publisher
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          root = Path('.github/workflows')
          group = 'group: wallet500-main-data-publisher'
          changed = []
          matched = []

          for path in sorted(root.glob('*.y*ml')):
              if path.name == 'publisher-queue-hardening.yml':
                  continue
              text = path.read_text(encoding='utf-8')
              if group not in text:
                  continue
              matched.append(path.name)
              lines = text.splitlines()
              out = []
              inserted = False
              in_target = False
              for line in lines:
                  out.append(line)
                  if line.strip() == group:
                      in_target = True
                      continue
                  if in_target and line.strip().startswith('queue:'):
                      if line.strip() != 'queue: max':
                          raise SystemExit(f'UNSAFE_QUEUE_VALUE:{path}:{line.strip()}')
                      in_target = False
                      continue
                  if in_target and line.strip().startswith('cancel-in-progress:'):
                      if line.strip() != 'cancel-in-progress: false':
                          raise SystemExit(f'UNSAFE_CANCEL_POLICY:{path}:{line.strip()}')
                      out.append('  queue: max')
                      inserted = True
                      in_target = False
              new = '\n'.join(out) + ('\n' if text.endswith('\n') else '')
              if inserted:
                  path.write_text(new, encoding='utf-8')
                  changed.append(path.name)

          if not matched:
              raise SystemExit('NO_SHARED_PUBLISHERS_FOUND')

          # Fail closed unless every shared publisher now has an explicit max queue.
          bad = []
          for path in sorted(root.glob('*.y*ml')):
              if path.name == 'publisher-queue-hardening.yml':
                  continue
              text = path.read_text(encoding='utf-8')
              if group in text:
                  block = text[text.index(group):text.index(group)+180]
                  if 'cancel-in-progress: false' not in block or 'queue: max' not in block:
                      bad.append(path.name)
          if bad:
              raise SystemExit('SHARED_PUBLISHER_QUEUE_NOT_HARDENED:' + ','.join(bad))

          print('SHARED_PUBLISHERS', len(matched), ','.join(matched))
          print('QUEUE_MAX_ADDED', len(changed), ','.join(changed))
          PY

          git diff --check

      - name: Commit queue hardening atomically and remove bootstrap
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'wallet500-ci-hardening-bot'
          git config user.email 'wallet500-ci-hardening-bot@users.noreply.github.com'
          git rm .github/workflows/publisher-queue-hardening.yml
          git add .github/workflows/

          if git diff --cached --quiet; then
            echo 'NO_QUEUE_HARDENING_CHANGE'
            exit 0
          fi

          git commit -m 'ci: preserve queued main-data publishers without cancellation'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo '::error::QUEUE_HARDENING_REBASE_CONFLICT'
              exit 1
            fi
            if git push origin HEAD:main; then
              echo 'PUBLISHER_QUEUE_HARDENING_OK'
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo '::error::QUEUE_HARDENING_PUSH_EXHAUSTED'
          exit 1
