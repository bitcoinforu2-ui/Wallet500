name: Wallet500 Liquidity Truth Repair

on:
  workflow_dispatch:
  schedule:
    - cron: '5,20,35,50 * * * *'
  push:
    branches: [main]
    paths:
      - 'src/wallet500/liquidity_truth.py'
      - 'src/wallet500/liquidity_truth_guard.py'
      - 'src/wallet500/cex_fast_lane.py'
      - 'scripts/atomic_publish.py'
      - 'data/cex-revival-radar.json'
      - 'tests/test_liquidity_truth_guard.py'
      - 'tests/test_system_integrity_audit.py'
      - '.github/workflows/liquidity-truth-repair.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: wallet500-liquidity-truth-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install and test liquidity truth contracts
        run: |
          pip install -e . pytest
          python -m pytest -q tests/test_liquidity_truth_guard.py
      - name: Full regression on code or manual repair changes
        if: github.event_name != 'schedule'
        run: python -m pytest -q
      - name: Sanitize CEX source truth and publish source-only data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'wallet500-liquidity-truth-bot'
          git config user.email 'wallet500-liquidity-truth-bot@users.noreply.github.com'

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            source_sha="$(git rev-parse HEAD)"

            python - <<'PY'
          from wallet500.liquidity_truth_guard import sanitize_cex_radar
          print('CEX_LIQUIDITY_TRUTH', sanitize_cex_radar())
          PY
            python -m pytest -q tests/test_system_integrity_audit.py

            set +e
            python scripts/atomic_publish.py \
              --base "$source_sha" \
              --fail-on-newer \
              --message 'data: enforce CEX liquidity source truth on latest main' \
              data/cex-revival-radar.json
            rc=$?
            set -e
            if [ "$rc" -eq 0 ]; then
              echo 'LIQUIDITY_SOURCE_TRUTH_PUBLISHED'
              break
            fi
            if [ "$rc" -eq 75 ]; then
              echo "LIQUIDITY_SOURCE_RECOMPUTE_REQUIRED attempt=$attempt"
              sleep 1
              continue
            fi
            exit "$rc"
          done

      - name: Delegate REAL ALERT recompute to canonical publisher
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run candidate-evidence-envelope.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo 'LIQUIDITY_TRUTH_DELEGATED_TO_CANONICAL_PUBLISHER'
