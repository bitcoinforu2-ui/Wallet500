name: Wallet500 Production Telegram Alerts

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Wallet500 Verified Snapshot Publisher"
    types: [completed]

permissions:
  contents: write

# User-facing delivery must run only after the sole canonical publisher has
# completed. Candidate Evidence and Pending Confirmation can legitimately finish
# after merely delegating a new Live Scan, and arbitrary source pushes do not
# guarantee a fresh decision generation. Both cases could otherwise wake
# Telegram against the previous snapshot.
concurrency:
  group: wallet500-production-telegram-alerts
  cancel-in-progress: false

jobs:
  deliver:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install and verify Telegram plus $10 tracking truth contracts
        run: |
          pip install -e . pytest
          python -m py_compile scripts/run_telegram_with_intelligence_shadow.py src/wallet500/buy_close_watch_registry.py
          python -m pytest -q \
            tests/test_telegram_exact_pair.py \
            tests/test_real_alerts.py \
            tests/test_real_alert_10usd_tracker.py \
            tests/test_pre_alert_forensics.py \
            tests/test_telegram_buy_only_policy.py \
            tests/test_buy_close_watch_registry.py
      - name: Verify fresh coherent production decision snapshot before user-facing delivery
        run: |
          python - <<'PY'
          import hashlib
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          def parse_ts(v):
              s=str(v or '').strip()
              if not s: raise SystemExit('MISSING_SNAPSHOT_TIMESTAMP')
              if s.endswith('Z'): s=s[:-1]+'+00:00'
              d=datetime.fromisoformat(s)
              if d.tzinfo is None: d=d.replace(tzinfo=timezone.utc)
              return d.astimezone(timezone.utc)

          real_path=Path('data/real-alerts.json')
          generation_path=Path('data/decision-generation.json')
          guard_path=Path('data/decision-snapshot-integrity.json')
          if not generation_path.is_file(): raise SystemExit('TELEGRAM_DECISION_GENERATION_MISSING')
          real_bytes=real_path.read_bytes(); guard_bytes=guard_path.read_bytes()
          real=json.loads(real_bytes.decode('utf-8')); guard=json.loads(guard_bytes.decode('utf-8')); generation=json.loads(generation_path.read_text())
          if generation.get('status') != 'COHERENT_READY': raise SystemExit('TELEGRAM_DECISION_GENERATION_STATUS_INVALID')
          if guard.get('passed') is not True: raise SystemExit('TELEGRAM_DECISION_SNAPSHOT_VALIDATION_NOT_PASS')
          policy=generation.get('policy') or {}
          production_scope=policy.get('production') or {}
          if int(production_scope.get('minimum_market_age_days') or 0) != 180: raise SystemExit('TELEGRAM_DECISION_PUBLICATION_AGE_DRIFT')
          if float(production_scope.get('minimum_execution_liquidity_usd') or 0) != 50000: raise SystemExit('TELEGRAM_DECISION_PUBLICATION_LIQUIDITY_DRIFT')
          if production_scope.get('exact_pair_required') is not True: raise SystemExit('TELEGRAM_DECISION_PUBLICATION_EXACT_PAIR_DRIFT')
          if production_scope.get('automatic_buy') is not False: raise SystemExit('TELEGRAM_DECISION_PUBLICATION_EXECUTION_DRIFT')
          run_id=str(generation.get('workflow_run_id') or '').strip(); source_sha=str(generation.get('source_sha') or '').strip(); generation_id=str(generation.get('generation_id') or '').strip()
          expected_generation=f'wallet500:{run_id}:{source_sha}'
          if not run_id or len(source_sha) != 40 or generation_id != expected_generation: raise SystemExit('TELEGRAM_DECISION_GENERATION_ID_INVALID')
          hashes=generation.get('hashes') or {}
          actual_real_sha=hashlib.sha256(real_bytes).hexdigest(); actual_guard_sha=hashlib.sha256(guard_bytes).hexdigest()
          if str(hashes.get('data/real-alerts.json') or '') != actual_real_sha: raise SystemExit(f'TELEGRAM_DECISION_REAL_ALERT_HASH_MISMATCH expected={hashes.get("data/real-alerts.json")} actual={actual_real_sha}')
          if str(hashes.get('data/decision-snapshot-integrity.json') or '') != actual_guard_sha: raise SystemExit('TELEGRAM_DECISION_GUARD_HASH_MISMATCH')
          states=generation.get('source_states') or {}
          if states.get('data/real-alerts.json') != 'VALID' or states.get('data/decision-snapshot-integrity.json') != 'VALID': raise SystemExit('TELEGRAM_DECISION_GENERATION_SOURCE_INVALID')
          truth=real.get('truth_contract') or {}
          if truth.get('minimum_market_age_days') != 180: raise SystemExit('TELEGRAM_SOURCE_VETERAN_SCOPE_DRIFT')
          if float(truth.get('minimum_execution_pool_liquidity_usd') or 0) < 50000: raise SystemExit('TELEGRAM_SOURCE_LIQUIDITY_SCOPE_DRIFT')
          if truth.get('exact_dex_pair_required') is not True: raise SystemExit('TELEGRAM_SOURCE_EXACT_PAIR_CONTRACT_DRIFT')
          now=datetime.now(timezone.utc); real_age=(now-parse_ts(real.get('generated_at'))).total_seconds(); generation_age=(now-parse_ts(generation.get('created_at'))).total_seconds()
          if real_age < -120 or generation_age < -120: raise SystemExit('TELEGRAM_SOURCE_TIMESTAMP_FROM_FUTURE')
          if real_age > 35*60 or generation_age > 35*60: raise SystemExit(f'TELEGRAM_SOURCE_STALE real_age={real_age:.0f}s generation_age={generation_age:.0f}s')
          print('TELEGRAM_COHERENT_DECISION_SOURCE_OK', {'generation_id':generation_id,'real_alerts':(real.get('counts') or {}).get('real_alerts'),'real_alerts_sha256':actual_real_sha,'real_age_seconds':round(real_age,1),'generation_age_seconds':round(generation_age,1)})
          PY
      - name: Build pre-alert wallet, cluster, flow and entry-timing evidence
        env:
          PRE_ALERT_FORENSICS_MODE: shadow
          PRE_ALERT_FORENSICS_MAX_AGE_SECONDS: '2400'
          PRE_ALERT_FORENSICS_LIVE_MARKET: '1'
          PRE_ALERT_FORENSICS_LIVE_HOLDER_REFRESH: '1'
          PRE_ALERT_FORENSICS_LIVE_WALLET_REFRESH: '1'
          PRE_ALERT_FORENSICS_MAX_LIVE_REFRESHES: '3'
          PRE_ALERT_FORENSICS_WALLET_SIGNATURES: '12'
          WALLET500_REAL_ALERT_INPUT: real-alerts.json
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
        run: python -m wallet500.pre_alert_forensics
      - name: Validate pre-alert shadow contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('data/pre-alert-forensics-report.json').read_text())
          delivery=json.loads(Path('data/pre-alert-forensics-real-alerts.json').read_text())
          meta=delivery.get('pre_alert_forensics') or {}
          if report.get('mode') != 'shadow': raise SystemExit('PRE_ALERT_FORENSICS_NOT_SHADOW')
          if (report.get('truth_contract') or {}).get('research_only_never_telegram') is not True: raise SystemExit('PRE_ALERT_RESEARCH_ONLY_CONTRACT_MISSING')
          if meta.get('shadow_only') is not True: raise SystemExit('PRE_ALERT_SHADOW_DELIVERY_CONTRACT_MISSING')
          if int(meta.get('source_real_alert_count') or 0) != int(meta.get('delivery_real_alert_count') or 0): raise SystemExit('PRE_ALERT_SHADOW_SUPPRESSED_REAL_ALERT')
          print('PRE_ALERT_FORENSICS_SHADOW_OK', {'targets':report.get('targets'),'would_block':report.get('would_block'),'actionable':report.get('actionable')})
          PY
      - name: Deliver only gated Wallet500 production alerts from verified main with intelligence shadow context
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WALLET500_ALERT_INPUT: active-qualified-candidates.json
          WALLET500_REAL_ALERT_INPUT: pre-alert-forensics-real-alerts.json
        run: python scripts/run_telegram_with_intelligence_shadow.py
      - name: Persist Telegram dedupe, pre-alert evidence and delivery report atomically
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'wallet500-truth-bot'
          git config user.email 'wallet500-truth-bot@users.noreply.github.com'
          python scripts/atomic_publish.py \
            --github-api-cas \
            --message 'telegram: persist production alert delivery state and pre-alert forensics' \
            data/telegram-alert-state.json \
            data/telegram-alert-report.json \
            data/pre-alert-forensics-state.json \
            data/pre-alert-forensics-report.json \
            data/pre-alert-forensics-real-alerts.json \
            data/buy-zone-close-watch-registry.json
      - name: Reconcile $10 paper cohort from newly delivered REAL ALERTs and mark all open positions
        run: python -m wallet500.real_alert_10usd_tracker
      - name: Persist $10 tracker state atomically
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'wallet500-truth-bot'
          git config user.email 'wallet500-truth-bot@users.noreply.github.com'
          python scripts/atomic_publish.py \
            --github-api-cas \
            --message 'data: mark new REAL ALERT $10 paper cohort' \
            data/real-alert-10usd-ledger.json \
            data/real-alert-10usd-summary.json
      - name: Validate delivery and tracking outcome
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('data/telegram-alert-report.json').read_text())
          summary=json.loads(Path('data/real-alert-10usd-summary.json').read_text())
          registry=json.loads(Path('data/buy-zone-close-watch-registry.json').read_text())
          if report.get('configured') is not True: raise SystemExit('TELEGRAM_NOT_CONFIGURED_IN_PRODUCTION_LANE')
          if int(report.get('error_count') or 0) > 0: raise SystemExit(f"TELEGRAM_DELIVERY_ERRORS={report.get('error_count')}")
          if summary.get('mode') != 'PAPER_ONLY_NO_REAL_MONEY': raise SystemExit('REAL_ALERT_10USD_MODE_DRIFT')
          if float(summary.get('position_size_usd') or 0) != 10.0: raise SystemExit('REAL_ALERT_10USD_SIZE_DRIFT')
          rt=registry.get('truth_contract') or {}
          if rt.get('source_requires_final_buy_zone') is not True or rt.get('deep_intelligence_required') is not True: raise SystemExit('BUY_CLOSE_WATCH_REGISTRY_CONTRACT_DRIFT')
          for key,item in (registry.get('entries') or {}).items():
              if item.get('active') is True and (item.get('close_watch')!='HIGHEST' or item.get('deep_investigation') is not True): raise SystemExit(f'BUY_CLOSE_WATCH_PRIORITY_DRIFT:{key}')
          if summary.get('new_entry_trigger') != 'SUCCESSFULLY_DELIVERED_NEW_TELEGRAM_REAL_ALERT_AFTER_ACTIVATION_ONLY': raise SystemExit('REAL_ALERT_10USD_TRIGGER_DRIFT')
          print('TELEGRAM_AND_10USD_PIPELINE_OK', {'delivered':report.get('delivered_count'),'positions':summary.get('positions_total'),'roi_pct':summary.get('roi_pct'),'buy_close_watch_active':registry.get('active_count')})
          PY
