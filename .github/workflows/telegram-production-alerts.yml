name: Wallet500 Production Telegram Alerts

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Wallet500 Candidate Evidence Envelope"
      - "Wallet500 Pending Confirmation Refresh"
    types: [completed]
  push:
    branches: [main]
    paths:
      - '.github/workflows/telegram-production-alerts.yml'
      - 'src/wallet500/telegram_alerts.py'
      - 'src/wallet500/real_alert_10usd_tracker.py'
      - 'tests/test_telegram_exact_pair.py'
      - 'tests/test_real_alert_10usd_tracker.py'

permissions:
  contents: write

# Serialized post-publish lane: a coherent decision snapshot must already be
# atomically committed on main by one of the two canonical decision publishers
# before user-facing delivery.
concurrency:
  group: wallet500-production-telegram-alerts
  cancel-in-progress: false

jobs:
  deliver:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install and verify Telegram plus $10 tracking truth contracts
        run: |
          pip install -e . pytest
          python -m pytest -q \
            tests/test_telegram_exact_pair.py \
            tests/test_real_alerts.py \
            tests/test_real_alert_10usd_tracker.py

      - name: Verify fresh coherent production decision snapshot before user-facing delivery
        run: |
          python - <<'PY'
          import hashlib
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          def parse_ts(v):
              s=str(v or '').strip()
              if not s:
                  raise SystemExit('MISSING_SNAPSHOT_TIMESTAMP')
              if s.endswith('Z'):
                  s=s[:-1]+'+00:00'
              d=datetime.fromisoformat(s)
              if d.tzinfo is None:
                  d=d.replace(tzinfo=timezone.utc)
              return d.astimezone(timezone.utc)

          real_path=Path('data/real-alerts.json')
          proof_path=Path('data/decision-publish-evidence.json')
          guard_path=Path('data/decision-snapshot-integrity.json')
          if not proof_path.is_file():
              raise SystemExit('TELEGRAM_DECISION_PUBLICATION_PROOF_MISSING')

          real_bytes=real_path.read_bytes()
          guard_bytes=guard_path.read_bytes()
          real=json.loads(real_bytes.decode('utf-8'))
          guard=json.loads(guard_bytes.decode('utf-8'))
          proof=json.loads(proof_path.read_text())

          if proof.get('status') != 'VERIFIED_COHERENT_DECISION_SNAPSHOT':
              raise SystemExit('TELEGRAM_DECISION_PUBLICATION_PROOF_STATUS_INVALID')

          # Both producers run the same fail-closed decision guard and bind the
          # exact generated files by SHA-256 in one atomic commit. The pending
          # refresh is explicitly non-promoting; accepting its proof does not
          # change the REAL ALERT gate, it only removes a producer-name race.
          producer=str(proof.get('producer') or '').strip()
          producer_prefix={
              'CANDIDATE_EVIDENCE_ENVELOPE':'candidate-evidence',
              'PENDING_CONFIRMATION_REFRESH':'pending-confirmation',
          }
          if producer not in producer_prefix:
              raise SystemExit('TELEGRAM_DECISION_PUBLICATION_PRODUCER_INVALID')
          if proof.get('decision_validation') != 'PASS' or guard.get('passed') is not True:
              raise SystemExit('TELEGRAM_DECISION_SNAPSHOT_VALIDATION_NOT_PASS')
          if int(proof.get('minimum_market_age_days') or 0) != 180 or proof.get('exact_pair_required') is not True:
              raise SystemExit('TELEGRAM_DECISION_PUBLICATION_TRUTH_DRIFT')

          run_id=str(proof.get('workflow_run_id') or '').strip()
          source_sha=str(proof.get('source_sha') or '').strip()
          generation_id=str(proof.get('generation_id') or '').strip()
          expected_generation=f'{producer_prefix[producer]}:{run_id}:{source_sha}'
          if not run_id or len(source_sha) != 40 or generation_id != expected_generation:
              raise SystemExit('TELEGRAM_DECISION_PUBLICATION_GENERATION_INVALID')

          hashes=proof.get('hashes') or {}
          actual_real_sha=hashlib.sha256(real_bytes).hexdigest()
          actual_guard_sha=hashlib.sha256(guard_bytes).hexdigest()
          if str(hashes.get('real_alerts') or '') != actual_real_sha:
              raise SystemExit(
                  f'TELEGRAM_DECISION_REAL_ALERT_HASH_MISMATCH expected={hashes.get("real_alerts")} actual={actual_real_sha}'
              )
          if str(hashes.get('decision_integrity') or '') != actual_guard_sha:
              raise SystemExit('TELEGRAM_DECISION_GUARD_HASH_MISMATCH')

          truth=real.get('truth_contract') or {}
          if truth.get('minimum_market_age_days') != 180:
              raise SystemExit('TELEGRAM_SOURCE_VETERAN_SCOPE_DRIFT')
          if truth.get('exact_dex_pair_required') is not True:
              raise SystemExit('TELEGRAM_SOURCE_EXACT_PAIR_CONTRACT_DRIFT')

          now=datetime.now(timezone.utc)
          real_age=(now-parse_ts(real.get('generated_at'))).total_seconds()
          proof_age=(now-parse_ts(proof.get('created_at'))).total_seconds()
          if real_age < -120 or proof_age < -120:
              raise SystemExit('TELEGRAM_SOURCE_TIMESTAMP_FROM_FUTURE')
          if real_age > 35*60 or proof_age > 35*60:
              raise SystemExit(f'TELEGRAM_SOURCE_STALE real_age={real_age:.0f}s proof_age={proof_age:.0f}s')
          print('TELEGRAM_COHERENT_DECISION_SOURCE_OK', {
              'producer': producer,
              'generation_id': generation_id,
              'real_alerts': (real.get('counts') or {}).get('real_alerts'),
              'real_alerts_sha256': actual_real_sha,
              'real_age_seconds': round(real_age,1),
              'proof_age_seconds': round(proof_age,1),
          })
          PY

      - name: Deliver only gated Wallet500 production alerts from verified main
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WALLET500_ALERT_INPUT: active-qualified-candidates.json
          WALLET500_REAL_ALERT_INPUT: real-alerts.json
        run: python -m wallet500.telegram_alerts

      # Persist Telegram dedupe state immediately after delivery. This protects
      # against duplicate alerts even if a later tracker/dashboard step fails.
      - name: Persist Telegram dedupe state and delivery report first
        run: |
          set -euo pipefail
          git config user.name 'wallet500-truth-bot'
          git config user.email 'wallet500-truth-bot@users.noreply.github.com'
          tmp="$(mktemp -d)"
          cp data/telegram-alert-state.json "$tmp/state.json"
          cp data/telegram-alert-report.json "$tmp/report.json"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp "$tmp/state.json" data/telegram-alert-state.json
            cp "$tmp/report.json" data/telegram-alert-report.json
            git add data/telegram-alert-state.json data/telegram-alert-report.json
            if git diff --cached --quiet; then
              echo 'No Telegram state changes to publish'
              break
            fi
            git commit -m 'telegram: persist production alert delivery state'
            if git push origin HEAD:main; then
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo 'Telegram state publish failed after retries'
              exit 1
            fi
            sleep 3
          done

      - name: Reconcile $10 paper cohort from newly delivered REAL ALERTs and mark all open positions
        run: python -m wallet500.real_alert_10usd_tracker

      - name: Persist $10 tracker state
        run: |
          set -euo pipefail
          git config user.name 'wallet500-truth-bot'
          git config user.email 'wallet500-truth-bot@users.noreply.github.com'
          tmp="$(mktemp -d)"
          cp data/real-alert-10usd-ledger.json "$tmp/ledger.json"
          cp data/real-alert-10usd-summary.json "$tmp/summary.json"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp "$tmp/ledger.json" data/real-alert-10usd-ledger.json
            cp "$tmp/summary.json" data/real-alert-10usd-summary.json
            git add data/real-alert-10usd-ledger.json data/real-alert-10usd-summary.json
            if git diff --cached --quiet; then
              echo 'No $10 tracker changes to publish'
              break
            fi
            git commit -m 'data: mark new REAL ALERT $10 paper cohort'
            if git push origin HEAD:main; then
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo '$10 tracker publish failed after retries'
              exit 1
            fi
            sleep 3
          done

      # Fail visibly only after state was safely persisted. Unsent alerts remain
      # re-tryable on the next coherent decision publication; successfully sent
      # ones stay deduped.
      - name: Validate delivery and tracking outcome
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report=json.loads(Path('data/telegram-alert-report.json').read_text())
          summary=json.loads(Path('data/real-alert-10usd-summary.json').read_text())
          if report.get('configured') is not True:
              raise SystemExit('TELEGRAM_NOT_CONFIGURED_IN_PRODUCTION_LANE')
          if int(report.get('error_count') or 0) > 0:
              raise SystemExit(f"TELEGRAM_DELIVERY_ERRORS={report.get('error_count')}")
          if summary.get('mode') != 'PAPER_ONLY_NO_REAL_MONEY':
              raise SystemExit('REAL_ALERT_10USD_MODE_DRIFT')
          if float(summary.get('position_size_usd') or 0) != 10.0:
              raise SystemExit('REAL_ALERT_10USD_SIZE_DRIFT')
          if summary.get('new_entry_trigger') != 'SUCCESSFULLY_DELIVERED_NEW_TELEGRAM_REAL_ALERT_AFTER_ACTIVATION_ONLY':
              raise SystemExit('REAL_ALERT_10USD_TRIGGER_DRIFT')
          print('TELEGRAM_AND_10USD_PIPELINE_OK', {
              'delivered': report.get('delivered_count'),
              'positions': summary.get('positions_total'),
              'roi_pct': summary.get('roi_pct'),
          })
          PY
