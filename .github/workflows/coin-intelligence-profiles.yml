name: Wallet500 Coin Intelligence Profiles

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/wallet500/coin_intelligence_profiles.py'
      - 'src/wallet500/coin_profile_quality_guard.py'
      - 'tests/test_coin_intelligence_profiles.py'
      - 'tests/test_coin_profile_quality_guard.py'
      - '.github/workflows/coin-intelligence-profiles.yml'
  schedule:
    - cron: '*/5 * * * *'
  workflow_run:
    workflows:
      - "Wallet500 Cross-Source Correlation"
      - "Wallet500 Multi-Chain Live Scan"
      - "Wallet500 Hybrid Token Profile"
      - "Wallet500 Social Intelligence V2"
      - "Wallet500 Global Listing Intelligence"
      - "Wallet500 Catalyst Wire"
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'src/wallet500/coin_intelligence_profiles.py'
      - 'src/wallet500/coin_profile_quality_guard.py'
      - 'scripts/atomic_publish.py'
      - 'tests/test_coin_intelligence_profiles.py'
      - 'tests/test_coin_profile_quality_guard.py'
      - '.github/workflows/coin-intelligence-profiles.yml'

permissions:
  contents: write

concurrency:
  group: wallet500-coin-intelligence-profile-builder
  cancel-in-progress: false

jobs:
  profile:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Wallet500 and tests
        run: pip install -e . pytest
      - name: Lock profile identity, persistence and quality quarantine truth rules
        run: pytest -q tests/test_coin_intelligence_profiles.py tests/test_coin_profile_quality_guard.py
      - name: Build persistent multi-source coin dossiers and DNA library
        run: python -m wallet500.coin_intelligence_profiles
      - name: Quarantine conflicting metrics from learning DNA
        run: python -m wallet500.coin_profile_quality_guard
      - name: Validate profile truth and data quality contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          latest=json.loads(Path('data/coin-intelligence-profiles.json').read_text())
          ledger=json.loads(Path('data/coin-intelligence-profile-ledger.json').read_text())
          archive=json.loads(Path('data/coin-intelligence-profile-archive.json').read_text())
          dna=json.loads(Path('data/coin-profile-dna-library.json').read_text())
          quality=json.loads(Path('data/coin-profile-data-quality.json').read_text())
          if latest.get('mode') != 'COIN_INTELLIGENCE_PROFILE_V1': raise SystemExit('COIN_PROFILE_MODE_DRIFT')
          if latest.get('automatic_trade') is not False or latest.get('production_change') is not False: raise SystemExit('COIN_PROFILE_PRODUCTION_LEAK')
          truth=ledger.get('truth_contract') or {}
          required=('symbol_never_defines_identity','provisional_evm_never_cross_chain_merges','negative_evidence_is_retained','material_duplicate_events_are_deduplicated','missing_fingerprint_dimensions_remain_unobserved','profile_never_bypasses_production_gates','quarantined_metrics_excluded_from_dna')
          if not all(truth.get(k) is True for k in required): raise SystemExit('COIN_PROFILE_TRUTH_CONTRACT_MISSING')
          for key,p in (ledger.get('profiles') or {}).items():
              if key != f"{p.get('chain')}:{p.get('token_address')}": raise SystemExit('COIN_PROFILE_IDENTITY_KEY_DRIFT')
              if p.get('production_effect') != 'NONE_RESEARCH_PROFILE_ONLY': raise SystemExit('COIN_PROFILE_PRODUCTION_EFFECT_LEAK')
              if (p.get('fingerprint') or {}).get('truth_rule') != 'MISSING_DIMENSIONS_REMAIN_UNOBSERVED': raise SystemExit('COIN_PROFILE_RAW_FINGERPRINT_TRUTH_DRIFT')
              if (p.get('learning_fingerprint') or {}).get('truth_rule') != 'MISSING_OR_QUARANTINED_DIMENSIONS_REMAIN_UNOBSERVED': raise SystemExit('COIN_PROFILE_LEARNING_FINGERPRINT_TRUTH_DRIFT')
              q=p.get('data_quality') or {}
              if q.get('status') not in {'CLEAN','CONFLICT_QUARANTINED'}: raise SystemExit('COIN_PROFILE_DATA_QUALITY_MISSING')
              if q.get('status') == 'CONFLICT_QUARANTINED' and p.get('research_similarity_eligible') is not False: raise SystemExit('COIN_PROFILE_QUARANTINED_SIMILARITY_LEAK')
          if dna.get('automatic_trade') is not False or dna.get('production_effect') != 'NONE': raise SystemExit('COIN_PROFILE_DNA_PRODUCTION_LEAK')
          dt=dna.get('truth_contract') or {}
          if dt.get('hard_gates_never_weaken_from_profile_similarity') is not True: raise SystemExit('COIN_PROFILE_DNA_HARD_GATE_LEAK')
          if dt.get('quarantined_metrics_excluded_from_similarity') is not True: raise SystemExit('COIN_PROFILE_DNA_QUALITY_QUARANTINE_MISSING')
          if quality.get('mode') != 'COIN_PROFILE_DATA_QUALITY_GUARD_V1': raise SystemExit('COIN_PROFILE_QUALITY_MODE_DRIFT')
          if quality.get('automatic_trade') is not False or quality.get('production_change') is not False: raise SystemExit('COIN_PROFILE_QUALITY_PRODUCTION_LEAK')
          print('COIN_PROFILE_TRUTH_OK', latest.get('counts'))
          print('COIN_PROFILE_DNA_OK', dna.get('counts'), 'archive', len(archive.get('entries') or {}))
          print('COIN_PROFILE_QUALITY_OK', quality.get('counts'))
          PY
      - name: Rebuild and atomically publish against newest source truth
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'wallet500-profile-bot'
          git config user.email 'wallet500-profile-bot@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch --depth=1 origin main
            git reset --hard origin/main
            source_sha="$(git rev-parse HEAD)"
            python -m wallet500.coin_intelligence_profiles
            python -m wallet500.coin_profile_quality_guard
            python - <<'PY'
          import json
          from pathlib import Path
          latest=json.loads(Path('data/coin-intelligence-profiles.json').read_text())
          ledger=json.loads(Path('data/coin-intelligence-profile-ledger.json').read_text())
          dna=json.loads(Path('data/coin-profile-dna-library.json').read_text())
          quality=json.loads(Path('data/coin-profile-data-quality.json').read_text())
          if latest.get('automatic_trade') is not False or latest.get('production_change') is not False: raise SystemExit('ATOMIC_PROFILE_PRODUCTION_LEAK')
          if (ledger.get('truth_contract') or {}).get('quarantined_metrics_excluded_from_dna') is not True: raise SystemExit('ATOMIC_PROFILE_QUALITY_GUARD_MISSING')
          if (dna.get('truth_contract') or {}).get('quarantined_metrics_excluded_from_similarity') is not True: raise SystemExit('ATOMIC_DNA_QUALITY_GUARD_MISSING')
          if quality.get('mode') != 'COIN_PROFILE_DATA_QUALITY_GUARD_V1': raise SystemExit('ATOMIC_PROFILE_QUALITY_MODE_DRIFT')
          print('ATOMIC_PROFILE_REBUILD_OK', latest.get('counts'), quality.get('counts'))
          PY
            set +e
            python scripts/atomic_publish.py \
              --base "$source_sha" \
              --fail-on-newer \
              --message 'data: refresh persistent coin intelligence profiles [skip ci]' \
              data/coin-intelligence-profiles.json \
              data/coin-intelligence-profile-ledger.json \
              data/coin-intelligence-profile-archive.json \
              data/coin-profile-dna-library.json \
              data/coin-profile-data-quality.json
            rc=$?
            set -e
            if [ "$rc" -eq 0 ]; then echo "COIN_PROFILE_ATOMIC_PUBLISH_OK attempt=$attempt"; exit 0; fi
            if [ "$rc" -eq 75 ]; then echo "COIN_PROFILE_REBUILD_REQUIRED attempt=$attempt"; sleep 1; continue; fi
            exit "$rc"
          done
          echo '::error::COIN_PROFILE_ATOMIC_PUBLISH_FAILED after 5 fresh rebuild attempts'
          exit 1
