name: Wallet500 Social Runner Research

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'src/wallet500/social_runner_research.py'
      - 'src/wallet500/social_runner_feed.py'
      - 'tests/test_social_runner_research.py'
      - 'tests/test_social_runner_feed.py'
      - 'src/wallet500/social_runner_telegram.py'
      - 'tests/test_social_runner_telegram.py'
      - '.github/workflows/social-runner-telegram.yml'
      - '.github/workflows/social-runner-research.yml'
  push:
    branches: [main]
    paths:
      - 'src/wallet500/social_runner_research.py'
      - 'src/wallet500/social_runner_feed.py'
      - 'tests/test_social_runner_research.py'
      - 'tests/test_social_runner_feed.py'
      - 'src/wallet500/social_runner_telegram.py'
      - 'tests/test_social_runner_telegram.py'
      - '.github/workflows/social-runner-telegram.yml'
      - '.github/workflows/social-runner-research.yml'
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

concurrency:
  group: wallet500-social-runner-research-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install and test Social Runner Research
        run: |
          pip install -e . pytest
          python -m pytest -q \
            tests/test_social_runner_research.py \
            tests/test_social_runner_feed.py

      - name: Build native no-hindsight social feed
        run: python -m wallet500.social_runner_feed

      - name: Build research-only social runner cohort
        run: python -m wallet500.social_runner_research

      - name: Validate production isolation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          f=json.loads(Path('data/social-runner-research-feed.json').read_text())
          d=json.loads(Path('data/social-runner-research.json').read_text())
          if f.get('mode')!='RESEARCH_ONLY_SOCIAL_RUNNER_NATIVE_FEED_V1': raise SystemExit('SOCIAL_RUNNER_FEED_MODE_DRIFT')
          if f.get('research_only') is not True or f.get('production_effect') is not False or f.get('automatic_buy') is not False: raise SystemExit('SOCIAL_RUNNER_FEED_PRODUCTION_LEAK')
          truth=f.get('truth_contract') or {}
          if truth.get('no_undocumented_tgmetrics_scraping') is not True: raise SystemExit('SOCIAL_RUNNER_TGMETRICS_TRUTH_LOST')
          if d.get('mode')!='RESEARCH_ONLY_SOCIAL_RUNNER_INTELLIGENCE_V1': raise SystemExit('SOCIAL_RUNNER_MODE_DRIFT')
          if d.get('research_only') is not True: raise SystemExit('SOCIAL_RUNNER_NOT_RESEARCH_ONLY')
          if d.get('production_effect') is not False: raise SystemExit('SOCIAL_RUNNER_PRODUCTION_LEAK')
          if d.get('automatic_buy') is not False: raise SystemExit('SOCIAL_RUNNER_AUTO_BUY_LEAK')
          targets=d.get('target_definitions') or {}
          for key in ('RUNNER_24H','RUNNER_72H','MOONSHOT_7D'):
              if key not in targets: raise SystemExit('SOCIAL_RUNNER_TARGET_MISSING:'+key)
          print('SOCIAL_RUNNER_RESEARCH_VALID', f.get('sources'), d.get('counts'), d.get('input_status'))
          PY

      - name: Publish forward research snapshots
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python scripts/atomic_publish.py \
            --github-api-cas \
            --message 'research: refresh social runner cohort' \
            data/social-runner-research.json \
            data/social-runner-live-ledger.json
