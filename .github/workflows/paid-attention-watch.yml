name: Wallet500 Paid Attention Research Watch

on:
  workflow_dispatch:
  schedule:
    - cron: '12,42 * * * *'
  push:
    branches: [main]
    paths:
      - 'src/wallet500/paid_attention_watch.py'
      - 'tests/test_paid_attention_watch.py'
      - 'data/paid-visibility-ledger.json'
      - '.github/workflows/paid-attention-watch.yml'

permissions:
  contents: write

# Keep one paid-attention research run active without sharing GitHub's single
# pending concurrency slot with unrelated main publishers. The publish step
# below remains race-safe via reset/retry and never weakens production gates.
concurrency:
  group: wallet500-paid-attention-watch
  cancel-in-progress: false

jobs:
  research-watch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -e . pytest
      - name: Unit tests
        run: python -m pytest -q tests/test_paid_attention_watch.py tests/test_revival_precursor.py
      - name: Build paid attention research watch
        env:
          BIRDEYE_API_KEY: ${{ secrets.BIRDEYE_API_KEY }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          COINGECKO_DEMO_API_KEY: ${{ secrets.COINGECKO_DEMO_API_KEY }}
        run: python -m wallet500.paid_attention_watch
      - name: Validate research-only truth contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from wallet500.revival_1000 import looks_like_solana_address
          p=Path('data/paid-attention-research-watch.json')
          s=Path('data/paid-attention-research-watch-state.json')
          if not p.exists() or not s.exists(): raise SystemExit('PAID_ATTENTION_WATCH_OUTPUT_MISSING')
          d=json.loads(p.read_text())
          if d.get('mode')!='RESEARCH_ONLY_PAID_ATTENTION_WATCH_V1': raise SystemExit('PAID_ATTENTION_WATCH_MODE_INVALID')
          if d.get('contract')!='PAID_ATTENTION_WATCH_V1': raise SystemExit('PAID_ATTENTION_WATCH_CONTRACT_INVALID')
          if d.get('network')!='solana' or d.get('production_portfolio_impact')!='NONE': raise SystemExit('PAID_ATTENTION_WATCH_SAFETY_INVALID')
          if d.get('no_hindsight') is not True: raise SystemExit('PAID_ATTENTION_WATCH_HINDSIGHT_INVALID')
          if d.get('trigger_policy')!='VERIFIED_PAID_VISIBILITY_CREATES_RESEARCH_WATCH_ONLY': raise SystemExit('PAID_ATTENTION_TRIGGER_POLICY_INVALID')
          rows=d.get('targets') or []
          if int((d.get('counts') or {}).get('tracked') or 0)!=len(rows): raise SystemExit('PAID_ATTENTION_WATCH_COUNT_MISMATCH')
          allowed={
              'PAID_ATTENTION_RESEARCH_WATCH',
              'PAID_ATTENTION_EARLY_CONFIRMING',
              'PAID_ATTENTION_LATE_MOVE',
              'PAID_ATTENTION_RISK_RESEARCH',
              'PAID_ATTENTION_LOW_LIQUIDITY_LEARNING',
              'PAID_ATTENTION_PUMP_DUMP_LEARNING',
              'PAID_ATTENTION_LIQUIDITY_UNVERIFIED',
          }
          banned={'USDC','USDT','DAI','USDS','USD1','USDE','PYUSD','FDUSD','TUSD','USDP','GUSD','FRAX','LUSD','CRVUSD','USDD','USDB','USDX','USD0','USDY','EURC','EURS','WBTC','CBBTC','TBTC','LBTC','SOLVBTC','WSOL','BNSOL','JITOSOL','JUPSOL','MSOL','STSOL','VSOL','JLP','SUSDE','SYRUPUSDC','USYC','USTB','BUILD'}
          for x in rows:
              if x.get('network')!='solana' or not looks_like_solana_address(str(x.get('token_address') or '')): raise SystemExit('PAID_ATTENTION_TOKEN_IDENTITY_INVALID')
              if not looks_like_solana_address(str(x.get('pair_address') or '')) or x.get('pair_identity_locked') is not True: raise SystemExit('PAID_ATTENTION_PAIR_IDENTITY_INVALID')
              if x.get('base_watch_status')!='PAID_ATTENTION_RESEARCH_WATCH': raise SystemExit('PAID_ATTENTION_BASE_STATUS_INVALID')
              if x.get('watch_status') not in allowed: raise SystemExit('PAID_ATTENTION_STATUS_INVALID')
              if x.get('pre_alpha_eligible') is not False or x.get('verified_buy_signal') is not False: raise SystemExit('PAID_ATTENTION_IMPROPER_PROMOTION')
              if x.get('production_portfolio_impact')!='NONE': raise SystemExit('PAID_ATTENTION_PRODUCTION_IMPACT')
              if str(x.get('symbol') or '').upper() in banned: raise SystemExit('PAID_ATTENTION_BANNED_ASSET')
              promo=x.get('promotion') or {}
              if promo.get('timing_class')=='PROMOTION_AFTER_BREAKOUT' and x.get('watch_status')=='PAID_ATTENTION_EARLY_CONFIRMING': raise SystemExit('LATE_PROMOTION_EARLY_CONFIRMING')
              for name,ch in (x.get('channels') or {}).items():
                  if ch.get('verified') is not True and float(ch.get('score') or 0)!=0: raise SystemExit('UNVERIFIED_PAID_CHANNEL_SCORED:'+name)
          print('PAID_ATTENTION_RESEARCH_WATCH_V1_VALID',d.get('counts'))
          PY
      - name: Publish paid attention research watch
        run: |
          set -euo pipefail
          git config user.name 'wallet500-paid-watch-bot'
          git config user.email 'wallet500-paid-watch-bot@users.noreply.github.com'
          tmp="$(mktemp -d)"
          cp data/paid-attention-research-watch.json "$tmp/paid-attention-research-watch.json"
          cp data/paid-attention-research-watch-state.json "$tmp/paid-attention-research-watch-state.json"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp "$tmp/paid-attention-research-watch.json" data/paid-attention-research-watch.json
            cp "$tmp/paid-attention-research-watch-state.json" data/paid-attention-research-watch-state.json
            git add data/paid-attention-research-watch.json data/paid-attention-research-watch-state.json
            if git diff --cached --quiet; then echo 'PAID_ATTENTION_WATCH_NO_DATA_CHANGE'; exit 0; fi
            git commit -m 'data: refresh paid attention research watch'
            if git push origin HEAD:main; then echo 'PAID_ATTENTION_WATCH_PUBLISH_OK'; exit 0; fi
            echo "PAID_ATTENTION_WATCH_PUBLISH_RETRY attempt=$attempt"; sleep 3
          done
          echo '::error::PAID_ATTENTION_WATCH_PUBLISH_RACE_EXHAUSTED'; exit 1
