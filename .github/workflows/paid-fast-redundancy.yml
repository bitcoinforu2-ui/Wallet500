name: Wallet500 Paid Fast Redundancy

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths:
      - 'src/wallet500/paid_fast_redundancy.py'
      - 'tests/test_paid_fast_redundancy.py'
      - 'data/paid-visibility-ledger.json'
      - '.github/workflows/paid-fast-redundancy.yml'

permissions:
  contents: write

concurrency:
  group: wallet500-paid-fast-redundancy
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            src/wallet500/paid_fast_redundancy.py
            tests/test_paid_fast_redundancy.py
            data/paid-visibility-ledger.json
            data/paid-fast-redundancy-ledger.json
            data/paid-fast-redundancy-summary.json
            .github/workflows/paid-fast-redundancy.yml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test runner
        run: python -m pip install -q pytest
      - name: Unit tests
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_paid_fast_redundancy.py
      - name: Collect official and redundant paid-signal sources
        env:
          PYTHONPATH: src
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          PAID_FAST_X_POLL_EVERY_RUNS: '6'
        run: python -m wallet500.paid_fast_redundancy
      - name: Validate research-only truth contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for name in ('paid-fast-redundancy-ledger.json','paid-fast-redundancy-summary.json'):
              p=Path('data')/name
              if not p.exists() or p.stat().st_size==0: raise SystemExit('PAID_FAST_OUTPUT_MISSING:'+name)
          d=json.loads(Path('data/paid-fast-redundancy-ledger.json').read_text())
          s=json.loads(Path('data/paid-fast-redundancy-summary.json').read_text())
          if d.get('mode')!='RESEARCH_ONLY_PAID_FAST_REDUNDANCY_V1' or d.get('contract')!='PAID_FAST_REDUNDANCY_V1': raise SystemExit('PAID_FAST_CONTRACT_INVALID')
          if d.get('network')!='solana' or d.get('production_portfolio_impact')!='NONE' or d.get('no_hindsight') is not True: raise SystemExit('PAID_FAST_SAFETY_INVALID')
          if len(d.get('telegram_sources') or [])!=5 or len(d.get('x_sources') or [])!=6: raise SystemExit('PAID_FAST_SOURCE_REGISTRY_INVALID')
          if s.get('production_portfolio_impact')!='NONE' or s.get('no_hindsight') is not True: raise SystemExit('PAID_FAST_SUMMARY_SAFETY_INVALID')
          for e in d.get('events') or []:
              if e.get('network')!='solana' or e.get('production_portfolio_impact')!='NONE': raise SystemExit('PAID_FAST_EVENT_SAFETY_INVALID')
              if e.get('pair_address') and e.get('pair_identity_locked') is not True: raise SystemExit('PAID_FAST_PAIR_NOT_LOCKED')
          print('PAID_FAST_REDUNDANCY_V1_VALID', s.get('counts'))
          PY
      - name: Publish fast redundancy ledger
        run: |
          set -euo pipefail
          git config user.name 'wallet500-paid-fast-bot'
          git config user.email 'wallet500-paid-fast-bot@users.noreply.github.com'
          tmp="$(mktemp -d)"
          cp data/paid-fast-redundancy-ledger.json "$tmp/ledger.json"
          cp data/paid-fast-redundancy-summary.json "$tmp/summary.json"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp "$tmp/ledger.json" data/paid-fast-redundancy-ledger.json
            cp "$tmp/summary.json" data/paid-fast-redundancy-summary.json
            git add data/paid-fast-redundancy-ledger.json data/paid-fast-redundancy-summary.json
            if git diff --cached --quiet; then echo 'PAID_FAST_NO_DATA_CHANGE'; exit 0; fi
            git commit -m 'data: refresh paid fast redundancy ledger'
            if git push origin HEAD:main; then echo 'PAID_FAST_PUBLISH_OK'; exit 0; fi
            echo "PAID_FAST_PUBLISH_RETRY attempt=$attempt"; sleep 3
          done
          echo '::error::PAID_FAST_PUBLISH_RACE_EXHAUSTED'; exit 1
