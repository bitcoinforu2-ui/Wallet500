name: DOGE1 Whale 0.1pct Ledger

on:
  schedule:
    - cron: '11 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: doge1-whale-ledger
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build timestamp-safe whale snapshot
        env:
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
          CA: DpBzjtgGLF7QA9Ug3eUVGbnqa6j3jvYBn1XuQuktvfhm
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          rpc=os.environ.get('SOLANA_RPC_URL','').strip()
          if not rpc:
              raise SystemExit('Fail closed: SOLANA_RPC_URL secret required for whale ledger')
          mint=os.environ['CA']
          def rpc_call(method,params):
              body=json.dumps({'jsonrpc':'2.0','id':1,'method':method,'params':params}).encode()
              req=urllib.request.Request(rpc,data=body,headers={'content-type':'application/json'},method='POST')
              with urllib.request.urlopen(req,timeout=30) as r: out=json.load(r)
              if out.get('error'): raise SystemExit(f'RPC {method} failed: {out["error"]}')
              return out.get('result')

          supply=rpc_call('getTokenSupply',[mint,{'commitment':'confirmed'}])
          val=(supply or {}).get('value') or {}
          amount=int(val.get('amount') or 0); decimals=int(val.get('decimals') or 0)
          if amount<=0: raise SystemExit('Fail closed: invalid token supply')
          largest=rpc_call('getTokenLargestAccounts',[mint,{'commitment':'confirmed'}]) or {}
          accounts=largest.get('value') or []
          threshold_raw=amount*0.001
          whales=[]
          for a in accounts:
              raw=int(a.get('amount') or 0)
              if raw < threshold_raw: continue
              whales.append({'token_account':a.get('address'),'raw_balance':str(raw),'balance':raw/(10**decimals),'supply_pct':round(raw/amount*100,6)})
          whales.sort(key=lambda x:x['raw_balance'],reverse=True)
          now=datetime.now(timezone.utc).isoformat()
          current={'observed_at':now,'mint':mint,'threshold_supply_pct':0.1,'supply_raw':str(amount),'decimals':decimals,'whales':whales,'coverage':'SOLANA_RPC_CONFIRMED_TOP_TOKEN_ACCOUNTS'}
          hist=Path('data/doge1-whale-ledger.json')
          ledger={'version':1,'mint':mint,'threshold_supply_pct':0.1,'snapshots':[]}
          if hist.exists():
              try: ledger=json.loads(hist.read_text())
              except: pass
          snaps=ledger.get('snapshots') if isinstance(ledger.get('snapshots'),list) else []
          snaps.append(current); snaps=snaps[-168:]
          ledger.update({'version':1,'mint':mint,'threshold_supply_pct':0.1,'updated_at':now,'snapshots':snaps})
          # Compare exact token accounts against the previous hourly snapshot.
          flows=[]
          if len(snaps)>=2:
              old={x['token_account']:int(x['raw_balance']) for x in snaps[-2].get('whales',[])}
              new={x['token_account']:int(x['raw_balance']) for x in whales}
              for acct in sorted(set(old)|set(new)):
                  d=new.get(acct,0)-old.get(acct,0)
                  if d:
                      flows.append({'token_account':acct,'delta_tokens':d/(10**decimals),'delta_supply_pct':round(d/amount*100,6),'direction':'BUY_OR_INFLOW' if d>0 else 'SELL_OR_OUTFLOW'})
          current['flows_vs_previous_hour']=sorted(flows,key=lambda x:abs(x['delta_supply_pct']),reverse=True)
          Path('data').mkdir(exist_ok=True)
          hist.write_text(json.dumps(ledger,ensure_ascii=False,indent=2)+'\n')
          Path('data/doge1-whale-current.json').write_text(json.dumps(current,ensure_ascii=False,indent=2)+'\n')
          print(f'whales >=0.1%: {len(whales)}; changed accounts: {len(flows)}')
          PY
      - name: Publish ledger safely
        run: |
          set -euo pipefail
          D="$(mktemp -d)"
          cp data/doge1-whale-ledger.json data/doge1-whale-current.json "$D/"
          git config user.name wallet500-bot
          git config user.email wallet500-bot@users.noreply.github.com
          for attempt in $(seq 1 12); do
            git fetch origin main
            git reset --hard origin/main
            cp "$D/doge1-whale-ledger.json" data/
            cp "$D/doge1-whale-current.json" data/
            git add data/doge1-whale-ledger.json data/doge1-whale-current.json
            git commit -m 'data: refresh DOGE1 whale ledger' || exit 0
            if git push origin HEAD:main; then exit 0; fi
            sleep $(( attempt < 5 ? attempt : 5 ))
          done
          exit 1
