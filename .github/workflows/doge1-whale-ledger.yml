name: DOGE1 Holder + Whale Onchain Ledger

on:
  schedule:
    - cron: '11 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/doge1-whale-ledger.yml'

permissions:
  contents: write

concurrency:
  group: doge1-whale-ledger
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Build timestamp-safe holder and whale snapshot
        env:
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
          CA: DpBzjtgGLF7QA9Ug3eUVGbnqa6j3jvYBn1XuQuktvfhm
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, time, urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          mint=os.environ['CA']
          secret_rpc=os.environ.get('SOLANA_RPC_URL','').strip()
          rpc_candidates=[]
          if secret_rpc:
              rpc_candidates.append(('SECRET_RPC', secret_rpc))
          for source,rpc in [
              ('SOLANA_MAINNET_PUBLIC','https://api.mainnet.solana.com'),
              ('SOLANA_MAINNET_BETA_PUBLIC','https://api.mainnet-beta.solana.com'),
              ('PUBLICNODE_FALLBACK','https://solana-rpc.publicnode.com'),
          ]:
              if rpc and all(existing_rpc != rpc for _,existing_rpc in rpc_candidates):
                  rpc_candidates.append((source,rpc))
          if not rpc_candidates:
              raise SystemExit('Fail closed: no Solana RPC endpoint available')

          rpc_source_used=None
          def call(method,params):
              global rpc_source_used
              errors=[]
              for source,rpc in rpc_candidates:
                  for attempt in range(1,4):
                      try:
                          b=json.dumps({'jsonrpc':'2.0','id':1,'method':method,'params':params}).encode()
                          q=urllib.request.Request(rpc,data=b,headers={'content-type':'application/json','user-agent':'wallet500-doge1-ledger/5'},method='POST')
                          with urllib.request.urlopen(q,timeout=45) as r:
                              o=json.load(r)
                          if o.get('error'):
                              raise RuntimeError(f'RPC error code={o["error"].get("code")}')
                          rpc_source_used=source
                          return o.get('result')
                      except Exception as exc:
                          errors.append(f'{source}:{method}:attempt{attempt}:{type(exc).__name__}')
                          if attempt < 3:
                              time.sleep(attempt)
              raise SystemExit(f'Fail closed: RPC {method} unavailable after retries; sources={errors}')

          sv=(call('getTokenSupply',[mint,{'commitment':'confirmed'}]) or {}).get('value') or {}
          supply=int(sv.get('amount') or 0); decimals=int(sv.get('decimals') or 0)
          if supply<=0: raise SystemExit('Fail closed: invalid supply')
          accts=call('getProgramAccounts',['TokenkegQfeZyiNwAJbNbGKPFXCWuBvf9Ss623VQ5DA',{'commitment':'confirmed','encoding':'jsonParsed','filters':[{'dataSize':165},{'memcmp':{'offset':0,'bytes':mint}}]}]) or []
          token_accounts=[]
          for a in accts:
              try:
                  raw=int(a['account']['data']['parsed']['info']['tokenAmount']['amount'])
                  if raw>0:
                      token_accounts.append({'token_account':a.get('pubkey'),'raw_balance':raw})
              except Exception:
                  pass
          holder_count=len(token_accounts)
          if holder_count<=0: raise SystemExit('Fail closed: holder count unavailable')
          # Derive whale balances from the same verified complete token-account scan.
          # This avoids a second rate-limited getTokenLargestAccounts dependency and
          # keeps holder/whale truth on one coherent on-chain snapshot.
          threshold=supply*0.001
          whales=[]
          for a in sorted(token_accounts,key=lambda x:x['raw_balance'],reverse=True)[:20]:
              raw=int(a['raw_balance'])
              if raw>=threshold:
                  whales.append({'token_account':a.get('token_account'),'raw_balance':str(raw),'balance':raw/(10**decimals),'supply_pct':round(raw/supply*100,6)})
          now=datetime.now(timezone.utc).isoformat(); hist=Path('data/doge1-whale-ledger.json')
          ledger={'version':5,'mint':mint,'threshold_supply_pct':0.1,'snapshots':[]}
          if hist.exists():
              try: ledger=json.loads(hist.read_text())
              except Exception: pass
          snaps=ledger.get('snapshots') if isinstance(ledger.get('snapshots'),list) else []
          current={'observed_at':now,'mint':mint,'holders':holder_count,'supply_raw':str(supply),'decimals':decimals,'threshold_supply_pct':0.1,'whales':whales,'coverage':'SOLANA_RPC_CONFIRMED_ONCHAIN','whale_method':'DERIVED_FROM_COMPLETE_POSITIVE_TOKEN_ACCOUNT_SCAN','rpc_source':rpc_source_used,'rpc_policy':'SECRET_PREFERRED_MULTI_PUBLIC_FAILOVER_FAIL_CLOSED'}
          from datetime import datetime as DT
          def dt(s):
              try:return DT.fromisoformat(s.replace('Z','+00:00'))
              except Exception:return None
          nowdt=dt(now)
          def holder_delta(hours):
              target=nowdt.timestamp()-hours*3600; best=None
              for s in snaps:
                  t=dt(s.get('observed_at',''))
                  if t and t.timestamp()<=target and s.get('holders') is not None:
                      if best is None or t.timestamp()>best[0]: best=(t.timestamp(),int(s['holders']))
              return holder_count-best[1] if best else None
          current['holder_deltas']={'h1':holder_delta(1),'h6':holder_delta(6),'h24':holder_delta(24)}
          flows=[]
          if snaps:
              old={x['token_account']:int(x['raw_balance']) for x in snaps[-1].get('whales',[])}; new={x['token_account']:int(x['raw_balance']) for x in whales}
              for acct in set(old)|set(new):
                  d=new.get(acct,0)-old.get(acct,0)
                  if d: flows.append({'token_account':acct,'delta_tokens':d/(10**decimals),'delta_supply_pct':round(d/supply*100,6),'direction':'BUY_OR_INFLOW' if d>0 else 'SELL_OR_OUTFLOW'})
          current['flows_vs_previous_hour']=sorted(flows,key=lambda x:abs(x['delta_supply_pct']),reverse=True)
          snaps.append(current); snaps=snaps[-168:]
          ledger.update({'version':5,'updated_at':now,'rpc_policy':'SECRET_PREFERRED_MULTI_PUBLIC_FAILOVER_FAIL_CLOSED','whale_method':'DERIVED_FROM_COMPLETE_POSITIVE_TOKEN_ACCOUNT_SCAN','snapshots':snaps})
          Path('data').mkdir(exist_ok=True)
          hist.write_text(json.dumps(ledger,ensure_ascii=False,indent=2)+'\n')
          Path('data/doge1-whale-current.json').write_text(json.dumps(current,ensure_ascii=False,indent=2)+'\n')
          print(f'holders={holder_count} whales>=0.1%={len(whales)} rpc_source={rpc_source_used}')
          PY
      - name: Validate DOGE1 onchain truth
        run: |
          python - <<'PY'
          import json
          c=json.load(open('data/doge1-whale-current.json'))
          assert c['mint']=='DpBzjtgGLF7QA9Ug3eUVGbnqa6j3jvYBn1XuQuktvfhm'
          assert int(c['holders'])>0 and int(c['supply_raw'])>0
          assert c['coverage']=='SOLANA_RPC_CONFIRMED_ONCHAIN'
          assert c['whale_method']=='DERIVED_FROM_COMPLETE_POSITIVE_TOKEN_ACCOUNT_SCAN'
          assert c['rpc_source'] in {'SECRET_RPC','SOLANA_MAINNET_PUBLIC','SOLANA_MAINNET_BETA_PUBLIC','PUBLICNODE_FALLBACK'}
          PY
      - name: Publish ledger safely
        run: |
          set -euo pipefail
          D="$(mktemp -d)"; cp data/doge1-whale-ledger.json data/doge1-whale-current.json "$D/"
          git config user.name wallet500-bot; git config user.email wallet500-bot@users.noreply.github.com
          for attempt in $(seq 1 12); do
            git fetch origin main; git reset --hard origin/main
            cp "$D/doge1-whale-ledger.json" data/; cp "$D/doge1-whale-current.json" data/
            git add data/doge1-whale-ledger.json data/doge1-whale-current.json
            python scripts/serialized_publish_staged.py --github-api-cas --message 'data: refresh DOGE1 holder and whale ledger'; exit $?
            if false; then # legacy direct push disabled exit 0; fi
            sleep $(( attempt < 5 ? attempt : 5 ))
          done
          exit 1
