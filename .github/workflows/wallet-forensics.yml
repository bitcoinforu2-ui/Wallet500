name: Wallet500 Deep Wallet Forensics

on:
  workflow_dispatch:
  schedule:
    - cron: '12,42 * * * *'

permissions:
  contents: write

# Keep only one forensics run active at a time. Do not share a repository-wide
# pending slot: GitHub concurrency keeps at most one pending run per group and
# can cancel older pending runs even when cancel-in-progress is false.
concurrency:
  group: wallet500-wallet-forensics
  cancel-in-progress: false

jobs:
  forensics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Scheduled-run retries keep the original event SHA. Forensics is a
          # current-state research job, so always generate evidence from the
          # latest main rather than rebasing outputs computed from a stale SHA.
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -e .
      - name: Run deeper verified Solana wallet forensics
        env:
          WALLET500_FORENSICS_INPUT: active-qualified-candidates.json
          WALLET500_FORENSICS_MAX_TOKENS: '5'
          WALLET500_FORENSICS_SIGNATURES: '12'
          WALLET500_FORENSICS_UPDATE_RUN_SUMMARY: '0'
        run: python -m wallet500.wallet_candidate_discovery
      - name: Validate isolated research output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/wallet-forensics-summary.json')
          if not p.exists(): raise SystemExit('FATAL: wallet-forensics-summary.json missing')
          d=json.loads(p.read_text())
          if d.get('source')!='active-qualified-candidates.json': raise SystemExit('FATAL: forensics did not inspect the active pre-production lane')
          if d.get('lane')!='PRE_PRODUCTION_EVIDENCE_GATHERING' or d.get('production_authorization') is not False: raise SystemExit('FATAL: forensics lane could authorize production')
          if d.get('method')!='VERIFIED_EXACT_PAIR_TRANSACTION_SIGNERS': raise SystemExit('FATAL: unverified wallet method')
          print('WALLET FORENSICS:',d.get('active_candidates_seen',0),'active candidates',d.get('solana_candidates_scanned',0),'Solana pools',d.get('verified_wallet_candidates',0),'verified wallets')
          PY
      - name: Publish wallet-forensics data only
        run: |
          set -euo pipefail
          git config user.name 'wallet500-forensics-bot'
          git config user.email 'wallet500-forensics-bot@users.noreply.github.com'
          git add data/wallet-candidates.json data/wallet-forensics-summary.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh verified wallet forensics'
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort || true
                echo 'FATAL: wallet-forensics publisher rebase conflict; refusing automatic conflict resolution'
                exit 1
              fi
              if git push origin HEAD:main; then
                exit 0
              fi
              sleep 3
              if [ "$attempt" = 5 ]; then exit 1; fi
            done
          fi