name: Wallet500 Near Alert Observatory

on:
  workflow_dispatch:
  schedule:
    - cron: '4,9,14,19,24,29,34,39,44,49,54,59 * * * *'
  workflow_run:
    workflows:
      - "Wallet500 Candidate Evidence Envelope"
      - "Wallet500 Revival Funnel Diagnostics"
      - "Wallet500 Survivor Reawakening Shadow"
      - "Wallet500 New REAL ALERT $10 Paper Tracker Repair"
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'src/wallet500/near_alert_observatory.py'
      - 'src/wallet500/research_sample_accelerator.py'
      - 'tests/test_near_alert_observatory.py'
      - 'tests/test_research_sample_accelerator.py'
      - 'scripts/atomic_publish.py'
      - '.github/workflows/near-alert-observatory.yml'

permissions:
  contents: write

concurrency:
  group: wallet500-near-alert-observatory
  cancel-in-progress: false

jobs:
  observe:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install and test observatory truth contract
        run: |
          pip install -e . pytest
          python -m pytest -q tests/test_near_alert_observatory.py tests/test_research_sample_accelerator.py
      - name: Recompute observatory and forward learning sample from newest main truth
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "wallet500-research-bot"
          git config user.email "wallet500-research-bot@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          source_sha="$(git rev-parse HEAD)"
          python -m wallet500.near_alert_observatory
          python -m wallet500.research_sample_accelerator
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('data/near-alert-observatory.json').read_text())
          if d.get('mode') != 'RESEARCH_ONLY_NEAR_ALERT_FALSE_NEGATIVE_OBSERVATORY_V1': raise SystemExit('NEAR_ALERT_OBSERVATORY_MODE_DRIFT')
          if d.get('production_change') is not False or d.get('automatic_buy') is not False: raise SystemExit('NEAR_ALERT_OBSERVATORY_PRODUCTION_LEAK')
          t=d.get('truth_contract') or {}
          if t.get('real_alert_gate_changed') is not False or t.get('real_alert_thresholds_weakened') is not False: raise SystemExit('NEAR_ALERT_OBSERVATORY_GATE_LEAK')
          if t.get('near_alert_is_not_real_alert') is not True: raise SystemExit('NEAR_ALERT_SEMANTICS_DRIFT')
          for row in (d.get('near_alert_leaderboard') or []) + (d.get('closest_to_real_alert') or []):
              if row.get('automatic_buy') is not False or row.get('research_only') is not True: raise SystemExit('NEAR_ALERT_ROW_ACTION_LEAK')

          r=json.loads(Path('data/research-sample-report.json').read_text())
          l=json.loads(Path('data/research-sample-ledger.json').read_text())
          if r.get('mode') != 'RESEARCH_ONLY_FORWARD_SAMPLE_ACCELERATOR_V1': raise SystemExit('RESEARCH_SAMPLE_MODE_DRIFT')
          if l.get('mode') != 'RESEARCH_ONLY_FORWARD_SAMPLE_ACCELERATOR_V1': raise SystemExit('RESEARCH_SAMPLE_LEDGER_MODE_DRIFT')
          if (r.get('integrity') or {}).get('status') != 'PASS': raise SystemExit('RESEARCH_SAMPLE_INTEGRITY_FAIL')
          if r.get('formal_alpha_proof_unchanged') is not True: raise SystemExit('FORMAL_ALPHA_PROOF_CONTAMINATED')
          g=r.get('guardrails') or {}
          if g.get('real_alert_gate_changed') is not False or g.get('real_alert_thresholds_weakened') is not False: raise SystemExit('RESEARCH_SAMPLE_REAL_ALERT_LEAK')
          if g.get('telegram_alerts_changed') is not False or g.get('automatic_promotion') is not False or g.get('automatic_weight_mutation') is not False: raise SystemExit('RESEARCH_SAMPLE_ACTION_LEAK')
          if g.get('research_only') is not True: raise SystemExit('RESEARCH_SAMPLE_NOT_RESEARCH_ONLY')
          s=r.get('sample_acceleration') or {}
          if s.get('usable_target') != 20 or s.get('strong_target') != 50 or s.get('deep_target') != 100: raise SystemExit('RESEARCH_SAMPLE_TARGET_DRIFT')
          print('NEAR_ALERT_OBSERVATORY_OK', d.get('summary'))
          print('RESEARCH_SAMPLE_ACCELERATOR_OK', r.get('record_count'), r.get('verified_execution_record_count'), s.get('mature_24h_count'), s.get('usable_progress_pct'))
          PY
          python scripts/atomic_publish.py \
            --base "$source_sha" \
            --message 'research: refresh near-alert and forward learning sample' \
            data/near-alert-observatory.json \
            data/research-sample-ledger.json \
            data/research-sample-report.json
