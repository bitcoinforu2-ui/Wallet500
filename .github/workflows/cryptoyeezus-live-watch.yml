name: Wallet500 CryptoYeezus Live Watch

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths:
      - 'src/wallet500/cryptoyeezus_live_watch.py'
      - 'tests/test_cryptoyeezus_live_watch.py'
      - '.github/workflows/cryptoyeezus-live-watch.yml'

permissions:
  contents: write

concurrency:
  group: wallet500-cryptoyeezus-live-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: pip install -e . pytest

      - name: Unit tests
        run: python -m pytest -q tests/test_cryptoyeezus_live_watch.py

      - name: Poll CryptoYeezus Telegram near-live and X under budget guard
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          YEEZUS_X_POLL_EVERY_CYCLES: '6'
        run: python -m wallet500.cryptoyeezus_live_watch

      - name: Persist forward-only state
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          git config user.name 'wallet500-bot'
          git config user.email 'wallet500-bot@users.noreply.github.com'
          git add data/cryptoyeezus-live-state.json data/cryptoyeezus-calls.json data/cryptoyeezus-live-latest.json
          if git diff --cached --quiet; then
            echo 'No state change to commit'
            exit 0
          fi
          git commit -m 'Update CryptoYeezus forward social state'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Publish race on attempt ${attempt}; retrying against fresh main"
            sleep $((attempt * 2))
          done
          echo 'Failed to publish CryptoYeezus state after 5 contention-safe retries' >&2
          exit 1
