name: Wallet500 CryptoYeezus Live Watch

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths:
      - 'src/wallet500/cryptoyeezus_live_watch.py'
      - 'src/wallet500/cryptoyeezus_x_fallback.py'
      - 'src/wallet500/cryptoyeezus_hardening.py'
      - 'src/wallet500/cryptoyeezus_identity_guard.py'
      - 'src/wallet500/cryptoyeezus_priority_alerts.py'
      - 'tests/test_cryptoyeezus_live_watch.py'
      - 'tests/test_cryptoyeezus_x_fallback.py'
      - 'tests/test_cryptoyeezus_hardening.py'
      - 'tests/test_cryptoyeezus_identity_guard.py'
      - 'tests/test_cryptoyeezus_priority_alerts.py'
      - '.github/workflows/cryptoyeezus-live-watch.yml'
      - 'scripts/serialized_publish.py'

permissions:
  contents: write

concurrency:
  group: wallet500-cryptoyeezus-live-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: pip install -e . pytest

      - name: Unit tests
        run: |
          python -m pytest -q \
            tests/test_cryptoyeezus_live_watch.py \
            tests/test_cryptoyeezus_x_fallback.py \
            tests/test_cryptoyeezus_hardening.py \
            tests/test_cryptoyeezus_identity_guard.py \
            tests/test_cryptoyeezus_priority_alerts.py

      - name: Poll canonical Telegram and direct X on every run
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          YEEZUS_X_POLL_EVERY_CYCLES: '1'
        run: python -m wallet500.cryptoyeezus_hardening live

      - name: Recover X through public redundancy when direct API is degraded
        env:
          YEEZUS_X_FALLBACK_COUNT: '50'
        run: python -m wallet500.cryptoyeezus_hardening fallback

      - name: Quarantine false exact identities before priority delivery
        run: python -m wallet500.cryptoyeezus_identity_guard

      - name: Deliver dedicated CryptoYeezus priority alerts
        env:
          TELEGRAM_BOT_TOKEN: ''
          TELEGRAM_CHAT_ID: ''
          YEEZUS_PERSISTENCE_ALERT_MINUTES: '120'
        run: python -m wallet500.cryptoyeezus_hardening priority

      - name: Validate source-check and priority-delivery contracts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p=json.loads(Path('data/cryptoyeezus-live-latest.json').read_text())
          src=p.get('providers') or {}
          x=src.get('x') or {}
          tg=src.get('telegram') or {}
          if str(x.get('status') or '') == 'SKIPPED_BUDGET_GUARD':
              raise SystemExit('YEEZUS_X_WAS_NOT_CHECKED_THIS_RUN')
          if not str(x.get('status') or ''):
              raise SystemExit('YEEZUS_X_STATUS_MISSING')
          if not str(tg.get('status') or ''):
              raise SystemExit('YEEZUS_TELEGRAM_STATUS_MISSING')
          if str(tg.get('status') or '') != 'OK':
              raise SystemExit('YEEZUS_TELEGRAM_CANONICAL_SOURCE_UNHEALTHY')

          direct_ok=str(x.get('status') or '').startswith('OK')
          effective=str(x.get('effective_status') or '')
          if not direct_ok and effective != 'OK_WITH_PUBLIC_FALLBACK':
              print(
                  f'::warning::YEEZUS_X_DEGRADED direct={x.get("status")} '
                  f'fallback={x.get("redundancy_status")} provider={x.get("redundancy_provider")}; '
                  'canonical Telegram priority lane remains active and state will persist'
              )

          priority=p.get('priority_delivery') or {}
          if priority.get('policy') != 'CRYPTOYEEZUS_PRIORITY_V2':
              raise SystemExit('YEEZUS_PRIORITY_POLICY_MISSING')
          if int(priority.get('persistence_alert_minutes') or 0) < 30:
              raise SystemExit('YEEZUS_PRIORITY_COOLDOWN_TOO_SHORT')

          state=json.loads(Path('data/cryptoyeezus-priority-state.json').read_text())
          truth=state.get('truth_contract') or {}
          if truth.get('forward_only') is not True or truth.get('no_hindsight') is not True:
              raise SystemExit('YEEZUS_PRIORITY_FORWARD_ONLY_GUARD_MISSING')
          if truth.get('inherited_identity_requires_prior_exact_pair_lock') is not True:
              raise SystemExit('YEEZUS_PRIORITY_IDENTITY_GUARD_MISSING')
          if truth.get('fresh_market_metrics_require_same_exact_pair_and_token') is not True:
              raise SystemExit('YEEZUS_PRIORITY_PAIR_GUARD_MISSING')
          if truth.get('automatic_buy') is not False:
              raise SystemExit('YEEZUS_PRIORITY_AUTO_BUY_INVALID')

          print('YEEZUS_SOURCE_AND_PRIORITY_OK', tg.get('status'), x.get('status'), effective or 'DIRECT_OK', priority)
          PY

      - name: Persist forward-only state
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git restore --worktree -- src/wallet500.egg-info || true
          python scripts/serialized_publish.py \
            --github-api-cas \
            --attempts 80 \
            --message 'Update CryptoYeezus forward social state' \
            data/cryptoyeezus-live-state.json \
            data/cryptoyeezus-calls.json \
            data/cryptoyeezus-live-latest.json \
            data/cryptoyeezus-priority-state.json \
            data/cryptoyeezus-identity-corrections.json
          echo 'CRYPTOYEEZUS_STATE_PUBLISH_OK'
