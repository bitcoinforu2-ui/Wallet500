name: Wallet500 Live Scan Watchdog

on:
  workflow_dispatch:
  schedule:
    - cron: '13,28,43,58 * * * *'

permissions:
  contents: read
  actions: write

concurrency:
  group: wallet500-live-scan-watchdog
  cancel-in-progress: true

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check scan freshness
        id: freshness
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          p = Path('data/run-summary.json')
          stale = True
          age = 999999.0
          if p.exists():
              try:
                  d = json.loads(p.read_text())
                  ts = datetime.fromisoformat(d['updated_at'])
                  age = (datetime.now(timezone.utc) - ts).total_seconds() / 60
                  stale = age > 12
              except Exception:
                  stale = True
          print('stale=' + ('true' if stale else 'false'))
          print(f'age_minutes={age:.1f}')
          PY

      - name: Fresh scan already exists
        if: steps.freshness.outputs.stale != 'true'
        run: echo "Primary scan is fresh (${{ steps.freshness.outputs.age_minutes }} minutes); watchdog exits cleanly."

      - name: Dispatch full primary scan only when idle
        if: steps.freshness.outputs.stale == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          # The watchdog must never generate or publish partial truth data itself.
          # Recovery is delegated only to the full Live Scan workflow, which owns
          # Exact Pair revalidation, $50K liquidity hardening, fail-closed
          # Holder/Cluster gates, system health and strict validation before publish.
          runs_json="$(gh api --method GET \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/live-scan.yml/runs?per_page=30")"

          active_count="$(printf '%s' "$runs_json" | jq '[.workflow_runs[] | select(.status == "in_progress" or .status == "queued" or .status == "pending" or .status == "waiting" or .status == "requested")] | length')"

          if [ "$active_count" -gt 0 ]; then
            echo "WATCHDOG_STALE_BUT_PRIMARY_ACTIVE age=${{ steps.freshness.outputs.age_minutes }}m active=${active_count}; no duplicate dispatch."
            exit 0
          fi

          echo "WATCHDOG_STALE_DISPATCH_FULL_PRIMARY age=${{ steps.freshness.outputs.age_minutes }}m"
          gh workflow run live-scan.yml --repo "$GITHUB_REPOSITORY" --ref main
