name: Wallet500 7of7 Trade Manager

on:
  workflow_dispatch:
  schedule:
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * *'
  push:
    branches: [main]
    paths:
      - 'src/wallet500/trade_management_engine.py'
      - 'src/wallet500/post_buy_guardian.py'
      - 'tests/test_trade_management_engine.py'
      - 'tests/test_post_buy_guardian.py'
      - 'trade-manager-widget.js'
      - 'index.html'
      - '.github/workflows/trade-management.yml'

permissions:
  contents: write

# This workflow owns the 5-minute post-BUY monitoring lane as well as the legacy
# 7of7 trade-manager snapshot. A dedicated group prevents starvation while
# serializing state transitions and Telegram risk delivery.
concurrency:
  group: wallet500-trade-manager
  cancel-in-progress: false

jobs:
  manage:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install and test trade manager
        run: |
          pip install -e . pytest
          python -m pytest -q tests/test_trade_management_engine.py tests/test_post_buy_guardian.py
      - name: Recompute 7of7 trade management from newest main truth
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          git config user.name "wallet500-trade-manager"
          git config user.email "wallet500-trade-manager@users.noreply.github.com"
          git fetch --no-tags --depth=1 origin main
          git reset --hard origin/main
          source_sha="$(git rev-parse HEAD)"
          python -m wallet500.trade_management_engine
          python -m wallet500.post_buy_guardian
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('data/trade-management.json').read_text())
          if d.get('mode')!='MANUAL_REVIEW_TRADE_MANAGEMENT_V1': raise SystemExit('TRADE_MANAGER_MODE_DRIFT')
          if d.get('manual_review_only') is not True or d.get('automatic_trade') is not False: raise SystemExit('TRADE_MANAGER_ACTION_LEAK')
          t=d.get('truth_contract') or {}
          if t.get('input_requires_real_alert_7_of_7') is not True or t.get('signal_gate_unchanged') is not True: raise SystemExit('TRADE_MANAGER_GATE_LEAK')
          if t.get('no_automatic_buy') is not True or t.get('no_automatic_sell') is not True: raise SystemExit('TRADE_MANAGER_AUTOMATION_LEAK')
          allowed={'DATA_INSUFFICIENT','BUY_ZONE','BREAKOUT_RETEST','WAIT_FOR_RETEST','WAIT_FOR_ENTRY','EXIT_REVIEW','INVALIDATED'}
          for row in d.get('positions') or []:
              if row.get('trade_state') not in allowed: raise SystemExit('TRADE_MANAGER_STATE_INVALID')
              if row.get('readiness')!='7/7' or row.get('manual_review_only') is not True: raise SystemExit('TRADE_MANAGER_ROW_SCOPE_LEAK')
              if row.get('automatic_buy') is not False or row.get('automatic_sell') is not False: raise SystemExit('TRADE_MANAGER_ROW_ACTION_LEAK')
          print('TRADE_MANAGER_OK', d.get('managed_count'), d.get('state_counts'))

          g=json.loads(Path('data/post-buy-guardian-report.json').read_text())
          if g.get('mode')!='POST_BUY_GUARDIAN_V1': raise SystemExit('POST_BUY_GUARDIAN_MODE_DRIFT')
          if g.get('manual_review_only') is not True or g.get('automatic_sell') is not False: raise SystemExit('POST_BUY_GUARDIAN_ACTION_LEAK')
          gt=g.get('truth_contract') or {}
          if gt.get('only_delivered_final_buys_are_tracked') is not True: raise SystemExit('POST_BUY_SOURCE_SCOPE_DRIFT')
          if gt.get('exact_chain_contract_pair_required') is not True: raise SystemExit('POST_BUY_EXACT_PAIR_DRIFT')
          if gt.get('state_transition_alerts_only') is not True: raise SystemExit('POST_BUY_SPAM_GUARD_DRIFT')
          if gt.get('data_failure_never_becomes_sell_signal') is not True: raise SystemExit('POST_BUY_FAIL_CLOSED_DRIFT')
          allowed_guard={'HEALTHY','CAUTION','EXIT_REVIEW','INVALIDATED','DATA_DEGRADED'}
          for row in g.get('positions') or []:
              if row.get('risk_state') not in allowed_guard: raise SystemExit('POST_BUY_STATE_INVALID')
              if row.get('automatic_sell') is not False: raise SystemExit('POST_BUY_AUTO_SELL_LEAK')
          print('POST_BUY_GUARDIAN_OK', g.get('tracked_count'), g.get('state_counts'), 'delivered', g.get('delivered_count'))
          PY
          python scripts/atomic_publish.py \
            --github-api-cas \
            --base "$source_sha" \
            --message 'trade: refresh live management and post-buy guardian' \
            data/trade-management.json \
            data/post-buy-guardian-state.json \
            data/post-buy-guardian-report.json
