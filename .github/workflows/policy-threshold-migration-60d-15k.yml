name: Policy threshold migration 60d 15k

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/policy-threshold-migration-60d-15k.yml'

permissions:
  contents: write

jobs:
  migrate-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply scoped policy migration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          ROOT = Path('.')
          AGE_TOKENS = (
              'MIN_MARKET_AGE_DAYS', 'PROJECT_SCOPE_MIN_AGE_DAYS',
              'APPROVED_PRODUCTION_MIN_AGE_DAYS', 'VETERAN_MIN_DAYS',
              'MIN_AGE_DAYS', 'minimum_market_age_days', 'market_age_min_days',
              'veteran_scope_days', 'market_age_days>=', 'market_age_min_days>=',
          )
          LIQ_TOKENS = (
              'MIN_LIQUIDITY_USD', 'MIN_LIVE_LIQUIDITY_USD',
              'MIN_TRADABLE_LIQUIDITY_USD', 'MIN_EXECUTION_LIQUIDITY_USD',
              'MIN_EXECUTION_POOL_LIQUIDITY_USD', 'MIN_LIQ=', 'MIN_LIQ =',
              'verified_min_liquidity_usd', 'qualification_min_liquidity_usd',
              'minimum_liquidity_usd', 'min_live_liquidity_usd',
              'min_execution_liquidity_usd', 'liquidity_floor_usd',
              'execution_pool_liquidity_usd>=', 'ACTIVE_LIQUIDITY_USD',
          )
          age_num = re.compile(r'(?<!\d)180(?:\.0)?(?!\d)')
          liq_num = re.compile(r'(?<!\d)(?:50_000(?:\.0)?|50000(?:\.0)?)(?!\d)')

          def replace_policy_lines(path: Path) -> bool:
              text = path.read_text(encoding='utf-8')
              out = []
              changed = False
              for line in text.splitlines(keepends=True):
                  new = line
                  if any(tok in new for tok in AGE_TOKENS):
                      new = age_num.sub(lambda m: '60.0' if m.group(0).endswith('.0') else '60', new)
                  if any(tok in new for tok in LIQ_TOKENS):
                      raw = new
                      def repl_liq(m):
                          v = m.group(0)
                          if '_' in v:
                              return '15_000.0' if v.endswith('.0') else '15_000'
                          return '15000.0' if v.endswith('.0') else '15000'
                      new = liq_num.sub(repl_liq, new)
                  if new != line:
                      changed = True
                  out.append(new)
              if changed:
                  path.write_text(''.join(out), encoding='utf-8')
              return changed

          changed_paths = set()
          for base in (Path('src/wallet500'), Path('tests'), Path('.github/workflows')):
              if not base.exists():
                  continue
              for path in base.rglob('*'):
                  if path.is_file() and path.suffix in {'.py', '.yml', '.yaml'}:
                      if replace_policy_lines(path):
                          changed_paths.add(str(path))

          # Global policy terminology in executable code/tests/workflows only.
          string_swaps = {
              'UNDER_180_DAYS': 'UNDER_60_DAYS',
              'GTE_180_DAYS': 'GTE_60_DAYS',
              '180D_PLUS': '60D_PLUS',
              '180d_plus': '60d_plus',
              'AT_LEAST_180_DAYS': 'AT_LEAST_60_DAYS',
              'at least 180 days': 'at least 60 days',
              '180-day': '60-day',
              '180 day': '60 day',
              'BELOW_50K': 'BELOW_15K',
              'SUB_50K': 'SUB_15K',
              '50K_PLUS': '15K_PLUS',
              'ge_50k': 'ge_15k',
              '>=50000': '>=15000',
              '>= 50000': '>= 15000',
          }
          for base in (Path('src/wallet500'), Path('tests'), Path('.github/workflows')):
              if not base.exists():
                  continue
              for path in base.rglob('*'):
                  if not path.is_file() or path.suffix not in {'.py', '.yml', '.yaml'}:
                      continue
                  text = path.read_text(encoding='utf-8')
                  new = text
                  for old, rep in string_swaps.items():
                      new = new.replace(old, rep)
                  if new != text:
                      path.write_text(new, encoding='utf-8')
                      changed_paths.add(str(path))

          # Primary qualification floor comes from Settings.
          p = Path('src/wallet500/config.py')
          text = p.read_text(encoding='utf-8')
          old = 'os.getenv("WALLET500_VERIFIED_MIN_LIQUIDITY_USD", "50000")'
          if old not in text:
              raise SystemExit('CONFIG_LIQUIDITY_DEFAULT_PATTERN_MISSING')
          text = text.replace(old, 'os.getenv("WALLET500_VERIFIED_MIN_LIQUIDITY_USD", "15000")')
          p.write_text(text, encoding='utf-8')
          changed_paths.add(str(p))

          # Additional explicit minimum-liquidity gates that use compact/bare forms.
          explicit = {
              'src/wallet500/hot_healthy_radar.py': [('MIN_LIQ = 50000.0', 'MIN_LIQ = 15000.0'), ('MIN_LIQ=50000.0', 'MIN_LIQ=15000.0')],
              'src/wallet500/realizable_performance.py': [('MIN_LIQ=50000.0', 'MIN_LIQ=15000.0')],
              'src/wallet500/arbitrum_revival_universe.py': [('MIN_AGE_DAYS=180; MIN_LIQUIDITY=50000.0', 'MIN_AGE_DAYS=60; MIN_LIQUIDITY=15000.0')],
              'src/wallet500/quality_shadow.py': [('and _f(mark.get("liquidity_usd")) >= 50000', 'and _f(mark.get("liquidity_usd")) >= 15000')],
              'src/wallet500/external_only_paper.py': [("snap['liquidity_usd']<50000", "snap['liquidity_usd']<15000")],
              'src/wallet500/revival_prewaking_wallet_evidence.py': [('REVIVAL_PREWAKING_ACTIVE_LIQUIDITY_USD", "50000"', 'REVIVAL_PREWAKING_ACTIVE_LIQUIDITY_USD", "15000"')],
          }
          for name, reps in explicit.items():
              path = Path(name)
              if not path.exists():
                  continue
              text = path.read_text(encoding='utf-8')
              new = text
              for old, rep in reps:
                  new = new.replace(old, rep)
              if new != text:
                  path.write_text(new, encoding='utf-8')
                  changed_paths.add(str(path))

          # Mature-age policy document is the canonical human-readable contract.
          policy = Path('docs/OLD_COIN_REVIVAL_POLICY.md')
          if policy.exists():
              text = policy.read_text(encoding='utf-8')
              text = re.sub(r'(?<!\d)180(?!\d)', '60', text)
              policy.write_text(text, encoding='utf-8')
              changed_paths.add(str(policy))

          # Reawakening must not label dead/illiquid rows as approaching recovery.
          dash = Path('src/wallet500/reawakening_dashboard.py')
          text = dash.read_text(encoding='utf-8')
          old_import = '''from .reawakening_shadow import (\n    MIN_CONFIRMATION_SPAN_MINUTES,\n    MIN_LIQUIDITY_RETENTION,\n    REQUIRED_CONSECUTIVE,\n    observation_passes,\n)'''
          new_import = '''from .reawakening_shadow import (\n    MIN_CONFIRMATION_SPAN_MINUTES,\n    MIN_LIQUIDITY_RETENTION,\n    MIN_LIQUIDITY_USD,\n    MIN_MARKET_AGE_DAYS,\n    REQUIRED_CONSECUTIVE,\n    observation_passes,\n)'''
          if old_import not in text and 'MIN_MARKET_AGE_DAYS,' not in text:
              raise SystemExit('REAWAKENING_DASH_IMPORT_PATTERN_MISSING')
          text = text.replace(old_import, new_import)
          old_block = '''        gate_passed = len(reasons)\n        activity_passed = int(metrics.get("activity_checks_passed") or 0)\n        activity_available = int(metrics.get("activity_checks_available") or 0)\n        waiting_confirmation = ('''
          new_block = '''        gate_passed = len(reasons)\n        activity_passed = int(metrics.get("activity_checks_passed") or 0)\n        activity_available = int(metrics.get("activity_checks_available") or 0)\n\n        # Near-recovery is a positive recovery surface, not a list of every historical reject.\n        # Fail closed on market age, current liquidity and actual returning activity.\n        market_age_verified = snap.get("market_age_verified") is True or record.get("market_age_verified") is True\n        market_age_days = _f(snap.get("market_age_min_days") or record.get("market_age_min_days"))\n        liquidity_recovered_for_watch = _f(metrics.get("liquidity_usd")) >= MIN_LIQUIDITY_USD\n        activity_returning = activity_passed >= 1\n        if (\n            not market_age_verified\n            or market_age_days < MIN_MARKET_AGE_DAYS\n            or not liquidity_recovered_for_watch\n            or not activity_returning\n        ):\n            continue\n\n        waiting_confirmation = ('''
          if old_block not in text and 'liquidity_recovered_for_watch' not in text:
              raise SystemExit('REAWAKENING_DASH_FILTER_PATTERN_MISSING')
          text = text.replace(old_block, new_block)
          old_rule = '''            "liquidity_floor_usd": 50000,\n            "exact_pair_locked": True,'''
          new_rule = '''            "minimum_market_age_days": MIN_MARKET_AGE_DAYS,\n            "liquidity_floor_usd": MIN_LIQUIDITY_USD,\n            "near_recovery_requires_positive_activity": True,\n            "exact_pair_locked": True,'''
          text = text.replace(old_rule, new_rule)
          dash.write_text(text, encoding='utf-8')
          changed_paths.add(str(dash))

          # Reawakening candidate eligibility itself is also fail-closed to 60d+ verified age.
          shadow = Path('src/wallet500/reawakening_shadow.py')
          text = shadow.read_text(encoding='utf-8')
          if 'MIN_MARKET_AGE_DAYS = 60' not in text:
              anchor = 'MIN_LIQUIDITY_USD = 15_000.0\n'
              if anchor not in text:
                  raise SystemExit('REAWAKENING_SHADOW_LIQ_ANCHOR_MISSING')
              text = text.replace(anchor, anchor + 'MIN_MARKET_AGE_DAYS = 60\n', 1)
          old_checks = '''    checks = {\n        "source_live_survival_failed": str(record.get("first_reject_source") or "") == ELIGIBLE_SOURCE,\n        "liquidity_only_failure_present": "CURRENT_LIQUIDITY_BELOW_15K" in reasons,\n        "other_quality_checks_passed": "PASSED_SCORE_LIQUIDITY_VOLUME_ACTIVITY_MANIPULATION" in reasons,\n        "no_hard_reversal_reason": not bool(reasons & HARD_EXCLUDED_REASONS),\n    }'''
          new_checks = '''    snap = record.get("first_reject_snapshot") if isinstance(record.get("first_reject_snapshot"), dict) else {}\n    age_verified = snap.get("market_age_verified") is True or record.get("market_age_verified") is True\n    age_days = _f(snap.get("market_age_min_days") or record.get("market_age_min_days"))\n    checks = {\n        "source_live_survival_failed": str(record.get("first_reject_source") or "") == ELIGIBLE_SOURCE,\n        "veteran_age_verified_60d_plus": age_verified and age_days >= MIN_MARKET_AGE_DAYS,\n        "liquidity_only_failure_present": "CURRENT_LIQUIDITY_BELOW_15K" in reasons,\n        "other_quality_checks_passed": "PASSED_SCORE_LIQUIDITY_VOLUME_ACTIVITY_MANIPULATION" in reasons,\n        "no_hard_reversal_reason": not bool(reasons & HARD_EXCLUDED_REASONS),\n    }'''
          if old_checks not in text and 'veteran_age_verified_60d_plus' not in text:
              raise SystemExit('REAWAKENING_SHADOW_ELIGIBILITY_PATTERN_MISSING')
          text = text.replace(old_checks, new_checks)
          shadow.write_text(text, encoding='utf-8')
          changed_paths.add(str(shadow))

          # Tests/workflow assertions that state the active prewaking minimum.
          for path in list(Path('tests').rglob('*.py')) + list(Path('.github/workflows').rglob('*.yml')):
              text = path.read_text(encoding='utf-8')
              new = text.replace('ACTIVE_LIQUIDITY_USD >= 50000', 'ACTIVE_LIQUIDITY_USD >= 15000')
              if new != text:
                  path.write_text(new, encoding='utf-8')
                  changed_paths.add(str(path))

          # Canonical policy strings that are not on the same line as their constants.
          for path in Path('src/wallet500').rglob('*.py'):
              text = path.read_text(encoding='utf-8')
              new = text.replace('EARLIEST_ATH_OR_ATL_DATE_MUST_PROVE_AT_LEAST_180_DAYS_OF_MARKET_HISTORY', 'EARLIEST_ATH_OR_ATL_DATE_MUST_PROVE_AT_LEAST_60_DAYS_OF_MARKET_HISTORY')
              new = new.replace('EXACT_LOCKED_PAIR_OR_OLDEST_CURRENT_EXACT_TOKEN_PAIR_MUST_PROVE_AT_LEAST_180_DAYS', 'EXACT_LOCKED_PAIR_OR_OLDEST_CURRENT_EXACT_TOKEN_PAIR_MUST_PROVE_AT_LEAST_60_DAYS')
              if new != text:
                  path.write_text(new, encoding='utf-8')
                  changed_paths.add(str(path))

          print('CHANGED_PATHS')
          for name in sorted(changed_paths):
              print(name)

          # Hard post-migration invariants for executable policy.
          cfg = Path('src/wallet500/config.py').read_text(encoding='utf-8')
          assert 'WALLET500_VERIFIED_MIN_LIQUIDITY_USD", "15000"' in cfg
          mature = Path('src/wallet500/mature_age_gate.py').read_text(encoding='utf-8')
          assert 'MIN_MARKET_AGE_DAYS = 60' in mature
          prod = Path('src/wallet500/production_risk_gate.py').read_text(encoding='utf-8')
          assert 'MIN_TRADABLE_LIQUIDITY_USD = 15_000.0' in prod
          reaw = Path('src/wallet500/reawakening_shadow.py').read_text(encoding='utf-8')
          assert 'MIN_LIQUIDITY_USD = 15_000.0' in reaw
          assert 'MIN_MARKET_AGE_DAYS = 60' in reaw
          dash_t = Path('src/wallet500/reawakening_dashboard.py').read_text(encoding='utf-8')
          assert 'liquidity_recovered_for_watch' in dash_t
          assert 'market_age_days < MIN_MARKET_AGE_DAYS' in dash_t
          PY

      - name: Install test package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Compile engine
        run: python -m compileall -q src/wallet500

      - name: Full unit test suite
        run: python -m pytest -q

      - name: Commit migration after tests pass
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No migration changes detected.'
            exit 0
          fi
          git config user.name 'wallet500-policy-bot'
          git config user.email 'wallet500-policy-bot@users.noreply.github.com'
          git add src tests docs .github/workflows
          git commit -m 'policy: set Revival scope to 60d age and 15k liquidity'
          git push origin HEAD:main
