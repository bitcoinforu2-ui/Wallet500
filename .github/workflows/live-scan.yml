name: Wallet500 Multi-Chain Live Scan

on:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'experiments/**'
      - 'scripts/**'
      - 'pyproject.toml'
      - '.github/workflows/live-scan.yml'
      - 'data/manual-watchlist.json'
      - 'data/cex-identity-registry.json'

permissions:
  contents: write

# Collection and validation only. Final verified state is handed to the
# serialized snapshot publisher so research helpers cannot race production.
concurrency:
  group: wallet500-live-scan-publisher
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -e . pytest
      - name: Test mature age, identity, evidence, health and production truth contracts
        run: >-
          python -m pytest -q
          tests/test_mature_age_gate.py
          tests/test_cex_identity_preflight.py
          tests/test_cex_identity.py
          tests/test_cex_fast_lane_collection.py
          tests/test_candidate_evidence_envelope.py
          tests/test_real_alerts.py
          tests/test_real_alerts_revival_bridge.py
          tests/test_revival_funnel_diagnostics.py
          tests/test_telegram_exact_pair.py
          tests/test_system_health.py
          tests/test_production_status.py
          tests/test_hot_email_alerts.py
          tests/test_signal_intelligence.py
          tests/test_signal_alert_guard.py
          tests/test_paper_signal_enrichment.py

      - name: Refresh fast veteran CEX identity lane
        env:
          COINGECKO_DEMO_API_KEY: ${{ secrets.COINGECKO_DEMO_API_KEY }}
        run: python -m wallet500.cex_fast_lane

      - name: Publish fast CEX identity only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "Fast publish skipped safely: main moved during scan; retaining local outputs for full validation"
          else
            # Do not publish the intermediate REAL ALERT file. It is recalculated
            # only after the full evidence envelope is built later in this run.
            git add data/cex-revival-radar.json data/cex-learning.json || true
            git add data/cex-state.json data/cex-state.json.gz 2>/dev/null || true
            if git diff --cached --quiet; then
              echo "No fast-lane data changes"
            else
              git commit -m "data: refresh fast veteran CEX identity feed"
              for attempt in 1 2 3; do
                if git push origin HEAD:main; then
                  break
                fi
                git fetch origin main
                if [ "$(git rev-parse HEAD^)" != "$(git rev-parse origin/main)" ]; then
                  echo "Fast publish superseded by newer main; continuing without overwriting newer truth data"
                  git reset --soft HEAD^
                  break
                fi
                if [ "$attempt" -eq 3 ]; then
                  echo "Fast publish failed after 3 attempts"
                  exit 1
                fi
                sleep $((attempt * 2))
              done
            fi
          fi

      - name: Ingest 6h external signal cohort
        continue-on-error: true
        run: python -m wallet500.external_signal_cohort

      - name: Run veteran revival intelligence scan
        env:
          WALLET500_CEX_PRECOMPUTED: '1'
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=30s 12m python -m wallet500.orchestrator

      - name: Reconfirm provider-resilient exact CEX identity
        env:
          COINGECKO_DEMO_API_KEY: ${{ secrets.COINGECKO_DEMO_API_KEY }}
        run: python -m wallet500.cex_fast_lane
      - name: Apply universal live survival gate
        run: python -m wallet500.fresh_solana_gate
      - name: Revalidate immutable exact pairs
        run: python -m wallet500.exact_pair_survival
      - name: Enforce veteran-only production age scope on final active DEX lane
        run: python -m wallet500.production_age_governance
      - name: Refresh immutable performance exact-pair marks
        run: python -m wallet500.performance_tracker
      - name: Refresh current tradability truth
        run: python -m wallet500.realizable_performance
      - name: Update isolated external-only $10 paper cohort
        run: python -m wallet500.external_only_paper
      - name: Run parallel 6h shadow experiment lab
        run: python -m wallet500.six_hour_experiment_lab
      - name: Apply production liquidity hardening gate
        run: python -m wallet500.production_risk_gate
      - name: Enrich verified EVM deployment blocks on-chain
        run: python -m wallet500.evm_deployment_enrichment
      - name: Gather pre-production wallet evidence
        continue-on-error: true
        run: python -m wallet500.wallet_candidate_discovery
      - name: Analyze holder and cluster risk on exact active pairs
        run: python -m wallet500.holder_cluster_gate
      - name: Apply fail-closed holder cluster production gate
        run: python -m wallet500.holder_cluster_production_gate
      - name: Reconcile immutable $100 paper portfolio
        run: python -m wallet500.paper_portfolio
      - name: Run Decision Engine V1 shadow state machine
        run: python -m wallet500.decision_engine_v1
      - name: Preserve rejected and quarantined candidates for learning
        run: python -m wallet500.rejected_candidate_learning
      - name: Track rejected outcomes and false negatives
        run: python -m wallet500.rejected_outcome_tracker
      - name: Generate evidence-based filter tuning advice
        run: python -m wallet500.filter_tuning_advisor
      - name: Capture immutable qualified evidence
        run: python -m wallet500.evidence_capture

      # The public decision outputs are generated as one coherent derived state,
      # after all current-run upstream evidence is present in the workspace.
      - name: Build canonical Candidate Evidence Envelope
        run: python -m wallet500.candidate_evidence_envelope
      - name: Build prospective Signal DNA and self-learning shadow intelligence
        run: python -m wallet500.signal_intelligence
      - name: Build evidence-aware fail-closed REAL ALERT feed
        run: python -m wallet500.real_alerts
      - name: Apply fail-closed signal data health guard and enrich alerts
        run: python -m wallet500.signal_alert_guard
      - name: Build evidence-promotion funnel diagnostics
        run: python -m wallet500.revival_funnel_diagnostics
      - name: Validate coherent decision snapshot
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          e=json.loads(Path('data/candidate-evidence-envelope.json').read_text())
          s=json.loads(Path('data/signal-intelligence.json').read_text())
          r=json.loads(Path('data/real-alerts.json').read_text())
          f=json.loads(Path('data/revival-funnel-diagnostics.json').read_text())
          ec=e.get('counts') or {}; rc=r.get('counts') or {}; ep=(f.get('lanes') or {}).get('evidence_promotion') or {}
          ready=int(ec.get('evidence_ready') or 0)
          if int(rc.get('evidence_ready_research') or 0) != ready: raise SystemExit('LIVE_DECISION_EVIDENCE_COUNT_SKEW')
          if int(ep.get('evidence_ready') or 0) != ready: raise SystemExit('LIVE_FUNNEL_EVIDENCE_COUNT_SKEW')
          if e.get('production_change') is not False or e.get('automatic_buy') is not False: raise SystemExit('LIVE_ENVELOPE_PRODUCTION_LEAK')
          if (e.get('truth_contract') or {}).get('minimum_market_age_days') != 180: raise SystemExit('LIVE_VETERAN_SCOPE_DRIFT')
          if s.get('automatic_buy') is not False: raise SystemExit('LIVE_SIGNAL_INTELLIGENCE_AUTO_BUY_LEAK')
          st=s.get('truth_contract') or {}
          if st.get('self_learning_requires_holdout_validation') is not True: raise SystemExit('LIVE_SELF_LEARNING_VALIDATION_CONTRACT_MISSING')
          if st.get('self_learning_never_weakens_hard_gates') is not True: raise SystemExit('LIVE_SELF_LEARNING_HARD_GATE_LEAK')
          rt=r.get('truth_contract') or {}
          if rt.get('signal_intelligence_data_health_required') is not True: raise SystemExit('LIVE_SIGNAL_DATA_HEALTH_GUARD_MISSING')
          sh=s.get('data_health') or {}
          if sh.get('production_safe') is not True and int(rc.get('real_alerts') or 0) != 0: raise SystemExit('LIVE_STALE_SIGNAL_DATA_NOT_FAIL_CLOSED')
          age=json.loads(Path('data/active-qualified-age-gate.json').read_text())
          if age.get('status')=='QUARANTINED_FAIL_CLOSED_UNAPPROVED_POLICY': raise SystemExit('LIVE_STALE_7D_AGE_POLICY')
          print('LIVE_DECISION_SNAPSHOT_COHERENT', {'evidence_ready':ready,'verified_watch':rc.get('verified_watch_not_real'),'real_alerts':rc.get('real_alerts'),'signal_health':sh.get('status'),'learning_model':(s.get('self_learning_model') or {}).get('status')})
          PY

      - name: Send gated Telegram alerts
        run: python -m wallet500.telegram_alerts
      - name: Send HOT email alerts
        continue-on-error: true
        env:
          HOT_ALERT_EMAIL_TO: bitcoinforu2@gmail.com
          HOT_ALERT_SMTP_USER: bitcoinforu2@gmail.com
          HOT_ALERT_SMTP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python -m wallet500.hot_email_alerts
      - name: Assess explicit system health
        run: python -m wallet500.system_health
      - name: Record scheduler telemetry
        continue-on-error: true
        run: python -m wallet500.scheduler_telemetry

      - name: Archive cold outcome history and bound live publish files
        env:
          WALLET500_OUTCOME_HOT_HISTORY: '24'
          WALLET500_OUTCOME_MAX_LIVE_BYTES: '73400320'
        run: python scripts/compact_outcome_history.py

      - name: Validate primary live lane and learning integrity
        id: strict_validation
        run: python -m wallet500.strict_validation

      # Preserve failure evidence off-main. This does not publish or mutate production
      # truth; it only makes the fail-closed validator payload inspectable after a run.
      - name: Upload strict validation diagnostics on failure
        if: ${{ failure() && steps.strict_validation.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: wallet500-strict-validation-failure-${{ github.run_id }}
          path: data/strict-validation.json
          if-no-files-found: error
          retention-days: 2

      - name: Build canonical production operator status
        run: python -m wallet500.production_status
      - name: Prepare immutable publish evidence
        env:
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          payload={
            'version':1,
            'created_at':datetime.now(timezone.utc).isoformat(),
            'status':'READY_TO_PUBLISH',
            'strict_validation':'PASS',
            'source_sha':os.environ.get('SOURCE_SHA'),
            'run_id':os.environ.get('RUN_ID'),
            'run_attempt':os.environ.get('RUN_ATTEMPT'),
            'proof_rule':'IF_THIS_FILE_IS_VISIBLE_ON_MAIN_THE_VALIDATED_DATA_COMMIT_WAS_PUSHED_SUCCESSFULLY'
          }
          Path('data/publish-evidence.json').write_text(json.dumps(payload,indent=2),encoding='utf-8')
          PY

      - name: Build immutable verified publish artifact
        env:
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          rm -rf .publish-snapshot
          mkdir -p .publish-snapshot/files
          python - <<'PY'
          import hashlib, json, os, shutil, subprocess
          from datetime import datetime, timezone
          from pathlib import Path, PurePosixPath

          root=Path('.publish-snapshot')
          files_root=root/'files'
          def lines(args):
              out=subprocess.check_output(args,text=True)
              return [x.strip() for x in out.splitlines() if x.strip()]

          changed=lines(['git','diff','--name-only','HEAD','--','data/'])
          untracked=lines(['git','ls-files','--others','--exclude-standard','--','data/'])
          paths=sorted(set(changed+untracked))
          if 'data/publish-evidence.json' not in paths:
              raise SystemExit('Fresh publish evidence is missing from verified snapshot')
          if not paths:
              raise SystemExit('Verified scan produced no publishable data paths')

          items=[]
          for raw in paths:
              pp=PurePosixPath(raw)
              if not raw.startswith('data/') or pp.is_absolute() or '..' in pp.parts:
                  raise SystemExit(f'Unsafe generated data path: {raw!r}')
              src=Path(raw)
              if src.is_file():
                  dst=files_root/src
                  dst.parent.mkdir(parents=True,exist_ok=True)
                  shutil.copy2(src,dst)
                  digest=hashlib.sha256(dst.read_bytes()).hexdigest()
                  items.append({'path':raw,'kind':'file','sha256':digest})
              elif not src.exists():
                  items.append({'path':raw,'kind':'delete','sha256':None})
              else:
                  raise SystemExit(f'Unsupported generated path type: {raw}')

          manifest={
              'version':1,
              'created_at':datetime.now(timezone.utc).isoformat(),
              'source_run_id':str(os.environ['RUN_ID']),
              'source_run_attempt':str(os.environ['RUN_ATTEMPT']),
              'source_sha':str(os.environ['SOURCE_SHA']),
              'strict_validation':'PASS',
              'scope':'data/',
              'items':items,
          }
          (root/'manifest.json').write_text(json.dumps(manifest,indent=2),encoding='utf-8')
          print(f'Immutable verified artifact prepared with {len(items)} data paths')
          PY

      - name: Upload verified snapshot handoff
        uses: actions/upload-artifact@v4
        with:
          name: wallet500-verified-snapshot
          path: .publish-snapshot
          if-no-files-found: error
          retention-days: 2
          include-hidden-files: true
