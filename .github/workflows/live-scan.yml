name: Wallet500 Live Scan
on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -e .
      - name: Run real Solana scan
        env:
          WALLET500_SEEDS: ${{ vars.WALLET500_SEEDS }}
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
        run: |
          if [ -z "$WALLET500_SEEDS" ]; then echo 'WALLET500_SEEDS is required'; exit 2; fi
          if [ -z "$SOLANA_RPC_URL" ]; then export SOLANA_RPC_URL='https://api.mainnet-beta.solana.com'; fi
          python -m wallet500.main
      - name: Publish scan data
        run: |
          git config user.name 'wallet500-bot'
          git config user.email 'wallet500-bot@users.noreply.github.com'
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m 'data: refresh Solana intelligence'
          git push
