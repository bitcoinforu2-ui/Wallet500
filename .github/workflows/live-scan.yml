name: Wallet500 Multi-Chain Live Scan

on:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'experiments/**'
      - 'pyproject.toml'
      - '.github/workflows/live-scan.yml'
      - 'data/manual-watchlist.json'
      - 'data/cex-identity-registry.json'

permissions:
  contents: write

# Keep Live Scan from being starved by unrelated publishers. Overlapping writes
# remain fail-closed: the fast publisher skips stale work when main moves, while
# the final verified publisher fetches/rebases and aborts on any data conflict.
concurrency:
  group: wallet500-live-scan-publisher
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -e . pytest
      - name: Test mature age, identity, health and production truth contracts
        run: >-
          python -m pytest -q
          tests/test_mature_age_gate.py
          tests/test_cex_identity_preflight.py
          tests/test_cex_identity.py
          tests/test_telegram_exact_pair.py
          tests/test_real_alerts.py
          tests/test_system_health.py
          tests/test_production_status.py
          tests/test_hot_email_alerts.py

      - name: Refresh fast veteran CEX identity lane
        env:
          COINGECKO_DEMO_API_KEY: ${{ secrets.COINGECKO_DEMO_API_KEY }}
        run: python -m wallet500.cex_fast_lane

      - name: Publish fast CEX identity and REAL ALERT feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # A concurrent research/data writer can legitimately move main while this
          # scan is running. Never rebase a generated fast-feed commit over newer
          # versions of the same truth files: that creates content conflicts and can
          # abort the entire live scan. If main moved, keep the generated files in
          # this workspace for downstream validation and simply skip the stale early
          # publish. The final verified publisher remains fail-closed.
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "Fast publish skipped safely: main moved during scan; retaining local fast-lane outputs for full validation"
          else
            git add data/cex-revival-radar.json data/cex-learning.json data/real-alerts.json || true
            git add data/cex-state.json data/cex-state.json.gz 2>/dev/null || true
            if git diff --cached --quiet; then
              echo "No fast-lane data changes"
            else
              git commit -m "data: refresh fast veteran CEX identity feed"
              for attempt in 1 2 3; do
                if git push origin HEAD:main; then
                  break
                fi
                # Do not merge/rebase generated truth files after a push race.
                # A newer main is authoritative; retain local outputs for the full
                # validation lane and let the final publisher resolve freshness.
                git fetch origin main
                if [ "$(git rev-parse HEAD^)" != "$(git rev-parse origin/main)" ]; then
                  echo "Fast publish superseded by newer main; continuing without overwriting newer truth data"
                  git reset --soft HEAD^
                  break
                fi
                if [ "$attempt" -eq 3 ]; then
                  echo "Fast publish failed after 3 attempts"
                  exit 1
                fi
                sleep $((attempt * 2))
              done
            fi
          fi

      - name: Ingest 6h external signal cohort
        continue-on-error: true
        run: python -m wallet500.external_signal_cohort
      - name: Track CryptoYeezus direct wallet 1pct shadow lane
        continue-on-error: true
        env:
          COPY_LIVE_ENABLED: 'false'
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
          JUPITER_API_KEY: ${{ secrets.JUPITER_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -m pytest -q tests/test_cryptoyeezus_copy.py tests/test_cryptoyeezus_verified_monitor.py
          python -m wallet500.cryptoyeezus_verified_monitor

      - name: Run veteran revival intelligence scan
        env:
          WALLET500_CEX_PRECOMPUTED: '1'
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=30s 12m python -m wallet500.orchestrator

      - name: Reconfirm provider-resilient exact CEX identity
        env:
          COINGECKO_DEMO_API_KEY: ${{ secrets.COINGECKO_DEMO_API_KEY }}
        run: python -m wallet500.cex_fast_lane
      - name: Apply universal live survival gate
        run: python -m wallet500.fresh_solana_gate
      - name: Revalidate immutable exact pairs
        run: python -m wallet500.exact_pair_survival
      - name: Enforce evidence-governed production age policy on final active DEX lane
        run: python -m wallet500.production_age_governance
      - name: Refresh immutable performance exact-pair marks
        run: python -m wallet500.performance_tracker
      - name: Refresh current tradability truth
        run: python -m wallet500.realizable_performance
      - name: Update isolated external-only $44 paper cohort
        run: python -m wallet500.external_only_paper
      - name: Run parallel 6h shadow experiment lab
        run: python -m wallet500.six_hour_experiment_lab
      - name: Apply production liquidity hardening gate
        run: python -m wallet500.production_risk_gate
      - name: Enrich verified EVM deployment blocks on-chain
        run: python -m wallet500.evm_deployment_enrichment
      - name: Gather pre-production wallet evidence
        continue-on-error: true
        run: python -m wallet500.wallet_candidate_discovery
      - name: Analyze holder and cluster risk on exact active pairs
        run: python -m wallet500.holder_cluster_gate
      - name: Apply fail-closed holder cluster production gate
        run: python -m wallet500.holder_cluster_production_gate
      - name: Run four-arm Survival Alpha experiment
        run: python -m wallet500.experiment_matrix_v2
      - name: Reconcile immutable $100 paper portfolio
        run: python -m wallet500.paper_portfolio
      - name: Run Decision Engine V1 shadow state machine
        run: python -m wallet500.decision_engine_v1
      - name: Preserve rejected and quarantined candidates for learning
        run: python -m wallet500.rejected_candidate_learning
      - name: Track rejected outcomes and false negatives
        run: python -m wallet500.rejected_outcome_tracker
      - name: Generate evidence-based filter tuning advice
        run: python -m wallet500.filter_tuning_advisor
      - name: Capture immutable qualified evidence
        run: python -m wallet500.evidence_capture
      - name: Build fail-closed unified REAL ALERT feed
        run: python -m wallet500.real_alerts
      - name: Send gated Telegram alerts
        run: python -m wallet500.telegram_alerts
      - name: Send HOT email alerts
        continue-on-error: true
        env:
          HOT_ALERT_EMAIL_TO: bitcoinforu2@gmail.com
          HOT_ALERT_SMTP_USER: bitcoinforu2@gmail.com
          HOT_ALERT_SMTP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python -m wallet500.hot_email_alerts
      - name: Assess explicit system health
        run: python -m wallet500.system_health
      - name: Record scheduler telemetry
        continue-on-error: true
        run: python -m wallet500.scheduler_telemetry
      - name: Validate primary live lane and learning integrity
        run: python -m wallet500.strict_validation
      - name: Build canonical production operator status
        run: python -m wallet500.production_status
      - name: Prepare immutable publish evidence
        env:
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          payload={
            'version':1,
            'created_at':datetime.now(timezone.utc).isoformat(),
            'status':'READY_TO_PUBLISH',
            'strict_validation':'PASS',
            'source_sha':os.environ.get('SOURCE_SHA'),
            'run_id':os.environ.get('RUN_ID'),
            'run_attempt':os.environ.get('RUN_ATTEMPT'),
            'proof_rule':'IF_THIS_FILE_IS_VISIBLE_ON_MAIN_THE_VALIDATED_DATA_COMMIT_WAS_PUSHED_SUCCESSFULLY'
          }
          Path('data/publish-evidence.json').write_text(json.dumps(payload,indent=2),encoding='utf-8')
          PY
      - name: Publish verified scan data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "data: refresh verified live scan"
            for attempt in 1 2 3; do
              echo "Publish attempt ${attempt}/3"
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort || true
                echo "Publish stopped fail-closed: data rebase conflict"
                exit 1
              fi
              if git push origin HEAD:main; then
                exit 0
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "Publish failed after 3 race-safe attempts"
                exit 1
              fi
              sleep $((attempt * 2))
            done
          fi