name: Wallet500 Multi-Chain Live Scan

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'pyproject.toml'
      - '.github/workflows/live-scan.yml'
      - 'data/manual-watchlist.json'
  schedule:
    - cron: '2,12,22,32,42,52 * * * *'

permissions:
  contents: write

concurrency:
  group: wallet500-live-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -e .
      - name: Run revival-first intelligence scan
        env:
          PYTHONUNBUFFERED: '1'
        run: python -m wallet500.orchestrator
      - name: Apply fresh Solana survival gate
        run: python -m wallet500.fresh_solana_gate
      - name: Record scheduler telemetry
        env:
          W500_EVENT: ${{ github.event_name }}
          W500_RUN_ID: ${{ github.run_id }}
          W500_WORKFLOW: PRIMARY
          W500_SCHEDULE: ${{ github.event.schedule }}
        run: |
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          p=Path('data/scheduler-health.json')
          try: d=json.loads(p.read_text()) if p.exists() else {}
          except Exception: d={}
          h=d.get('history') if isinstance(d.get('history'),list) else []
          now=datetime.now(timezone.utc).isoformat()
          row={'at':now,'workflow':os.getenv('W500_WORKFLOW'),'event':os.getenv('W500_EVENT'),'run_id':os.getenv('W500_RUN_ID'),'schedule':os.getenv('W500_SCHEDULE') or None}
          h.append(row); h=h[-100:]
          d={'updated_at':now,'last':row,'history':h}
          p.write_text(json.dumps(d,indent=2))
          PY
      - name: Validate primary revival lane and report degraded research lanes
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          p=Path('data/run-summary.json')
          if not p.exists(): raise SystemExit('FATAL: run-summary.json missing')
          d=json.loads(p.read_text()); ts=datetime.fromisoformat(d['updated_at']); age=(datetime.now(timezone.utc)-ts).total_seconds()
          if age>300: raise SystemExit(f'FATAL: stale scan output ({age:.0f}s old)')
          cpath=Path('data/cex-revival-radar.json')
          if not cpath.exists(): raise SystemExit('FATAL: CEX revival radar missing')
          c=json.loads(cpath.read_text())
          if c.get('contracts_seen',0)<=0: raise SystemExit('FATAL: CEX radar empty')
          if c.get('healthy_sources',0)<2: raise SystemExit('FATAL: fewer than 2 healthy CEX sources')
          for required in ('data/cex-state.json','data/cex-learning.json','data/time-machine-replay.json','data/fresh-solana-survival.json','data/active-qualified-candidates.json','data/scheduler-health.json'):
              if not Path(required).exists(): raise SystemExit('FATAL: missing '+required)
          counts=d.get('counts',{})
          degraded=[chain for chain in ('solana','ethereum','bsc') if int((counts.get(chain) or {}).get('discovered',0))<=0]
          lane=(d.get('lane_health') or {}).get('new_token_lab','UNKNOWN')
          if degraded or lane!='HEALTHY':
              print('WARNING: research lane degraded; primary revival publish continues:',degraded,(d.get('lane_health') or {}).get('new_token_error'))
          print('HEALTHY PRIMARY REVIVAL:',d['updated_at'],'CEX sources',c['healthy_sources'],'contracts',c['contracts_seen'],'symbols',c.get('symbols_seen',0),'alerts',c['alerts_count'])
          print('FRESH SOLANA:', 'quality', d.get('quality_gate_qualified',d.get('qualified',0)), 'active', d.get('active_qualified',0), 'pending', d.get('fresh_solana_pending',0), 'failed', d.get('fresh_solana_failed',0))
          PY
      - name: Publish verified scan data
        run: |
          set -euo pipefail
          git config user.name 'wallet500-bot'
          git config user.email 'wallet500-bot@users.noreply.github.com'
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m 'data: refresh verified revival intelligence'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git merge --no-edit -X ours origin/main
            if git push origin HEAD:main; then exit 0; fi
            echo "Push raced with main; retrying publish (attempt $attempt)"
          done
          echo 'FATAL: failed to publish scan data after retries'
          exit 1
