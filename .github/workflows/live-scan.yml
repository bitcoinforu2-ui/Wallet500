name: Wallet500 Multi-Chain Live Scan

on:
  workflow_dispatch:
  schedule:
    - cron: '6,21,36,51 * * * *'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'pyproject.toml'
      - '.github/workflows/live-scan.yml'
      - 'data/manual-watchlist.json'

permissions:
  contents: write

concurrency:
  group: wallet500-live-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -e .
      - name: Run revival-first intelligence scan
        env:
          PYTHONUNBUFFERED: '1'
        run: python -m wallet500.orchestrator
      - name: Apply universal live survival gate
        run: python -m wallet500.fresh_solana_gate
      - name: Capture immutable qualified evidence
        run: python -m wallet500.evidence_capture
      - name: Send gated Telegram alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m wallet500.telegram_alerts
      - name: Extract verified Solana wallet candidates
        continue-on-error: true
        run: python -m wallet500.wallet_candidate_discovery
      - name: Record scheduler telemetry
        env:
          W500_EVENT: ${{ github.event_name }}
          W500_RUN_ID: ${{ github.run_id }}
          W500_WORKFLOW: PRIMARY_15M_LIVE
          W500_SCHEDULE: ${{ github.event.schedule }}
        run: |
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          p=Path('data/scheduler-health.json')
          try: d=json.loads(p.read_text()) if p.exists() else {}
          except Exception: d={}
          h=d.get('history') if isinstance(d.get('history'),list) else []
          now=datetime.now(timezone.utc).isoformat()
          row={'at':now,'workflow':os.getenv('W500_WORKFLOW'),'event':os.getenv('W500_EVENT'),'run_id':os.getenv('W500_RUN_ID'),'schedule':os.getenv('W500_SCHEDULE') or None}
          h.append(row); h=h[-200:]
          p.write_text(json.dumps({'updated_at':now,'last':row,'history':h},indent=2))
          PY
      - name: Validate primary revival lane and report degraded research lanes
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          p=Path('data/run-summary.json')
          if not p.exists(): raise SystemExit('FATAL: run-summary.json missing')
          d=json.loads(p.read_text()); ts=datetime.fromisoformat(d['updated_at']); age=(datetime.now(timezone.utc)-ts).total_seconds()
          if age>300: raise SystemExit(f'FATAL: stale scan output ({age:.0f}s old)')
          cpath=Path('data/cex-revival-radar.json')
          if not cpath.exists(): raise SystemExit('FATAL: CEX revival radar missing')
          c=json.loads(cpath.read_text())
          if c.get('contracts_seen',0)<=0: raise SystemExit('FATAL: CEX radar empty')
          if c.get('healthy_sources',0)<2: raise SystemExit('FATAL: fewer than 2 healthy CEX sources')
          for required in ('data/cex-state.json','data/cex-learning.json','data/time-machine-replay.json','data/fresh-solana-survival.json','data/active-qualified-candidates.json','data/discovery-evidence-ledger.json','data/scheduler-health.json','data/telegram-alert-report.json'):
              if not Path(required).exists(): raise SystemExit('FATAL: missing '+required)
          wp=Path('data/wallet-candidates.json')
          if wp.exists():
              w=json.loads(wp.read_text())
              print('WALLET FORENSICS:',w.get('verified_wallet_candidates',0),'verified candidates; EVM deferred',w.get('evm_candidates_deferred',0))
          else:
              print('DEGRADED RESEARCH LANE: wallet-candidates.json missing; primary lane remains healthy')
          ap=Path('data/telegram-alert-report.json')
          a=json.loads(ap.read_text())
          print('TELEGRAM ALERTS: configured',a.get('configured'),'eligible',a.get('eligible_count',0),'delivered',a.get('delivered_count',0),'errors',a.get('error_count',0))
          print('HEALTHY LIVE SCAN:',d['updated_at'],'active',d.get('active_qualified',0),'pending',d.get('live_survival_pending',0),'failed',d.get('live_survival_failed',0))
          PY
      - name: Publish verified scan data
        run: |
          set -euo pipefail
          git config user.name 'wallet500-bot'
          git config user.email 'wallet500-bot@users.noreply.github.com'
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m 'data: refresh verified intelligence'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git merge --no-edit -X ours origin/main
            if git push origin HEAD:main; then exit 0; fi
            echo "Push raced with main; retrying publish (attempt $attempt)"
            sleep 3
          done
          echo 'FATAL: failed to publish scan data after retries'
          exit 1
