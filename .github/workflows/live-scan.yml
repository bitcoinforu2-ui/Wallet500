name: Wallet500 Multi-Chain Live Scan
# operational heartbeat: truthful live data only

on:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'pyproject.toml'
      - '.github/workflows/live-scan.yml'
      - 'data/manual-watchlist.json'

permissions:
  contents: write

concurrency:
  group: wallet500-live-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -e .
      - name: Capture Moonshot launchpad discovery feed
        continue-on-error: true
        run: python -m wallet500.moonshot_radar
      - name: Run revival-first intelligence scan
        env:
          PYTHONUNBUFFERED: '1'
          BIRDEYE_API_KEY: ${{ secrets.BIRDEYE_API_KEY }}
        run: python -m wallet500.orchestrator
      - name: Apply universal live survival gate
        run: python -m wallet500.fresh_solana_gate
      - name: Revalidate immutable exact pairs
        run: python -m wallet500.exact_pair_survival
      - name: Refresh immutable performance exact-pair marks
        run: python -m wallet500.performance_tracker
      - name: Refresh current tradability truth
        run: python -m wallet500.realizable_performance
      - name: Apply production liquidity hardening gate
        run: python -m wallet500.production_risk_gate
      - name: Enrich verified EVM deployment blocks on-chain
        env:
          ETH_RPC_URL: ${{ secrets.ETH_RPC_URL }}
          BSC_RPC_URL: ${{ secrets.BSC_RPC_URL }}
          BSC_RPC_FALLBACK_URLS: https://bsc.drpc.org,https://rpc.nodeflare.app/bnb/public
        run: python -m wallet500.evm_deployment_enrichment
      - name: Analyze holder and cluster risk on exact active pairs
        env:
          HOLDER_CLUSTER_INPUT: active-qualified-candidates.json
          ETH_RPC_URL: ${{ secrets.ETH_RPC_URL }}
          BSC_RPC_URL: ${{ secrets.BSC_RPC_URL }}
          BSC_RPC_FALLBACK_URLS: https://bsc.drpc.org,https://rpc.nodeflare.app/bnb/public
        run: python -m wallet500.holder_cluster_gate
      - name: Apply fail-closed holder cluster production gate
        run: python -m wallet500.holder_cluster_production_gate
      - name: Reconcile immutable $100 paper portfolio
        run: python -m wallet500.paper_portfolio
      - name: Preserve rejected and quarantined candidates for learning
        run: python -m wallet500.rejected_candidate_learning
      - name: Track rejected outcomes and false negatives
        run: python -m wallet500.rejected_outcome_tracker
      - name: Generate evidence-based filter tuning advice
        run: python -m wallet500.filter_tuning_advisor
      - name: Capture immutable qualified evidence
        env:
          WALLET500_EVIDENCE_INPUT: holder-cluster-production-qualified.json
        run: python -m wallet500.evidence_capture
      - name: Send gated Telegram alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WALLET500_ALERT_INPUT: holder-cluster-production-qualified.json
        run: python -m wallet500.telegram_alerts
      - name: Fast wallet-forensics heartbeat
        continue-on-error: true
        env:
          WALLET500_FORENSICS_MAX_TOKENS: '1'
          WALLET500_FORENSICS_SIGNATURES: '5'
          WALLET500_FORENSICS_UPDATE_RUN_SUMMARY: '1'
        run: python -m wallet500.wallet_candidate_discovery
      - name: Assess explicit system health
        run: python -m wallet500.system_health
      - name: Record scheduler telemetry
        env:
          W500_EVENT: ${{ github.event_name }}
          W500_RUN_ID: ${{ github.run_id }}
          W500_WORKFLOW: PRIMARY_15M_LIVE
          W500_SCHEDULE: ${{ github.event.schedule }}
        run: |
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          p=Path('data/scheduler-health.json')
          try: d=json.loads(p.read_text()) if p.exists() else {}
          except Exception: d={}
          h=d.get('history') if isinstance(d.get('history'),list) else []
          now=datetime.now(timezone.utc).isoformat()
          row={'at':now,'workflow':os.getenv('W500_WORKFLOW'),'event':os.getenv('W500_EVENT'),'run_id':os.getenv('W500_RUN_ID'),'schedule':os.getenv('W500_SCHEDULE') or None}
          h.append(row); h=h[-200:]
          p.write_text(json.dumps({'updated_at':now,'last':row,'history':h},indent=2))
          PY
      - name: Validate primary live lane and learning integrity
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          p=Path('data/run-summary.json')
          if not p.exists(): raise SystemExit('FATAL: run-summary.json missing')
          d=json.loads(p.read_text()); ts=datetime.fromisoformat(d['updated_at']); age=(datetime.now(timezone.utc)-ts).total_seconds()
          if age>300: raise SystemExit(f'FATAL: stale scan output ({age:.0f}s old)')
          cpath=Path('data/cex-revival-radar.json')
          if not cpath.exists(): raise SystemExit('FATAL: CEX revival radar missing')
          c=json.loads(cpath.read_text())
          if c.get('contracts_seen',0)<=0: raise SystemExit('FATAL: CEX radar empty')
          if c.get('healthy_sources',0)<2: raise SystemExit('FATAL: fewer than 2 healthy CEX sources')
          required=('data/cex-state.json','data/cex-learning.json','data/time-machine-replay.json','data/fresh-solana-survival.json','data/active-qualified-candidates.json','data/discovery-evidence-ledger.json','data/scheduler-health.json','data/telegram-alert-report.json','data/production-risk-evaluations.json','data/production-risk-blocked.json','data/exact-pair-survival-report.json','data/holder-cluster-gate.json','data/holder-cluster-production-qualified.json','data/holder-cluster-quarantine.json','data/holder-cluster-production-blocked.json','data/holder-cluster-production-report.json','data/paper-portfolio-ledger.json','data/paper-portfolio-summary.json','data/rejected-candidate-ledger.json','data/rejected-candidate-learning-summary.json','data/rejected-outcome-report.json','data/rejected-filter-attribution.json','data/filter-tuning-advisor.json','data/system-health.json','data/realizable-performance.json','data/realizable-performance-summary.json')
          for name in required:
              if not Path(name).exists() or Path(name).stat().st_size == 0: raise SystemExit('FATAL: missing/empty '+name)
          perf=json.loads(Path('data/realizable-performance.json').read_text())
          pts=datetime.fromisoformat(perf['updated_at']); page=(datetime.now(timezone.utc)-pts).total_seconds()
          if page>300: raise SystemExit(f'FATAL: stale performance truth ({page:.0f}s old)')
          for row in perf.get('plausible_rows') or []:
              if float(row.get('liquidity_usd') or 0) < 50000: raise SystemExit('FATAL: sub-$50K pair reached tradable performance display')
              if row.get('current_status') != 'CURRENTLY_TRADABLE': raise SystemExit('FATAL: blocked pair reached tradable performance display')
          hreport=json.loads(Path('data/holder-cluster-production-report.json').read_text())
          if hreport.get('mode')!='PRODUCTION_FAIL_CLOSED': raise SystemExit('FATAL: holder cluster gate not fail-closed')
          promoted=json.loads(Path('data/holder-cluster-production-qualified.json').read_text())
          for row in promoted:
              if row.get('holder_cluster_production_status')!='PASS' or row.get('holder_cluster_verification_complete') is not True: raise SystemExit('FATAL: unsafe holder/cluster candidate reached downstream')
          portfolio=json.loads(Path('data/paper-portfolio-summary.json').read_text())
          if portfolio.get('mode')!='PAPER_ONLY_NO_REAL_MONEY': raise SystemExit('FATAL: portfolio mode is not paper-only')
          if float(portfolio.get('position_size_usd',0))!=1.0: raise SystemExit('FATAL: portfolio position size changed')
          ap=json.loads(Path('data/telegram-alert-report.json').read_text())
          if (ap.get('policy') or {}).get('source')!='holder-cluster-production-qualified.json': raise SystemExit('FATAL: Telegram bypasses holder cluster production gate')
          ev=json.loads(Path('data/discovery-evidence-ledger.json').read_text())
          if ev.get('source')!='holder-cluster-production-qualified.json': raise SystemExit('FATAL: evidence capture bypasses holder cluster production gate')
          reject=json.loads(Path('data/rejected-outcome-report.json').read_text())
          if reject.get('records',0) < reject.get('false_negative_winners',0): raise SystemExit('FATAL: invalid false-negative accounting')
          tune=json.loads(Path('data/filter-tuning-advisor.json').read_text())
          if tune.get('mode')!='RESEARCH_ADVISORY_ONLY' or tune.get('production_thresholds_modified') is not False: raise SystemExit('FATAL: tuning advisor may not mutate production')
          health=json.loads(Path('data/system-health.json').read_text())
          if health.get('overall')=='FAILED': raise SystemExit('FATAL: system health failed: '+str(health.get('checks')))
          print('SYSTEM HEALTH:',health.get('overall'))
          print('PAPER PORTFOLIO:','$'+str(portfolio.get('total_equity_usd')),'open',portfolio.get('open_positions'),'closed',portfolio.get('closed_positions'),'pnl',portfolio.get('total_pnl_usd'))
          print('PERFORMANCE TRUTH:',perf.get('updated_at'),'tradable',perf.get('currently_tradable_count'),'blocked',perf.get('not_realizable_now_count'))
          print('HEALTHY LIVE SCAN:',d['updated_at'],'active',d.get('active_qualified',0),'pending',d.get('live_survival_pending',0),'failed',d.get('live_survival_failed',0))
          PY
      - name: Publish verified scan data
        run: |
          set -euo pipefail
          git config user.name 'wallet500-bot'
          git config user.email 'wallet500-bot@users.noreply.github.com'
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh verified intelligence'
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git merge --no-edit -X ours origin/main
              if git push origin HEAD:main; then break; fi
              sleep 3
              if [ "$attempt" = 5 ]; then exit 1; fi
            done
          fi
