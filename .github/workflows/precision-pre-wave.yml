name: Wallet500 Precision PRE-WAVE

on:
  workflow_dispatch:
  schedule:
    - cron: '1,6,11,16,21,26,31,36,41,46,51,56 * * * *'
  push:
    branches: [main]
    paths:
      - 'src/wallet500/precision_pre_wave.py'
      - 'src/wallet500/precision_pre_wave_telegram.py'
      - 'tests/test_precision_pre_wave.py'
      - '.github/workflows/precision-pre-wave.yml'

permissions:
  contents: write

concurrency:
  group: wallet500-precision-prewave
  cancel-in-progress: false

jobs:
  precision-prewave:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install and test precision PRE-WAVE
        run: |
          pip install -e . pytest
          python -m pytest -q tests/test_precision_pre_wave.py
      - name: Recompute from newest main truth and deliver eligible alerts
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          git config user.name "wallet500-precision-prewave"
          git config user.email "wallet500-precision-prewave@users.noreply.github.com"
          git fetch --no-tags --depth=1 origin main
          git reset --hard origin/main
          source_sha="$(git rev-parse HEAD)"
          python -m wallet500.precision_pre_wave
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('data/precision-pre-wave.json').read_text())
          if d.get('mode')!='MANUAL_REVIEW_PRECISION_PRE_WAVE_6OF7_V1': raise SystemExit('PRECISION_PREWAVE_MODE_DRIFT')
          t=d.get('truth_contract') or {}
          if t.get('real_alert_gate_unchanged') is not True or t.get('real_alert_still_requires_7_of_7') is not True: raise SystemExit('PRECISION_PREWAVE_REAL_GATE_LEAK')
          if t.get('only_missing_gate')!='STRONG_DECISION_LANE' or t.get('only_allowed_blocker')!='NO_STRONG_DECISION_LANE': raise SystemExit('PRECISION_PREWAVE_SCOPE_DRIFT')
          if t.get('late_candidates_never_user_alert') is not True or t.get('no_automatic_buy') is not True or t.get('no_automatic_trade') is not True: raise SystemExit('PRECISION_PREWAVE_ACTION_LEAK')
          for row in d.get('candidates') or []:
              if row.get('readiness')!='6/7' or row.get('manual_review_only') is not True: raise SystemExit('PRECISION_PREWAVE_ROW_SCOPE_LEAK')
              if row.get('automatic_buy') is not False or row.get('automatic_trade') is not False: raise SystemExit('PRECISION_PREWAVE_ROW_ACTION_LEAK')
              if row.get('timing')=='LATE_DO_NOT_CHASE' and row.get('user_alert_eligible') is not False: raise SystemExit('PRECISION_PREWAVE_LATE_ALERT_LEAK')
          print('PRECISION_PREWAVE_OK', d.get('candidate_count'), d.get('user_alert_eligible_count'))
          PY
          python -m wallet500.precision_pre_wave_telegram
          files=(data/precision-pre-wave.json)
          if [ -f data/precision-pre-wave-telegram-state.json ]; then files+=(data/precision-pre-wave-telegram-state.json); fi
          if [ -f data/precision-pre-wave-telegram-report.json ]; then files+=(data/precision-pre-wave-telegram-report.json); fi
          python scripts/atomic_publish.py \
            --github-api-cas \
            --base "$source_sha" \
            --message 'alerts: refresh precision pre-wave' \
            "${files[@]}"
