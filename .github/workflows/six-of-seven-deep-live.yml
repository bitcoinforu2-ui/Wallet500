name: Wallet500 6-of-7 Deep Live Intelligence

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Wallet500 Multi-Chain Live Scan"]
    types: [completed]
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: wallet500-live-scan-publisher
  cancel-in-progress: false

jobs:
  deep-live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -e . pytest

      - name: Validate 6-of-7 war-room contracts
        run: >-
          python -m pytest -q
          tests/test_six_of_seven_live_intelligence.py
          tests/test_deep_intelligence_edge.py
          tests/test_pre_catalyst_fingerprint.py
          tests/test_research_decision_engine.py
          tests/test_moonshot_future_listing_watch.py
          tests/test_moonshot_verification_watch.py

      - name: Detect current verified 6-of-7 veteran candidates
        id: detect
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          from wallet500.six_of_seven_live_intelligence import select_six_of_seven
          p=Path('data/real-alerts.json')
          real=json.loads(p.read_text()) if p.exists() else {}
          rows=select_six_of_seven(real)
          print(f"count={len(rows)}")
          print("symbols=" + ",".join(str(x.get('symbol') or '?') for x in rows))
          PY

      - name: Refresh fast listing and promotion intelligence
        if: steps.detect.outputs.count != '0'
        continue-on-error: true
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: |
          python -m wallet500.moonshot_verification_watch
          python -m wallet500.moonshot_future_listing_watch

      - name: Deep-search live social news and public-index intelligence
        if: steps.detect.outputs.count != '0'
        env:
          SOCIAL_SCAN_BUDGET: '8'
          MESH_PUBLIC_INDEX_SLOTS: '8'
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          NEYNAR_API_KEY: ${{ secrets.NEYNAR_API_KEY }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_IDS: ${{ secrets.DISCORD_GUILD_IDS }}
          DISCORD_CHANNEL_IDS: ${{ secrets.DISCORD_CHANNEL_IDS }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          BSKY_IDENTIFIER: ${{ secrets.BSKY_IDENTIFIER }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
        run: python -m wallet500.six_of_seven_live_intelligence

      - name: Recompute organic acceleration and social intelligence
        if: steps.detect.outputs.count != '0'
        run: |
          python -m wallet500.social_organic_acceleration
          python -m wallet500.social_intelligence_v2

      - name: Build explainable EDGE SCORE and immutable micro-event ledger
        if: steps.detect.outputs.count != '0'
        run: python -m wallet500.deep_intelligence_edge

      - name: Build forward-only pre-catalyst fingerprints
        if: steps.detect.outputs.count != '0'
        run: python -m wallet500.pre_catalyst_fingerprint

      - name: Rebuild evidence and alert decision after deep live intelligence
        if: steps.detect.outputs.count != '0'
        run: |
          python -m wallet500.candidate_evidence_envelope
          python -m wallet500.signal_intelligence
          python -m wallet500.real_alerts
          python -m wallet500.signal_alert_guard
          python -m wallet500.revival_funnel_diagnostics
          python -m wallet500.near_alert_observatory
          python -m wallet500.research_decision_engine

      - name: Assert war room cannot bypass hard truth gates
        if: steps.detect.outputs.count != '0'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          deep=json.loads(Path('data/six-of-seven-live-intelligence.json').read_text())
          edge=json.loads(Path('data/deep-intelligence-edge.json').read_text())
          pre=json.loads(Path('data/pre-catalyst-fingerprints.json').read_text())
          real=json.loads(Path('data/real-alerts.json').read_text())
          assert deep.get('production_effect') is False
          assert deep.get('automatic_buy') is False
          truth=deep.get('truth_contract') or {}
          assert truth.get('exact_token_and_pair_required') is True
          assert truth.get('symbol_or_name_only_context_never_promotes_gate') is True
          et=edge.get('truth_contract') or {}
          assert et.get('edge_score_is_not_profit_probability') is True
          assert et.get('edge_score_never_bypasses_hard_gates') is True
          assert et.get('symbol_name_only_never_counts_as_exact_evidence') is True
          assert et.get('production_effect') is False
          pt=pre.get('truth_contract') or {}
          assert pt.get('forward_only') is True
          assert pt.get('no_hindsight') is True
          assert pt.get('production_effect') is False
          rt=real.get('truth_contract') or {}
          assert rt.get('exact_onchain_identity_required') is True
          assert rt.get('exact_dex_pair_required') is True
          print('DEEP_INTELLIGENCE_FAIL_CLOSED_OK', {
              'candidates':deep.get('candidate_count'),
              'high_edge':edge.get('high_priority_count'),
              'extreme_edge':edge.get('extreme_edge_count'),
              'new_micro_events':edge.get('new_micro_events'),
              'fingerprints':pre.get('candidate_count'),
              'real_alerts':(real.get('counts') or {}).get('real_alerts')})
          PY

      - name: Publish only changed war-room derived data
        if: steps.detect.outputs.count != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/six-of-seven-live-intelligence.json \
            data/deep-intelligence-edge.json \
            data/deep-intelligence-event-ledger.json \
            data/pre-catalyst-fingerprints.json \
            data/pre-catalyst-fingerprint-registry.json \
            data/social-source-scan.json \
            data/social-catalyst-ledger.json \
            data/social-identity-cache.json \
            data/social-organic-acceleration.json \
            data/social-intelligence-v2.json \
            data/moonshot-verification-latest.json \
            data/moonshot-verification-ledger.json \
            data/moonshot-future-listing-latest.json \
            data/moonshot-future-listing-ledger.json \
            data/candidate-evidence-envelope.json \
            data/signal-intelligence.json \
            data/real-alerts.json \
            data/revival-funnel-diagnostics.json \
            data/near-alert-observatory.json \
            data/research-decision-engine.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No meaningful deep-live data changes"
            exit 0
          fi
          git commit -m "data: refresh 6-of-7 intelligence war room"
          # Some scanners intentionally refresh additional local research/cache files
          # that are not part of this publisher's immutable output contract. Keep those
          # residues out of the commit while making the worktree clean enough to rebase.
          if [ -n "$(git status --porcelain)" ]; then
            git stash push --include-untracked -m "deep-live-unpublished-residue"
          fi
          git pull --rebase origin main
          git push origin HEAD:main
