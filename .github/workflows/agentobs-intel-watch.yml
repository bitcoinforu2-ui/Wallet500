name: Wallet500 Agent OBS Intelligence Watch

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  pull_request:
    paths:
      - 'src/wallet500/agentobs_intel_watch.py'
      - 'tests/test_agentobs_intel_watch.py'
      - '.github/workflows/agentobs-intel-watch.yml'
      - 'scripts/serialized_publish.py'
  push:
    branches: [main]
    paths:
      - 'src/wallet500/agentobs_intel_watch.py'
      - 'tests/test_agentobs_intel_watch.py'
      - '.github/workflows/agentobs-intel-watch.yml'
      - 'scripts/serialized_publish.py'

permissions:
  contents: write

concurrency:
  group: wallet500-agentobs-intel-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: pip install -e . pytest

      - name: Unit tests
        run: python -m pytest -q tests/test_agentobs_intel_watch.py

      - name: Poll canonical Agent OBS X account
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          TELEGRAM_BOT_TOKEN: ''
          TELEGRAM_CHAT_ID: ''
        run: python -m wallet500.agentobs_intel_watch

      - name: Validate source freshness and author lock
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('data/agentobs-intel-latest.json').read_text())
          src=p.get('provider') or {}
          status=str(src.get('status') or '')
          if not status:
              raise SystemExit('AGENTOBS_X_STATUS_MISSING')
          if status == 'NO_QUERY_IDENTITY':
              raise SystemExit('AGENTOBS_X_QUERY_NOT_LOCKED')
          if p.get('production_trade_impact') != 'NONE':
              raise SystemExit('AGENTOBS_MUST_REMAIN_RESEARCH_ONLY')
          print('AGENTOBS_SOURCE_CHECK', status, src.get('count_after_author_lock'))
          PY

      - name: Persist forward-only intelligence state
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git restore --worktree -- src/wallet500.egg-info || true
          python scripts/serialized_publish.py \
            --github-api-cas \
            --attempts 80 \
            --message 'Update Agent OBS intelligence state' \
            data/agentobs-intel-state.json \
            data/agentobs-intel-events.json \
            data/agentobs-intel-latest.json
          echo 'AGENTOBS_STATE_PUBLISH_OK'
