name: Wallet500 CryptoYeezus Source Wallet Watch

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  pull_request:
    paths:
      - 'src/wallet500/cryptoyeezus_source_wallet_watch.py'
      - 'tests/test_cryptoyeezus_source_wallet_watch.py'
      - '.github/workflows/cryptoyeezus-source-wallet-watch.yml'
      - 'scripts/serialized_publish.py'
  push:
    branches: [main]
    paths:
      - 'src/wallet500/cryptoyeezus_source_wallet_watch.py'
      - 'tests/test_cryptoyeezus_source_wallet_watch.py'
      - '.github/workflows/cryptoyeezus-source-wallet-watch.yml'
      - 'scripts/serialized_publish.py'

permissions:
  contents: write

concurrency:
  group: wallet500-cryptoyeezus-source-wallet-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -e . pytest
      - name: Unit tests
        run: python -m pytest -q tests/test_cryptoyeezus_source_wallet_watch.py
      - name: Run forward-only verified swap watcher
        if: github.event_name != 'pull_request'
        env:
          SOLANA_RPC_URL: https://api.mainnet-beta.solana.com
          TELEGRAM_BOT_TOKEN: ''
          TELEGRAM_CHAT_ID: ''
        run: python -m wallet500.cryptoyeezus_source_wallet_watch
      - name: Validate source-wallet truth contract
        if: github.event_name != 'pull_request'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('data/cryptoyeezus-source-wallet-latest.json').read_text())
          s=json.loads(Path('data/cryptoyeezus-source-wallet-state.json').read_text())
          if p.get('wallet')!='JCxTzSXz1f8s3UEtYQzaDdBDWneaD6yo1cX38RBf6Rjd': raise SystemExit('SOURCE_WALLET_IDENTITY_DRIFT')
          if p.get('simulation_only') is not True: raise SystemExit('SOURCE_WALLET_SIMULATION_GUARD_MISSING')
          if not str(s.get('cursor') or '').strip(): raise SystemExit('SOURCE_WALLET_BASELINE_CURSOR_MISSING')
          for e in p.get('events') or []:
              if e.get('verification')!='SIGNED_WALLET_TWO_SIDED_BALANCE_DELTA_PLUS_DEX_SWAP_EVIDENCE': raise SystemExit('UNVERIFIED_SOURCE_WALLET_EVENT')
              if e.get('real_trade_claimed') is not False: raise SystemExit('REAL_TRADE_FALSE_CLAIM')
              if not e.get('signature') or not e.get('token_mint'): raise SystemExit('SOURCE_WALLET_IDENTITY_INCOMPLETE')
          print('SOURCE_WALLET_TRUTH_OK', p.get('status'), p.get('new_verified_swaps'), 'cursor', str(s.get('cursor'))[:12])
          PY
      - name: Publish forward-only source-wallet state
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git restore --worktree -- src/wallet500.egg-info || true
          python scripts/serialized_publish.py \
            --github-api-cas \
            --attempts 80 \
            --message 'data: update CryptoYeezus source wallet state' \
            data/cryptoyeezus-source-wallet-state.json \
            data/cryptoyeezus-source-wallet-latest.json \
            data/cryptoyeezus-source-wallet-events.json
          echo 'SOURCE_WALLET_PUBLISH_OK'
