name: Wallet500 Telegram Connect

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/telegram-connect.yml

permissions:
  contents: read

jobs:
  connect:
    runs-on: ubuntu-latest
    steps:
      - name: Validate bot and Telegram alert destination
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, sys, urllib.request, urllib.error

          token = os.environ.get("TELEGRAM_BOT_TOKEN", "").strip()
          configured_chat_id = os.environ.get("TELEGRAM_CHAT_ID", "").strip()
          if not token:
              print("::error::TELEGRAM_BOT_TOKEN is missing")
              sys.exit(1)

          base = f"https://api.telegram.org/bot{token}"

          def raw_call(method, payload=None):
              data = None
              headers = {}
              if payload is not None:
                  data = json.dumps(payload).encode()
                  headers["Content-Type"] = "application/json"
              req = urllib.request.Request(f"{base}/{method}", data=data, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=20) as r:
                      return json.load(r), None
              except urllib.error.HTTPError as e:
                  return None, e.code

          def call(method, payload=None):
              body, status = raw_call(method, payload)
              if status is not None:
                  print(f"::error::Telegram API HTTP {status} during {method}")
                  sys.exit(1)
              if not body.get("ok"):
                  print(f"::error::Telegram API rejected {method}: {body.get('description','unknown error')}")
                  sys.exit(1)
              return body["result"]

          me = call("getMe")
          print(f"Bot authenticated: @{me.get('username','unknown')}")

          def latest_private_chat():
              updates = call("getUpdates")
              candidates = []
              for u in updates:
                  msg = u.get("message") or u.get("edited_message") or u.get("channel_post")
                  if not msg:
                      continue
                  chat = msg.get("chat") or {}
                  if chat.get("type") != "private" or "id" not in chat:
                      continue
                  candidates.append((u.get("update_id", 0), str(chat["id"])))
              return max(candidates)[1] if candidates else None

          if configured_chat_id:
              body, status = raw_call("sendMessage", {
                  "chat_id": configured_chat_id,
                  "text": "✅ Wallet500 production Telegram route verified. TELEGRAM_CHAT_ID is working."
              })
              if status is None and body and body.get("ok"):
                  print("Telegram destination source: repository secret")
                  print("Telegram production route test: PASS")
                  sys.exit(0)
              print("Configured TELEGRAM_CHAT_ID was rejected; attempting safe private-chat recovery.")

          chat_id = latest_private_chat()
          if not chat_id:
              print("::error::Could not recover a private Telegram chat. Send /start and a fresh message to the bot, then run again.")
              sys.exit(1)

          recovery_text = (
              "⚠️ Wallet500 found that the saved TELEGRAM_CHAT_ID is not valid.\n"
              "Your correct TELEGRAM_CHAT_ID is:\n"
              f"{chat_id}\n\n"
              "Copy this exact number into the GitHub repository secret TELEGRAM_CHAT_ID."
          )
          sent = call("sendMessage", {"chat_id": chat_id, "text": recovery_text})
          if not sent.get("message_id"):
              print("::error::Telegram did not confirm the recovery message")
              sys.exit(1)

          # Do not print the recovered chat ID to GitHub logs.
          print("Recovery message sent to the verified private chat.")
          print("::error::Update TELEGRAM_CHAT_ID with the number sent by the bot, then rerun this workflow.")
          sys.exit(1)
          PY
