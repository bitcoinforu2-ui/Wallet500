name: Wallet500 Telegram Connect

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  connect:
    runs-on: ubuntu-latest
    steps:
      - name: Validate bot and Telegram alert destination
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, sys, urllib.request, urllib.error

          token = os.environ.get("TELEGRAM_BOT_TOKEN", "").strip()
          configured_chat_id = os.environ.get("TELEGRAM_CHAT_ID", "").strip()
          if not token:
              print("::error::TELEGRAM_BOT_TOKEN is missing")
              sys.exit(1)

          base = f"https://api.telegram.org/bot{token}"

          def call(method, payload=None):
              data = None
              headers = {}
              if payload is not None:
                  data = json.dumps(payload).encode()
                  headers["Content-Type"] = "application/json"
              req = urllib.request.Request(f"{base}/{method}", data=data, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=20) as r:
                      body = json.load(r)
              except urllib.error.HTTPError as e:
                  print(f"::error::Telegram API HTTP {e.code} during {method}")
                  sys.exit(1)
              if not body.get("ok"):
                  print(f"::error::Telegram API rejected {method}: {body.get('description','unknown error')}")
                  sys.exit(1)
              return body["result"]

          me = call("getMe")
          print(f"Bot authenticated: @{me.get('username','unknown')}")

          chat_id = configured_chat_id
          source = "repository secret"
          if not chat_id:
              updates = call("getUpdates")
              candidates = []
              for u in updates:
                  msg = u.get("message") or u.get("edited_message") or u.get("channel_post")
                  if not msg:
                      continue
                  chat = msg.get("chat") or {}
                  if chat.get("type") != "private" or "id" not in chat:
                      continue
                  candidates.append((u.get("update_id", 0), str(chat["id"])))
              if not candidates:
                  print("::error::TELEGRAM_CHAT_ID is missing and no private chat update was found")
                  sys.exit(1)
              _, chat_id = max(candidates)
              source = "latest private update"

          text = "✅ Wallet500 production Telegram route verified. TELEGRAM_CHAT_ID is working."
          sent = call("sendMessage", {"chat_id": chat_id, "text": text})
          if not sent.get("message_id"):
              print("::error::Telegram did not confirm the route test message")
              sys.exit(1)

          # Never print the chat ID itself.
          print(f"Telegram destination source: {source}")
          print("Telegram production route test: PASS")
          PY
