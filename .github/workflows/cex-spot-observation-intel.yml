name: Wallet500 CEX Observation Intelligence

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Wallet500 CEX Spot Revival Fast Lane"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: wallet500-cex-observation-intelligence
  cancel-in-progress: true

jobs:
  learn:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -e . pytest
      - name: Verify observation intelligence contracts
        run: python -m pytest -q tests/test_cex_spot_observation_intel.py
      - name: Build immutable observation and miss diagnostics
        run: python -m wallet500.cex_spot_observation_intel
      - name: Validate production isolation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('data/cex-spot-observation-intel.json').read_text())
          assert p['production_effect'] is False
          assert p['automatic_buy'] is False
          assert p['production_thresholds_modified'] is False
          assert p['liquidity_minimum_modified'] is False
          assert p['identity_rules_modified'] is False
          assert p['truth_contract']['leveraged_products_remain_excluded_from_production'] is True
          assert p['truth_contract']['leveraged_underlying_evidence_shadow_only'] is True
          assert p['truth_contract']['shadow_evidence_never_changes_score'] is True
          print('CEX_OBSERVATION_INTEL_OK', {
              'markets': p.get('observation_market_count'),
              'new_markets': p.get('observation_new_markets_added'),
              'leveraged_underlyings': p.get('leveraged_underlying_shadow_count'),
              'mover_diagnostics': p.get('mover_diagnostics_count'),
          })
          PY
      - name: Publish research observation intelligence
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git restore --worktree -- src/wallet500.egg-info || true
          python scripts/serialized_publish.py \
            --github-api-cas \
            --attempts 80 \
            --message 'research: refresh CEX observation intelligence' \
            data/cex-spot-observation-ledger.json \
            data/cex-spot-observation-intel.json
          echo 'CEX_OBSERVATION_INTEL_PUBLISH_OK'
