name: DOGE1 Hourly Telegram Relay

on:
  push:
    branches: [main]
    paths:
      - 'data/doge1-hourly-report.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: doge1-hourly-telegram
  cancel-in-progress: false

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate DOGE1 canonical report
        run: |
          set -euo pipefail
          test -s data/doge1-hourly-report.json
          python - <<'PY'
          import json
          p=json.load(open('data/doge1-hourly-report.json',encoding='utf-8'))
          expected='DpBzjtgGLF7QA9Ug3eUVGbnqa6j3jvYBn1XuQuktvfhm'
          if (p.get('token') or {}).get('contract_address') != expected:
              raise SystemExit('DOGE1 exact CA mismatch')
          if not p.get('observed_at'):
              raise SystemExit('DOGE1 report missing observed_at')
          PY

      - name: Load latest published onchain evidence from main
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:data/doge1-whale-current.json > /tmp/doge1-whale-current.json 2>/dev/null || true

      - name: Wait until canonical report is published on Wallet500 Pages
        env:
          SITE_URL: https://bitcoinforu2-ui.github.io/Wallet500/data/doge1-hourly-report.json
        run: |
          set -euo pipefail
          LOCAL_TS="$(python - <<'PY'
          import json
          print(json.load(open('data/doge1-hourly-report.json',encoding='utf-8'))['observed_at'])
          PY
          )"
          for attempt in $(seq 1 30); do
            REMOTE_TS="$(curl -fsSL --max-time 10 "${SITE_URL}?v=${GITHUB_RUN_ID}-${attempt}" | python -c 'import json,sys; print(json.load(sys.stdin).get("observed_at", ""))' 2>/dev/null || true)"
            if [ "$REMOTE_TS" = "$LOCAL_TS" ]; then
              exit 0
            fi
            sleep 20
          done
          echo 'Canonical DOGE1 report not published within 10 minutes'
          exit 1

      - name: Send freshness-gated DOGE1 intelligence to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SITE_URL: https://bitcoinforu2-ui.github.io/Wallet500/data/doge1-hourly-report.json
          CA: DpBzjtgGLF7QA9Ug3eUVGbnqa6j3jvYBn1XuQuktvfhm
          PAIR: 2fckuYXUrwbA9LHKMP1az5DTFstFrRjqqbBstz7yvVXL
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.parse, urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          CA=os.environ['CA']; PAIR=os.environ['PAIR']
          canonical=json.load(open('data/doge1-hourly-report.json',encoding='utf-8'))

          def parse_ts(s):
              try: return datetime.fromisoformat(str(s).replace('Z','+00:00'))
              except: return None
          def age_minutes(ts):
              d=parse_ts(ts)
              return None if not d else (datetime.now(timezone.utc)-d).total_seconds()/60
          def money(x):
              try: n=float(x)
              except: return '—'
              if abs(n)>=1_000_000:return f'${n/1_000_000:.2f}M'
              if abs(n)>=1_000:return f'${n/1_000:.1f}K'
              if abs(n)>=1:return f'${n:.4f}'
              return f'${n:.8f}'.rstrip('0').rstrip('.')
          def pct(x):
              try:return f'{float(x):+.1f}%'
              except:return '—'
          def val(x): return '—' if x is None or x=='' else str(x)
          def items(x): return x if isinstance(x,list) else ([] if not x else [x])

          # Market truth is fetched at Telegram send time from the hard-locked exact pair.
          market=None; market_error=None
          try:
              u=f'https://api.geckoterminal.com/api/v2/networks/solana/pools/{PAIR}'
              req=urllib.request.Request(u,headers={'accept':'application/json','user-agent':'Wallet500-DOGE1/1.0'})
              with urllib.request.urlopen(req,timeout=20) as r: raw=json.load(r)
              a=((raw.get('data') or {}).get('attributes') or {})
              rel=((raw.get('data') or {}).get('relationships') or {})
              base=((rel.get('base_token') or {}).get('data') or {}).get('id','')
              quote=((rel.get('quote_token') or {}).get('data') or {}).get('id','')
              if CA not in (base,quote) and not base.endswith('_'+CA) and not quote.endswith('_'+CA):
                  raise ValueError(f'exact CA not present in exact pair relationships: {base} / {quote}')
              tx=a.get('transactions') or {}; pc=a.get('price_change_percentage') or {}; vol=a.get('volume_usd') or {}
              h1=tx.get('h1') or {}
              market={
                'price':a.get('base_token_price_usd'),
                'liq':a.get('reserve_in_usd'),
                'v1':vol.get('h1'),'v24':vol.get('h24'),
                'buys1':h1.get('buys'),'sells1':h1.get('sells'),
                'p1':pc.get('h1'),'p6':pc.get('h6'),'p24':pc.get('h24'),
                'observed_at':datetime.now(timezone.utc).isoformat()
              }
              if market['price'] is None or market['liq'] is None: raise ValueError('missing price/liquidity')
          except Exception as e:
              market_error=str(e)[:160]

          # Onchain truth is allowed only when a fresh exact-mint snapshot exists.
          onchain=None; onchain_age=None
          op=Path('/tmp/doge1-whale-current.json')
          if op.exists() and op.stat().st_size:
              try:
                  q=json.loads(op.read_text())
                  onchain_age=age_minutes(q.get('observed_at'))
                  if q.get('mint')==CA and onchain_age is not None and -2 <= onchain_age <= 90:
                      onchain=q
              except Exception: pass

          social=canonical.get('social') or {}; game=canonical.get('game_changer')
          report_age=age_minutes(canonical.get('observed_at'))
          social_status=str(social.get('status') or '')
          social_txt='אין האצה אורגנית מאומתת' if ('NO_VERIFIED' in social_status or not social_status) else social_status[:90]
          game_txt='אין Game Changer מאומת'
          if isinstance(game,dict):
              st=str(game.get('status') or '')
              if st and 'NO_VERIFIED' not in st: game_txt='⚠️ '+st[:100]
          elif game and 'NO_VERIFIED' not in str(game): game_txt='⚠️ '+str(game)[:100]

          lines=['🛰 DOGE-1 | עדכון שעתי · FRESHNESS GATED']
          if market:
              lines += [
                f"💰 {money(market['price'])} | 1H {pct(market['p1'])} | 6H {pct(market['p6'])} | 24H {pct(market['p24'])}",
                f"💧 נזילות {money(market['liq'])} | Vol 1H {money(market['v1'])} | 24H {money(market['v24'])}",
                f"🟢/🔴 קניות/מכירות 1H: {val(market['buys1'])}/{val(market['sells1'])}",
                '✅ Market: exact pair fetched at send time'
              ]
          else:
              lines.append('⚠️ Market: NO LIVE EXACT-PAIR DATA — לא מציג מחיר ישן כעדכני')

          if onchain:
              hd=onchain.get('holder_deltas') or {}
              hc=onchain.get('holders')
              lines.append(f"👥 Holders on-chain: {val(hc)} | 1H {val(hd.get('h1'))} | 6H {val(hd.get('h6'))} | 24H {val(hd.get('h24'))}")
              flows=items(onchain.get('flows_vs_previous_hour'))
              sell=sum(1 for x in flows if isinstance(x,dict) and x.get('direction')=='SELL_OR_OUTFLOW')
              buy=sum(1 for x in flows if isinstance(x,dict) and x.get('direction')=='BUY_OR_INFLOW')
              lines.append(f"🐋 ≥0.1%: {len(onchain.get('whales') or [])} top token-accounts tracked | inflow {buy} / outflow {sell}")
              lines.append(f"✅ On-chain snapshot age: {onchain_age:.0f}m")
          else:
              lines.append('⚠️ Holders/Whales: NO FRESH ON-CHAIN SNAPSHOT — לא מנחש 0 ולא משאיר מספר ישן')

          lines.append(f'📣 Social: {social_txt}')
          lines.append(f'🎯 {game_txt}')
          if report_age is not None and report_age>90:
              lines.append(f'⚠️ Research/news snapshot age: {report_age:.0f}m')
          for label,key in [('👤 KOL','notable_mentions')]:
              xs=items(social.get(key))[:2]
              if xs: lines.append(label+': '+' | '.join(str(x)[:100] for x in xs))
          news=items(canonical.get('news'))[:2]
          if news: lines.append('📰 חדשות: '+' | '.join(str(x)[:105] for x in news))
          listings=items(canonical.get('listings'))[:2]
          if listings: lines.append('🏦 Listing: '+' | '.join(str(x)[:105] for x in listings))
          lines.append('🔒 חדשות משימת DOGE-1 ≠ endorsement לטוקן בלי CA/קישור רשמי.')
          lines.append('🔗 '+os.environ['SITE_URL'])

          text='\n'.join(lines)[:1900]
          bot=os.environ.get('TELEGRAM_BOT_TOKEN','').strip(); chat=os.environ.get('TELEGRAM_CHAT_ID','').strip()
          if not bot or not chat: raise SystemExit('Telegram secrets are not configured')
          data=urllib.parse.urlencode({'chat_id':chat,'text':text,'disable_web_page_preview':'true'}).encode()
          req=urllib.request.Request(f'https://api.telegram.org/bot{bot}/sendMessage',data=data,method='POST')
          with urllib.request.urlopen(req,timeout=20) as r:
              if not 200 <= r.status < 300: raise SystemExit(f'Telegram HTTP {r.status}')
          print('Freshness-gated DOGE1 Telegram report delivered')
          if market_error: print('market_error:',market_error)
          PY
