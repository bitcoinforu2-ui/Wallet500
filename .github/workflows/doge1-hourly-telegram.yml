name: DOGE1 Hourly Telegram Relay

on:
  push:
    branches: [main]
    paths:
      - 'data/doge1-hourly-report.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: doge1-hourly-telegram
  cancel-in-progress: false

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Validate DOGE1 report
        run: |
          set -euo pipefail
          test -s data/doge1-hourly-report.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('data/doge1-hourly-report.json').read_text(encoding='utf-8'))
          expected='DpBzjtgGLF7QA9Ug3eUVGbnqa6j3jvYBn1XuQuktvfhm'
          token=p.get('token') or {}
          if token.get('contract_address') != expected:
              raise SystemExit('DOGE1 exact CA mismatch')
          if not p.get('observed_at'):
              raise SystemExit('DOGE1 report missing observed_at')
          PY
      - name: Wait until report is published on Wallet500 Pages
        env:
          SITE_URL: https://bitcoinforu2-ui.github.io/Wallet500/data/doge1-hourly-report.json
        run: |
          set -euo pipefail
          LOCAL_TS="$(python - <<'PY'
          import json
          print(json.load(open('data/doge1-hourly-report.json',encoding='utf-8'))['observed_at'])
          PY
          )"
          for attempt in $(seq 1 30); do
            REMOTE_TS="$(curl -fsSL --max-time 10 "${SITE_URL}?v=${GITHUB_RUN_ID}-${attempt}" | python -c 'import json,sys; print(json.load(sys.stdin).get("observed_at", ""))' 2>/dev/null || true)"
            if [ "$REMOTE_TS" = "$LOCAL_TS" ]; then
              echo "Published DOGE1 snapshot confirmed on site: $REMOTE_TS"
              exit 0
            fi
            echo "Waiting for Pages publish (${attempt}/30): local=$LOCAL_TS remote=${REMOTE_TS:-missing}"
            sleep 20
          done
          echo "DOGE1 report did not appear on Pages within 10 minutes"
          exit 1
      - name: Send compact hourly DOGE1 intelligence to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SITE_URL: https://bitcoinforu2-ui.github.io/Wallet500/data/doge1-hourly-report.json
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.parse, urllib.request
          from pathlib import Path

          p=json.loads(Path('data/doge1-hourly-report.json').read_text(encoding='utf-8'))
          pair=p.get('exact_pair') or {}; holders=p.get('holders') or {}; whales=p.get('whales') or {}; social=p.get('social') or {}
          def v(x): return '—' if x is None or x=='' else str(x)
          def money(x):
              try: n=float(x)
              except Exception: return '—'
              if abs(n)>=1_000_000: return f'${n/1_000_000:.2f}M'
              if abs(n)>=1_000: return f'${n/1_000:.1f}K'
              if abs(n)>=1: return f'${n:.4f}'
              return f'${n:.8f}'.rstrip('0').rstrip('.')
          def pct(x):
              try: return f'{float(x):+.1f}%'
              except Exception: return '—'
          def items(x): return x if isinstance(x,list) else ([] if not x else [x])

          whale_events=items(whales.get('events'))
          notable=items(social.get('notable_mentions'))
          news=items(p.get('news'))
          listings=items(p.get('listings'))
          changes=items(p.get('changes_since_previous'))
          game=p.get('game_changer')

          # Compact decision-oriented summary. Missing evidence is shown once, not as raw JSON/status dumps.
          coverage=str(whales.get('coverage') or '').upper()
          whale_txt=f'{len(whale_events)} אירועים'
          if not coverage or 'INSUFFICIENT' in coverage:
              whale_txt += ' · כיסוי חסר'
          holder_txt=f"{v(holders.get('count'))} (1H {v(holders.get('delta_1h'))} | 24H {v(holders.get('delta_24h'))})"
          social_status=str(social.get('status') or '')
          social_txt='אין האצה אורגנית מאומתת' if ('NO_VERIFIED' in social_status or not social_status) else social_status[:90]

          material=[]
          for x in changes:
              if isinstance(x,dict):
                  if x.get('price_change_vs_previous_snapshot_pct') is not None:
                      material.append('מחיר מול שעה קודמת '+pct(x.get('price_change_vs_previous_snapshot_pct')))
                  if x.get('liquidity_change_vs_previous_snapshot_pct') is not None:
                      material.append('נזילות '+pct(x.get('liquidity_change_vs_previous_snapshot_pct')))
                  if x.get('volume_24h_change_vs_previous_snapshot_pct') is not None:
                      material.append('ווליום 24H '+pct(x.get('volume_24h_change_vs_previous_snapshot_pct')))
              elif str(x) not in ('NO_MATERIAL_CHANGE',''):
                  material.append(str(x)[:120])
          material=material[:3]

          game_status='אין Game Changer מאומת'
          if isinstance(game,dict):
              st=str(game.get('status') or '')
              if st and 'NO_VERIFIED' not in st:
                  game_status='⚠️ '+st[:100]
          elif game and 'NO_VERIFIED' not in str(game):
              game_status='⚠️ '+str(game)[:100]

          lines=[
              '🛰 DOGE-1 | עדכון שעתי',
              f"💰 {money(pair.get('price_usd'))} | 1H {pct(pair.get('price_change_h1_pct'))} | 6H {pct(pair.get('price_change_h6_pct'))} | 24H {pct(pair.get('price_change_24h_pct'))}",
              f"💧 נזילות {money(pair.get('liquidity_usd'))} | Vol 1H {money(pair.get('volume_h1'))} | 24H {money(pair.get('volume_24h'))}",
              f"🟢/🔴 קניות/מכירות 1H: {v(pair.get('buys_h1'))}/{v(pair.get('sells_h1'))}",
              f"👥 Holders: {holder_txt}",
              f"🐋 Whales ≥{v(whales.get('threshold_supply_pct'))}%: {whale_txt}",
              f"📣 Social: {social_txt}",
              f"🎯 {game_status}",
          ]
          if material:
              lines.append('📊 מול שעה קודמת: ' + ' | '.join(material))
          else:
              lines.append('📊 מול שעה קודמת: אין שינוי מהותי מאומת')
          if notable:
              lines.append('👤 KOL: ' + ' | '.join(str(x)[:100] for x in notable[:2]))
          if news:
              lines.append('📰 חדשות: ' + ' | '.join(str(x)[:110] for x in news[:2]))
          if listings:
              lines.append('🏦 Listing: ' + ' | '.join(str(x)[:110] for x in listings[:2]))
          lines.append('🔒 חדשות משימת DOGE-1 ≠ endorsement לטוקן בלי CA/קישור רשמי.')
          lines.append(f"🔗 {os.environ['SITE_URL']}")

          text='\n'.join(lines)[:1800]
          bot=os.environ.get('TELEGRAM_BOT_TOKEN','').strip(); chat=os.environ.get('TELEGRAM_CHAT_ID','').strip()
          if not bot or not chat: raise SystemExit('Telegram secrets are not configured')
          url=f'https://api.telegram.org/bot{bot}/sendMessage'
          data=urllib.parse.urlencode({'chat_id':chat,'text':text,'disable_web_page_preview':'true'}).encode()
          req=urllib.request.Request(url,data=data,method='POST')
          with urllib.request.urlopen(req,timeout=20) as r:
              if not 200 <= r.status < 300: raise SystemExit(f'Telegram HTTP {r.status}')
          print('Compact DOGE1 Telegram report delivered')
          PY
