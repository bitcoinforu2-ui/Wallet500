name: Wallet500 Backup Scan

on:
  workflow_dispatch:
  schedule:
    - cron: '33 * * * *'

permissions:
  contents: read
  actions: write

concurrency:
  group: wallet500-backup-sentinel
  cancel-in-progress: true

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check whether primary data is stale
        id: stale
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          stale = True
          age = 999999.0
          p = Path('data/run-summary.json')
          if p.exists():
              try:
                  d = json.loads(p.read_text())
                  ts = datetime.fromisoformat(d['updated_at'])
                  age = (datetime.now(timezone.utc) - ts).total_seconds() / 60
                  stale = age > 20
              except Exception:
                  stale = True
          print('stale=' + ('true' if stale else 'false'))
          print(f'age_minutes={age:.1f}')
          PY

      - name: Fresh primary data needs no backup action
        if: steps.stale.outputs.stale != 'true'
        run: echo "Primary scan is fresh enough (${{ steps.stale.outputs.age_minutes }} minutes); backup exits cleanly."

      - name: Dispatch full primary scan only when idle
        if: steps.stale.outputs.stale == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          # Backup is a scheduler sentinel only. It must never calculate, merge,
          # auto-resolve or publish truth-bearing data. All recovery goes through
          # the complete Live Scan chain and its fail-closed strict validation.
          runs_json="$(gh api --method GET \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/live-scan.yml/runs?per_page=30")"

          active_count="$(printf '%s' "$runs_json" | jq '[.workflow_runs[] | select(.status == "in_progress" or .status == "queued" or .status == "pending" or .status == "waiting" or .status == "requested")] | length')"

          if [ "$active_count" -gt 0 ]; then
            echo "BACKUP_STALE_BUT_PRIMARY_ACTIVE age=${{ steps.stale.outputs.age_minutes }}m active=${active_count}; no duplicate dispatch."
            exit 0
          fi

          echo "BACKUP_STALE_DISPATCH_FULL_PRIMARY age=${{ steps.stale.outputs.age_minutes }}m"
          gh workflow run live-scan.yml --repo "$GITHUB_REPOSITORY" --ref main
