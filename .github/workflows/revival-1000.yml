name: Wallet500 Revival Solana Expanded

on:
  workflow_dispatch:
  schedule:
    - cron: '7,37 * * * *'
  push:
    branches: [main]
    paths:
      - 'src/wallet500/revival_1000.py'
      - 'src/wallet500/revival_absorption_signal.py'
      - 'src/wallet500/revival_discovery_expansion.py'
      - 'src/wallet500/revival_discovery_expansion_v3.py'
      - 'src/wallet500/revival_strict_t0.py'
      - 'src/wallet500/mature_age_gate.py'
      - 'src/wallet500/paid_visibility_lab.py'
      - 'tests/test_revival_1000.py'
      - 'tests/test_revival_absorption_signal.py'
      - 'tests/test_revival_strict_t0.py'
      - 'tests/test_mature_age_gate.py'
      - 'tests/test_paid_visibility_lab.py'
      - '.github/workflows/revival-1000.yml'
      - 'dashboard-revival1000.html'

permissions:
  contents: write

concurrency:
  group: wallet500-main-data-publisher
  cancel-in-progress: false
  queue: max

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -e . pytest
      - name: Unit tests
        run: python -m pytest -q tests/test_revival_1000.py tests/test_revival_absorption_signal.py tests/test_revival_strict_t0.py tests/test_mature_age_gate.py tests/test_paid_visibility_lab.py
      - name: Migrate base Revival state to strict Solana identity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from wallet500.revival_1000 import looks_like_solana_address
          p=Path('data/revival-1000-state.json')
          if not p.exists(): raise SystemExit(0)
          state=json.loads(p.read_text()); coins=state.get('coins') or {}
          clean={k:v for k,v in coins.items() if isinstance(v,dict) and v.get('network')=='solana' and looks_like_solana_address(v.get('token_address'))}
          state['version']=4; state['network']='solana'; state['coins']=clean
          p.write_text(json.dumps(state,ensure_ascii=False,indent=2))
          print('REVIVAL_STATE_SOLANA_MIGRATION','kept=',len(clean),'removed=',len(coins)-len(clean))
          PY
      - name: Collect verified Solana-only base universe
        env:
          COINGECKO_DEMO_API_KEY: ${{ secrets.COINGECKO_DEMO_API_KEY }}
        run: python -m wallet500.revival_1000
      - name: Enrich base strict absorption signals
        run: python -m wallet500.revival_absorption_signal
      - name: Expand strict and pre-move absorption candidates across known Solana universe
        run: python -m wallet500.revival_discovery_expansion_v3
      - name: Lock immutable first green STRICT discovery price
        run: python -m wallet500.revival_strict_t0
      - name: Enforce verified 180-day mature-coin hard gate
        env:
          COINGECKO_DEMO_API_KEY: ${{ secrets.COINGECKO_DEMO_API_KEY }}
        run: python -m wallet500.mature_age_gate --revival
      - name: Validate expanded truth contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from wallet500.revival_1000 import looks_like_solana_address
          d=json.loads(Path('data/revival-1000-latest.json').read_text())
          if d.get('mode')!='RESEARCH_ONLY_REVIVAL_SOLANA_EXPANDED_V6': raise SystemExit('REVIVAL_EXPANDED_V6_MODE_MISSING')
          if d.get('network')!='solana' or d.get('production_portfolio_impact')!='NONE': raise SystemExit('REVIVAL_SAFETY_LABEL_INVALID')
          if d.get('no_hindsight') is not True or d.get('candidate_cap') is not None: raise SystemExit('REVIVAL_TRUTH_OR_CAP_VIOLATION')
          age_gate=d.get('age_gate') or {}
          if age_gate.get('status')!='ENFORCED_FAIL_CLOSED' or int(age_gate.get('minimum_market_age_days') or 0)!=180: raise SystemExit('REVIVAL_180D_AGE_GATE_MISSING')
          contract=d.get('discovery_expansion_contract') or {}
          if contract.get('version')!='REVIVAL_DISCOVERY_ABSORPTION_EXPANSION_V2': raise SystemExit('DISCOVERY_EXPANSION_V2_CONTRACT_MISSING')
          if contract.get('fixed_candidate_cap') is not None or contract.get('production_portfolio_impact')!='NONE': raise SystemExit('DISCOVERY_EXPANSION_SAFETY_INVALID')
          strict_t0=d.get('strict_discovery_contract') or {}
          if strict_t0.get('version')!='FORWARD_LOCKED_STRICT_T0_V1' or strict_t0.get('no_hindsight') is not True: raise SystemExit('STRICT_T0_CONTRACT_MISSING')
          if strict_t0.get('production_portfolio_impact')!='NONE' or strict_t0.get('discovery_price_mutation')!='FORBIDDEN_AFTER_FIRST_LOCK': raise SystemExit('STRICT_T0_SAFETY_INVALID')
          coins=d.get('coins') or []
          if len(coins)<100: raise SystemExit('REVIVAL_UNIVERSE_TOO_SMALL')
          if any(x.get('market_age_verified') is not True or int(x.get('market_age_min_days') or 0)<180 for x in coins): raise SystemExit('REVIVAL_UNDER_180_OR_UNVERIFIED_AGE_PRESENT')
          if any(x.get('network')!='solana' or x.get('network_verified') is not True for x in coins): raise SystemExit('NON_VERIFIED_SOLANA_PRESENT')
          if any(not looks_like_solana_address(x.get('token_address')) for x in coins): raise SystemExit('INVALID_SOLANA_ADDRESS')
          if any(x.get('pre_alpha_eligible') for x in coins): raise SystemExit('RESEARCH_LAYER_PROMOTED_PRE_ALPHA')
          expansion=0; strict_expansion=0; candidate_expansion=0
          for x in coins:
              if x.get('source')=='revival_discovery_state+dexscreener_absorption_expansion':
                  expansion += 1
                  if x.get('solana_only_platform_verified') is not False or x.get('cross_platform_status')!='UNKNOWN_RESEARCH_ONLY': raise SystemExit('DISCOVERY_IDENTITY_OVERCLAIM')
                  if x.get('absorption_candidate_proxy') is not True: raise SystemExit('EXPANSION_WITHOUT_CANDIDATE_PROXY')
                  status=x.get('watch_status'); flow=x.get('order_flow_absorption') or {}
                  if status=='ABSORPTION_WATCH_DISCOVERY_EXPANSION':
                      strict_expansion += 1
                      if flow.get('signal') is not True: raise SystemExit('STRICT_EXPANSION_WITHOUT_SIGNAL')
                      sd=x.get('strict_discovery') or {}
                      if not (float(sd.get('discovery_price_usd') or 0)>0 and sd.get('immutable_t0') is True and sd.get('no_hindsight') is True): raise SystemExit('STRICT_EXPANSION_WITHOUT_LOCKED_DISCOVERY_PRICE')
                      if str(sd.get('pair_address') or '').lower()!=str(x.get('dex_pair_address') or '').lower(): raise SystemExit('STRICT_T0_PAIR_IDENTITY_MISMATCH')
                  elif status=='ABSORPTION_CANDIDATE_DISCOVERY_EXPANSION':
                      candidate_expansion += 1
                      if flow.get('signal') is True: raise SystemExit('CANDIDATE_MISLABELED_STRICT')
                      if x.get('strict_discovery') is not None: raise SystemExit('PRE_MOVE_HAS_STRICT_DISCOVERY_METRIC')
                  else: raise SystemExit('EXPANSION_STATUS_INVALID')
              elif x.get('solana_only_platform_verified') is not True:
                  raise SystemExit('BASE_CROSS_PLATFORM_ASSET_PRESENT')
          counts=d.get('counts') or {}
          verified=sum(1 for x in coins if x.get('dex_link_type')=='DEXSCREENER_VERIFIED_PAIR')
          strict=sum(1 for x in coins if (x.get('order_flow_absorption') or {}).get('signal') is True)
          candidates=sum(1 for x in coins if x.get('absorption_candidate_proxy') is True)
          if counts.get('universe')!=len(coins) or counts.get('dex_verified_pairs')!=verified: raise SystemExit('AGGREGATE_COUNT_MISMATCH')
          if counts.get('age_verified_180d_plus')!=len(coins): raise SystemExit('AGE_COUNT_MISMATCH')
          if counts.get('absorption_proxy_watch')!=strict or counts.get('absorption_candidate_proxy_watch')!=candidates: raise SystemExit('ABSORPTION_COUNT_MISMATCH')
          if counts.get('absorption_discovery_expansion_added')!=expansion: raise SystemExit('EXPANSION_COUNT_MISMATCH')
          if counts.get('absorption_discovery_strict_added')!=strict_expansion: raise SystemExit('STRICT_EXPANSION_COUNT_MISMATCH')
          if counts.get('absorption_discovery_candidate_added')!=candidate_expansion: raise SystemExit('CANDIDATE_EXPANSION_COUNT_MISMATCH')
          if counts.get('strict_green_t0_current')!=strict_expansion: raise SystemExit('STRICT_T0_CURRENT_COUNT_MISMATCH')
          print('REVIVAL_SOLANA_EXPANDED_V6_OK',counts)
          PY
      - name: Collect paid-visibility exposure events and matched controls
        run: python -m wallet500.paid_visibility_lab
      - name: Validate paid-visibility research truth contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for name in ('paid-visibility-ledger.json','paid-visibility-summary.json'):
              p=Path('data')/name
              if not p.exists() or p.stat().st_size==0: raise SystemExit('PAID_VISIBILITY_OUTPUT_MISSING:'+name)
          ledger=json.loads(Path('data/paid-visibility-ledger.json').read_text())
          summary=json.loads(Path('data/paid-visibility-summary.json').read_text())
          if ledger.get('mode')!='RESEARCH_ONLY_PAID_VISIBILITY_LAB_V1' or ledger.get('contract')!='PAID_VISIBILITY_LAB_V1': raise SystemExit('PAID_VISIBILITY_CONTRACT_INVALID')
          if ledger.get('production_portfolio_impact')!='NONE' or ledger.get('no_hindsight') is not True: raise SystemExit('PAID_VISIBILITY_SAFETY_INVALID')
          if summary.get('production_portfolio_impact')!='NONE' or int(summary.get('providers_tracked') or 0)!=10: raise SystemExit('PAID_VISIBILITY_SUMMARY_INVALID')
          for e in ledger.get('events') or []:
              if e.get('provider')!='dexscreener': raise SystemExit('UNVERIFIED_PROVIDER_EVENT')
              if e.get('production_portfolio_impact')!='NONE': raise SystemExit('PAID_EVENT_PRODUCTION_IMPACT')
              t0=e.get('t0')
              if t0 and (not e.get('pair_identity_locked') or str(t0.get('pair_address') or '')!=str(e.get('pair_address') or '')): raise SystemExit('PAID_EVENT_PAIR_IDENTITY_INVALID')
              for o in e.get('observations') or []:
                  if int(o.get('horizon_min') or 0) not in {0,60,360,1440,4320}: raise SystemExit('PAID_EVENT_HORIZON_INVALID')
          print('PAID_VISIBILITY_LAB_V1_TRUTH_OK', {'active':summary.get('active_paid_events_now'),'solana':summary.get('active_solana_paid_events_now'),'events':summary.get('total_events_observed')})
          PY
      - name: Publish expanded Revival, paid visibility lab, immutable strict T0, and immutable base T0 state
        run: |
          set -euo pipefail
          git config user.name 'wallet500-truth-bot'
          git config user.email 'wallet500-truth-bot@users.noreply.github.com'
          tmp="$(mktemp -d)"
          for f in revival-1000-latest.json revival-1000-state.json revival-strict-t0.json paid-visibility-ledger.json paid-visibility-summary.json; do cp "data/$f" "$tmp/$f"; done
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            for f in revival-1000-latest.json revival-1000-state.json revival-strict-t0.json paid-visibility-ledger.json paid-visibility-summary.json; do cp "$tmp/$f" "data/$f"; done
            git add data/revival-1000-latest.json data/revival-1000-state.json data/revival-strict-t0.json data/paid-visibility-ledger.json data/paid-visibility-summary.json
            if git diff --cached --quiet; then echo 'REVIVAL_AND_PAID_VISIBILITY_NO_DATA_CHANGE'; exit 0; fi
            git commit -m 'data: refresh Revival, strict T0, and paid visibility experiment'
            if git push origin HEAD:main; then echo 'REVIVAL_AND_PAID_VISIBILITY_PUBLISH_OK'; exit 0; fi
            echo "REVIVAL_AND_PAID_VISIBILITY_PUBLISH_RETRY attempt=$attempt"; sleep 3
          done
          echo '::error::REVIVAL_AND_PAID_VISIBILITY_PUBLISH_RACE_EXHAUSTED'; exit 1
