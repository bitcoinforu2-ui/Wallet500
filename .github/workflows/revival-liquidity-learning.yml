name: Wallet500 Revival Liquidity Learning

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths:
      - 'src/wallet500/revival_liquidity_learning.py'
      - 'src/wallet500/revival_forensics_v2.py'
      - 'src/wallet500/revival_forensics_runner.py'
      - 'src/wallet500/revival_wallet_evidence.py'
      - 'src/wallet500/revival_forensics_wallet_bridge.py'
      - 'tests/test_revival_liquidity_learning.py'
      - 'tests/test_revival_forensics_v2.py'
      - 'tests/test_revival_wallet_evidence.py'
      - '.github/workflows/revival-liquidity-learning.yml'

permissions:
  contents: write

concurrency:
  group: wallet500-revival-forensics-publisher
  cancel-in-progress: false

jobs:
  learn:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -e . pytest
      - name: Unit tests
        run: |
          python -m pytest -q \
            tests/test_revival_liquidity_learning.py \
            tests/test_revival_forensics_v2.py \
            tests/test_revival_wallet_evidence.py
      - name: Run liquidity-price learning sensor
        run: |
          python - <<'PY'
          import json
          import wallet500.revival_liquidity_learning as learning

          source = json.loads(learning.REVIVAL.read_text())
          if source.get('mode') != 'RESEARCH_ONLY_REVIVAL_SOLANA_EXPANDED_V6':
              raise SystemExit('REVIVAL_TRUTH_CONTRACT_UNAVAILABLE')
          if source.get('network') != learning.NETWORK:
              raise SystemExit('REVIVAL_NETWORK_NOT_SOLANA')
          if source.get('production_portfolio_impact') != 'NONE':
              raise SystemExit('REVIVAL_PRODUCTION_IMPACT_NOT_NONE')
          if source.get('no_hindsight') is not True:
              raise SystemExit('REVIVAL_NO_HINDSIGHT_VIOLATION')

          learning.load_revival = lambda: source
          learning.main()
          PY
      - name: Run exact-pair wallet evidence sensor
        env:
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
        run: |
          if [ -z "${SOLANA_RPC_URL:-}" ]; then
            export SOLANA_RPC_URL='https://solana-rpc.publicnode.com'
            echo 'Using verified public Solana RPC fallback'
          fi
          python -m wallet500.revival_wallet_evidence
      - name: Run full-lifecycle Revival Forensics v2
        run: python -m wallet500.revival_forensics_runner
      - name: Bridge verified wallet evidence into Forensics
        run: python -m wallet500.revival_forensics_wallet_bridge
      - name: Validate research truth contracts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p=Path('data/revival-liquidity-learning.json')
          s=Path('data/revival-liquidity-learning-state.json')
          if not p.exists() or not s.exists(): raise SystemExit('LIQUIDITY_LEARNING_OUTPUT_MISSING')
          d=json.loads(p.read_text())
          if d.get('mode')!='RESEARCH_ONLY_REVIVAL_LIQUIDITY_LEARNING_V1': raise SystemExit('LIQUIDITY_LEARNING_MODE_INVALID')
          if d.get('network')!='solana': raise SystemExit('LIQUIDITY_LEARNING_NETWORK_INVALID')
          if d.get('production_impact')!='NONE': raise SystemExit('LIQUIDITY_LEARNING_PRODUCTION_IMPACT_NOT_NONE')
          if d.get('no_hindsight') is not True: raise SystemExit('LIQUIDITY_LEARNING_NO_HINDSIGHT_VIOLATION')
          tc=d.get('truth_contract') or {}
          if tc.get('pair_identity')!='EXACT_REVIVAL_VERIFIED_PAIR_ONLY': raise SystemExit('LIQUIDITY_LEARNING_PAIR_IDENTITY_INVALID')
          if tc.get('price_market_cap_identity')!='TOKEN_MUST_BE_DEX_PAIR_BASE_TOKEN': raise SystemExit('LIQUIDITY_LEARNING_BASE_TOKEN_GUARD_MISSING')

          wp=Path('data/revival-wallet-evidence.json')
          ws=Path('data/revival-wallet-evidence-state.json')
          if not wp.exists() or not ws.exists(): raise SystemExit('REVIVAL_WALLET_EVIDENCE_OUTPUT_MISSING')
          w=json.loads(wp.read_text())
          if w.get('version')!='REVIVAL_WALLET_EVIDENCE_V1': raise SystemExit('REVIVAL_WALLET_VERSION_INVALID')
          if w.get('mode')!='RESEARCH_ONLY_EXACT_PAIR_WALLET_EVIDENCE': raise SystemExit('REVIVAL_WALLET_MODE_INVALID')
          if w.get('network')!='solana': raise SystemExit('REVIVAL_WALLET_NETWORK_INVALID')
          if w.get('production_portfolio_impact')!='NONE': raise SystemExit('REVIVAL_WALLET_PRODUCTION_IMPACT_INVALID')
          if w.get('automatic_buy') is not False: raise SystemExit('REVIVAL_WALLET_AUTOMATIC_BUY_INVALID')
          wt=w.get('truth_contract') or {}
          if wt.get('exact_pair_only') is not True: raise SystemExit('REVIVAL_WALLET_EXACT_PAIR_INVALID')
          if wt.get('signed_token_owner_delta_only') is not True: raise SystemExit('REVIVAL_WALLET_SIGNED_OWNER_INVALID')
          if wt.get('unresolved_not_guessed') is not True: raise SystemExit('REVIVAL_WALLET_UNRESOLVED_POLICY_INVALID')
          if wt.get('forward_only') is not True: raise SystemExit('REVIVAL_WALLET_FORWARD_ONLY_INVALID')
          bridge=w.get('smart_money_bridge') or {}
          if bridge.get('raw_verified_wallet_evidence_connected') is not True: raise SystemExit('REVIVAL_WALLET_RAW_BRIDGE_INVALID')
          if bridge.get('wallet500_tiers_connected') is not False: raise SystemExit('REVIVAL_WALLET_PREMATURE_TIER_CLAIM')
          for row in w.get('tokens') or []:
              if not row.get('exact_pair'): raise SystemExit('REVIVAL_WALLET_PAIR_MISSING')
              for wallet in row.get('top_wallets_raw_verified') or []:
                  if wallet.get('tier')!='UNSCORED_RAW_VERIFIED': raise SystemExit('REVIVAL_WALLET_FALSE_TIER_LABEL')

          fp=Path('data/revival-forensics-latest.json')
          fs=Path('data/revival-forensics-state.json')
          fd=Path('data/revival-forensics-dashboard.json')
          fa=Path('data/revival-feature-analysis.json')
          if not all(x.exists() for x in (fp,fs,fd,fa)): raise SystemExit('REVIVAL_FORENSICS_OUTPUT_MISSING')
          f=json.loads(fp.read_text())
          if f.get('mode')!='RESEARCH_ONLY_REVIVAL_FORENSICS_V2': raise SystemExit('REVIVAL_FORENSICS_MODE_INVALID')
          if f.get('revision')!='2.1': raise SystemExit('REVIVAL_FORENSICS_REVISION_INVALID')
          if f.get('contract')!='REVIVAL_FORENSICS_V2': raise SystemExit('REVIVAL_FORENSICS_CONTRACT_INVALID')
          if f.get('t0_source_contract')!='REVIVAL_GENERATED_AT_EXACT_PUBLICATION_V1': raise SystemExit('REVIVAL_FORENSICS_T0_SOURCE_CONTRACT_INVALID')
          if f.get('waking_authority')!='REVIVAL_1000_LATEST_WATCH_STATUS': raise SystemExit('REVIVAL_FORENSICS_WAKING_AUTHORITY_INVALID')
          if f.get('confirmation_role')!='OPTIONAL_ENRICHMENT_NEVER_ENTRY_GATE': raise SystemExit('REVIVAL_FORENSICS_CONFIRMATION_ROLE_INVALID')
          if f.get('network')!='solana': raise SystemExit('REVIVAL_FORENSICS_NETWORK_INVALID')
          if f.get('production_portfolio_impact')!='NONE': raise SystemExit('REVIVAL_FORENSICS_PRODUCTION_IMPACT_NOT_NONE')
          if f.get('automatic_buy') is not False: raise SystemExit('REVIVAL_FORENSICS_AUTOMATIC_BUY_INVALID')
          if f.get('no_hindsight') is not True: raise SystemExit('REVIVAL_FORENSICS_NO_HINDSIGHT_VIOLATION')
          if 'NEVER_SWITCH' not in str(f.get('pair_identity_rule')): raise SystemExit('REVIVAL_FORENSICS_PAIR_LOCK_MISSING')
          if '180' not in str(f.get('age_rule')): raise SystemExit('REVIVAL_FORENSICS_AGE_GATE_MISSING')
          if '24H' not in str(f.get('full_lifecycle_rule')): raise SystemExit('REVIVAL_FORENSICS_LIFECYCLE_MISSING')
          if f.get('wallet500_status')!='RAW_VERIFIED_EXACT_PAIR_CONNECTED_SMART_MONEY_TIERS_PENDING': raise SystemExit('REVIVAL_FORENSICS_WALLET_BRIDGE_STATUS_INVALID')
          fb=f.get('wallet500_bridge') or {}
          if fb.get('smart_money_tiers_connected') is not False: raise SystemExit('REVIVAL_FORENSICS_FALSE_SMART_MONEY_CLAIM')

          for event in f.get('events') or []:
              t0=event.get('t0') or {}
              if t0.get('t0_source')!='REVIVAL_1000_LATEST_GENERATED_AT': raise SystemExit('REVIVAL_FORENSICS_EVENT_T0_SOURCE_INVALID')
              if t0.get('waking_t0')!=t0.get('price_source_generated_at'): raise SystemExit('REVIVAL_FORENSICS_T0_PRICE_TIME_MISMATCH')
              if len(str(t0.get('evidence_sha256') or '')) != 64: raise SystemExit('REVIVAL_FORENSICS_EVIDENCE_HASH_INVALID')
              if not t0.get('pair_address'): raise SystemExit('REVIVAL_FORENSICS_PAIR_ID_MISSING')
              if t0.get('market_age_verified') is not True or int(t0.get('market_age_min_days') or 0) < 180:
                  raise SystemExit('REVIVAL_FORENSICS_EVENT_AGE_INVALID')
              for horizon in (event.get('horizons') or {}).values():
                  if horizon.get('available') is True and horizon.get('pair_identity')!='STRICT_MATCH':
                      raise SystemExit('REVIVAL_FORENSICS_HORIZON_PAIR_NOT_STRICT')
              we=event.get('wallet500_evidence') or {}
              if we.get('connected') is True and we.get('exact_pair')!=t0.get('pair_address'):
                  raise SystemExit('REVIVAL_FORENSICS_WALLET_PAIR_MISMATCH')
              if int(we.get('elite') or 0)!=0 or int(we.get('strong') or 0)!=0:
                  raise SystemExit('REVIVAL_FORENSICS_UNVERIFIED_SMART_MONEY_TIER')

          for event in f.get('invalidated_events_audit') or []:
              if event.get('eligible_for_learning') is not False:
                  raise SystemExit('REVIVAL_FORENSICS_INVALIDATED_EVENT_LEARNING_LEAK')

          print('REVIVAL_LIQUIDITY_LEARNING_OK', d.get('counts'), d.get('learning_summary'))
          print('REVIVAL_WALLET_EVIDENCE_OK', w.get('targets'), bridge)
          print('REVIVAL_FORENSICS_V2_1_OK', f.get('counts'), f.get('wallet500_bridge'))
          PY
      - name: Publish learning, wallet evidence and forensics state
        run: |
          set -euo pipefail
          git config user.name 'wallet500-truth-bot'
          git config user.email 'wallet500-truth-bot@users.noreply.github.com'

          tmp="$(mktemp -d)"
          cp data/revival-liquidity-learning.json "$tmp/revival-liquidity-learning.json"
          cp data/revival-liquidity-learning-state.json "$tmp/revival-liquidity-learning-state.json"
          cp data/revival-wallet-evidence.json "$tmp/revival-wallet-evidence.json"
          cp data/revival-wallet-evidence-state.json "$tmp/revival-wallet-evidence-state.json"
          cp data/revival-forensics-latest.json "$tmp/revival-forensics-latest.json"
          cp data/revival-forensics-state.json "$tmp/revival-forensics-state.json"
          cp data/revival-forensics-dashboard.json "$tmp/revival-forensics-dashboard.json"
          cp data/revival-feature-analysis.json "$tmp/revival-feature-analysis.json"

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp "$tmp/revival-liquidity-learning.json" data/revival-liquidity-learning.json
            cp "$tmp/revival-liquidity-learning-state.json" data/revival-liquidity-learning-state.json
            cp "$tmp/revival-wallet-evidence.json" data/revival-wallet-evidence.json
            cp "$tmp/revival-wallet-evidence-state.json" data/revival-wallet-evidence-state.json
            cp "$tmp/revival-forensics-latest.json" data/revival-forensics-latest.json
            cp "$tmp/revival-forensics-state.json" data/revival-forensics-state.json
            cp "$tmp/revival-forensics-dashboard.json" data/revival-forensics-dashboard.json
            cp "$tmp/revival-feature-analysis.json" data/revival-feature-analysis.json
            git add \
              data/revival-liquidity-learning.json \
              data/revival-liquidity-learning-state.json \
              data/revival-wallet-evidence.json \
              data/revival-wallet-evidence-state.json \
              data/revival-forensics-latest.json \
              data/revival-forensics-state.json \
              data/revival-forensics-dashboard.json \
              data/revival-feature-analysis.json

            if git diff --cached --quiet; then
              echo 'REVIVAL_FORENSICS_NO_DATA_CHANGE'
              exit 0
            fi

            git commit -m 'data: refresh Revival liquidity wallet evidence and forensics'
            if git push origin HEAD:main; then
              echo 'REVIVAL_FORENSICS_PUBLISH_OK'
              exit 0
            fi

            echo "REVIVAL_FORENSICS_PUBLISH_RETRY attempt=$attempt"
            sleep 3
          done

          echo '::error::REVIVAL_FORENSICS_PUBLISH_RACE_EXHAUSTED'
          exit 1
