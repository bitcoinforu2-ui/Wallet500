name: Wallet500 Decision Replay Lab

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/wallet500/decision_replay_lab.py'
      - 'tests/test_decision_replay_lab.py'
      - '.github/workflows/decision-replay-lab.yml'
      - 'data/research-sample-ledger.json'
  schedule:
    - cron: '12 * * * *'

permissions:
  contents: write

concurrency:
  group: wallet500-decision-replay-lab
  cancel-in-progress: true

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install and test Decision Replay contract
        run: |
          pip install -e . pytest
          python -m pytest -q tests/test_decision_replay_lab.py
      - name: Build immutable forward-only replay
        run: python -m wallet500.decision_replay_lab
      - name: Validate research isolation, identity, horizon and promotion contracts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('data/decision-replay-report.json').read_text())
          l=json.loads(Path('data/decision-replay-ledger.json').read_text())
          if r.get('mode')!='RESEARCH_ONLY_DECISION_REPLAY_V1': raise SystemExit('REPLAY_MODE_DRIFT')
          if r.get('research_only') is not True or r.get('production_effect') is not False: raise SystemExit('PRODUCTION_LEAK')
          if r.get('production_thresholds_modified') is not False: raise SystemExit('THRESHOLD_LEAK')
          if l.get('version') != 2 or r.get('version') != 2: raise SystemExit('REPLAY_CONTRACT_VERSION_DRIFT')
          if l.get('identity_contract')!='chain|token_address|pair_address|first_decision_at': raise SystemExit('IDENTITY_CONTRACT_DRIFT')
          if l.get('immutable_t0') is not True: raise SystemExit('IMMUTABLE_T0_LOST')
          if l.get('observation_selection_contract')!='FIRST_RELIABLE_EXACT_PAIR_OBSERVATION_AT_OR_AFTER_TARGET': raise SystemExit('HORIZON_SELECTION_DRIFT')
          g=r.get('guardrails') or {}
          if g.get('no_hindsight_t0_backfill') is not True: raise SystemExit('HINDSIGHT_GUARD_LOST')
          if g.get('exact_pair_required') is not True: raise SystemExit('EXACT_PAIR_GUARD_LOST')
          if g.get('first_observation_at_or_after_horizon_required') is not True: raise SystemExit('FIRST_OBSERVATION_GUARD_LOST')
          if g.get('walk_forward_future_label_leakage_forbidden') is not True: raise SystemExit('LEAKAGE_GUARD_LOST')
          if g.get('minimum_matured_decisions_for_review') != 30: raise SystemExit('MATURED_GATE_DRIFT')
          if g.get('minimum_validation_windows_for_review') != 2: raise SystemExit('WINDOW_GATE_DRIFT')
          if g.get('production_changes') is not False or g.get('telegram_changes') is not False: raise SystemExit('RESEARCH_ISOLATION_LOST')
          wf=r.get('walk_forward') or {}
          gate=r.get('promotion_gate') or {}
          if gate.get('minimum_matured_decisions') != 30: raise SystemExit('PROMOTION_MATURED_GATE_DRIFT')
          if gate.get('minimum_valid_non_overlapping_validation_windows') != 2: raise SystemExit('PROMOTION_WINDOW_GATE_DRIFT')
          if gate.get('promotion_scope') != 'RESEARCH_REVIEW_ONLY_NEVER_AUTOMATIC_PRODUCTION_PROMOTION': raise SystemExit('PROMOTION_SCOPE_DRIFT')
          hard=gate.get('hard_prerequisites') or {}
          if gate.get('status') == 'READY_FOR_REVIEW':
              if wf.get('matured_decisions', 0) < 30: raise SystemExit('ILLEGAL_READY_LT_30')
              if wf.get('valid_validation_windows', 0) < 2: raise SystemExit('ILLEGAL_READY_LT_2_WINDOWS')
              if not hard or not all(hard.values()): raise SystemExit('ILLEGAL_READY_HARD_PREREQ_FAILURE')
          expected={'A_CURRENT_PRODUCTION','B_ACCELERATION_TURNOVER','C_LIQUIDITY_SURVIVAL','D_WALLET_CAPITAL_SOCIAL','E_WINNER_DNA_PERSISTENCE'}
          if set((r.get('policies') or {}).keys()) != expected: raise SystemExit('SHADOW_POLICY_SET_DRIFT')
          print('DECISION_REPLAY_VALID', r.get('sample'), gate)
          PY
      - name: Publish replay state atomically
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "wallet500-research-bot"
          git config user.email "wallet500-research-bot@users.noreply.github.com"
          python scripts/atomic_publish.py \
            --message 'research: refresh decision replay lab' \
            data/decision-replay-ledger.json \
            data/decision-replay-report.json
