name: Wallet500 Decision Replay Lab

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/wallet500/decision_replay_lab.py'
      - 'tests/test_decision_replay_lab.py'
      - '.github/workflows/decision-replay-lab.yml'
      - 'data/research-sample-ledger.json'
  schedule:
    - cron: '12 * * * *'

permissions:
  contents: write

concurrency:
  group: wallet500-decision-replay-lab
  cancel-in-progress: true

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install and test Decision Replay contract
        run: |
          pip install -e . pytest
          python -m pytest -q tests/test_decision_replay_lab.py
      - name: Build immutable forward-only replay
        run: python -m wallet500.decision_replay_lab
      - name: Validate research isolation and identity contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('data/decision-replay-report.json').read_text())
          l=json.loads(Path('data/decision-replay-ledger.json').read_text())
          if r.get('mode')!='RESEARCH_ONLY_DECISION_REPLAY_V1': raise SystemExit('REPLAY_MODE_DRIFT')
          if r.get('research_only') is not True or r.get('production_effect') is not False: raise SystemExit('PRODUCTION_LEAK')
          if r.get('production_thresholds_modified') is not False: raise SystemExit('THRESHOLD_LEAK')
          if l.get('identity_contract')!='chain|token_address|pair_address|first_decision_at': raise SystemExit('IDENTITY_CONTRACT_DRIFT')
          if l.get('immutable_t0') is not True: raise SystemExit('IMMUTABLE_T0_LOST')
          g=r.get('guardrails') or {}
          if g.get('no_hindsight_t0_backfill') is not True: raise SystemExit('HINDSIGHT_GUARD_LOST')
          if g.get('exact_pair_required') is not True: raise SystemExit('EXACT_PAIR_GUARD_LOST')
          if g.get('production_changes') is not False or g.get('telegram_changes') is not False: raise SystemExit('RESEARCH_ISOLATION_LOST')
          print('DECISION_REPLAY_VALID', r.get('sample'), r.get('promotion_gate'))
          PY
      - name: Publish replay state atomically
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "wallet500-research-bot"
          git config user.email "wallet500-research-bot@users.noreply.github.com"
          python scripts/atomic_publish.py \
            --message 'research: refresh decision replay lab' \
            data/decision-replay-ledger.json \
            data/decision-replay-report.json
