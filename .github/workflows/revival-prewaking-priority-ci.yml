name: Wallet500 PRE-WAKING Activity Priority CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/wallet500/revival_prewaking_wallet_evidence.py'
      - 'tests/test_revival_prewaking_rotation.py'
      - 'tests/test_revival_prewaking_activity_priority.py'
      - '.github/workflows/revival-prewaking-priority-ci.yml'
  push:
    branches: [main]
    paths:
      - 'src/wallet500/revival_prewaking_wallet_evidence.py'
      - 'tests/test_revival_prewaking_rotation.py'
      - 'tests/test_revival_prewaking_activity_priority.py'
      - '.github/workflows/revival-prewaking-priority-ci.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e . pytest
      - name: Rotation + activity-priority tests
        run: python -m pytest -q tests/test_revival_prewaking_rotation.py tests/test_revival_prewaking_activity_priority.py
      - name: Research-only scheduling contract
        run: |
          python - <<'PY'
          from wallet500 import revival_prewaking_wallet_evidence as m
          assert m.ACTIVE_LIQUIDITY_USD >= 50000
          assert m.WARM_LIQUIDITY_USD > 0
          assert m.ACTIVE_VOLUME_24H_USD > m.WARM_VOLUME_24H_USD
          print('PREWAKING_ACTIVITY_PRIORITY_OK')
          PY
