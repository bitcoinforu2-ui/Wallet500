name: Wallet500 Revival Holder Tracker

on:
  workflow_dispatch:
  schedule:
    - cron: '12,42 * * * *'
  push:
    branches: [main]
    paths:
      - 'src/wallet500/revival_holder_tracker.py'
      - 'src/wallet500/solscan_holder_truth.py'
      - 'src/wallet500/holder_truth_guard.py'
      - 'tests/test_solscan_holder_truth.py'
      - 'tests/test_holder_truth_guard.py'
      - '.github/workflows/revival-holder-tracker.yml'

permissions:
  contents: write

concurrency:
  group: wallet500-main-data-publisher
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -e . pytest
      - name: Verify holder truth tests
        run: python -m pytest -q tests/test_holder_truth_guard.py tests/test_solscan_holder_truth.py
      - name: Track trusted forward holder evidence
        env:
          REVIVAL_HOLDER_BATCH: '30'
          SOLSCAN_API_KEY: ${{ secrets.SOLSCAN_API_KEY }}
        run: python -m wallet500.revival_holder_tracker
      - name: Fail closed unsafe holder-count semantics
        run: python -m wallet500.holder_truth_guard
      - name: Validate holder truth contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/revival-holder-latest.json')
          s=Path('data/revival-holder-state.json')
          g=Path('data/holder-truth-status.json')
          if not p.exists() or not s.exists() or not g.exists(): raise SystemExit('REVIVAL_HOLDER_OUTPUT_MISSING')
          d=json.loads(p.read_text())
          guard=json.loads(g.read_text())
          if d.get('mode')!='RESEARCH_ONLY_REVIVAL_HOLDER_TRACKER_V2': raise SystemExit('REVIVAL_HOLDER_MODE_INVALID')
          if d.get('network')!='solana' or d.get('production_portfolio_impact')!='NONE' or d.get('no_hindsight') is not True: raise SystemExit('REVIVAL_HOLDER_TRUTH_INVALID')
          if 'NEVER FABRICATE RETROACTIVE HOLDER COUNT' not in str(d.get('truth_rule')): raise SystemExit('REVIVAL_HOLDER_NO_RETROACTIVE_RULE_MISSING')
          if d.get('growth_fail_closed') is not True: raise SystemExit('REVIVAL_HOLDER_FAIL_CLOSED_MISSING')
          if guard.get('mode')!='HOLDER_TRUTH_FAIL_CLOSED_V1': raise SystemExit('HOLDER_TRUTH_GUARD_INVALID')
          for x in d.get('coins') or []:
              if x.get('source')=='RUGCHECK_EXACT_MINT_PUBLIC_REPORT':
                  if x.get('holder_count') is not None or x.get('growth_eligible') is not False: raise SystemExit('RUGCHECK_TRUTH_LEAK')
              if x.get('holder_truth_status')=='ANOMALY_REQUIRES_SECOND_SOURCE' and x.get('growth_eligible') is not False:
                  raise SystemExit('ANOMALOUS_JUMP_NOT_BLOCKED')
              if x.get('source')=='SOLSCAN_V2_TOKEN_HOLDERS_TOTAL' and x.get('holder_count') is not None:
                  if x.get('holder_truth_status')!='FORWARD_VERIFIED' or x.get('growth_eligible') is not True: raise SystemExit('SOLSCAN_TRUTH_NOT_MARKED')
                  if x.get('first_holder_count') is not None and x.get('holder_growth_count') is not None:
                      if int(x['holder_growth_count']) != int(x['holder_count'])-int(x['first_holder_count']): raise SystemExit('REVIVAL_HOLDER_DELTA_MISMATCH')
          print('REVIVAL_HOLDER_V2_OK', {'configured':d.get('provider_configured'),'success':d.get('successful_this_run'),'covered':d.get('covered')})
          PY
      - name: Publish guarded holder tracker state
        run: |
          set -euo pipefail
          git config user.name 'wallet500-truth-bot'
          git config user.email 'wallet500-truth-bot@users.noreply.github.com'
          tmp="$(mktemp -d)"
          cp data/revival-holder-latest.json "$tmp/latest.json"
          cp data/revival-holder-state.json "$tmp/state.json"
          cp data/holder-truth-status.json "$tmp/guard.json"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp "$tmp/latest.json" data/revival-holder-latest.json
            cp "$tmp/state.json" data/revival-holder-state.json
            cp "$tmp/guard.json" data/holder-truth-status.json
            git add data/revival-holder-latest.json data/revival-holder-state.json data/holder-truth-status.json
            if git diff --cached --quiet; then echo 'REVIVAL_HOLDER_NO_CHANGE'; exit 0; fi
            git commit -m 'data: refresh trusted Revival holder tracker'
            if git push origin HEAD:main; then echo 'REVIVAL_HOLDER_PUBLISH_OK'; exit 0; fi
            echo "REVIVAL_HOLDER_PUBLISH_RETRY attempt=$attempt"
            sleep 3
          done
          echo '::error::REVIVAL_HOLDER_PUBLISH_RACE_EXHAUSTED'
          exit 1
