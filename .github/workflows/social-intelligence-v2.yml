name: Wallet500 Social Intelligence V2

on:
  workflow_dispatch:
  schedule:
    - cron: '23,53 * * * *'
  pull_request:
    branches: [main]
    paths:
      - 'src/wallet500/social_feed_scan.py'
      - 'src/wallet500/social_feed_scan_v2.py'
      - 'src/wallet500/social_feed_scan_v3.py'
      - 'src/wallet500/social_feed_scan_v4.py'
      - 'src/wallet500/social_feed_scan_v5.py'
      - 'src/wallet500/social_direct_providers.py'
      - 'src/wallet500/social_mesh_providers.py'
      - 'src/wallet500/social_bluesky_resilient.py'
      - 'src/wallet500/social_mesh_public_index.py'
      - 'src/wallet500/social_telegram_truth_hardening.py'
      - 'src/wallet500/social_source_health_history.py'
      - 'src/wallet500/social_provider_budget_advisor.py'
      - 'src/wallet500/social_intelligence_v2.py'
      - 'src/wallet500/social_mesh_intelligence_enrichment.py'
      - 'src/wallet500/social_mesh_index_intelligence_enrichment.py'
      - 'src/wallet500/social_organic_acceleration.py'
      - 'src/wallet500/social_coverage_hardening.py'
      - 'src/wallet500/cross_signal_fusion_v2.py'
      - 'tests/test_social_intelligence_v2.py'
      - 'tests/test_social_feed_scan_v2.py'
      - 'tests/test_social_direct_providers.py'
      - 'tests/test_social_mesh_providers.py'
      - 'tests/test_social_bluesky_resilient.py'
      - 'tests/test_social_mesh_public_index.py'
      - 'tests/test_social_telegram_truth_hardening.py'
      - 'tests/test_social_source_health.py'
      - 'tests/test_social_source_health_history.py'
      - 'tests/test_social_provider_budget_advisor.py'
      - 'tests/test_social_coverage_hardening.py'
      - 'tests/test_cross_signal_fusion_v2.py'
      - 'tests/test_social_organic_acceleration.py'
      - '.github/workflows/social-intelligence-v2.yml'
  push:
    branches: [main]
    paths:
      - 'src/wallet500/social_feed_scan.py'
      - 'src/wallet500/social_feed_scan_v2.py'
      - 'src/wallet500/social_feed_scan_v3.py'
      - 'src/wallet500/social_feed_scan_v4.py'
      - 'src/wallet500/social_feed_scan_v5.py'
      - 'src/wallet500/social_direct_providers.py'
      - 'src/wallet500/social_mesh_providers.py'
      - 'src/wallet500/social_bluesky_resilient.py'
      - 'src/wallet500/social_mesh_public_index.py'
      - 'src/wallet500/social_telegram_truth_hardening.py'
      - 'src/wallet500/social_source_health_history.py'
      - 'src/wallet500/social_provider_budget_advisor.py'
      - 'src/wallet500/social_intelligence_v2.py'
      - 'src/wallet500/social_mesh_intelligence_enrichment.py'
      - 'src/wallet500/social_mesh_index_intelligence_enrichment.py'
      - 'src/wallet500/social_organic_acceleration.py'
      - 'src/wallet500/social_coverage_hardening.py'
      - 'src/wallet500/cross_signal_fusion_v2.py'
      - 'tests/test_social_intelligence_v2.py'
      - 'tests/test_social_feed_scan_v2.py'
      - 'tests/test_social_direct_providers.py'
      - 'tests/test_social_mesh_providers.py'
      - 'tests/test_social_bluesky_resilient.py'
      - 'tests/test_social_mesh_public_index.py'
      - 'tests/test_social_telegram_truth_hardening.py'
      - 'tests/test_social_source_health.py'
      - 'tests/test_social_source_health_history.py'
      - 'tests/test_social_provider_budget_advisor.py'
      - 'tests/test_social_coverage_hardening.py'
      - 'tests/test_cross_signal_fusion_v2.py'
      - 'tests/test_social_organic_acceleration.py'
      - '.github/workflows/social-intelligence-v2.yml'

permissions:
  contents: write

concurrency:
  group: wallet500-social-intelligence-v2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  social:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -e . pytest 'telethon>=1.43,<2'

      - name: Unit tests
        run: >-
          python -m pytest -q
          tests/test_social_intelligence_v2.py
          tests/test_social_feed_scan_v2.py
          tests/test_social_direct_providers.py
          tests/test_social_mesh_providers.py
          tests/test_social_bluesky_resilient.py
          tests/test_social_mesh_public_index.py
          tests/test_social_telegram_truth_hardening.py
          tests/test_social_source_health.py
          tests/test_social_source_health_history.py
          tests/test_social_provider_budget_advisor.py
          tests/test_social_coverage_hardening.py
          tests/test_cross_signal_fusion_v2.py
          tests/test_social_organic_acceleration.py

      - name: Social resilience V5 self-test
        run: python -m wallet500.social_feed_scan_v5 --self-test

      - name: Scan direct social providers, Social Mesh and public index
        env:
          SOCIAL_SCAN_BUDGET: '24'
          SOCIAL_SCAN_PRIORITY_SLOTS: '8'
          X_DIRECT_SLOTS: '1'
          YOUTUBE_DIRECT_SLOTS: '1'
          REDDIT_DIRECT_SLOTS: '6'
          TELEGRAM_DIRECT_SLOTS: '4'
          FARCASTER_DIRECT_SLOTS: '6'
          DISCORD_DIRECT_SLOTS: '6'
          THREADS_DIRECT_SLOTS: '6'
          BLUESKY_DIRECT_SLOTS: '12'
          MESH_PUBLIC_INDEX_SLOTS: '8'
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USER_AGENT: ${{ vars.REDDIT_USER_AGENT || 'Wallet500/3.1 by bitcoinforu2-ui' }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          NEYNAR_API_KEY: ${{ secrets.NEYNAR_API_KEY }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_IDS: ${{ vars.DISCORD_GUILD_IDS }}
          DISCORD_CHANNEL_IDS: ${{ vars.DISCORD_CHANNEL_IDS }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          BSKY_IDENTIFIER: ${{ secrets.BSKY_IDENTIFIER }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
          COINGECKO_DEMO_API_KEY: ${{ secrets.COINGECKO_DEMO_API_KEY }}
        run: python -m wallet500.social_feed_scan_v5

      - name: Record observability-only provider health history
        run: python -m wallet500.social_source_health_history

      - name: Build observability-only provider budget advisor
        run: python -m wallet500.social_provider_budget_advisor

      - name: Recompute organic acceleration
        run: python -m wallet500.social_organic_acceleration

      - name: Build Social Intelligence V2
        run: python -m wallet500.social_intelligence_v2

      - name: Harden missing channels as unknown not zero
        run: python -m wallet500.social_coverage_hardening

      - name: Enrich intelligence with Social Mesh exact evidence
        run: python -m wallet500.social_mesh_intelligence_enrichment

      - name: Enrich indexed mesh context without score credit
        run: python -m wallet500.social_mesh_index_intelligence_enrichment

      - name: Build research-only cross-signal fusion
        run: python -m wallet500.cross_signal_fusion_v2

      - name: Validate truth contract, direct identity and Social Mesh
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('data/social-source-scan.json').read_text())
          h=json.loads(Path('data/social-source-health-history.json').read_text())
          a=json.loads(Path('data/social-provider-budget-advisor.json').read_text())
          o=json.loads(Path('data/social-organic-acceleration.json').read_text())
          i=json.loads(Path('data/social-intelligence-v2.json').read_text())
          f=json.loads(Path('data/cross-signal-fusion-v2.json').read_text())
          cache=json.loads(Path('data/social-identity-cache.json').read_text())
          if s.get('mode')!='RESEARCH_ONLY_SOCIAL_SOURCE_SCAN_V1': raise SystemExit('SOCIAL_SCAN_MODE_INVALID')
          if h.get('mode')!='SOCIAL_SOURCE_HEALTH_HISTORY_OBSERVABILITY_ONLY_V2': raise SystemExit('SOURCE_HEALTH_HISTORY_MODE_INVALID')
          if h.get('observability_only') is not True or h.get('production_effect') is not False or h.get('automatic_buy') is not False: raise SystemExit('SOURCE_HEALTH_HISTORY_PRODUCTION_LEAK')
          htruth=h.get('truth_contract') or {}
          for key in ('provider_health_never_modifies_token_scores','provider_health_never_modifies_alert_gate','provider_health_never_auto_changes_api_budgets','single_run_never_changes_provider_policy','secret_values_never_stored','unknown_is_not_zero','configuration_is_not_evidence','call_efficiency_is_observability_only'):
              if htruth.get(key) is not True: raise SystemExit('SOURCE_HEALTH_HISTORY_TRUTH_MISSING:'+key)
          if int(h.get('runs_count') or 0)<1: raise SystemExit('SOURCE_HEALTH_HISTORY_EMPTY')
          for provider,row in (h.get('provider_rollup') or {}).items():
              if row.get('budget_recommendation_effect')!='NONE_OBSERVE_ONLY': raise SystemExit('SOURCE_HEALTH_HISTORY_BUDGET_POLICY_LEAK:'+provider)

          if a.get('mode')!='SOCIAL_PROVIDER_BUDGET_ADVISOR_OBSERVABILITY_ONLY_V1': raise SystemExit('SOCIAL_BUDGET_ADVISOR_MODE_INVALID')
          if a.get('observability_only') is not True or a.get('production_effect') is not False or a.get('automatic_budget_changes') is not False or a.get('automatic_buy') is not False: raise SystemExit('SOCIAL_BUDGET_ADVISOR_PRODUCTION_LEAK')
          if int(a.get('history_runs_count') or 0)!=int(h.get('runs_count') or 0): raise SystemExit('SOCIAL_BUDGET_ADVISOR_HISTORY_SKEW')
          atruth=a.get('truth_contract') or {}
          for key in ('recommendations_never_modify_api_budgets','recommendations_never_modify_token_scores','recommendations_never_modify_alert_gate','single_run_never_produces_budget_change_advice','unknown_is_not_zero','not_configured_is_not_bad_evidence','indexed_context_never_counts_as_direct_efficiency'):
              if atruth.get(key) is not True: raise SystemExit('SOCIAL_BUDGET_ADVISOR_TRUTH_MISSING:'+key)
          for row in a.get('providers') or []:
              if row.get('automatic_change') is not False: raise SystemExit('SOCIAL_BUDGET_ADVISOR_AUTO_CHANGE_LEAK')
              if row.get('suggested_budget_delta') is not None: raise SystemExit('SOCIAL_BUDGET_ADVISOR_NUMERIC_DELTA_LEAK')
              if row.get('score_effect')!='NONE_PROVIDER_POLICY_ADVICE_ONLY': raise SystemExit('SOCIAL_BUDGET_ADVISOR_SCORE_LEAK')
              if row.get('alert_gate_effect')!='NONE': raise SystemExit('SOCIAL_BUDGET_ADVISOR_ALERT_LEAK')
          if int(h.get('runs_count') or 0)<int(a.get('minimum_runs_for_policy_advice') or 6):
              forbidden={'CANDIDATE_INCREASE_AFTER_HUMAN_REVIEW','CANDIDATE_DECREASE_AFTER_HUMAN_REVIEW'}
              if any(row.get('recommendation') in forbidden for row in (a.get('providers') or [])): raise SystemExit('SOCIAL_BUDGET_ADVISOR_EARLY_POLICY_ADVICE')

          if i.get('mode')!='RESEARCH_ONLY_SOCIAL_INTELLIGENCE_V2': raise SystemExit('SOCIAL_INTELLIGENCE_MODE_INVALID')
          if f.get('mode')!='RESEARCH_ONLY_CROSS_SIGNAL_FUSION_V2': raise SystemExit('FUSION_MODE_INVALID')
          if i.get('automatic_buy') is not False or f.get('automatic_buy') is not False: raise SystemExit('SOCIAL_PRODUCTION_LEAK')
          truth=i.get('truth_contract') or {}
          if truth.get('missing_channel_is_unknown_not_zero') is not True: raise SystemExit('UNKNOWN_ZERO_TRUTH_MISSING')
          if truth.get('indexed_exact_mentions_are_context_only_not_organic') is not True: raise SystemExit('INDEX_CONTEXT_TRUTH_MISSING')
          if truth.get('social_mesh_sources_enabled') is not True: raise SystemExit('SOCIAL_MESH_TRUTH_MISSING')
          if truth.get('mesh_name_symbol_context_is_not_organic') is not True: raise SystemExit('SOCIAL_MESH_CONTEXT_LEAK')
          if truth.get('telegram_official_context_requires_author_match') is not True: raise SystemExit('TELEGRAM_OFFICIAL_ATTRIBUTION_WEAK')
          if truth.get('mesh_public_index_is_context_only_not_organic') is not True: raise SystemExit('MESH_INDEX_ORGANIC_LEAK')
          if truth.get('mesh_public_index_never_grants_kol_credit') is not True: raise SystemExit('MESH_INDEX_KOL_LEAK')
          if (f.get('truth_contract') or {}).get('does_not_modify_real_alert_gate') is not True: raise SystemExit('REAL_ALERT_GATE_LEAK')
          if (s.get('selection_policy') or {}).get('rotation_enabled') is not True: raise SystemExit('SOCIAL_ROTATION_MISSING')
          q=s.get('identity_query_contract') or {}
          if q.get('primary')!='EXACT_TOKEN_MINT': raise SystemExit('SOCIAL_MINT_IDENTITY_MISSING')
          if q.get('secondary')!='EXACT_PAIR_ADDRESS': raise SystemExit('SOCIAL_PAIR_IDENTITY_MISSING')
          if q.get('indexed_exact_context_is_organic') is not False: raise SystemExit('INDEX_CONTEXT_ORGANIC_LEAK')
          accepted=set(q.get('accepted_into_social_ledger') or [])
          if not {'EXACT_CONTRACT','EXACT_PAIR','OFFICIAL_CHANNEL_CONTEXT'} <= accepted: raise SystemExit('SOCIAL_ATTRIBUTION_CONTRACT_MISSING')

          cfg=s.get('direct_provider_config') or {}
          for key in ('x','youtube','reddit_oauth','reddit_public','telegram_public_direct'):
              if key not in cfg or not isinstance(cfg[key], bool): raise SystemExit('DIRECT_PROVIDER_CONFIG_INVALID:'+key)
          if cfg.get('reddit_public') is not True: raise SystemExit('REDDIT_PUBLIC_FALLBACK_DISABLED')
          budget=s.get('direct_provider_budget') or {}
          calls=s.get('direct_provider_calls_used') or {}
          expected={'x':1,'youtube':1,'reddit':6}
          for key,limit in expected.items():
              if budget.get(key)!=limit: raise SystemExit('DIRECT_PROVIDER_BUDGET_INVALID:'+key)
              used=calls.get(key)
              if not isinstance(used,int) or used<0 or used>limit: raise SystemExit('DIRECT_PROVIDER_CALL_OVER_BUDGET:'+key)

          mesh_cfg=s.get('mesh_provider_config') or {}
          for key in ('telegram_mtproto','farcaster_neynar','discord_watch','threads_keyword','bluesky_public'):
              if key not in mesh_cfg or not isinstance(mesh_cfg[key], bool): raise SystemExit('MESH_PROVIDER_CONFIG_INVALID:'+key)
          if mesh_cfg.get('bluesky_public') is not True: raise SystemExit('BLUESKY_PUBLIC_DISABLED')
          mesh_budget=s.get('mesh_provider_budget') or {}
          mesh_calls=s.get('mesh_provider_calls_used') or {}
          mesh_expected={'telegram_mtproto':4,'farcaster':6,'discord':6,'threads':6,'bluesky':12}
          for key,limit in mesh_expected.items():
              if mesh_budget.get(key)!=limit: raise SystemExit('MESH_PROVIDER_BUDGET_INVALID:'+key)
              used=mesh_calls.get(key)
              if not isinstance(used,int) or used<0 or used>limit: raise SystemExit('MESH_PROVIDER_CALL_OVER_BUDGET:'+key)
          mesh_meta=s.get('social_mesh') or {}
          if mesh_meta.get('enabled') is not True: raise SystemExit('SOCIAL_MESH_NOT_ENABLED')
          if mesh_meta.get('official_telegram_requires_author_match') is not True: raise SystemExit('TELEGRAM_AUTHOR_MATCH_DISABLED')
          index_meta=s.get('mesh_public_index') or {}
          if index_meta.get('enabled') is not True: raise SystemExit('MESH_PUBLIC_INDEX_DISABLED')
          if index_meta.get('organic_eligible') is not False: raise SystemExit('MESH_PUBLIC_INDEX_ORGANIC_LEAK')
          if index_meta.get('budget')!=8: raise SystemExit('MESH_PUBLIC_INDEX_BUDGET_INVALID')

          tg=s.get('telegram_truth_hardening') or {}
          if tg.get('timestamp_required') is not True: raise SystemExit('TELEGRAM_TIMESTAMP_REQUIREMENT_DISABLED')
          if tg.get('official_author_match_required') is not True: raise SystemExit('TELEGRAM_OFFICIAL_AUTHOR_MATCH_DISABLED')
          if int(tg.get('status_contract_violations') or 0)!=0: raise SystemExit('TELEGRAM_TIMESTAMP_STATUS_CONTRACT_VIOLATION')
          if int(tg.get('timestamped_messages') or 0)!=int(tg.get('messages_accepted') or 0): raise SystemExit('TELEGRAM_UNTIMESTAMPED_MESSAGE_ACCEPTED')
          if tg.get('freshness_source')!='TELEGRAM_ORIGINAL_DATETIME': raise SystemExit('TELEGRAM_FRESHNESS_SOURCE_INVALID')

          health=s.get('source_health') or {}
          shealth_truth=health.get('truth') or {}
          for key in ('configuration_is_not_evidence','index_context_never_counts_as_organic','provider_health_does_not_modify_token_scores','secret_values_never_exposed','traffic_light_is_observability_only','not_configured_is_amber_not_failure','fallback_recovered_is_amber_not_green','red_requires_expected_failure_without_usable_recovery'):
              if shealth_truth.get(key) is not True: raise SystemExit('SOURCE_HEALTH_TRUTH_MISSING:'+key)
          providers=health.get('providers') or {}
          expected_providers={'x','youtube','reddit','telegram_official','telegram_mtproto','farcaster','discord','threads','bluesky','social_mesh_public_index'}
          if not expected_providers <= set(providers): raise SystemExit('SOURCE_HEALTH_PROVIDER_COVERAGE_MISSING')
          valid_states={'ACTIVE_EXACT_EVIDENCE','ACTIVE_OFFICIAL_CONTEXT','INDEX_CONTEXT_ONLY','DEGRADED_UNKNOWN','NOT_CONFIGURED','ACTIVE_NO_EXACT_EVIDENCE','UNKNOWN'}
          for provider,row in providers.items():
              if row.get('state') not in valid_states: raise SystemExit('SOURCE_HEALTH_STATE_INVALID:'+provider)
              if row.get('unknown_is_not_zero') is not True: raise SystemExit('SOURCE_HEALTH_UNKNOWN_ZERO_LEAK:'+provider)
              if row.get('score_effect')!='NONE_PROVIDER_HEALTH_ONLY': raise SystemExit('SOURCE_HEALTH_SCORE_LEAK:'+provider)
              if row.get('traffic_light') not in {'GREEN','AMBER','RED'}: raise SystemExit('SOURCE_HEALTH_TRAFFIC_LIGHT_INVALID:'+provider)
          resilience=s.get('provider_resilience') or {}
          if resilience.get('production_effect') is not False or resilience.get('automatic_buy') is not False: raise SystemExit('PROVIDER_RESILIENCE_PRODUCTION_LEAK')
          rtruth=resilience.get('truth') or {}
          for key in ('cache_never_overrides_exact_pair_identity','stale_cache_is_optional_metadata_only','index_recovery_never_counts_as_direct_organic_evidence','not_configured_is_unknown_not_zero','red_requires_failure_without_usable_recovery','provider_health_never_modifies_token_scores','provider_health_never_modifies_alert_gate'):
              if rtruth.get(key) is not True: raise SystemExit('PROVIDER_RESILIENCE_TRUTH_MISSING:'+key)
          if cache.get('secret_values_stored') is not False: raise SystemExit('IDENTITY_CACHE_SECRET_LEAK')
          if int(cache.get('ttl_hours') or 0)!=24: raise SystemExit('IDENTITY_CACHE_TTL_INVALID')

          formats=set(o.get('timestamp_formats_supported') or [])
          if not {'ISO8601','UNIX_EPOCH','RFC2822'} <= formats: raise SystemExit('SOCIAL_TIMESTAMP_FORMAT_SUPPORT_MISSING')
          for row in i.get('tokens') or []:
              av=row.get('availability') or {}; scores=row.get('scores') or {}
              if av.get('social_momentum') is False and scores.get('social_momentum') is not None: raise SystemExit('SOCIAL_UNKNOWN_RENDERED_AS_ZERO')
              if av.get('kol_quality') is False and scores.get('kol_quality') is not None: raise SystemExit('KOL_UNKNOWN_RENDERED_AS_ZERO')
              if av.get('news_catalyst') is False and scores.get('news_catalyst') is not None: raise SystemExit('NEWS_UNKNOWN_RENDERED_AS_ZERO')
          for row in f.get('tokens') or []:
              if row.get('production_effect') is not False or row.get('automatic_buy') is not False: raise SystemExit('FUSION_ROW_PRODUCTION_LEAK')
              if row.get('risk',{}).get('hard_blockers') and row.get('fusion_status')!='HARD_TRUTH_BLOCKED': raise SystemExit('HARD_BLOCKER_OVERRIDE')
          print('SOCIAL_MESH_V11_OK', 'history_runs=', h.get('runs_count'), 'advisor=', a.get('counts'), 'telegram_truth=', tg, 'source_health=', health.get('summary'), 'traffic=', health.get('traffic_light_summary'), 'resilience=', resilience.get('identity_cache'), 'mesh_cfg=', mesh_cfg, 'mesh_breakers=', s.get('mesh_provider_circuit_breakers'), 'index=', index_meta, i.get('counts'), f.get('counts'))
          PY

      - name: Publish social intelligence snapshot
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'wallet500-social-bot'
          git config user.email 'wallet500-social-bot@users.noreply.github.com'
          tmp="$(mktemp -d)"
          for f in social-source-scan.json social-identity-cache.json social-catalyst-ledger.json social-organic-acceleration.json social-intelligence-v2.json cross-signal-fusion-v2.json; do cp "data/$f" "$tmp/$f"; done
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            for f in social-source-scan.json social-identity-cache.json social-catalyst-ledger.json social-organic-acceleration.json social-intelligence-v2.json cross-signal-fusion-v2.json; do cp "$tmp/$f" "data/$f"; done
            python -m wallet500.social_source_health_history
            python -m wallet500.social_provider_budget_advisor
            python -m wallet500.social_intelligence_v2
            python -m wallet500.social_coverage_hardening
            python -m wallet500.social_mesh_intelligence_enrichment
            python -m wallet500.social_mesh_index_intelligence_enrichment
            python -m wallet500.cross_signal_fusion_v2
            git add data/social-source-scan.json data/social-identity-cache.json data/social-source-health-history.json data/social-provider-budget-advisor.json data/social-catalyst-ledger.json data/social-organic-acceleration.json data/social-intelligence-v2.json data/cross-signal-fusion-v2.json
            if git diff --cached --quiet; then echo 'SOCIAL_V11_NO_DATA_CHANGE'; exit 0; fi
            git commit -m 'data: refresh social resilience and provider health v11'
            if git push origin HEAD:main; then echo 'SOCIAL_MESH_V11_PUBLISH_OK'; exit 0; fi
            echo "SOCIAL_MESH_V11_RETRY attempt=$attempt"
            sleep 3
          done
          echo '::error::SOCIAL_MESH_V11_PUBLISH_RACE_EXHAUSTED'
          exit 1
