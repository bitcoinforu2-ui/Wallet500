name: Wallet500 Holder Concentration Shadow

on:
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/holder-concentration-shadow.yml'
      - 'src/wallet500/holder_concentration_shadow.py'
      - 'tests/test_holder_concentration_shadow.py'

permissions:
  contents: write

concurrency:
  group: holder-concentration-shadow
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -e . pytest
      - name: Verify concentration shadow truth rules
        run: python -m pytest -q tests/test_holder_concentration_shadow.py
      - name: Scan priority exact-mint holder concentration
        env:
          HOLDER_CONCENTRATION_BUDGET: '16'
        run: python -m wallet500.holder_concentration_shadow
      - name: Validate concentration shadow contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from wallet500.revival_1000 import looks_like_solana_address

          p=Path('data/holder-concentration-shadow.json')
          s=Path('data/holder-concentration-shadow-state.json')
          if not p.exists() or not p.stat().st_size or not s.exists() or not s.stat().st_size:
              raise SystemExit('HOLDER_CONCENTRATION_SHADOW_OUTPUT_MISSING')
          d=json.loads(p.read_text())
          if d.get('mode')!='RESEARCH_ONLY_HOLDER_CONCENTRATION_SHADOW_V1':
              raise SystemExit('HOLDER_CONCENTRATION_SHADOW_MODE_INVALID')
          if d.get('network')!='solana' or d.get('production_portfolio_impact')!='NONE' or d.get('no_hindsight') is not True:
              raise SystemExit('HOLDER_CONCENTRATION_SHADOW_TRUTH_INVALID')
          if int(d.get('selected_this_run') or 0) > int(d.get('budget') or 0):
              raise SystemExit('HOLDER_CONCENTRATION_SHADOW_BUDGET_BROKEN')

          concentration_keys={'verified','contract_match','semantics','top1_pct','top5_pct','top10_pct'}
          holder_semantics='THIRD_PARTY_CACHED_HOLDER_COUNT_SHADOW_NOT_TRUSTED_GROWTH'
          for row in d.get('rows') or []:
              if not looks_like_solana_address(str(row.get('token_address') or '')):
                  raise SystemExit('HOLDER_CONCENTRATION_SHADOW_MINT_INVALID')
              if row.get('hybrid_score_impact')!='NONE':
                  raise SystemExit('HOLDER_CONCENTRATION_SHADOW_SCORE_LEAK')
              if row.get('positive_signal_eligible') not in (None, False):
                  raise SystemExit('HOLDER_CONCENTRATION_SHADOW_POSITIVE_SIGNAL_LEAK')
              if row.get('growth_signal_eligible') not in (None, False):
                  raise SystemExit('HOLDER_CONCENTRATION_SHADOW_GROWTH_SIGNAL_LEAK')

              has_concentration=any(k in row for k in concentration_keys)
              has_holder_shadow=row.get('holder_count_shadow') is not None
              if not has_concentration and not has_holder_shadow:
                  raise SystemExit('HOLDER_CONCENTRATION_SHADOW_EVIDENCE_MISSING')

              if has_concentration:
                  if row.get('verified') is not True or row.get('contract_match') is not True:
                      raise SystemExit('HOLDER_CONCENTRATION_SHADOW_UNVERIFIED_CONCENTRATION')
                  if row.get('positive_signal_eligible') is not False:
                      raise SystemExit('HOLDER_CONCENTRATION_SHADOW_CONCENTRATION_SIGNAL_LEAK')
                  if row.get('semantics')!='TOP_TOKEN_ACCOUNT_CONCENTRATION_NOT_OWNER_CLUSTER_CONCENTRATION':
                      raise SystemExit('HOLDER_CONCENTRATION_SHADOW_SEMANTICS_INVALID')
                  for key in ('top1_pct','top5_pct','top10_pct'):
                      value=row.get(key)
                      if not isinstance(value,(int,float)) or not (0.0 <= float(value) <= 100.0):
                          raise SystemExit(f'HOLDER_CONCENTRATION_SHADOW_METRIC_INVALID:{key}')

              if has_holder_shadow:
                  shadow_semantics=row.get('holder_shadow_semantics')
                  # Legacy rows written before holder-shadow semantics became explicit
                  # are accepted only when the same row already carries fully verified
                  # concentration evidence. The holder count still remains non-scoring.
                  if shadow_semantics not in (None, holder_semantics):
                      raise SystemExit('HOLDER_CONCENTRATION_SHADOW_HOLDER_SEMANTICS_INVALID')
                  if shadow_semantics is None and not (
                      row.get('verified') is True
                      and row.get('contract_match') is True
                      and row.get('semantics')=='TOP_TOKEN_ACCOUNT_CONCENTRATION_NOT_OWNER_CLUSTER_CONCENTRATION'
                  ):
                      raise SystemExit('HOLDER_CONCENTRATION_SHADOW_LEGACY_HOLDER_UNVERIFIED')
                  if row.get('growth_signal_eligible') is not False:
                      raise SystemExit('HOLDER_CONCENTRATION_SHADOW_HOLDER_SIGNAL_LEAK')
                  count=row.get('holder_count_shadow')
                  if isinstance(count,bool) or not isinstance(count,int) or count < 0:
                      raise SystemExit('HOLDER_CONCENTRATION_SHADOW_HOLDER_COUNT_INVALID')

          print('HOLDER_CONCENTRATION_SHADOW_OK', {'selected':d.get('selected_this_run'),'verified':d.get('verified_this_run'),'total':d.get('total_verified_rows')})
          PY
      - name: Publish concentration shadow state
        run: |
          set -euo pipefail
          git config user.name wallet500-research-bot
          git config user.email wallet500-research-bot@users.noreply.github.com

          # Freeze the already validated outputs before touching the moving main
          # branch. Editable installs may dirty egg-info, and unrelated bots can
          # advance main while this scan is running.
          cp data/holder-concentration-shadow.json /tmp/holder-concentration-shadow.json
          cp data/holder-concentration-shadow-state.json /tmp/holder-concentration-shadow-state.json
          git restore src/wallet500.egg-info/SOURCES.txt 2>/dev/null || true

          for n in 1 2 3 4; do
            git fetch origin main --depth=1
            git reset --hard origin/main
            cp /tmp/holder-concentration-shadow.json data/holder-concentration-shadow.json
            cp /tmp/holder-concentration-shadow-state.json data/holder-concentration-shadow-state.json
            git add data/holder-concentration-shadow.json data/holder-concentration-shadow-state.json

            if git diff --cached --quiet; then
              echo "no holder-concentration shadow changes"
              exit 0
            fi

            python scripts/serialized_publish_staged.py --github-api-cas --message "data: refresh holder concentration shadow [skip ci]"; exit $?
            if false; then
              exit 0
            fi

            echo "holder-concentration push race ${n}; replaying validated outputs on latest main"
            sleep $((n * 2))
          done

          echo '::error::HOLDER_CONCENTRATION_SHADOW_PUBLISH_RACE_EXHAUSTED'
          exit 1
