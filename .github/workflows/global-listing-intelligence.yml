name: Wallet500 Global Listing Intelligence

on:
  workflow_dispatch:
  schedule:
    - cron: '4,19,34,49 * * * *'
  push:
    branches: [main]
    paths:
      - 'src/wallet500/global_listing_intelligence.py'
      - 'src/wallet500/cross_source_correlation.py'
      - 'tests/test_global_listing_evm_core.py'
      - 'tests/test_cross_source_correlation.py'
      - '.github/workflows/global-listing-intelligence.yml'

permissions:
  contents: write

# Source collection is independent. It must keep polling even while Live is
# publishing truth state. Cross-source/manual-watchlist publication is handled
# by the dedicated correlation workflow after this source ledger is persisted.
concurrency:
  group: wallet500-global-listing-source-scan
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Wallet500 and tests
        run: pip install -e . pytest
      - name: Lock listing and cross-source truth policy
        run: pytest -q tests/test_global_listing_evm_core.py tests/test_cross_source_correlation.py
      - name: Run unified exchange pre-listing discovery
        run: python -m wallet500.global_listing_intelligence
      - name: Validate source-ledger truth boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/global-listing-radar.json')
          l=Path('data/global-listing-ledger.json')
          for x in (p,l):
              if not x.exists(): raise SystemExit('FATAL missing '+str(x))
          d=json.loads(p.read_text())
          if d.get('mode')!='GLOBAL_EXCHANGE_PRELISTING_DISCOVERY_FORWARD_ONLY':
              raise SystemExit('FATAL listing engine truth mode changed')
          ledger=json.loads(l.read_text())
          if ledger.get('truth_label')!='PUBLIC_LISTING_DISCOVERY_EVIDENCE_ONLY':
              raise SystemExit('FATAL listing ledger promoted beyond discovery evidence')
          print('LISTING SOURCE LEDGER:',d.get('sources_healthy'),'healthy sources,',d.get('observations'),'observations,',d.get('deep_scan_candidates'),'locally staged candidates')
          PY
      - name: Publish listing source evidence only
        run: |
          set -euo pipefail
          git config user.name 'wallet500-listing-bot'
          git config user.email 'wallet500-listing-bot@users.noreply.github.com'
          # global_listing_intelligence stages a local deep-scan watchlist for
          # backwards compatibility. Never publish it here: the correlated
          # publisher owns manual-watchlist truth state.
          git restore data/manual-watchlist.json 2>/dev/null || true
          git add data/global-listing-radar.json data/global-listing-ledger.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh global listing source evidence [skip ci]'
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort || true
                echo 'GLOBAL_LISTING_PUBLISH_REJECTED: rebase conflict; refusing automatic conflict resolution'
                exit 1
              fi
              if git push origin HEAD:main; then exit 0; fi
              sleep 3
              if [ "$attempt" = 5 ]; then exit 1; fi
            done
          fi
