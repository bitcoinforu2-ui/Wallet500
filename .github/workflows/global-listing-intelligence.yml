name: Wallet500 Global Listing Intelligence

on:
  workflow_dispatch:
  schedule:
    - cron: '4,19,34,49 * * * *'
  push:
    branches: [main]
    paths:
      - 'src/wallet500/global_listing_intelligence.py'
      - '.github/workflows/global-listing-intelligence.yml'

permissions:
  contents: write

concurrency:
  group: wallet500-global-listing-intelligence
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Wallet500
        run: pip install -e .
      - name: Run unified exchange pre-listing discovery
        run: python -m wallet500.global_listing_intelligence
      - name: Validate truth boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/global-listing-radar.json')
          l=Path('data/global-listing-ledger.json')
          w=Path('data/manual-watchlist.json')
          for x in (p,l,w):
              if not x.exists(): raise SystemExit('FATAL missing '+str(x))
          d=json.loads(p.read_text())
          if d.get('mode')!='GLOBAL_EXCHANGE_PRELISTING_DISCOVERY_FORWARD_ONLY':
              raise SystemExit('FATAL listing engine truth mode changed')
          ledger=json.loads(l.read_text())
          if ledger.get('truth_label')!='PUBLIC_LISTING_DISCOVERY_EVIDENCE_ONLY':
              raise SystemExit('FATAL listing ledger promoted beyond discovery evidence')
          rows=json.loads(w.read_text())
          for r in rows:
              if isinstance(r,dict) and r.get('source')=='GLOBAL_LISTING_INTELLIGENCE':
                  if r.get('research_only_until_wallet500_gates_pass') is not True:
                      raise SystemExit('FATAL auto listing candidate bypass flag missing')
          print('LISTING RADAR:',d.get('sources_healthy'),'healthy sources,',d.get('observations'),'observations,',d.get('deep_scan_candidates'),'deep-scan candidates')
          PY
      - name: Publish discovery evidence and feed deep scan
        run: |
          set -euo pipefail
          git config user.name 'wallet500-listing-bot'
          git config user.email 'wallet500-listing-bot@users.noreply.github.com'
          git add data/global-listing-radar.json data/global-listing-ledger.json data/manual-watchlist.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh global pre-listing intelligence'
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git merge --no-edit -X ours origin/main
              if git push origin HEAD:main; then break; fi
              sleep 3
              if [ "$attempt" = 5 ]; then exit 1; fi
            done
          fi
