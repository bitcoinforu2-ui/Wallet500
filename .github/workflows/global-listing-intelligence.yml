name: Wallet500 Global Listing Intelligence

on:
  workflow_dispatch:
  schedule:
    - cron: '4,19,34,49 * * * *'
  push:
    branches: [main]
    paths:
      - 'src/wallet500/global_listing_intelligence.py'
      - '.github/workflows/global-listing-intelligence.yml'

permissions:
  contents: write

# This workflow updates manual-watchlist.json, which is also consumed and may be
# rewritten by the primary Live truth pipeline. Serialize both writers on the
# same concurrency group so validated Live publication cannot race this feed.
# Keep cancel-in-progress false: truth writers must finish or fail closed, never
# be interrupted mid-publish.
concurrency:
  group: wallet500-live-scan-publisher
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Wallet500
        run: pip install -e .
      - name: Run unified exchange pre-listing discovery
        run: python -m wallet500.global_listing_intelligence
      - name: Reconcile immutable first-seen timestamps
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          ledger_path=Path('data/global-listing-ledger.json')
          watch_path=Path('data/manual-watchlist.json')
          ledger=json.loads(ledger_path.read_text())
          watch=json.loads(watch_path.read_text())
          records=ledger.get('records') or {}
          fixed=0
          for row in watch:
              if not isinstance(row,dict) or row.get('source')!='GLOBAL_LISTING_INTELLIGENCE':
                  continue
              raw=f"{row.get('listing_source')}|{row.get('listing_surface')}|{row.get('token')}"
              key=hashlib.sha256(raw.encode()).hexdigest()[:24]
              rec=records.get(key) or {}
              first=rec.get('first_seen_at')
              if first and row.get('listing_first_observed_at') != first:
                  row['listing_first_observed_at']=first
                  fixed += 1
          watch_path.write_text(json.dumps(watch,indent=2,ensure_ascii=False),encoding='utf-8')
          print('IMMUTABLE_FIRST_SEEN_RECONCILED',fixed)
          PY
      - name: Validate truth boundary
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          p=Path('data/global-listing-radar.json')
          l=Path('data/global-listing-ledger.json')
          w=Path('data/manual-watchlist.json')
          for x in (p,l,w):
              if not x.exists(): raise SystemExit('FATAL missing '+str(x))
          d=json.loads(p.read_text())
          if d.get('mode')!='GLOBAL_EXCHANGE_PRELISTING_DISCOVERY_FORWARD_ONLY':
              raise SystemExit('FATAL listing engine truth mode changed')
          ledger=json.loads(l.read_text())
          if ledger.get('truth_label')!='PUBLIC_LISTING_DISCOVERY_EVIDENCE_ONLY':
              raise SystemExit('FATAL listing ledger promoted beyond discovery evidence')
          records=ledger.get('records') or {}
          rows=json.loads(w.read_text())
          for r in rows:
              if isinstance(r,dict) and r.get('source')=='GLOBAL_LISTING_INTELLIGENCE':
                  if r.get('research_only_until_wallet500_gates_pass') is not True:
                      raise SystemExit('FATAL auto listing candidate bypass flag missing')
                  raw=f"{r.get('listing_source')}|{r.get('listing_surface')}|{r.get('token')}"
                  key=hashlib.sha256(raw.encode()).hexdigest()[:24]
                  rec=records.get(key) or {}
                  first=rec.get('first_seen_at')
                  if not first or r.get('listing_first_observed_at') != first:
                      raise SystemExit('FATAL listing first-seen provenance drift')
          print('LISTING RADAR:',d.get('sources_healthy'),'healthy sources,',d.get('observations'),'observations,',d.get('deep_scan_candidates'),'deep-scan candidates')
          PY
      - name: Publish discovery evidence and feed deep scan
        run: |
          set -euo pipefail
          git config user.name 'wallet500-listing-bot'
          git config user.email 'wallet500-listing-bot@users.noreply.github.com'
          git add data/global-listing-radar.json data/global-listing-ledger.json data/manual-watchlist.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh global pre-listing intelligence'
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort || true
                echo 'GLOBAL_LISTING_PUBLISH_REJECTED: rebase conflict; refusing automatic conflict resolution'
                exit 1
              fi
              if git push origin HEAD:main; then exit 0; fi
              sleep 3
              if [ "$attempt" = 5 ]; then exit 1; fi
            done
          fi
