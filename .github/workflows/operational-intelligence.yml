name: Wallet500 Operational Intelligence

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
  pull_request:
    paths:
      - 'src/wallet500/operational_intelligence.py'
      - 'src/wallet500/prospective_benchmark.py'
      - 'src/wallet500/engine_learning_review.py'
      - 'src/wallet500/provider_redundancy.py'
      - 'tests/test_operational_intelligence.py'
      - 'tests/test_engine_learning_review.py'
      - 'tests/test_provider_redundancy.py'
      - 'tests/test_smart_money_learning.py'
      - '.github/workflows/operational-intelligence.yml'
  push:
    branches: [main]
    paths:
      - 'src/wallet500/operational_intelligence.py'
      - 'src/wallet500/prospective_benchmark.py'
      - 'src/wallet500/engine_learning_review.py'
      - 'src/wallet500/provider_redundancy.py'
      - 'tests/test_operational_intelligence.py'
      - 'tests/test_engine_learning_review.py'
      - 'tests/test_provider_redundancy.py'
      - 'tests/test_smart_money_learning.py'
      - '.github/workflows/operational-intelligence.yml'

permissions:
  contents: write

concurrency:
  group: wallet500-operational-intelligence-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -e . pytest
      - name: Unit tests
        run: python -m pytest -q tests/test_operational_intelligence.py tests/test_engine_learning_review.py tests/test_provider_redundancy.py tests/test_smart_money_learning.py
      - name: Build fail-closed operational intelligence
        run: python -m wallet500.operational_intelligence
      - name: Update prospective no-hindsight benchmark
        run: python -m wallet500.prospective_benchmark
      - name: Build prospective engine learning review
        run: python -m wallet500.engine_learning_review
      - name: Measure provider family redundancy
        run: python -m wallet500.provider_redundancy
      - name: Validate research/production separation and exact-pair keys
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          op=json.loads(Path('data/operational-intelligence.json').read_text())
          bench=json.loads(Path('data/prospective-benchmark-latest.json').read_text())
          learn=json.loads(Path('data/engine-learning-review.json').read_text())
          redundancy=json.loads(Path('data/provider-redundancy.json').read_text())
          if op.get('production_effect') is not False or op.get('no_hindsight') is not True: raise SystemExit('OPERATIONAL_TRUTH_INVALID')
          if bench.get('production_effect') is not False or bench.get('no_hindsight') is not True: raise SystemExit('BENCHMARK_TRUTH_INVALID')
          if learn.get('production_effect') is not False or learn.get('no_hindsight') is not True: raise SystemExit('ENGINE_LEARNING_TRUTH_INVALID')
          if redundancy.get('production_effect') is not False or redundancy.get('failed_provider_counts_as_positive_evidence') is not False: raise SystemExit('PROVIDER_REDUNDANCY_TRUTH_INVALID')
          truth=learn.get('truth_contract') or {}
          if truth.get('production_threshold_changes')!='FORBIDDEN': raise SystemExit('ENGINE_LEARNING_THRESHOLD_GUARD_MISSING')
          if truth.get('retrospective_first_seen_backfill')!='FORBIDDEN': raise SystemExit('ENGINE_LEARNING_BACKFILL_GUARD_MISSING')
          if truth.get('smart_money_queue_can_promote') is not False: raise SystemExit('SMART_MONEY_PROMOTION_GUARD_MISSING')
          for row in bench.get('progression') or []:
              parts=str(row.get('identity') or '').split('|')
              if len(parts)!=3 or not all(parts): raise SystemExit('EXACT_PAIR_IDENTITY_INVALID')
          for row in ((learn.get('prospective_cohort') or {}).get('rows') or []):
              parts=str(row.get('identity') or '').split('|')
              if len(parts)!=3 or not all(parts): raise SystemExit('LEARNING_EXACT_PAIR_IDENTITY_INVALID')
          print('OPERATIONAL_INTELLIGENCE_OK', op.get('counts'))
          print('PROSPECTIVE_BENCHMARK_OK', bench.get('counts'), bench.get('dwell'), bench.get('attribution_quality'))
          print('ENGINE_LEARNING_REVIEW_OK', (learn.get('prospective_cohort') or {}).get('blocker_counts'), learn.get('provider_health'), learn.get('smart_money_quality'))
          print('PROVIDER_REDUNDANCY_OK', redundancy.get('families'), redundancy.get('degraded_providers'))
          PY
      - name: Publish observability and learning snapshots atomically
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          git config user.name 'wallet500-truth-bot'
          git config user.email 'wallet500-truth-bot@users.noreply.github.com'
          BASE_SHA="$(git rev-parse HEAD)"
          python scripts/atomic_publish.py \
            --base "$BASE_SHA" \
            --fail-on-newer \
            --message 'data: refresh operational intelligence and prospective learning' \
            data/operational-intelligence.json \
            data/prospective-benchmark-ledger.json \
            data/prospective-benchmark-latest.json \
            data/engine-learning-review.json \
            data/provider-redundancy.json
