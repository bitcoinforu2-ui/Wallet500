name: Wallet500 Operational Intelligence

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
  push:
    branches: [main]
    paths:
      - 'src/wallet500/operational_intelligence.py'
      - 'src/wallet500/prospective_benchmark.py'
      - '.github/workflows/operational-intelligence.yml'

permissions:
  contents: write

concurrency:
  group: wallet500-operational-intelligence-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -e .
      - name: Build fail-closed operational intelligence
        run: python -m wallet500.operational_intelligence
      - name: Update prospective no-hindsight benchmark
        run: python -m wallet500.prospective_benchmark
      - name: Validate research/production separation and exact-pair keys
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          op=json.loads(Path('data/operational-intelligence.json').read_text())
          bench=json.loads(Path('data/prospective-benchmark-latest.json').read_text())
          if op.get('production_effect') is not False or op.get('no_hindsight') is not True: raise SystemExit('OPERATIONAL_TRUTH_INVALID')
          if bench.get('production_effect') is not False or bench.get('no_hindsight') is not True: raise SystemExit('BENCHMARK_TRUTH_INVALID')
          for row in bench.get('progression') or []:
              if len(str(row.get('identity') or '').split('|')) != 3: raise SystemExit('EXACT_PAIR_IDENTITY_INVALID')
          print('OPERATIONAL_INTELLIGENCE_OK', op.get('counts'))
          print('PROSPECTIVE_BENCHMARK_OK', bench.get('counts'), bench.get('dwell'))
          PY
      - name: Publish observability snapshot atomically
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          git config user.name 'wallet500-truth-bot'
          git config user.email 'wallet500-truth-bot@users.noreply.github.com'
          BASE_SHA="$(git rev-parse HEAD)"
          python scripts/atomic_publish.py \
            --base "$BASE_SHA" \
            --fail-on-newer \
            --message 'data: refresh operational intelligence' \
            data/operational-intelligence.json \
            data/prospective-benchmark-ledger.json \
            data/prospective-benchmark-latest.json
