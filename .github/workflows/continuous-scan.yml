name: Wallet500 Continuous Scan

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/continuous-scan.yml'

permissions:
  contents: write

concurrency:
  group: wallet500-live-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -e .
      - name: Run verified intelligence scan
        env:
          PYTHONUNBUFFERED: '1'
        run: python -m wallet500.orchestrator
      - name: Apply universal live survival gate
        run: python -m wallet500.fresh_solana_gate
      - name: Capture immutable qualified evidence
        run: python -m wallet500.evidence_capture
      - name: Send gated Telegram alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m wallet500.telegram_alerts
      - name: Extract verified Solana wallet candidates
        continue-on-error: true
        run: python -m wallet500.wallet_candidate_discovery
      - name: Validate fresh verified output and record scheduler health
        env:
          W500_EVENT: ${{ github.event_name }}
          W500_RUN_ID: ${{ github.run_id }}
          W500_SCHEDULE: ${{ github.event.schedule }}
        run: |
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          p=Path('data/run-summary.json')
          if not p.exists(): raise SystemExit('FATAL: run-summary.json missing')
          d=json.loads(p.read_text())
          ts=datetime.fromisoformat(d['updated_at'])
          age=(datetime.now(timezone.utc)-ts).total_seconds()
          if age>300: raise SystemExit(f'FATAL: scan output stale ({age:.0f}s)')
          if not d.get('verified_only'): raise SystemExit('FATAL: scan is not verified-only')
          for required in ('data/fresh-solana-survival.json','data/active-qualified-candidates.json','data/telegram-alert-report.json'):
              if not Path(required).exists(): raise SystemExit('FATAL: missing '+required)
          hp=Path('data/scheduler-health.json')
          try: h=json.loads(hp.read_text()) if hp.exists() else {}
          except Exception: h={}
          hist=h.get('history') if isinstance(h.get('history'),list) else []
          now=datetime.now(timezone.utc).isoformat()
          item={'at':now,'workflow':'MANUAL_FALLBACK','event':os.getenv('W500_EVENT'),'run_id':os.getenv('W500_RUN_ID'),'schedule':os.getenv('W500_SCHEDULE') or None,'scan_updated_at':d['updated_at'],'scan_run_total':d.get('scan_runs_total')}
          hist.append(item); hist=hist[-200:]
          hp.write_text(json.dumps({'updated_at':now,'last':item,'history':hist},indent=2))
          print('HEALTHY FALLBACK SCAN',d['updated_at'],'run',d.get('scan_runs_total'))
          PY
      - name: Publish verified scan data
        run: |
          set -euo pipefail
          git config user.name 'wallet500-scheduler'
          git config user.email 'wallet500-scheduler@users.noreply.github.com'
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m 'data: manual fallback verified scan'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git merge --no-edit -X ours origin/main || true
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
