name: Wallet500 Continuous Scan

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: wallet500-fallback-dispatcher
  cancel-in-progress: true

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch full primary scan only when idle
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          # A fallback must never be a weaker truth-publishing lane.
          # Recovery is always delegated to the complete Live Scan workflow,
          # which owns Exact Pair revalidation, $50K liquidity hardening,
          # fail-closed Holder/Cluster gates and strict validation before publish.
          runs_json="$(gh api --method GET \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/live-scan.yml/runs?per_page=30")"

          active_count="$(printf '%s' "$runs_json" | jq '[.workflow_runs[] | select(.status == "in_progress" or .status == "queued" or .status == "pending" or .status == "waiting" or .status == "requested")] | length')"

          if [ "$active_count" -gt 0 ]; then
            echo "FALLBACK_PRIMARY_ALREADY_ACTIVE active=${active_count}; no duplicate dispatch."
            exit 0
          fi

          echo "FALLBACK_DISPATCH_FULL_PRIMARY"
          gh workflow run live-scan.yml --repo "$GITHUB_REPOSITORY" --ref main
