name: Wallet500 Research Decision Engine
on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Wallet500 Near Alert Observatory"
    types: [completed]
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main]
    paths:
      - 'src/wallet500/research_decision_engine.py'
      - 'data/near-alert-observatory.json'
      - 'data/cex-revival-radar.json'
      - 'data/filter-tuning-advisor.json'
      - 'data/rejected-outcome-report.json'
      - 'data/case-study-cyberleek.json'
      - 'data/case-study-doge1.json'
      - 'data/case-study-dusd.json'
      - 'docs/experiments/research-decision-engine-v1.md'
      - '.github/workflows/research-decision-engine.yml'
permissions:
  contents: write
concurrency:
  group: research-decision-engine
  cancel-in-progress: false
jobs:
  advise:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package
        run: pip install -e . pytest
      - name: Safety tests
        run: pytest -q tests/test_research_decision_engine.py
      - name: Build research decisions
        run: python -m wallet500.research_decision_engine
      - name: Validate advisory contract
        run: |
          python - <<'PY'
          import json
          d=json.load(open('data/research-decision-engine.json'))
          assert d['mode']=='RESEARCH_ADVISORY_ONLY'
          assert d['production_change_allowed'] is False
          assert d['production_thresholds_modified'] is False
          assert 'LIQUIDITY_GTE_50K_EXACT_EXECUTION_POOL' in d['hard_rules']
          assert 'EXACT_PAIR_IDENTITY' in d['hard_rules']
          assert 'HOLDER_CLUSTER_FAIL_CLOSED' in d['hard_rules']
          assert any(p.get('hypothesis_id')=='CASE::DUSD' for p in d.get('proposals',[])), 'DUSD case disconnected from research engine'
          print(d['decision_states'])
          PY
      - name: Publish newest advisory output with bounded retries
        run: |
          set -euo pipefail
          git config user.name 'wallet500-research-bot'
          git config user.email 'wallet500-research-bot@users.noreply.github.com'
          for attempt in $(seq 1 12); do
            echo "Research decision publish attempt $attempt/12"
            git fetch origin main
            git reset --hard origin/main
            python -m wallet500.research_decision_engine
            if [ -z "$(git status --porcelain -- data/research-decision-engine.json)" ]; then
              echo 'No advisory change'
              exit 0
            fi
            git add data/research-decision-engine.json
            git commit -m 'research: refresh decision engine advisory'
            if git push origin HEAD:main; then
              echo 'Fresh research decision output published'
              exit 0
            fi
            echo 'Main moved during publish; retrying from newest main'
            sleep 1
          done
          echo 'Research decision publisher failed after bounded retries'
          exit 1
