name: Wallet500 Revival 90D 15K Actionable Telegram

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Wallet500 Revival Solana Expanded"
    types: [completed]
  pull_request:
    paths:
      - 'src/wallet500/revival_90d_telegram.py'
      - 'src/wallet500/revival_deep_intelligence.py'
      - 'tests/test_revival_90d_telegram.py'
      - 'tests/test_revival_deep_intelligence.py'
      - '.github/workflows/revival-90d-telegram.yml'

permissions:
  contents: write

concurrency:
  group: wallet500-revival-90d-15k-actionable
  cancel-in-progress: true

jobs:
  alert:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install and test 90d 15k actionable alert contract
        run: |
          pip install -e . pytest
          python -m py_compile src/wallet500/revival_90d_telegram.py src/wallet500/revival_deep_intelligence.py
          python -m pytest -q tests/test_revival_90d_telegram.py tests/test_revival_deep_intelligence.py
      - name: Stop after PR verification
        if: github.event_name == 'pull_request'
        run: echo 'REVIVAL_DEEP_INTELLIGENCE_PR_TESTS_OK'
      - name: Refuse stale or wrong Revival source
        if: github.event_name != 'pull_request'
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          p=Path('data/revival-1000-latest.json')
          if not p.exists(): raise SystemExit('REVIVAL_90D_EXPANDED_SOURCE_MISSING')
          d=json.loads(p.read_text())
          if d.get('network')!='solana': raise SystemExit('REVIVAL_90D_SOURCE_NOT_SOLANA')
          gate=d.get('age_gate') or {}
          if gate.get('status')!='ENFORCED_FAIL_CLOSED' or int(gate.get('minimum_market_age_days') or 0)!=90:
              raise SystemExit('REVIVAL_90D_SOURCE_AGE_CONTRACT_INVALID')
          ts=str(d.get('generated_at') or '')
          if ts.endswith('Z'): ts=ts[:-1]+'+00:00'
          dt=datetime.fromisoformat(ts)
          if dt.tzinfo is None: dt=dt.replace(tzinfo=timezone.utc)
          age=(datetime.now(timezone.utc)-dt.astimezone(timezone.utc)).total_seconds()
          if age > 45*60: raise SystemExit(f'REVIVAL_90D_EXPANDED_SOURCE_STALE age={age:.0f}s')
          print('REVIVAL_90D_EXPANDED_SOURCE_OK', {'age_seconds':round(age,1),'coins':len(d.get('coins') or [])})
          PY
      - name: Send forward-only actionable Revival REAL ALERTs after deep intelligence
        if: github.event_name != 'pull_request'
        env:
          TELEGRAM_BOT_TOKEN: ''
          TELEGRAM_CHAT_ID: ''
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
          REVIVAL_90D_LIVE_REFRESH: '1'
        run: |
          set -euo pipefail
          echo 'REVIVAL_90D_DIRECT_TELEGRAM_DISABLED_FINAL_BUY_ONLY'
          python -m wallet500.revival_90d_telegram
      - name: Validate actionable alert and deep intelligence reports
        if: github.event_name != 'pull_request'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('data/revival-90d-telegram-report.json').read_text())
          deep=json.loads(Path('data/revival-deep-intelligence-report.json').read_text())
          t=d.get('truth_contract') or {}
          dt=deep.get('truth_contract') or {}
          if d.get('mode')!='ACTIONABLE_REVIVAL_90D_15K_REAL_ALERT_V2': raise SystemExit('REVIVAL_90D_MODE_INVALID')
          if d.get('configured') is not False: raise SystemExit('REVIVAL_90D_DIRECT_TELEGRAM_MUST_BE_DISABLED')
          if int(d.get('delivered_count') or 0) != 0: raise SystemExit('REVIVAL_90D_DIRECT_TELEGRAM_DELIVERY_LEAK')
          if t.get('research_only') is not False or t.get('actionable_only') is not True: raise SystemExit('REVIVAL_90D_ACTIONABILITY_INVALID')
          if t.get('real_alert_lane')!='REVIVAL_90D_15K': raise SystemExit('REVIVAL_90D_REAL_ALERT_LANE_INVALID')
          if t.get('automatic_buy') is not False: raise SystemExit('REVIVAL_90D_AUTO_BUY_LEAK')
          if float(t.get('minimum_market_age_days') or 0)!=90.0: raise SystemExit('REVIVAL_90D_AGE_DRIFT')
          if float(t.get('minimum_liquidity_usd') or 0)!=15000.0: raise SystemExit('REVIVAL_90D_LIQ_DRIFT')
          if int(t.get('minimum_txns_h1') or 0)!=30: raise SystemExit('REVIVAL_90D_TXNS_H1_DRIFT')
          if t.get('exact_pair_required') is not True or t.get('exact_base_token_identity_required') is not True: raise SystemExit('REVIVAL_90D_IDENTITY_GUARD_MISSING')
          if t.get('expanded_source_required')!='revival-1000-latest.json': raise SystemExit('REVIVAL_90D_WRONG_SOURCE')
          if t.get('automatic_deep_intelligence_before_delivery') is not True: raise SystemExit('REVIVAL_DEEP_CHECK_NOT_REQUIRED')
          if t.get('deep_check_pass_required_for_actionable_alert') is not True: raise SystemExit('REVIVAL_DEEP_PASS_NOT_REQUIRED')
          if t.get('revival_score_separate_from_confirmation_score') is not True: raise SystemExit('REVIVAL_CONFIRMATION_SCORE_CONFLATED')
          if t.get('critical_deep_source_failure_cannot_pass') is not True: raise SystemExit('REVIVAL_DEEP_FAIL_OPEN')
          if dt.get('critical_source_failure_cannot_pass') is not True or dt.get('hard_blocker_overrides_score') is not True: raise SystemExit('REVIVAL_DEEP_TRUTH_CONTRACT_INVALID')
          if dt.get('automatic_trade') is not False or dt.get('manual_decision_only') is not True: raise SystemExit('REVIVAL_DEEP_AUTO_TRADE_LEAK')
          for item in d.get('delivered') or []:
              if item.get('deep_check') != 'PASS': raise SystemExit('REVIVAL_NON_PASS_DELIVERED')
              if item.get('confirmation_score') is None: raise SystemExit('REVIVAL_DELIVERED_WITHOUT_CONFIRMATION_SCORE')
          if t.get('notification_marker')!='🔥🔥🔥': raise SystemExit('REVIVAL_90D_FIRE_MARKER_MISSING')
          if t.get('no_historical_backfill') is not True or t.get('no_hindsight') is not True: raise SystemExit('REVIVAL_90D_FORWARD_ONLY_GUARD_MISSING')
          print('REVIVAL_90D_DEEP_INTELLIGENCE_OK', {'baseline_eligible':d.get('baseline_eligible_before_deep_check'),'pass':d.get('deep_check_pass_count'),'watch':d.get('deep_check_watch_count'),'reject':d.get('deep_check_reject_count'),'delivered':d.get('delivered_count')})
          PY
      - name: Publish actionable alert and deep-intelligence state atomically
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python scripts/atomic_publish.py \
            --github-api-cas \
            --message 'alerts: persist Revival deep intelligence and actionable state' \
            data/revival-90d-telegram-report.json \
            data/revival-90d-telegram-state.json \
            data/revival-deep-intelligence-report.json \
            data/revival-deep-intelligence-state.json
