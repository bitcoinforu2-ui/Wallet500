name: Wallet500 Paper Truth Portfolio

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Wallet500 Multi-Chain Live Scan"]
    types: [completed]
  schedule:
    - cron: '12,27,42,57 * * * *'
  push:
    branches: [main]
    paths:
      - 'src/wallet500/paper_truth_portfolio.py'
      - 'src/wallet500/paper_truth_exact_runner.py'
      - 'src/wallet500/exact_pair_quote.py'
      - 'src/wallet500/cash_verified.py'
      - '.github/workflows/paper-truth.yml'

permissions:
  contents: write

# This workflow writes truth-ledger data to main. It must share the same
# non-cancelling publisher lock as every other generated-data writer.
concurrency:
  group: wallet500-main-data-publisher
  cancel-in-progress: false

jobs:
  truth:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -e .
      - name: Reconcile exact-pair quote-verified paper truth ledger
        env:
          ZEROX_API_KEY: ${{ secrets.ZEROX_API_KEY }}
          ETH_RPC_URL: ${{ secrets.ETH_RPC_URL }}
          BSC_RPC_URL: ${{ secrets.BSC_RPC_URL }}
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
        run: python -m wallet500.paper_truth_exact_runner
      - name: Validate truth accounting
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          lp = Path('data/paper-truth-ledger.json')
          sp = Path('data/paper-truth-summary.json')
          if not lp.exists() or not sp.exists():
              raise SystemExit('FATAL: paper truth outputs missing')

          l = json.loads(lp.read_text())
          s = json.loads(sp.read_text())
          expected_mode = 'PAPER_TRUTH_EXACT_PAIR_EXECUTION_VERIFIED_NO_REAL_MONEY'
          if s.get('mode') != expected_mode or l.get('mode') != expected_mode:
              raise SystemExit('FATAL: wrong exact-pair truth mode')
          if float(s.get('position_size_usd', 0)) != 1.0:
              raise SystemExit('FATAL: position size changed')
          if s.get('generic_router_booking_disabled') is not True:
              raise SystemExit('FATAL: generic router booking unexpectedly enabled')

          closed_status = 'CLOSED_EXACT_PAIR_QUOTE_VERIFIED'
          positions = l.get('positions') or []
          for p in positions:
              if not p.get('entry_quote_proof_level'):
                  raise SystemExit('FATAL: booked position without entry quote proof')
              if p.get('entry_exact_pair_constrained') is not True:
                  raise SystemExit('FATAL: booked position without exact-pair entry proof')
              pair = str(p.get('pair_address') or '').lower()
              quoted_pair = str(p.get('entry_quoted_pair_address') or '').lower()
              if not pair or quoted_pair != pair:
                  raise SystemExit('FATAL: booked position entry pair mismatch')
              if p.get('status') == closed_status and not p.get('exit_quote_proof_level'):
                  raise SystemExit('FATAL: closed position without exit quote proof')

          calc = sum(
              float(p.get('realized_quote_pnl_usd') or 0)
              for p in positions
              if p.get('status') == closed_status
          )
          if abs(calc - float(s.get('realized_quote_pnl_usd') or 0)) > 1e-7:
              raise SystemExit('FATAL: realized PnL mismatch')
          if int(s.get('closed_exact_pair_quote_verified_positions') or 0) != sum(1 for p in positions if p.get('status') == closed_status):
              raise SystemExit('FATAL: closed exact-pair count mismatch')

          print(
              'PAPER TRUTH EXACT-PAIR: entries', s.get('entry_quote_verified_positions'),
              'closed', s.get('closed_exact_pair_quote_verified_positions'),
              'realized_quote_pnl', s.get('realized_quote_pnl_usd'),
              'pending', s.get('exit_pending')
          )
          PY
      - name: Publish truth ledger only
        run: |
          set -euo pipefail
          git config user.name 'wallet500-truth-bot'
          git config user.email 'wallet500-truth-bot@users.noreply.github.com'
          git add data/paper-truth-ledger.json data/paper-truth-summary.json
          if git diff --cached --quiet; then
            echo 'No paper truth change'
            exit 0
          fi
          git commit -m 'truth: advance quote-verified paper portfolio'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo 'FATAL: paper truth publisher rebase conflict; refusing automatic conflict resolution'
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 3
            if [ "$attempt" = 5 ]; then
              exit 1
            fi
          done
