name: Wallet500 Composite Strong Shadow

on:
  pull_request:
    paths:
      - 'src/wallet500/composite_strong_shadow.py'
      - 'tests/test_composite_strong_shadow.py'
      - '.github/workflows/composite-strong-shadow.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e . pytest
      - name: Unit tests
        run: python -m pytest -q tests/test_composite_strong_shadow.py
      - name: Run shadow study
        run: python -m wallet500.composite_strong_shadow
      - name: Print compact findings
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('data/composite-strong-shadow-report.json').read_text())
          print('POPULATION', p['population_count'])
          print('PROMOTIONS', p['shadow_promotions_count'])
          print('RAY', json.dumps(p.get('ray'), sort_keys=True))
          for row in p.get('shadow_promotions') or []:
              print('PROMOTE', row.get('symbol'), row.get('signal_score'), row.get('source_lane_count'), row.get('positive_lanes'))
          PY
