name: Wallet500 Survivor Wave Watch

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main]
    paths:
      - 'src/wallet500/survivor_wave_watch.py'
      - 'src/wallet500/survivor_signal_enhancer.py'
      - 'src/wallet500/survivor_signal_intelligence_v3.py'
      - 'src/wallet500/survivor_model_governor_v4.py'
      - 'src/wallet500/survivor_veteran_gate.py'
      - '.github/workflows/survivor-wave-watch.yml'
      - 'data/winner-separator-study.json'
      - 'data/hot-healthy-radar.json'

permissions:
  contents: write

concurrency:
  group: wallet500-survivor-wave-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -e .
      - name: Run exact-pair survivor watch
        run: python -m wallet500.survivor_wave_watch
      - name: Run shadow Winner DNA v2 research layers
        run: python -m wallet500.survivor_signal_enhancer
      - name: Run shadow Survivor Intelligence v3 layers
        run: python -m wallet500.survivor_signal_intelligence_v3
      - name: Run shadow Model Governor v4
        run: python -m wallet500.survivor_model_governor_v4
      - name: Apply veteran-only alert gate
        run: python -m wallet500.survivor_veteran_gate
      - name: Validate truth contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/survivor-wave-watch.json')
          if not p.exists(): raise SystemExit('SURVIVOR_WATCH_OUTPUT_MISSING')
          d=json.loads(p.read_text())
          if d.get('mode')!='HOURLY_WINNER_SURVIVOR_WAVE_WATCH_V1': raise SystemExit('MODE_INVALID')
          if d.get('research_only') is not True or d.get('automatic_buy') is not False: raise SystemExit('PRODUCTION_CONTRACT_INVALID')
          if d.get('exact_pair_only') is not True: raise SystemExit('PAIR_CONTRACT_INVALID')
          if (d.get('research_layers') or {}).get('production_gates_changed') is not False: raise SystemExit('RESEARCH_LAYER_CONTRACT_INVALID')
          layers3=d.get('research_layers_v3') or {}
          if layers3.get('research_only') is not True or layers3.get('production_gates_changed') is not False: raise SystemExit('RESEARCH_V3_CONTRACT_INVALID')
          gov=d.get('model_governor_v4') or {}
          if gov.get('research_only') is not True or gov.get('production_gates_changed') is not False: raise SystemExit('GOVERNOR_V4_CONTRACT_INVALID')
          cal=gov.get('calibration') or {}
          if cal.get('probability_model_enabled') is not False: raise SystemExit('UNCALIBRATED_PROBABILITY_ENABLED')
          contract=d.get('veteran_truth_contract') or {}
          if contract.get('focus')!='VETERAN_COIN_REVIVAL_ONLY': raise SystemExit('VETERAN_FOCUS_INVALID')
          if float(contract.get('minimum_market_age_days') or 0) < 180: raise SystemExit('VETERAN_AGE_FLOOR_INVALID')
          if contract.get('unknown_age_policy')!='FAIL_CLOSED_NO_ALERT': raise SystemExit('VETERAN_FAIL_CLOSED_INVALID')
          eligible={}
          for x in d.get('tokens') or []:
              if float(x.get('liquidity_usd') or 0) < float(d.get('liquidity_survival_floor_usd') or 50000): raise SystemExit('SURVIVOR_BELOW_LIQUIDITY_FLOOR')
              if 'intelligence_v3' not in x or 'model_governor_v4' not in x: raise SystemExit('SHADOW_LAYER_MISSING')
              if ((x.get('intelligence_v3') or {}).get('pre_wave_probability') or {}).get('status') != 'INSUFFICIENT_SAMPLE': raise SystemExit('UNCALIBRATED_PROBABILITY_LEAK')
              token=str(x.get('token') or '').lower(); eligible[token]=bool(x.get('veteran_alert_eligible'))
              if x.get('veteran_alert_eligible') and x.get('veteran_age_status')!='VERIFIED_180D_PLUS': raise SystemExit('ACTIONABLE_WITHOUT_VERIFIED_VETERAN_AGE')
          for event in d.get('telegram_events') or []:
              if not eligible.get(str(event.get('token') or '').lower(), False): raise SystemExit('NON_VETERAN_TELEGRAM_EVENT_LEAK')
          for qn in ('data/survivor-signal-intelligence-v3.json','data/survivor-model-governor-v4.json'):
              q=Path(qn)
              if not q.exists(): raise SystemExit('SHADOW_OUTPUT_MISSING:'+qn)
              qd=json.loads(q.read_text())
              if qd.get('research_only') is not True or qd.get('production_gates_changed') is not False: raise SystemExit('SHADOW_OUTPUT_CONTRACT_INVALID:'+qn)
          print('SURVIVOR_WAVE_WATCH_OK', d.get('survivor_n'), d.get('actionable_veteran_signal_n'), d.get('suppressed_non_veteran_or_unverified_signal_n'))
          PY
      - name: Publish hourly survivor state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'wallet500-survivor-bot'
          git config user.email 'wallet500-survivor-bot@users.noreply.github.com'
          tmp="$(mktemp -d)"
          cp data/survivor-wave-watch.json "$tmp/survivor-wave-watch.json"
          cp data/survivor-wave-watch-state.json "$tmp/survivor-wave-watch-state.json"
          cp data/survivor-signal-enhancer-state.json "$tmp/survivor-signal-enhancer-state.json"
          cp data/survivor-forward-validation.json "$tmp/survivor-forward-validation.json"
          cp data/survivor-signal-intelligence-v3.json "$tmp/survivor-signal-intelligence-v3.json"
          cp data/survivor-model-governor-v4.json "$tmp/survivor-model-governor-v4.json"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp "$tmp/survivor-wave-watch.json" data/survivor-wave-watch.json
            cp "$tmp/survivor-wave-watch-state.json" data/survivor-wave-watch-state.json
            cp "$tmp/survivor-signal-enhancer-state.json" data/survivor-signal-enhancer-state.json
            cp "$tmp/survivor-forward-validation.json" data/survivor-forward-validation.json
            cp "$tmp/survivor-signal-intelligence-v3.json" data/survivor-signal-intelligence-v3.json
            cp "$tmp/survivor-model-governor-v4.json" data/survivor-model-governor-v4.json
            git add data/survivor-wave-watch.json data/survivor-wave-watch-state.json data/survivor-signal-enhancer-state.json data/survivor-forward-validation.json data/survivor-signal-intelligence-v3.json data/survivor-model-governor-v4.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'data: refresh hourly survivor wave watch'
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
