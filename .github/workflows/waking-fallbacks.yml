name: Wallet500 Waking No-Key Fallbacks

on:
  workflow_dispatch:
  schedule:
    - cron: '3,18,33,48 * * * *'
  workflow_run:
    workflows: ['Wallet500 Waking Confirmation']
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'src/wallet500/waking_fallbacks.py'
      - 'tests/test_waking_fallbacks.py'
      - '.github/workflows/waking-fallbacks.yml'

permissions:
  contents: write

concurrency:
  group: wallet500-waking-confirmation
  cancel-in-progress: false

jobs:
  enrich:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -e . pytest
      - name: Unit tests
        run: python -m pytest -q tests/test_waking_fallbacks.py tests/test_waking_confirmation.py
      - name: Enrich WAKING with exact-mint RugCheck and official Telegram
        run: python -m wallet500.waking_fallbacks
      - name: Validate no-key fallback truth contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from wallet500.revival_1000 import looks_like_solana_address

          p=Path('data/waking-confirmation-latest.json')
          s=Path('data/waking-confirmation-state.json')
          if not p.exists() or not s.exists(): raise SystemExit('WAKING_FALLBACK_OUTPUT_MISSING')
          d=json.loads(p.read_text())
          if d.get('mode')!='RESEARCH_ONLY_WAKING_CONFIRMATION_V1' or d.get('production_portfolio_impact')!='NONE':
              raise SystemExit('WAKING_FALLBACK_BASE_CONTRACT_INVALID')
          fc=d.get('fallback_contract') or {}
          if fc.get('version')!='WAKING_NO_KEY_FALLBACKS_V1' or fc.get('production_portfolio_impact')!='NONE':
              raise SystemExit('WAKING_FALLBACK_CONTRACT_INVALID')
          if fc.get('rugcheck_distribution_positive_double_count')!='FORBIDDEN':
              raise SystemExit('RUGCHECK_DOUBLE_COUNT_GUARD_MISSING')
          allowed={'WAKING_UNCONFIRMED_RESEARCH','WAKING_CONFIRMED_RESEARCH','WAKING_STRONG_RESEARCH','WAKING_RISK_RESEARCH'}
          rows=d.get('targets') or []
          for x in rows:
              if x.get('base_watch_status')!='WAKING_MARKET_ONLY' or not looks_like_solana_address(x.get('token_address')):
                  raise SystemExit('WAKING_FALLBACK_IDENTITY_INVALID')
              if x.get('confirmation_status') not in allowed: raise SystemExit('WAKING_FALLBACK_STATUS_INVALID')
              if x.get('production_portfolio_impact')!='NONE': raise SystemExit('WAKING_FALLBACK_PRODUCTION_IMPACT')
              for name,ch in (x.get('channels') or {}).items():
                  if ch.get('verified') is not True and float(ch.get('score') or 0)!=0:
                      raise SystemExit('WAKING_FALLBACK_UNVERIFIED_CHANNEL_SCORED:'+name)
              dist=x.get('distribution_evidence') or {}
              if str(dist.get('source') or '').startswith('RUGCHECK_'):
                  if dist.get('score_semantics')!='CONCENTRATION_RISK_ONLY_NOT_INDEPENDENT_POSITIVE_FAMILY':
                      raise SystemExit('RUGCHECK_DISTRIBUTION_SEMANTICS_INVALID')
          c=d.get('counts') or {}
          if int(c.get('waking_targets') or 0)!=len(rows): raise SystemExit('WAKING_FALLBACK_COUNT_MISMATCH')
          print('WAKING_NO_KEY_FALLBACKS_VALID',c,d.get('provider_status_counts'))
          PY
      - name: Publish enriched Waking snapshots
        run: |
          set -euo pipefail
          git config user.name 'wallet500-waking-fallback-bot'
          git config user.email 'wallet500-waking-fallback-bot@users.noreply.github.com'
          tmp="$(mktemp -d)"
          cp data/waking-confirmation-latest.json "$tmp/waking-confirmation-latest.json"
          cp data/waking-confirmation-state.json "$tmp/waking-confirmation-state.json"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp "$tmp/waking-confirmation-latest.json" data/waking-confirmation-latest.json
            cp "$tmp/waking-confirmation-state.json" data/waking-confirmation-state.json
            git add data/waking-confirmation-latest.json data/waking-confirmation-state.json
            if git diff --cached --quiet; then echo 'WAKING_FALLBACK_NO_DATA_CHANGE'; exit 0; fi
            git commit -m 'data: enrich Waking with no-key holder and Telegram evidence'
            if git push origin HEAD:main; then echo 'WAKING_FALLBACK_PUBLISH_OK'; exit 0; fi
            echo "WAKING_FALLBACK_PUBLISH_RETRY attempt=$attempt"; sleep 3
          done
          echo '::error::WAKING_FALLBACK_PUBLISH_RACE_EXHAUSTED'; exit 1
