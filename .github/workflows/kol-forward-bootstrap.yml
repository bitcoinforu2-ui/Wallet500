name: Wallet500 KOL Forward Bootstrap

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kol-forward-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wallet500-kol-forward-bootstrap
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package
        run: pip install -e .
      - name: Patch live scan, dashboard hub, and Pages deployment
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, needle, replacement, already_marker):
              p=Path(path); s=p.read_text(encoding='utf-8')
              if already_marker in s:
                  print(f'{path}: already patched')
                  return
              if needle not in s:
                  raise SystemExit(f'{path}: insertion marker missing: {needle[:80]!r}')
              p.write_text(s.replace(needle,replacement,1),encoding='utf-8')
              print(f'{path}: patched')

          # 1) Run the forward KOL experiment only after the authoritative holder/cluster
          # gate has finished. KOLs nominate; Wallet500 remains the entry authority.
          live=Path('.github/workflows/live-scan.yml')
          s=live.read_text(encoding='utf-8')
          if 'Run prospective KOL forward experiment' not in s:
              needle='      - name: Apply fail-closed holder cluster production gate\n        run: python -m wallet500.holder_cluster_production_gate\n'
              if needle not in s: raise SystemExit('live-scan holder gate marker missing')
              insert=needle+'      - name: Run prospective KOL forward experiment\n        continue-on-error: true\n        run: python -m wallet500.kol_forward_experiment\n'
              live.write_text(s.replace(needle,insert,1),encoding='utf-8')

          # 2) Give the experiment its own visible rubric in the main hub without
          # redesigning or replacing the existing dashboard.
          hub=Path('index.html'); h=hub.read_text(encoding='utf-8')
          if '/Wallet500/kol/' not in h:
              nav='<a href="/Wallet500/backtest/">מחקר 7/30/90</a></div>'
              if nav not in h: raise SystemExit('index nav marker missing')
              h=h.replace(nav,'<a href="/Wallet500/backtest/">מחקר 7/30/90</a><a href="/Wallet500/kol/">KOL FORWARD LAB</a></div>',1)
          if 'KOL FORWARD · זיהוי מוקדם בלבד' not in h:
              marker='<section class="sec panel"><div class="head">המטבעות שעברו סף עכשיו</div>'
              if marker not in h: raise SystemExit('index section marker missing')
              panel='''<section class="sec panel exp" id="kol-forward-rubric"><div class="head">KOL FORWARD · זיהוי מוקדם בלבד</div><div class="note" style="margin-bottom:10px">ניסוי נפרד: עוקבים רק קדימה אחרי המלצות חדשות. KOL מציע; כניסת $1 נפתחת רק אחרי שהמטבע וה־pair המדויק עוברים את כל ספי Wallet500.</div><div class="grid"><div class="card"><div class="label">FORWARD CALLS</div><div class="n" id="kolCalls">—</div></div><div class="card"><div class="label">PASSED WALLET500</div><div class="n ok" id="kolEntries">—</div></div><div class="card"><div class="label">WAITING GATE</div><div class="n warn" id="kolWaiting">—</div></div><div class="card"><div class="label">PAPER ROI</div><div class="n" id="kolRoi">—</div></div></div><div class="note" id="kolNote" style="margin-top:9px">טוען נתוני KOL Forward...</div><div style="margin-top:10px"><a class="btn" href="/Wallet500/kol/">פתח רובליקה מלאה ↗</a></div></section>'''
              h=h.replace(marker,panel+marker,1)
          if 'function loadKolForwardRubric' not in h:
              script='''<script>(function(){function loadKolForwardRubric(){fetch('/Wallet500/data/kol-forward-summary.json?v='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(s=>{const g=id=>document.getElementById(id);if(!g('kolCalls'))return;g('kolCalls').textContent=Number(s.forward_calls||0).toLocaleString('en-US');g('kolEntries').textContent=Number(s.qualified_paper_entries||0).toLocaleString('en-US');g('kolWaiting').textContent=Number(s.waiting_wallet500_gate||0).toLocaleString('en-US');let roi=Number(s.paper_roi_pct||0);g('kolRoi').textContent=(roi>=0?'+':'')+roi.toFixed(2)+'%';g('kolRoi').className='n '+(roi>=0?'ok':'bad');g('kolNote').textContent=(s.status||'—')+' · מקורות '+Number(s.sources_configured||0)+' · Forward only / no backfill';}).catch(()=>{const x=document.getElementById('kolNote');if(x)x.textContent='KOL Forward ממתין לנתוני הריצה הראשונה.'})}loadKolForwardRubric();setInterval(loadKolForwardRubric,60000)})();</script>'''
              if '</body>' not in h: raise SystemExit('index body marker missing')
              h=h.replace('</body>',script+'</body>',1)
          hub.write_text(h,encoding='utf-8')

          # 3) Publish the dedicated page and its truth data through the existing
          # single Pages deployment lane.
          pages=Path('.github/workflows/pages.yml'); p=pages.read_text(encoding='utf-8')
          if "- 'dashboard-kol-forward.html'" not in p:
              needle="      - 'dashboard-cyberleek.html'\n"
              if needle not in p: raise SystemExit('pages dashboard path marker missing')
              p=p.replace(needle,needle+"      - 'dashboard-kol-forward.html'\n",1)
          if "- 'data/kol-forward-summary.json'" not in p:
              needle="      - 'data/case-study-cyberleek.json'\n"
              if needle not in p: raise SystemExit('pages data path marker missing')
              p=p.replace(needle,needle+"      - 'data/kol-forward-summary.json'\n      - 'data/kol-forward-ledger.json'\n",1)
          if '_site/kol' not in p:
              needle='          mkdir -p _site/live _site/terminal _site/performance _site/backtest _site/control _site/hub _site/revival _site/hybrid _site/cyberleek\n'
              if needle not in p: raise SystemExit('pages mkdir marker missing')
              p=p.replace(needle,needle.rstrip('\n')+' _site/kol\n',1)
          if 'cp dashboard-kol-forward.html _site/kol/index.html' not in p:
              needle='          cp dashboard-cyberleek.html _site/cyberleek/index.html\n'
              if needle not in p: raise SystemExit('pages copy marker missing')
              p=p.replace(needle,needle+'          cp dashboard-kol-forward.html _site/kol/index.html\n',1)
          if "check_text _site/kol/index.html 'KOL FORWARD LAB'" not in p:
              needle="          check_text _site/cyberleek/index.html 'CYBERLEEK · EXACT-PAIR DEEP WATCH'\n"
              if needle not in p: raise SystemExit('pages check marker missing')
              p=p.replace(needle,needle+"          check_text _site/kol/index.html 'KOL FORWARD LAB'\n          check_text _site/index.html 'KOL FORWARD · זיהוי מוקדם בלבד'\n",1)
          pages.write_text(p,encoding='utf-8')
          PY
      - name: Validate implementation
        run: |
          python -m py_compile src/wallet500/kol_forward_experiment.py
          python -m json.tool experiments/kol-forward-v1.json >/dev/null
          python -m json.tool data/kol-forward-summary.json >/dev/null
          grep -Fq 'Run prospective KOL forward experiment' .github/workflows/live-scan.yml
          grep -Fq 'KOL FORWARD · זיהוי מוקדם בלבד' index.html
          grep -Fq 'dashboard-kol-forward.html _site/kol/index.html' .github/workflows/pages.yml
          echo KOL_FORWARD_BOOTSTRAP_STATIC_OK
      - name: Establish immutable forward start and first source poll
        run: python -m wallet500.kol_forward_experiment
      - name: Commit bootstrap installation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/live-scan.yml .github/workflows/pages.yml data/kol-forward-summary.json data/kol-forward-ledger.json
          if git diff --cached --quiet; then
            echo 'Bootstrap already installed'
            exit 0
          fi
          git commit -m 'feat: activate prospective KOL forward lab'
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo 'Bootstrap stopped fail-closed on rebase conflict'
              exit 1
            fi
            if git push origin HEAD:main; then exit 0; fi
            [ "$attempt" -eq 3 ] && exit 1
            sleep $((attempt * 2))
          done
