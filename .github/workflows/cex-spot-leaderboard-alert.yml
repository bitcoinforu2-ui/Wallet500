name: Wallet500 CEX Leaderboard Research Scan

on:
  workflow_dispatch:
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/cex-spot-leaderboard-alert.yml'
      - 'src/wallet500/cex_spot_revival.py'
      - 'src/wallet500/cex_spot_leaderboard_bridge.py'
      - 'src/wallet500/cex_spot_identity.py'
      - 'src/wallet500/cex_spot_identity_fallback.py'
      - 'src/wallet500/cex_spot_divergence.py'
      - 'src/wallet500/cex_spot_watch_telegram.py'
      - 'tests/test_cex_spot_revival.py'
      - 'tests/test_cex_spot_leaderboard_bridge.py'
      - 'tests/test_cex_spot_watch_telegram.py'
      - 'tests/test_cex_spot_identity_fallback.py'
      - 'tests/test_cex_spot_divergence.py'

permissions:
  contents: write

concurrency:
  group: wallet500-cex-leaderboard-research-scan
  cancel-in-progress: false

jobs:
  detect-research:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -e . pytest
      - name: Test leaderboard, identity, divergence and research notification boundary
        run: >-
          python -m pytest -q
          tests/test_cex_spot_revival.py
          tests/test_cex_spot_leaderboard_bridge.py
          tests/test_cex_spot_watch_telegram.py
          tests/test_cex_spot_identity_fallback.py
          tests/test_cex_spot_divergence.py
          tests/test_cex_spot_identity.py
          tests/test_cex_spot_dynamic_identity_bridge.py
          tests/test_cex_identity_preflight.py
          tests/test_cex_identity.py
      - name: Collect Spot markets, leaderboard evidence, exact identity and exact-pair divergence
        env:
          COINGECKO_DEMO_API_KEY: ${{ secrets.COINGECKO_DEMO_API_KEY }}
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path
          from wallet500.cex_spot_revival import run_cex_spot_revival
          from wallet500.cex_spot_leaderboard_bridge import run as bridge_leaderboard
          from wallet500.cex_spot_identity import run as resolve_identity
          from wallet500.cex_spot_divergence import run as enrich_divergence

          now=datetime.now(timezone.utc).isoformat()
          spot=run_cex_spot_revival(Path('data'), now)
          board=bridge_leaderboard(Path('data'), now)
          ident=resolve_identity(Path('data'))
          div=enrich_divergence(Path('data'))
          print('CEX_LEADERBOARD_RESEARCH_SCAN', {
              'generated_at': now,
              'healthy_sources': spot.get('healthy_sources'),
              'symbols_seen': spot.get('symbols_seen'),
              'spot_watch_count': spot.get('watch_count'),
              'leaderboard_symbols': board.get('leaderboard_symbols'),
              'injected': board.get('injected_count'),
              'annotated': board.get('annotated_count'),
              'identity_status': ident.get('status'),
              'identity_counts': ident.get('counts'),
              'divergence_enriched': div.get('enriched_count'),
              'divergence_errors': div.get('error_count'),
          })
          PY
      - name: Validate fail-closed research boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          board=json.loads(Path('data/cex-spot-leaderboard.json').read_text())
          ident=json.loads(Path('data/cex-spot-identity-radar.json').read_text())
          if board.get('research_only') is not True or board.get('automatic_buy') is not False:
              raise SystemExit('LEADERBOARD_RESEARCH_BOUNDARY_LEAK')
          truth=ident.get('truth_contract') or {}
          if ident.get('automatic_buy') is not False: raise SystemExit('IDENTITY_AUTO_BUY_LEAK')
          if truth.get('symbol_only_never_actionable') is not True: raise SystemExit('SYMBOL_ONLY_GUARD_MISSING')
          if truth.get('cex_only_never_real_alert') is not True: raise SystemExit('CEX_ONLY_REAL_ALERT_GUARD_MISSING')
          if truth.get('dex_fallback_requires_price_pair_age_coherence') is not True: raise SystemExit('DEX_FALLBACK_GUARD_MISSING')
          div=ident.get('cex_dex_divergence_enrichment') or {}
          dtruth=div.get('truth_contract') or {}
          if dtruth.get('exact_pair_only') is not True: raise SystemExit('DIVERGENCE_EXACT_PAIR_GUARD_MISSING')
          if dtruth.get('production_gates_unchanged') is not True: raise SystemExit('DIVERGENCE_PRODUCTION_BOUNDARY_LEAK')
          for row in ident.get('candidates') or []:
              if row.get('research_only') is not True or row.get('actionable') is not False:
                  raise SystemExit('CEX_RESEARCH_ACTIONABLE_LEAK')
          print('CEX_LEADERBOARD_FAIL_CLOSED_VALID')
          PY
      - name: Record CEX research telemetry without user-facing Telegram delivery
        run: python -m wallet500.cex_spot_watch_telegram
      - name: Publish fresh research state with bounded retries
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          base="$GITHUB_SHA"
          targets=(
            data/cex-spot-revival-radar.json
            data/cex-spot-identity-radar.json
            data/cex-spot-leaderboard.json
            data/cex-spot-telegram-report.json
            data/cex-spot-state.json
            data/cex-spot-state.json.gz
            data/cex-identity-registry.json
          )
          snap="$(mktemp -d)"
          for f in "${targets[@]}"; do
            if [ -f "$f" ]; then
              mkdir -p "$snap/$(dirname "$f")"
              cp -a "$f" "$snap/$f"
            fi
          done
          for attempt in $(seq 1 20); do
            git fetch origin main
            latest="$(git rev-parse origin/main)"
            conflict=0
            for f in "${targets[@]}"; do
              if ! git diff --quiet "$base" "$latest" -- "$f"; then
                echo "Newer main changed $f; preserving newer state and skipping stale publish"
                conflict=1
              fi
            done
            if [ "$conflict" -ne 0 ]; then exit 0; fi
            git reset --hard "$latest"
            for f in "${targets[@]}"; do
              if [ -f "$snap/$f" ]; then
                mkdir -p "$(dirname "$f")"
                cp -a "$snap/$f" "$f"
              elif git ls-files --error-unmatch "$f" >/dev/null 2>&1; then
                rm -f "$f"
              fi
            done
            for f in "${targets[@]}"; do
              if [ -e "$f" ] || git ls-files --error-unmatch "$f" >/dev/null 2>&1; then git add -A -- "$f"; fi
            done
            if git diff --cached --quiet; then echo "No CEX leaderboard state changes"; exit 0; fi
            git commit -m "data: refresh CEX leaderboard research state"
            if git push origin HEAD:main; then echo "CEX leaderboard research state published"; exit 0; fi
            sleep 1
          done
          echo "CEX leaderboard publisher failed after bounded retries"
          exit 1
