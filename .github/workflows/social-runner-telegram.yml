name: Wallet500 Social Runner Telegram

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'src/wallet500/social_runner_telegram.py'
      - 'tests/test_social_runner_telegram.py'
      - '.github/workflows/social-runner-telegram.yml'
  workflow_run:
    workflows:
      - "Wallet500 Social Runner Research"
    types: [completed]

permissions:
  contents: write

concurrency:
  group: wallet500-social-runner-telegram
  cancel-in-progress: false

jobs:
  telegram:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install and test joint pre-buy social alert policy
        run: |
          pip install -e . pytest
          python -m pytest -q tests/test_social_runner_telegram.py

      - name: Validate source safety contracts
        if: github.event_name != 'pull_request'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          sp=Path('data/social-runner-research.json')
          if not sp.is_file() or not sp.stat().st_size:
              raise SystemExit('SOCIAL_RUNNER_TELEGRAM_SOCIAL_SOURCE_MISSING')
          s=json.loads(sp.read_text())
          if s.get('mode')!='RESEARCH_ONLY_SOCIAL_RUNNER_INTELLIGENCE_V1':
              raise SystemExit('SOCIAL_RUNNER_TELEGRAM_SOCIAL_MODE_DRIFT')
          if s.get('research_only') is not True or s.get('production_effect') is not False or s.get('automatic_buy') is not False:
              raise SystemExit('SOCIAL_RUNNER_TELEGRAM_SOCIAL_SAFETY_DRIFT')

          cp=Path('data/candidate-evidence-envelope.json')
          if cp.is_file() and cp.stat().st_size:
              c=json.loads(cp.read_text())
              if c.get('mode')!='RESEARCH_ONLY_CANDIDATE_EVIDENCE_ENVELOPE_V1':
                  raise SystemExit('SOCIAL_RUNNER_TELEGRAM_CANDIDATE_MODE_DRIFT')
              if c.get('production_change') is not False or c.get('automatic_buy') is not False:
                  raise SystemExit('SOCIAL_RUNNER_TELEGRAM_CANDIDATE_SAFETY_DRIFT')
          print('SOCIAL_RUNNER_TELEGRAM_SOURCE_CONTRACTS_OK')
          PY

      - name: Deliver only joint CONFIRMED_RUNNER plus PAPER_BUY_CANDIDATE transitions
        if: github.event_name != 'pull_request'
        env:
          TELEGRAM_BOT_TOKEN: ''
          TELEGRAM_CHAT_ID: ''
        run: python -m wallet500.social_runner_telegram

      - name: Persist social pre-buy Telegram dedupe and report atomically
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'wallet500-truth-bot'
          git config user.email 'wallet500-truth-bot@users.noreply.github.com'
          python scripts/atomic_publish.py \
            --github-api-cas \
            --message 'telegram: persist joint social pre-buy alert state' \
            data/social-runner-telegram-state.json \
            data/social-runner-telegram-report.json

      - name: Validate delivery policy
        if: github.event_name != 'pull_request'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('data/social-runner-telegram-report.json').read_text())
          if r.get('mode')!='JOINT_PREBUY_SOCIAL_TELEGRAM_V1':
              raise SystemExit('SOCIAL_RUNNER_TELEGRAM_MODE_DRIFT')
          if r.get('configured') is not False:
              raise SystemExit('SOCIAL_RUNNER_DIRECT_TELEGRAM_MUST_BE_DISABLED')
          if int(r.get('delivered_count') or 0) != 0:
              raise SystemExit('SOCIAL_RUNNER_DIRECT_TELEGRAM_DELIVERY_LEAK')
          if int(r.get('error_count') or 0)>0:
              raise SystemExit(f"SOCIAL_RUNNER_TELEGRAM_ERRORS={r.get('error_count')}")
          p=r.get('policy') or {}
          required={
              'raw_social_notifications': False,
              'early_runner_notifications': False,
              'confirmed_runner_requires_prebuy': True,
              'exact_chain_contract_pair_required': True,
              'late_attention_silent': True,
              'distribution_false_social_silent': True,
              'automatic_buy': False,
              'real_alert_pipeline_unchanged': True,
              'final_buy_pipeline_separate': True,
          }
          for key,value in required.items():
              if p.get(key) is not value:
                  raise SystemExit('SOCIAL_RUNNER_TELEGRAM_POLICY_DRIFT:'+key)
          print('SOCIAL_RUNNER_TELEGRAM_OK', {'eligible':r.get('eligible_count'),'delivered':r.get('delivered_count'),'candidate_source_valid':r.get('candidate_source_valid')})
          PY
