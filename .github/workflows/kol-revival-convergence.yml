name: Wallet500 KOL Revival Convergence

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths:
      - 'experiments/kol-revival-convergence-v1.json'
      - 'src/wallet500/kol_revival_convergence.py'
      - 'src/wallet500/kol_revival_convergence_runner.py'
      - 'tests/test_kol_revival_convergence.py'
      - '.github/workflows/kol-revival-convergence.yml'

permissions:
  contents: write

concurrency:
  group: kol-revival-convergence
  cancel-in-progress: false

jobs:
  convergence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install and test KOL convergence truth rules
        run: |
          pip install -e . pytest
          python -m pytest -q tests/test_kol_revival_convergence.py
      - name: Scan verified KOL wallets forward only
        env:
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
        run: python -m wallet500.kol_revival_convergence_runner
      - name: Validate fail-closed mature contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/kol-revival-convergence-summary.json')
          l=Path('data/kol-revival-convergence-ledger.json')
          if not p.exists() or not l.exists(): raise SystemExit('KOL_CONVERGENCE_OUTPUT_MISSING')
          d=json.loads(p.read_text())
          if d.get('version')!='KOL_REVIVAL_CONVERGENCE_V1': raise SystemExit('KOL_CONVERGENCE_VERSION_INVALID')
          if d.get('mode')!='FORWARD_ONLY_WALLET_FIRST_RESEARCH': raise SystemExit('KOL_CONVERGENCE_MODE_INVALID')
          if d.get('production_portfolio_impact')!='NONE' or d.get('automatic_buy') is not False: raise SystemExit('KOL_CONVERGENCE_SAFETY_INVALID')
          rules=d.get('truth_contract') or {}
          required=['forward_only','verified_onchain_swap_buy_required','exact_mint_identity_required','market_age_gte_180d_required_for_signal','unknown_age_fails_closed','linked_wallets_count_once']
          if any(rules.get(k) is not True for k in required): raise SystemExit('KOL_CONVERGENCE_TRUTH_RULE_MISSING')
          for x in d.get('active') or []:
              if x.get('eligible_research_watch'):
                  m=x.get('market') or {}
                  if m.get('market_age_verified') is not True or float(m.get('market_age_min_days') or 0)<180: raise SystemExit('UNDERAGE_KOL_SIGNAL')
                  if m.get('liquidity_pass') is not True or float(m.get('liquidity_usd') or 0)<50000: raise SystemExit('LOW_LIQ_KOL_SIGNAL')
          print('KOL_REVIVAL_CONVERGENCE_V1_OK', d.get('active_convergences'), d.get('strong_or_higher_now'), 'retry_wallets', d.get('rpc_retry_wallets'))
          PY
      - name: Publish immutable forward ledger
        run: |
          set -euo pipefail
          git config user.name 'wallet500-kol-bot'
          git config user.email 'wallet500-kol-bot@users.noreply.github.com'
          tmp="$(mktemp -d)"
          cp data/kol-revival-convergence-summary.json "$tmp/summary.json"
          cp data/kol-revival-convergence-ledger.json "$tmp/ledger.json"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp "$tmp/summary.json" data/kol-revival-convergence-summary.json
            cp "$tmp/ledger.json" data/kol-revival-convergence-ledger.json
            git add data/kol-revival-convergence-summary.json data/kol-revival-convergence-ledger.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'research: refresh KOL revival convergence'
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
