name: Wallet500 Paid Attention Liquidity Hardening Bootstrap
on:
  push:
    paths:
      - '.github/workflows/paid-liquidity-hardening-bootstrap.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . pytest
      - name: Patch paid attention liquidity quarantine
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('src/wallet500/paid_attention_watch.py')
          s=p.read_text(encoding='utf-8')
          if 'MIN_RESEARCH_LIQUIDITY_USD = 50_000.0' not in s:
              s=s.replace('FRESHNESS_HOURS = 36\n', 'FRESHNESS_HOURS = 36\nMIN_RESEARCH_LIQUIDITY_USD = 50_000.0\nEXTREME_THIN_LIQUIDITY_USD = 10_000.0\n', 1)

          if 'def liquidity_class(' not in s:
              pattern=r'def classify_watch\(timing: str, confirmation: str, distribution: dict \| None\) -> str:\n.*?\n\n\ndef _live_pair'
              replacement='''def liquidity_class(t0_liquidity_usd, live_liquidity_usd, timing: str) -> str:\n    t0_liq = _n(t0_liquidity_usd)\n    live_liq = _n(live_liquidity_usd)\n    if live_liq is None:\n        return "LIQUIDITY_UNVERIFIED"\n    if live_liq < EXTREME_THIN_LIQUIDITY_USD:\n        if t0_liq is not None and t0_liq >= MIN_RESEARCH_LIQUIDITY_USD:\n            return "POST_PROMOTION_LIQUIDITY_COLLAPSE"\n        return "EXTREME_THIN_LIQUIDITY"\n    if live_liq < MIN_RESEARCH_LIQUIDITY_USD:\n        if t0_liq is not None and t0_liq >= MIN_RESEARCH_LIQUIDITY_USD:\n            return "POST_PROMOTION_LIQUIDITY_DRAIN"\n        return "LOW_LIQUIDITY_BELOW_RESEARCH_FLOOR"\n    if timing == "PROMOTION_DURING_CAPITULATION" and t0_liq is not None and t0_liq < MIN_RESEARCH_LIQUIDITY_USD:\n        return "POST_COLLAPSE_PAID_PROMOTION"\n    return "RESEARCH_LIQUIDITY_OK"\n\n\ndef classify_watch(\n    timing: str,\n    confirmation: str,\n    distribution: dict | None,\n    t0_liquidity_usd=None,\n    live_liquidity_usd=None,\n) -> str:\n    liq_class = liquidity_class(t0_liquidity_usd, live_liquidity_usd, timing)\n    if liq_class == "LIQUIDITY_UNVERIFIED":\n        return "PAID_ATTENTION_LIQUIDITY_UNVERIFIED"\n    if liq_class in {"EXTREME_THIN_LIQUIDITY", "POST_PROMOTION_LIQUIDITY_COLLAPSE", "POST_COLLAPSE_PAID_PROMOTION"}:\n        return "PAID_ATTENTION_PUMP_DUMP_LEARNING"\n    if liq_class in {"LOW_LIQUIDITY_BELOW_RESEARCH_FLOOR", "POST_PROMOTION_LIQUIDITY_DRAIN"}:\n        return "PAID_ATTENTION_LOW_LIQUIDITY_LEARNING"\n    risk = _n((distribution or {}).get("risk_score"))\n    if risk is not None and risk >= 50:\n        return "PAID_ATTENTION_RISK_RESEARCH"\n    if timing == "PROMOTION_AFTER_BREAKOUT":\n        return "PAID_ATTENTION_LATE_MOVE"\n    if timing == "PROMOTION_PRE_BREAKOUT_WINDOW" and confirmation in {\n        "WAKING_CONFIRMED_RESEARCH", "WAKING_STRONG_RESEARCH"\n    }:\n        return "PAID_ATTENTION_EARLY_CONFIRMING"\n    return "PAID_ATTENTION_RESEARCH_WATCH"\n\n\ndef _live_pair'''
              s,n=re.subn(pattern,replacement,s,count=1,flags=re.S)
              if n!=1: raise SystemExit('classify_watch patch failed')

          old='''        timing = timing_class(group)\n        watch_status = classify_watch(timing, confirmation, dist)\n'''
          new='''        timing = timing_class(group)\n        t0_liquidity_usd = _n((group.get("t0") or {}).get("liquidity_usd"))\n        live_liquidity_usd = _n(live.get("liquidity_usd"))\n        liq_class = liquidity_class(t0_liquidity_usd, live_liquidity_usd, timing)\n        watch_status = classify_watch(timing, confirmation, dist, t0_liquidity_usd, live_liquidity_usd)\n'''
          if old in s: s=s.replace(old,new,1)

          marker='''            "market": live,\n            "confirmation_status": confirmation,\n'''
          insert='''            "market": live,\n            "liquidity_evidence": {\n                "t0_liquidity_usd": t0_liquidity_usd,\n                "live_liquidity_usd": live_liquidity_usd,\n                "liquidity_class": liq_class,\n                "research_floor_usd": MIN_RESEARCH_LIQUIDITY_USD,\n                "extreme_thin_floor_usd": EXTREME_THIN_LIQUIDITY_USD,\n            },\n            "confirmation_status": confirmation,\n'''
          if marker in s and '"liquidity_evidence": {' not in s: s=s.replace(marker,insert,1)

          if '"PAID_ATTENTION_LOW_LIQUIDITY_LEARNING": 4' not in s:
              s=s.replace('''        "PAID_ATTENTION_RISK_RESEARCH": 2,\n        "PAID_ATTENTION_LATE_MOVE": 3,\n''','''        "PAID_ATTENTION_RISK_RESEARCH": 2,\n        "PAID_ATTENTION_LATE_MOVE": 3,\n        "PAID_ATTENTION_LOW_LIQUIDITY_LEARNING": 4,\n        "PAID_ATTENTION_PUMP_DUMP_LEARNING": 5,\n        "PAID_ATTENTION_LIQUIDITY_UNVERIFIED": 6,\n''',1)

          if '"low_liquidity_learning": sum(' not in s:
              s=s.replace('''        "late_move": sum(1 for x in rows if x["watch_status"] == "PAID_ATTENTION_LATE_MOVE"),\n        "ad_and_boost":''','''        "late_move": sum(1 for x in rows if x["watch_status"] == "PAID_ATTENTION_LATE_MOVE"),\n        "low_liquidity_learning": sum(1 for x in rows if x["watch_status"] == "PAID_ATTENTION_LOW_LIQUIDITY_LEARNING"),\n        "pump_dump_learning": sum(1 for x in rows if x["watch_status"] == "PAID_ATTENTION_PUMP_DUMP_LEARNING"),\n        "liquidity_unverified": sum(1 for x in rows if x["watch_status"] == "PAID_ATTENTION_LIQUIDITY_UNVERIFIED"),\n        "live_liquidity_ge_50k": sum(1 for x in rows if _n((x.get("market") or {}).get("liquidity_usd"), 0.0) >= MIN_RESEARCH_LIQUIDITY_USD),\n        "live_liquidity_lt_50k": sum(1 for x in rows if _n((x.get("market") or {}).get("liquidity_usd"), 0.0) < MIN_RESEARCH_LIQUIDITY_USD),\n        "live_liquidity_lt_10k": sum(1 for x in rows if _n((x.get("market") or {}).get("liquidity_usd"), 0.0) < EXTREME_THIN_LIQUIDITY_USD),\n        "ad_and_boost":''',1)

          rule='''            "Missing providers remain unavailable and never become positive evidence.",\n'''
          if 'Paid Attention main watch requires live exact-pair liquidity' not in s:
              s=s.replace(rule,rule+'''            "Paid Attention main watch requires verified live exact-pair liquidity >= $50K; thinner or unverified pairs are quarantined for learning only.",\n            "T0 liquidity and live liquidity are preserved to distinguish already-thin promotions from post-promotion liquidity collapse.",\n''',1)
          p.write_text(s,encoding='utf-8')

          t=Path('tests/test_paid_attention_watch.py')
          q=t.read_text(encoding='utf-8')
          q=q.replace('from wallet500.paid_attention_watch import _fresh_paid_groups, classify_watch, timing_class','from wallet500.paid_attention_watch import _fresh_paid_groups, classify_watch, liquidity_class, timing_class')
          if 'test_extreme_thin_liquidity_goes_to_pump_dump_learning' not in q:
              q+='''\n\ndef test_extreme_thin_liquidity_goes_to_pump_dump_learning():\n    assert classify_watch("PROMOTION_DURING_CAPITULATION", "WAKING_UNCONFIRMED_RESEARCH", None, 2500, 2200) == "PAID_ATTENTION_PUMP_DUMP_LEARNING"\n\ndef test_below_50k_is_learning_not_main_watch():\n    assert classify_watch("PROMOTION_PRE_BREAKOUT_WINDOW", "WAKING_STRONG_RESEARCH", None, 30000, 35000) == "PAID_ATTENTION_LOW_LIQUIDITY_LEARNING"\n\ndef test_liquidity_collapse_after_healthy_t0_is_learning():\n    assert liquidity_class(80000, 4000, "PROMOTION_PRE_BREAKOUT_WINDOW") == "POST_PROMOTION_LIQUIDITY_COLLAPSE"\n    assert classify_watch("PROMOTION_PRE_BREAKOUT_WINDOW", "WAKING_STRONG_RESEARCH", None, 80000, 4000) == "PAID_ATTENTION_PUMP_DUMP_LEARNING"\n\ndef test_unverified_liquidity_is_quarantined():\n    assert classify_watch("PROMOTION_PRE_BREAKOUT_WINDOW", "WAKING_STRONG_RESEARCH", None, 80000, None) == "PAID_ATTENTION_LIQUIDITY_UNVERIFIED"\n\ndef test_healthy_liquidity_can_be_early_confirming():\n    assert classify_watch("PROMOTION_PRE_BREAKOUT_WINDOW", "WAKING_STRONG_RESEARCH", None, 80000, 90000) == "PAID_ATTENTION_EARLY_CONFIRMING"\n'''
          t.write_text(q,encoding='utf-8')

          d=Path('data/decision-lab.html')
          h=d.read_text(encoding='utf-8')
          h=h.replace('Boost או Ad מאומת מכניס את המטבע למחקר גם אם Revival לא גילה אותו קודם. זהו Trigger לתשומת לב בלבד — לא BUY ולא PRE-ALPHA. EARLY CONFIRMING דורש ראיות עצמאיות מעבר לתשלום.','Boost או Ad מאומת מכניס למחקר בלבד. ה-Watch הראשי דורש exact-pair ונזילות חיה מאומתת ≥ $50K. זוגות דקים או לא מאומתים נשמרים רק בארכיון Warning/Learning.')
          marker='<div id="attention" class="grid" style="margin-top:8px"><div class="sub">טוען Paid Attention Watch...</div></div></section>'
          if marker in h and 'id="attentionLearning"' not in h:
              h=h.replace(marker,'<div id="attention" class="grid" style="margin-top:8px"><div class="sub">טוען Paid Attention Watch...</div></div><div class="head" style="margin-top:14px">⚠ Warning / Pump-Dump / Low Liquidity Learning</div><div class="sub">למידה בלבד — לא Watch, לא PRE-ALPHA ולא BUY. &lt;$50K quarantined; &lt;$10K Pump/Dump learning.</div><div id="attentionLearning" class="grid" style="margin-top:8px"></div></section>',1)
          h=h.replace("[['TRACKED',c.tracked],['EARLY CONFIRMING',c.early_confirming],['RESEARCH WATCH',c.research_watch],['LATE MOVE',c.late_move],['RISK',c.risk],['AD+BOOST',c.ad_and_boost],['BOOST 500+',c.boost_500_plus]]","[['TRACKED',c.tracked],['LIQ ≥50K',c.live_liquidity_ge_50k],['EARLY CONFIRMING',c.early_confirming],['RESEARCH WATCH',c.research_watch],['LATE MOVE',c.late_move],['<50K LEARN',c.live_liquidity_lt_50k],['<10K P&D',c.live_liquidity_lt_10k]]")
          old="$('attention').innerHTML=(a.targets||[]).length?(a.targets||[]).slice(0,36).map(attCard).join(''):"
          if old in h and 'attentionLearning' in h:
              h=h.replace(old,"let at=a.targets||[],quarantine=['PAID_ATTENTION_LOW_LIQUIDITY_LEARNING','PAID_ATTENTION_PUMP_DUMP_LEARNING','PAID_ATTENTION_LIQUIDITY_UNVERIFIED'],learn=at.filter(x=>quarantine.includes(x.watch_status)),active=at.filter(x=>!quarantine.includes(x.watch_status));$('attention').innerHTML=active.length?active.slice(0,36).map(attCard).join(''):",1)
              h=h.replace("try{let p=await j('revival-precursor-latest.json')","$('attentionLearning').innerHTML=learn.length?learn.slice(0,24).map(attCard).join(''):'<div class=\"sub\">אין כרגע מקרי quarantine.</div>';try{let p=await j('revival-precursor-latest.json')",1)
          d.write_text(h,encoding='utf-8')
          PY
      - name: Verify patch
        run: |
          grep -Fq 'MIN_RESEARCH_LIQUIDITY_USD = 50_000.0' src/wallet500/paid_attention_watch.py
          grep -Fq 'PAID_ATTENTION_PUMP_DUMP_LEARNING' src/wallet500/paid_attention_watch.py
          grep -Fq 'PAID_ATTENTION_LIQUIDITY_UNVERIFIED' src/wallet500/paid_attention_watch.py
          grep -Fq 'attentionLearning' data/decision-lab.html
          pytest -q tests/test_paid_attention_watch.py
      - name: Commit source hardening
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/wallet500/paid_attention_watch.py tests/test_paid_attention_watch.py data/decision-lab.html
          if git diff --cached --quiet; then echo 'No changes'; exit 0; fi
          git commit -m 'research: quarantine thin paid promotions from active watch'
          git pull --rebase origin main
          git push
