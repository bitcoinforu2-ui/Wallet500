name: Wallet500 BULLA Cluster Telegram Watch

on:
  workflow_dispatch:
  schedule:
    - cron: '22 * * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/bulla_cluster_watch.py'
      - '.github/workflows/bulla-cluster-telegram-watch.yml'

permissions:
  contents: write

# Exact-token / exact-pair watch. Never auto-trades and never treats a CEX
# withdrawal as a buy signal by itself.
concurrency:
  group: wallet500-bulla-cluster-telegram-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate watcher syntax
        run: python -m py_compile scripts/bulla_cluster_watch.py

      - name: Scan finalized BNB transfers and alert only on material BULLA events
        env:
          TELEGRAM_BOT_TOKEN: ''
          TELEGRAM_CHAT_ID: ''
        run: python scripts/bulla_cluster_watch.py

      - name: Persist BULLA forward-only watch state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          STATE='data/bulla-cluster-watch-state.json'
          if [ ! -f "$STATE" ]; then
            echo 'BULLA state file was not produced' >&2
            exit 1
          fi
          # Update only this state blob through the Contents API. The blob SHA is
          # refreshed on every retry, so unrelated writers advancing main cannot
          # cause a non-fast-forward push failure. A same-file race fails closed
          # and retries against the newest blob instead of overwriting blindly.
          for attempt in 1 2 3 4 5; do
            sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${STATE}?ref=main" --jq '.sha' 2>/dev/null || true)"
            encoded="$(base64 -w0 "$STATE")"
            payload="$(python - "$sha" "$encoded" <<'PY'
          import json, sys
          sha, content = sys.argv[1], sys.argv[2]
          p = {"message": "chore: update BULLA cluster watch state [skip ci]", "content": content, "branch": "main"}
          if sha:
              p["sha"] = sha
          print(json.dumps(p))
          PY
          )"
            if printf '%s' "$payload" | gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${STATE}" --input - >/tmp/bulla-put.json 2>/tmp/bulla-put.err; then
              echo "BULLA_STATE_PERSISTED_CONTENTS_API attempt=${attempt} commit=$(jq -r '.commit.sha' /tmp/bulla-put.json)"
              exit 0
            fi
            echo "BULLA_STATE_CAS_RETRY attempt=${attempt}: $(cat /tmp/bulla-put.err)" >&2
            sleep $((attempt * 2))
          done
          echo 'BULLA state persistence failed after CAS retries' >&2
          exit 1
