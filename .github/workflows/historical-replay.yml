name: Wallet500 Historical Replay Research

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
  push:
    paths:
      - '.github/workflows/historical-replay.yml'
      - 'src/wallet500/historical_backfill.py'
      - 'src/wallet500/historical_replay.py'
      - 'src/wallet500/onchain_historical_reconstruction.py'
      - 'src/wallet500/historical_truth_backtest.py'
      - 'data/discovery-evidence-ledger.json'
      - 'data/cash-verified-performance.json'

permissions:
  contents: write

# All workflows that publish generated data to main must share one
# non-cancelling group. This prevents a research checkpoint commit from
# racing the live truth publisher while it is rebasing/pushing.
concurrency:
  group: wallet500-main-data-publisher
  cancel-in-progress: false

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Incrementally backfill exact-pair market history
        run: |
          export PYTHONPATH="$PWD/src"
          python -m wallet500.historical_backfill

      - name: Reconstruct point-in-time exact-pair state on-chain
        run: |
          export PYTHONPATH="$PWD/src"
          python -m wallet500.onchain_historical_reconstruction

      - name: Build isolated historical research report
        run: |
          export PYTHONPATH="$PWD/src"
          python -m wallet500.historical_replay

      - name: Build strict no-hindsight truth backtest
        run: |
          export PYTHONPATH="$PWD/src"
          python -m wallet500.historical_truth_backtest
          python - <<'PY'
          import json
          from pathlib import Path
          bp=Path('data/historical-backfill-report.json')
          rp=Path('data/historical-replay-report.json')
          op=Path('data/onchain-historical-reconstruction.json')
          tp=Path('data/historical-truth-backtest.json')
          assert bp.exists() and rp.exists() and op.exists() and tp.exists()
          b=json.loads(bp.read_text())
          r=json.loads(rp.read_text())
          o=json.loads(op.read_text())
          t=json.loads(tp.read_text())
          assert b['mode']=='RESEARCH_ONLY_INCREMENTAL_BACKFILL'
          assert b['production_portfolio_impact']=='NONE'
          assert b['lookahead_policy']=='FORBIDDEN'
          assert r['mode']=='RESEARCH_ONLY_NO_PRODUCTION_WRITES'
          assert r['production_portfolio_impact']=='NONE'
          assert r['lookahead_policy']=='FORBIDDEN'
          assert o['mode']=='ONCHAIN_POINT_IN_TIME_RECONSTRUCTION'
          assert o['production_portfolio_impact']=='NONE'
          assert o['lookahead_policy']=='FORBIDDEN'
          assert o['pair_identity_policy']=='EXACT_LOCKED_PAIR_ONLY'
          assert t['mode']=='STRICT_NO_HINDSIGHT_BACKTEST_VERIFIER'
          assert t['lookahead_policy']=='FORBIDDEN'
          assert t['pair_identity_policy']=='EXACT_LOCKED_PAIR_ONLY'
          assert t['minimum_entry_liquidity_usd']==50000.0
          assert set(t['windows'])=={'7','30','90'}
          for w in t['windows'].values():
              if w['status'] != 'BACKTEST_VERIFIED':
                  assert w['verified_roi_pct'] is None
                  assert w['verified_pnl_usd'] is None
          print('Historical truth lane validated: exact pair, on-chain reconstruction, no hindsight, no fake ROI')
          PY

      - name: Commit research outputs only
        run: |
          set -euo pipefail
          git config user.name 'wallet500-research-bot'
          git config user.email 'wallet500-research-bot@users.noreply.github.com'

          # Preserve only the validated research outputs. On every retry reset
          # to the newest main first, then re-apply those files. This avoids
          # merge strategies that could accidentally carry stale generated
          # data from the job's checkout over newer truth data.
          tmp="$(mktemp -d)"
          files=(
            historical-backfill-state.json
            historical-backfill-report.json
            onchain-historical-reconstruction-state.json
            onchain-historical-reconstruction.json
            historical-replay-report.json
            historical-truth-backtest.json
          )
          for f in "${files[@]}"; do cp "data/$f" "$tmp/$f"; done

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            for f in "${files[@]}"; do cp "$tmp/$f" "data/$f"; done
            git add \
              data/historical-backfill-state.json \
              data/historical-backfill-report.json \
              data/onchain-historical-reconstruction-state.json \
              data/onchain-historical-reconstruction.json \
              data/historical-replay-report.json \
              data/historical-truth-backtest.json
            if git diff --cached --quiet; then
              echo 'No research output change'
              exit 0
            fi
            git commit -m 'research: advance onchain historical truth checkpoint'
            if git push origin HEAD:main; then
              echo 'HISTORICAL_RESEARCH_PUBLISH_OK'
              exit 0
            fi
            echo "HISTORICAL_RESEARCH_PUBLISH_RETRY attempt=$attempt"
            sleep 3
          done
          echo '::error::HISTORICAL_RESEARCH_PUBLISH_RACE_EXHAUSTED'
          exit 1
