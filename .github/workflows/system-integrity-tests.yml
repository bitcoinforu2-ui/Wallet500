name: Wallet500 System Integrity Tests

on:
  workflow_dispatch:
  schedule:
    - cron: '41 * * * *'
  workflow_run:
    workflows: ['Wallet500 Multi-Chain Live Scan']
    types: [completed]
  push:
    paths:
      - 'src/wallet500/system_integrity_audit.py'
      - 'src/wallet500/liquidity_truth.py'
      - 'src/wallet500/liquidity_truth_guard.py'
      - 'src/wallet500/production_risk_gate.py'
      - 'src/wallet500/cex_identity.py'
      - 'src/wallet500/cex_fast_lane.py'
      - 'src/wallet500/real_alerts.py'
      - 'src/wallet500/survivor_wave_watch.py'
      - 'src/wallet500/survivor_wallet_transaction_intelligence_v5.py'
      - 'tests/test_system_integrity_audit.py'
      - '.github/workflows/system-integrity-tests.yml'

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'

jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout current truth
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test runtime
        run: python -m pip install -e . pytest

      - name: Critical unit tests
        run: |
          pytest -q \
            tests/test_system_integrity_audit.py \
            tests/test_production_risk_gate.py \
            tests/test_cex_identity.py

      - name: Full regression suite
        run: pytest -q

      - name: Live data-quality and bottleneck audit
        id: audit
        shell: bash
        run: |
          set +e
          python -m wallet500.system_integrity_audit --data-dir data --fail-on critical
          rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish audit to job summary
        if: always()
        shell: bash
        run: |
          if [ -f data/system-integrity-audit.json ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          p=json.loads(Path('data/system-integrity-audit.json').read_text())
          print('# Wallet500 System Integrity Audit')
          print()
          print(f"**Status:** {p.get('status')}  ")
          print(f"**Severity:** {p.get('severity_counts')}  ")
          print()
          print('## Top bottlenecks')
          rows=p.get('top_bottlenecks') or []
          if not rows:
              print('No CRITICAL/HIGH findings.')
          for x in rows[:15]:
              print(f"- **{x.get('severity')} · {x.get('code')}** — {x.get('message')} ({x.get('file') or 'n/a'})")
          PY
          fi

      - name: Upload integrity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wallet500-system-integrity-${{ github.run_id }}
          path: data/system-integrity-audit.json
          if-no-files-found: error
          retention-days: 14

      - name: Enforce critical fail-closed
        if: always()
        shell: bash
        run: |
          test "${{ steps.audit.outputs.exit_code }}" = "0" || {
            echo 'CRITICAL SYSTEM/DATA INTEGRITY FAILURE — see audit artifact and job summary.'
            exit 1
          }
