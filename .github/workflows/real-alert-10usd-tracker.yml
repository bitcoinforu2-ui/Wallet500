name: Wallet500 New REAL ALERT $10 Paper Tracker Repair

on:
  workflow_dispatch:
  schedule:
    - cron: '11,41 * * * *'

permissions:
  contents: write

concurrency:
  group: wallet500-real-alert-10usd-paper-tracker-repair
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: pip install -e . pytest

      - name: Test new-alert $10 tracking and Signal DNA enrichment contracts
        run: >-
          python -m pytest -q
          tests/test_real_alert_10usd_tracker.py
          tests/test_paper_signal_enrichment.py

      - name: Reconcile $10 paper cohort from newly delivered Telegram REAL ALERTs only
        run: python -m wallet500.real_alert_10usd_tracker

      - name: Enrich $10 positions with immutable T0 Signal DNA
        run: python -m wallet500.paper_signal_enrichment

      - name: Validate outputs
        run: |
          python -m json.tool data/real-alert-10usd-ledger.json >/dev/null
          python -m json.tool data/real-alert-10usd-summary.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('data/real-alert-10usd-summary.json').read_text())
          if s.get('mode') != 'PAPER_ONLY_NO_REAL_MONEY':
              raise SystemExit('REAL_ALERT_10USD_MODE_DRIFT')
          if float(s.get('position_size_usd') or 0) != 10.0:
              raise SystemExit('REAL_ALERT_10USD_SIZE_DRIFT')
          if s.get('new_entry_trigger') != 'SUCCESSFULLY_DELIVERED_NEW_TELEGRAM_REAL_ALERT_AFTER_ACTIVATION_ONLY':
              raise SystemExit('REAL_ALERT_10USD_TRIGGER_DRIFT')
          positions=list(s.get('positions') or [])
          immutable=sum(1 for p in positions if isinstance(p,dict) and p.get('signal_dna_immutable_t0') is True)
          print('REAL_ALERT_10USD_TRACKER_REPAIR_OK', {'positions':s.get('positions_total'),'roi_pct':s.get('roi_pct'),'immutable_signal_dna_positions':immutable})
          PY

      - name: Publish repaired tracker state
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/real-alert-10usd-ledger.json data/real-alert-10usd-summary.json
          if git diff --cached --quiet; then
            echo "No $10 tracker changes"
            exit 0
          fi
          git commit -m "data: repair new REAL ALERT $10 paper tracker"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 2))
          done
          echo "Failed to publish $10 tracker after 5 attempts"
          exit 1
