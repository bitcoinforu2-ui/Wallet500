name: Wallet500 New REAL ALERT $10 Paper Tracker

on:
  workflow_run:
    workflows: ["Wallet500 Verified Snapshot Publisher"]
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: '5,20,35,50 * * * *'

permissions:
  contents: write

concurrency:
  group: wallet500-real-alert-10usd-paper-tracker
  cancel-in-progress: true

jobs:
  track:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: pip install -e . pytest

      - name: Test new-alert $10 tracking contract
        run: python -m pytest -q tests/test_real_alert_10usd_tracker.py

      - name: Reconcile $10 paper cohort from newly delivered Telegram REAL ALERTs only
        run: python -m wallet500.real_alert_10usd_tracker

      - name: Validate outputs
        run: |
          python -m json.tool data/real-alert-10usd-ledger.json >/dev/null
          python -m json.tool data/real-alert-10usd-summary.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('data/real-alert-10usd-summary.json').read_text())
          if s.get('mode') != 'PAPER_ONLY_NO_REAL_MONEY':
              raise SystemExit('REAL_ALERT_10USD_MODE_DRIFT')
          if float(s.get('position_size_usd') or 0) != 10.0:
              raise SystemExit('REAL_ALERT_10USD_SIZE_DRIFT')
          if s.get('new_entry_trigger') != 'SUCCESSFULLY_DELIVERED_NEW_TELEGRAM_REAL_ALERT_AFTER_ACTIVATION_ONLY':
              raise SystemExit('REAL_ALERT_10USD_TRIGGER_DRIFT')
          print('REAL_ALERT_10USD_TRACKER_OK', {'positions':s.get('positions_total'),'roi_pct':s.get('roi_pct')})
          PY

      - name: Publish tracker state
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/real-alert-10usd-ledger.json data/real-alert-10usd-summary.json
          if git diff --cached --quiet; then
            echo "No $10 tracker changes"
            exit 0
          fi
          git commit -m "data: update new REAL ALERT $10 paper tracker"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 2))
          done
          echo "Failed to publish $10 tracker after 3 attempts"
          exit 1
