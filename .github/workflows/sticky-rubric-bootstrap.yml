name: Wallet500 Sticky Experiment Rubric Bootstrap

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sticky-rubric-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wallet500-sticky-rubric-bootstrap
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Add persistent rubric CSS to every dashboard source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          files = [
              Path('index.html'),
              Path('dashboard-live.html'),
              Path('dashboard-terminal.html'),
              Path('dashboard-performance.html'),
              Path('dashboard-backtest.html'),
              Path('dashboard-engine-control.html'),
              Path('dashboard-revival1000.html'),
              Path('dashboard-hybrid.html'),
              Path('dashboard-cyberleek.html'),
              Path('dashboard-kol-forward.html'),
              Path('data/decision-lab.html'),
          ]
          marker = 'W500_STICKY_RUBRIC_V1'
          css = '''<style id="w500-sticky-rubric-source">/* W500_STICKY_RUBRIC_V1 */#w500-experiment-rubric{position:sticky!important;top:0!important;z-index:2147483000!important;background:rgba(2,8,13,.98)!important;box-shadow:0 4px 14px rgba(0,0,0,.45)!important;-webkit-overflow-scrolling:touch!important}</style>'''
          changed = []
          for p in files:
              if not p.exists():
                  raise SystemExit(f'missing dashboard source: {p}')
              s = p.read_text(encoding='utf-8')
              if marker in s:
                  continue
              if '</head>' not in s:
                  raise SystemExit(f'missing </head> in {p}')
              p.write_text(s.replace('</head>', css + '</head>', 1), encoding='utf-8')
              changed.append(str(p))
          print('PATCHED', changed)
          PY
          for f in index.html dashboard-live.html dashboard-terminal.html dashboard-performance.html dashboard-backtest.html dashboard-engine-control.html dashboard-revival1000.html dashboard-hybrid.html dashboard-cyberleek.html dashboard-kol-forward.html data/decision-lab.html; do
            grep -Fq 'W500_STICKY_RUBRIC_V1' "$f" || { echo "missing sticky rubric marker in $f"; exit 1; }
          done
      - name: Commit source-level sticky rubric
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No changes needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html dashboard-live.html dashboard-terminal.html dashboard-performance.html dashboard-backtest.html dashboard-engine-control.html dashboard-revival1000.html dashboard-hybrid.html dashboard-cyberleek.html dashboard-kol-forward.html data/decision-lab.html
          git commit -m 'ui: enforce sticky experiment rubric across dashboards'
          git pull --rebase origin main
          git push origin HEAD:main
