name: Wallet500 Repair Recovery Watch 90D 15K — MANUAL LEGACY TOOL

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wallet500-recovery-policy-repair-manual
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assert this is isolated legacy Recovery V2 research only
        run: |
          python - <<'PY'
          from wallet500.truth_contract import (
              RESEARCH_MIN_MARKET_AGE_DAYS,
              RESEARCH_MIN_LIQUIDITY_USD,
              PRODUCTION_MIN_MARKET_AGE_DAYS,
              PRODUCTION_MIN_LIQUIDITY_USD,
          )
          assert RESEARCH_MIN_MARKET_AGE_DAYS == 90
          assert RESEARCH_MIN_LIQUIDITY_USD == 15000
          assert PRODUCTION_MIN_MARKET_AGE_DAYS == 180
          assert PRODUCTION_MIN_LIQUIDITY_USD == 50000
          print('LEGACY_RECOVERY_TOOL_ISOLATED_FROM_PRODUCTION')
          PY
      - name: Apply Recovery Watch research repair
        run: python scripts/repair_recovery_watch_90d_15k.py
      - name: Install and test Recovery V2 compatibility
        run: |
          pip install -e . pytest
          python -m pytest -q tests/test_reawakening_shadow.py tests/test_reawakening_forward_tracker.py tests/test_reawakening_forward_fast_runner.py tests/test_reawakening_dashboard.py tests/test_reawakening_telegram.py
      - name: Rebuild forward-only Recovery V2 research truth
        env:
          WALLET500_REAWAKENING_REQUEST_PAUSE_SECONDS: '0.22'
        run: |
          python -m wallet500.reawakening_forward_fast_runner
          python -m wallet500.reawakening_dashboard
      - name: Validate isolated research scope before publish
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('data/reawakening-dashboard.json').read_text())
          rule=d.get('rule') or {}
          assert float(rule.get('minimum_market_age_days') or 0) == 90.0
          assert float(rule.get('liquidity_floor_usd') or 0) == 15000.0
          assert rule.get('near_recovery_requires_current_exact_pair') is True
          assert rule.get('near_recovery_requires_anti_chase_window') is True
          assert rule.get('near_recovery_requires_returning_activity') is True
          print('LEGACY_RECOVERY_RESEARCH_ONLY_OK', d.get('counts'))
          PY
      - name: Commit isolated Recovery V2 research outputs only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'wallet500-truth-bot'
          git config user.email 'wallet500-truth-bot@users.noreply.github.com'
          git add \
            data/reawakening-shadow.json \
            data/reawakening-shadow-state.json \
            data/reawakening-forward-state.json \
            data/reawakening-forward-report.json \
            data/reawakening-dashboard.json
          if git diff --cached --quiet; then
            echo 'NO_LEGACY_RECOVERY_DATA_CHANGE'
            exit 0
          fi
          git commit -m 'research: refresh isolated Recovery V2 compatibility outputs'
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 2))
          done
          exit 1
