name: Wallet500 Telegram Chat ID Discovery

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover-chat-id:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Discover latest Telegram chat ID
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        shell: bash
        run: |
          set +e
          python - <<'PY'
          import json, os, urllib.request, urllib.error
          from pathlib import Path

          summary = Path(os.environ.get('GITHUB_STEP_SUMMARY', '/tmp/summary.md'))
          token = os.environ.get('TELEGRAM_BOT_TOKEN', '').strip()

          def write(lines):
              text = '\n'.join(lines) + '\n'
              try:
                  summary.write_text(text, encoding='utf-8')
              except Exception:
                  pass
              print(text)

          if not token:
              write([
                  '## Telegram Chat ID Discovery',
                  '',
                  '❌ **TELEGRAM_BOT_TOKEN is missing**',
                  '',
                  'Update the repository secret `TELEGRAM_BOT_TOKEN` and run this workflow again.'
              ])
              raise SystemExit(0)

          url = f'https://api.telegram.org/bot{token}/getUpdates?timeout=0&limit=100'
          req = urllib.request.Request(url, headers={'User-Agent':'Wallet500/1.0'})
          try:
              with urllib.request.urlopen(req, timeout=15) as r:
                  data = json.loads(r.read().decode('utf-8'))
          except urllib.error.HTTPError as e:
              write([
                  '## Telegram Chat ID Discovery',
                  '',
                  f'❌ **Telegram API HTTP error: {e.code}**',
                  '',
                  'Most likely the bot token is invalid/revoked. Update `TELEGRAM_BOT_TOKEN` and run again.'
              ])
              raise SystemExit(0)
          except Exception as e:
              write([
                  '## Telegram Chat ID Discovery',
                  '',
                  f'❌ **Telegram API request failed: {type(e).__name__}**',
                  '',
                  'Run again. If it repeats, check the bot token.'
              ])
              raise SystemExit(0)

          if not data.get('ok'):
              write([
                  '## Telegram Chat ID Discovery',
                  '',
                  '❌ **Telegram getUpdates returned ok=false**',
                  '',
                  'Check the bot token and run again.'
              ])
              raise SystemExit(0)

          rows = data.get('result') or []
          candidates = []
          for u in rows:
              msg = u.get('message') or u.get('edited_message') or u.get('channel_post') or u.get('edited_channel_post')
              if not isinstance(msg, dict):
                  continue
              chat = msg.get('chat') or {}
              cid = chat.get('id')
              if cid is None:
                  continue
              candidates.append({
                  'update_id': u.get('update_id'),
                  'chat_id': cid,
                  'chat_type': chat.get('type'),
                  'text': msg.get('text'),
              })

          if not candidates:
              write([
                  '## Telegram Chat ID Discovery',
                  '',
                  '⚠️ **No Telegram updates found**',
                  '',
                  'Open `@NexusSOLAI_AlertBot`, send a fresh `hello`, then run this workflow again.'
              ])
              raise SystemExit(0)

          latest = candidates[-1]
          write([
              '## Telegram Chat ID Discovery',
              '',
              '✅ **Chat ID found**',
              '',
              f'`TELEGRAM_CHAT_ID={latest["chat_id"]}`',
              '',
              f'Chat type: `{latest.get("chat_type")}`',
              '',
              f'Last message: `{latest.get("text")}`',
              '',
              'Copy only the number after `TELEGRAM_CHAT_ID=` into the GitHub repository secret named `TELEGRAM_CHAT_ID`.'
          ])
          PY
