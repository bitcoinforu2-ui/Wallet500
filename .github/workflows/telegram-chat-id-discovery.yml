name: Wallet500 Telegram Chat ID Discovery

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover-chat-id:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Discover latest Telegram chat ID
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ]; then
            echo "ERROR: TELEGRAM_BOT_TOKEN secret is missing"
            exit 1
          fi

          python - <<'PY'
          import json, os, urllib.request

          token = os.environ['TELEGRAM_BOT_TOKEN'].strip()
          url = f'https://api.telegram.org/bot{token}/getUpdates?timeout=0&limit=100'
          req = urllib.request.Request(url, headers={'User-Agent':'Wallet500/1.0'})
          with urllib.request.urlopen(req, timeout=15) as r:
              data = json.loads(r.read().decode('utf-8'))

          if not data.get('ok'):
              raise SystemExit('ERROR: Telegram getUpdates failed')

          rows = data.get('result') or []
          candidates = []
          for u in rows:
              msg = u.get('message') or u.get('edited_message') or u.get('channel_post') or u.get('edited_channel_post')
              if not isinstance(msg, dict):
                  continue
              chat = msg.get('chat') or {}
              cid = chat.get('id')
              if cid is None:
                  continue
              candidates.append({
                  'update_id': u.get('update_id'),
                  'chat_id': cid,
                  'chat_type': chat.get('type'),
                  'title': chat.get('title'),
                  'username': chat.get('username'),
                  'first_name': chat.get('first_name'),
                  'text': msg.get('text'),
              })

          if not candidates:
              raise SystemExit('ERROR: No Telegram updates found. Send hello to the bot and run again.')

          latest = candidates[-1]
          print('TELEGRAM_CHAT_ID=' + str(latest['chat_id']))
          print('CHAT_TYPE=' + str(latest.get('chat_type')))
          print('LAST_MESSAGE=' + repr(latest.get('text')))
          print('NOTE: Copy only TELEGRAM_CHAT_ID into the GitHub secret named TELEGRAM_CHAT_ID.')
          PY
