name: Wallet500 Revival Clean Entry Telegram

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Wallet500 Revival 90D 15K Actionable Telegram"
    types: [completed]

permissions:
  contents: write

concurrency:
  group: wallet500-revival-clean-entry
  cancel-in-progress: true

jobs:
  clean-entry:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install and test clean-entry guard
        run: |
          pip install -e . pytest
          python -m pytest -q tests/test_revival_clean_entry_telegram.py
      - name: Send forward-only clean-entry candidates
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REVIVAL_90D_LIVE_REFRESH: '1'
          REVIVAL_CLEAN_MIN_BUY_SELL_RATIO: '1.10'
          REVIVAL_CLEAN_MAX_SOURCE_LIVE_PRICE_DIFF_PCT: '3.0'
          REVIVAL_CLEAN_MAX_FRAGMENTATION_AGE_SECONDS: '3600'
        run: |
          set -euo pipefail
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo 'REVIVAL_CLEAN_ENTRY_TELEGRAM_SECRETS_MISSING'
            exit 1
          fi
          python -m wallet500.revival_clean_entry_telegram
      - name: Validate clean-entry truth contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('data/revival-clean-entry-telegram-report.json').read_text())
          t=d.get('truth_contract') or {}
          if d.get('mode')!='REVIVAL_CLEAN_ENTRY_REAL_ALERT_V1': raise SystemExit('CLEAN_ENTRY_MODE_INVALID')
          if d.get('configured') is not True: raise SystemExit('CLEAN_ENTRY_TELEGRAM_NOT_CONFIGURED')
          if t.get('automatic_buy') is not False or t.get('manual_decision_only') is not True: raise SystemExit('CLEAN_ENTRY_AUTO_TRADE_LEAK')
          if t.get('exact_pair_live_price_required') is not True: raise SystemExit('CLEAN_ENTRY_LIVE_PRICE_GUARD_MISSING')
          if t.get('buyers_must_lead_h1') is not True: raise SystemExit('CLEAN_ENTRY_FLOW_GUARD_MISSING')
          if float(t.get('minimum_buy_sell_ratio_h1') or 0) < 1.10: raise SystemExit('CLEAN_ENTRY_FLOW_THRESHOLD_DRIFT')
          if float(t.get('maximum_source_live_price_diff_pct') or 999) > 3.0: raise SystemExit('CLEAN_ENTRY_PRICE_DIVERGENCE_GUARD_DRIFT')
          if t.get('fresh_cross_venue_price_dispersion_veto') is not True: raise SystemExit('CLEAN_ENTRY_CROSS_VENUE_VETO_MISSING')
          if t.get('buy_now_language_forbidden') is not True: raise SystemExit('CLEAN_ENTRY_LANGUAGE_GUARD_MISSING')
          print('REVIVAL_CLEAN_ENTRY_OK', {'clean':d.get('clean_count'),'blocked':d.get('blocked_count'),'delivered':d.get('delivered_count')})
          PY
      - name: Publish clean-entry state atomically
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python scripts/atomic_publish.py \
            --github-api-cas \
            --message 'alerts: persist Revival clean-entry state' \
            data/revival-clean-entry-telegram-report.json \
            data/revival-clean-entry-telegram-state.json
