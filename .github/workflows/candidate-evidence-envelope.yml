name: Wallet500 Candidate Evidence Envelope

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Wallet500 Verified Snapshot Publisher"
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'src/wallet500/candidate_evidence_envelope.py'
      - 'src/wallet500/pending_confirmation_truth_normalizer.py'
      - 'src/wallet500/decision_snapshot_guard.py'
      - 'src/wallet500/mature_age_gate.py'
      - 'src/wallet500/production_age_governance.py'
      - 'src/wallet500/production_status.py'
      - 'src/wallet500/system_health.py'
      - 'src/wallet500/strict_validation.py'
      - 'src/wallet500/real_alerts.py'
      - 'src/wallet500/revival_funnel_diagnostics.py'
      - 'src/wallet500/truth_contract.py'
      - 'src/wallet500/safe_json.py'
      - 'src/wallet500/truth_input_preflight.py'
      - 'src/wallet500/normalize_age_aliases.py'
      - 'src/wallet500/decision_generation.py'
      - 'scripts/pipeline_integrity_audit.py'
      - 'tests/**'
      - '.github/workflows/candidate-evidence-envelope.yml'

permissions:
  contents: read
  actions: write

# QA is intentionally separate from the single verified publisher. It never
# writes canonical data, so it cannot race production publication.
concurrency:
  group: wallet500-candidate-evidence-qa
  cancel-in-progress: true

jobs:
  request-primary:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delegate recompute to complete primary scan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/live-scan.yml/runs?per_page=20")"
          active="$(printf '%s' "$runs" | jq '[.workflow_runs[] | select(.status=="queued" or .status=="in_progress" or .status=="pending" or .status=="waiting" or .status=="requested")] | length')"
          if [ "$active" -gt 0 ]; then
            echo "PRIMARY_ALREADY_ACTIVE count=$active"
            exit 0
          fi
          gh workflow run live-scan.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo 'CANDIDATE_EVIDENCE_DELEGATED_TO_FULL_PRIMARY'

  verify-published:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -e . pytest
      - name: Regression
        run: |
          python -m pytest -q \
            tests/test_truth_contract.py \
            tests/test_safe_json.py \
            tests/test_truth_input_preflight.py \
            tests/test_mature_age_gate.py \
            tests/test_candidate_evidence_envelope.py \
            tests/test_pending_confirmation_truth_normalizer.py \
            tests/test_decision_snapshot_guard.py \
            tests/test_production_status.py \
            tests/test_system_health.py \
            tests/test_real_alerts.py \
            tests/test_real_alerts_revival_bridge.py \
            tests/test_revival_funnel_diagnostics.py
      - name: Fail closed on missing or corrupt canonical inputs
        run: python -m wallet500.truth_input_preflight
      - name: Verify publisher ownership and policy integrity
        run: python scripts/pipeline_integrity_audit.py
      - name: Verify coherent generation manifest is published
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/decision-generation.json')
          if not p.exists(): raise SystemExit('DECISION_GENERATION_MISSING')
          g=json.loads(p.read_text())
          if g.get('status')!='COHERENT_READY': raise SystemExit('DECISION_GENERATION_NOT_COHERENT')
          policy=g.get('policy') or {}
          if (policy.get('research') or {}).get('minimum_market_age_days')!=90: raise SystemExit('RESEARCH_AGE_DRIFT')
          if float((policy.get('research') or {}).get('minimum_execution_liquidity_usd') or 0)!=15000: raise SystemExit('RESEARCH_LIQ_DRIFT')
          if (policy.get('production') or {}).get('minimum_market_age_days')!=180: raise SystemExit('PRODUCTION_AGE_DRIFT')
          if float((policy.get('production') or {}).get('minimum_execution_liquidity_usd') or 0)!=50000: raise SystemExit('PRODUCTION_LIQ_DRIFT')
          if (policy.get('production') or {}).get('exact_pair_required') is not True: raise SystemExit('EXACT_PAIR_DRIFT')
          if (policy.get('production') or {}).get('automatic_buy') is not False: raise SystemExit('AUTO_BUY_DRIFT')
          print('PUBLISHED_GENERATION_VERIFIED',g.get('generation_id'))
          PY
