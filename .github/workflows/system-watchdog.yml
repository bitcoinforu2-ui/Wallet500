name: Wallet500 Independent System Watchdog

on:
  workflow_dispatch:
  schedule:
    # Lightweight integrity/availability guard twice per hour.
    # The deeper Wallet500 Full Guard remains the hourly second layer.
    - cron: '3,33 * * * *'
  push:
    branches: [main]
    paths:
      - 'src/wallet500/system_watchdog.py'
      - 'tests/test_system_watchdog.py'
      - '.github/workflows/system-watchdog.yml'

permissions:
  contents: write
  actions: read

concurrency:
  group: wallet500-independent-system-watchdog
  cancel-in-progress: false

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify watchdog contract independently
        run: |
          pip install -e . pytest
          python -m pytest -q tests/test_system_watchdog.py

      - name: Probe Wallet500 from outside the production decision path
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m wallet500.system_watchdog

      - name: Validate watchdog outputs
        run: |
          python -m json.tool data/system-watchdog.json >/dev/null
          python -m json.tool data/system-watchdog-state.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('data/system-watchdog.json').read_text())
          if r.get('mode') != 'INDEPENDENT_OBSERVABILITY_NO_TRADING_POLICY_EFFECT':
              raise SystemExit('WATCHDOG_MODE_DRIFT')
          rules=set(r.get('truth_contract') or [])
          required={
              'WATCHDOG_NEVER_CHANGES_SIGNAL_OR_TRADING_POLICY',
              'NO_TELEGRAM_MESSAGE_WHEN_HEALTHY',
              'INCIDENTS_ARE_DEDUPED_AND_RATE_LIMITED',
              'CURRENT_REAL_ALERTS_ARE_BASELINED_ON_FIRST_WATCHDOG_RUN',
              'NEW_REAL_ALERT_TELEGRAM_GAPS_ARE_DETECTED_BY_EXACT_PAIR_TRANSITION',
          }
          if not required.issubset(rules):
              raise SystemExit('WATCHDOG_TRUTH_CONTRACT_INCOMPLETE')
          print('WATCHDOG_VALID', {'overall':r.get('overall'),'incidents':r.get('incident_count'),'critical':r.get('critical_count')})
          PY

      - name: Persist watchdog state and report
        run: |
          set -euo pipefail
          git config user.name 'wallet500-watchdog-bot'
          git config user.email 'wallet500-watchdog-bot@users.noreply.github.com'
          tmp="$(mktemp -d)"
          cp data/system-watchdog.json "$tmp/report.json"
          cp data/system-watchdog-state.json "$tmp/state.json"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp "$tmp/report.json" data/system-watchdog.json
            cp "$tmp/state.json" data/system-watchdog-state.json
            git add data/system-watchdog.json data/system-watchdog-state.json
            if git diff --cached --quiet; then
              echo 'No watchdog state changes'
              exit 0
            fi
            git commit -m 'watchdog: refresh independent system health sentinel'
            if git push origin HEAD:main; then
              exit 0
            fi
            if [ "$attempt" -eq 5 ]; then
              echo 'Watchdog state publish failed after retries'
              exit 1
            fi
            sleep $((attempt * 2))
          done

      - name: Surface unresolved critical incidents in Actions
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/system-watchdog.json')
          if not p.exists():
              raise SystemExit('WATCHDOG_REPORT_MISSING')
          r=json.loads(p.read_text())
          critical=int(r.get('critical_count') or 0)
          if critical:
              codes=', '.join(x.get('code','?') for x in (r.get('incidents') or []) if x.get('severity')=='CRITICAL')
              print(f'::error::Wallet500 Watchdog critical incidents: {codes}')
              raise SystemExit(2)
          if r.get('overall') == 'DEGRADED':
              codes=', '.join(x.get('code','?') for x in (r.get('incidents') or []))
              print(f'::warning::Wallet500 Watchdog degraded: {codes}')
          else:
              print('WATCHDOG_HEALTHY_NO_ALERT')
          PY
