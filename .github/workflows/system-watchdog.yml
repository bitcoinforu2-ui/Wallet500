name: Wallet500 Independent System Watchdog

on:
  workflow_dispatch:
  schedule:
    - cron: '3,33 * * * *'
  push:
    branches: [main]
    paths:
      - 'src/wallet500/system_watchdog.py'
      - 'src/wallet500/operational_guard.py'
      - 'tests/test_system_watchdog.py'
      - '.github/workflows/system-watchdog.yml'

permissions:
  contents: write
  actions: read

concurrency:
  group: wallet500-independent-system-watchdog
  cancel-in-progress: true

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify watchdog contract independently
        run: |
          pip install -e . pytest
          python -m pytest -q tests/test_system_watchdog.py

      - name: Verify production orchestration and satellite freshness
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          telegram = Path('.github/workflows/telegram-production-alerts.yml').read_text()
          required = 'Wallet500 Verified Snapshot Publisher'
          forbidden = ('Wallet500 Pending Confirmation Refresh', 'Wallet500 Candidate Evidence Envelope')
          if required not in telegram or any(x in telegram for x in forbidden):
              raise SystemExit('TELEGRAM_TRIGGER_BINDING_DRIFT')

          def parse(v):
              s=str(v or '').strip()
              if not s: return None
              if s.endswith('Z'): s=s[:-1]+'+00:00'
              try:
                  d=datetime.fromisoformat(s)
                  return d if d.tzinfo else d.replace(tzinfo=timezone.utc)
              except Exception:
                  return None

          now=datetime.now(timezone.utc)
          generation=json.loads(Path('data/decision-generation.json').read_text())
          gdt=parse(generation.get('created_at'))
          if generation.get('status')!='COHERENT_READY' or not gdt:
              raise SystemExit('DECISION_GENERATION_NOT_COHERENT')
          gage=(now-gdt.astimezone(timezone.utc)).total_seconds()
          if gage > 45*60:
              raise SystemExit(f'DECISION_GENERATION_STALE age={gage:.0f}s')

          for filename, field, max_age in (
              ('data/doge1-whale-current.json','observed_at',2*3600),
              ('data/dusd-whale-current.json','observed_at',2*3600),
          ):
              p=Path(filename)
              if not p.exists():
                  print(f'::warning::SATELLITE_LEDGER_MISSING {filename}')
                  continue
              payload=json.loads(p.read_text())
              ts=parse(payload.get(field))
              age=None if not ts else (now-ts.astimezone(timezone.utc)).total_seconds()
              if age is None or age > max_age:
                  print(f'::warning::SATELLITE_LEDGER_STALE {filename} age={age}')
              elif payload.get('coverage')!='SOLANA_RPC_CONFIRMED_ONCHAIN':
                  print(f'::warning::SATELLITE_LEDGER_COVERAGE_DEGRADED {filename}')
              else:
                  print('SATELLITE_LEDGER_OK', filename, round(age,1), payload.get('rpc_source'))
          print('ORCHESTRATION_BINDING_OK', required)
          PY

      - name: Probe Wallet500 from outside the production decision path
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m wallet500.system_watchdog

      - name: Add Actions capacity, publish freshness and starvation guard
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m wallet500.operational_guard

      - name: Validate watchdog outputs
        run: |
          python -m json.tool data/system-watchdog.json >/dev/null
          python -m json.tool data/system-watchdog-state.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('data/system-watchdog.json').read_text())
          if r.get('mode') != 'INDEPENDENT_OBSERVABILITY_NO_TRADING_POLICY_EFFECT':
              raise SystemExit('WATCHDOG_MODE_DRIFT')
          rules=set(r.get('truth_contract') or [])
          required={
              'WATCHDOG_NEVER_CHANGES_SIGNAL_OR_TRADING_POLICY',
              'NO_TELEGRAM_MESSAGE_WHEN_HEALTHY',
              'INCIDENTS_ARE_DEDUPED_AND_RATE_LIMITED',
              'CURRENT_REAL_ALERTS_ARE_BASELINED_ON_FIRST_WATCHDOG_RUN',
              'GENERIC_REAL_ALERTS_ARE_NOT_USER_TELEGRAM_EVENTS_IN_BUY_ONLY_MODE',
              'FINAL_BUY_TELEGRAM_GAPS_REQUIRE_MATCHED_BUY_DECISION',
              'PRE_BUY_TELEGRAM_GAPS_DISABLED_WHEN_BUY_ONLY_V2_ACTIVE',
              'WATCHDOG_TECHNICAL_INCIDENTS_NEVER_GO_TO_USER_TELEGRAM',
              'GLOBAL_ACTIONS_QUEUE_AND_RUN_PRESSURE_IS_MEASURED',
              'NEWER_FAILED_REVIVAL_PUBLICATION_IS_NOT_HEALTHY',
              'SUSTAINED_ZERO_ACTIVE_WITH_QUALIFIED_SCAN_INPUT_IS_STARVATION',
              'OPERATIONAL_GUARD_NEVER_CHANGES_TRADING_POLICY',
          }
          if not required.issubset(rules):
              raise SystemExit('WATCHDOG_TRUTH_CONTRACT_INCOMPLETE')
          checks=r.get('checks') or {}
          if 'github_actions_capacity' not in checks or 'revival_publish_freshness' not in checks or 'candidate_starvation' not in checks:
              raise SystemExit('WATCHDOG_OPERATIONAL_CHECKS_MISSING')
          print('WATCHDOG_VALID', {'overall':r.get('overall'),'incidents':r.get('incident_count'),'critical':r.get('critical_count'),'high':r.get('high_count')})
          PY

      - name: Persist watchdog state and report with contention-safe CAS
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python scripts/atomic_publish.py \
            --github-api-cas \
            --message 'watchdog: refresh independent system health sentinel' \
            data/system-watchdog.json \
            data/system-watchdog-state.json

      - name: Surface unresolved critical incidents in Actions
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/system-watchdog.json')
          if not p.exists():
              raise SystemExit('WATCHDOG_REPORT_MISSING')
          r=json.loads(p.read_text())
          critical=int(r.get('critical_count') or 0)
          if critical:
              codes=', '.join(x.get('code','?') for x in (r.get('incidents') or []) if x.get('severity')=='CRITICAL')
              print(f'::error::Wallet500 Watchdog critical incidents: {codes}')
              raise SystemExit(2)
          if r.get('overall') == 'DEGRADED':
              codes=', '.join(x.get('code','?') for x in (r.get('incidents') or []))
              print(f'::warning::Wallet500 Watchdog degraded: {codes}')
          else:
              print('WATCHDOG_HEALTHY_NO_ALERT')
          PY
