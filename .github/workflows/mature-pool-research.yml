name: Wallet500 Mature Pool Research

on:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'
  push:
    branches: [main]
    paths:
      - 'src/wallet500/mature_pool_research.py'
      - '.github/workflows/mature-pool-research.yml'

permissions:
  contents: write

concurrency:
  group: wallet500-mature-pool-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -e .
      - name: Run mature exact-pool 7/30/90 infrastructure replay
        run: python -m wallet500.mature_pool_research
      - name: Validate research isolation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/mature-pool-research.json')
          if not p.exists(): raise SystemExit('missing mature-pool-research.json')
          d=json.loads(p.read_text())
          if d.get('mode')!='RESEARCH_ONLY_MATURE_POOL_INFRASTRUCTURE_REPLAY': raise SystemExit('unsafe research mode')
          if d.get('production_portfolio_impact')!='NONE': raise SystemExit('research may not affect production')
          if not d.get('survivorship_bias_warning'): raise SystemExit('survivorship warning missing')
          print('MATURE POOLS', d.get('counts'))
          PY
      - name: Publish research result
        run: |
          set -euo pipefail
          git config user.name 'wallet500-bot'
          git config user.email 'wallet500-bot@users.noreply.github.com'
          git add data/mature-pool-research.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh mature pool research'
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git merge --no-edit -X ours origin/main
              if git push origin HEAD:main; then break; fi
              sleep 3
              if [ "$attempt" = 5 ]; then exit 1; fi
            done
          fi
