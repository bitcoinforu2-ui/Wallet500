name: Wallet500 Holder Cluster Research Gate

on:
  workflow_dispatch:
  push:
    branches: [holder-cluster-gate-build-3]
    paths:
      - 'src/wallet500/holder_cluster_gate.py'
      - '.github/workflows/holder-cluster-test.yml'
      - 'data/qualified-candidates.json'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -e .
      - name: Analyze research qualified cohort
        env:
          HOLDER_CLUSTER_INPUT: qualified-candidates.json
        run: python -m wallet500.holder_cluster_gate
      - name: Validate truth rules
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/holder-cluster-gate.json')
          if not p.exists(): raise SystemExit('holder cluster output missing')
          d=json.loads(p.read_text())
          rows=d.get('rows',[])
          bad=[r for r in rows if r.get('status')=='PASS' and not r.get('cluster_verified')]
          if bad: raise SystemExit('FATAL: PASS emitted without independently verified cluster evidence')
          for r in rows:
              if str(r.get('chain')).lower()=='solana' and r.get('holders'):
                  if r.get('evidence_level')!='ONCHAIN_OWNER_CONCENTRATION_RESOLVED':
                      raise SystemExit('FATAL: Solana holders were not owner-resolved')
          s=json.loads(Path('data/holder-cluster-gate-summary.json').read_text())
          print('HOLDER CLUSTER RESEARCH:',s)
          PY
