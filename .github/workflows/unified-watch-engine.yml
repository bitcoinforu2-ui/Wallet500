name: Wallet500 Unified Verified Watch Engine

on:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/unified_watch_engine.py'
      - 'scripts/free_intelligence_collector.py'
      - 'scripts/intelligence_fusion.py'
      - 'data/unified-watch-config.json'
      - 'data/close-watch-intelligence-policy.json'
      - 'data/close-watch-events.json'
      - '.github/workflows/unified-watch-engine.yml'

permissions:
  contents: write

concurrency:
  group: wallet500-unified-verified-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate unified watcher, free collectors and intelligence fusion
        run: |
          python -m py_compile scripts/unified_watch_engine.py scripts/free_intelligence_collector.py scripts/intelligence_fusion.py
          python -m json.tool data/unified-watch-config.json >/dev/null
          python -m json.tool data/unified-watch-state.json >/dev/null
          python -m json.tool data/close-watch-intelligence-policy.json >/dev/null
          python -m json.tool data/close-watch-events.json >/dev/null
          python -m json.tool data/free-intelligence-collector-state.json >/dev/null

      - name: Collect free cross-domain intelligence
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/free_intelligence_collector.py

      - name: Fuse cross-domain intelligence evidence
        run: python scripts/intelligence_fusion.py

      - name: Run fail-closed verified market watchlist
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/unified_watch_engine.py

      - name: Persist verified forward-only state, evidence and intelligence snapshot
        run: |
          set -euo pipefail
          git config user.name 'wallet500-bot'
          git config user.email 'wallet500-bot@users.noreply.github.com'
          git add data/unified-watch-state.json data/close-watch-intelligence.json data/close-watch-events.json data/free-intelligence-collector-state.json || true
          if git diff --cached --quiet; then
            echo 'UNIFIED_WATCH_STATE_UNCHANGED'
            exit 0
          fi
          git commit -m 'chore: update unified watch intelligence state [skip ci]'
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            echo "STATE_PUSH_RETRY_${attempt}"
            sleep $((attempt * 2))
          done
          echo 'STATE_PERSIST_FAILED_AFTER_RETRIES'
          exit 1
