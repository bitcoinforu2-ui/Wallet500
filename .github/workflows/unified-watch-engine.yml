name: Wallet500 Unified Verified Watch Engine

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Wallet500 CEX Fast Promotion"]
    types: [completed]
  schedule:
    - cron: '7,22,37,52 * * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/unified_watch_engine.py'
      - 'scripts/new_chain_bootstrap_radar.py'
      - 'scripts/test_new_chain_bootstrap_contract.py'
      - 'scripts/resilient_unified_watch_runner.py'
      - 'scripts/deep_investigation_refresh.py'
      - 'scripts/narrative_dependency_collector.py'
      - 'scripts/resilient_http.py'
      - 'scripts/spot_market_discovery_collector.py'
      - 'scripts/unified_candidate_bridge.py'
      - 'scripts/spot_cex_fast_handoff.py'
      - 'scripts/native_asset_intelligence.py'
      - 'scripts/cross_domain_intelligence_collector.py'
      - 'scripts/free_intelligence_collector.py'
      - 'scripts/derivatives_intelligence_collector.py'
      - 'scripts/public_alpha_source_collector.py'
      - 'scripts/alpha_caller_intake.py'
      - 'scripts/alpha_caller_reputation.py'
      - 'scripts/intelligence_fusion.py'
      - 'scripts/test_intelligence_fusion_contract.py'
      - 'scripts/user_watch_final_buy.py'
      - 'scripts/cex_final_buy_lane.py'
      - 'scripts/test_user_watch_final_buy_contract.py'
      - 'scripts/test_cex_final_buy_lane_contract.py'
      - 'data/unified-watch-config.json'
      - 'data/new-chain-bootstrap-state.json'
      - 'data/new-chain-bootstrap-radar.json'
      - 'data/buy-zone-close-watch-registry.json'
      - 'data/alpha-caller-sources.json'
      - 'data/close-watch-intelligence-policy.json'
      - '.github/workflows/unified-watch-engine.yml'

permissions:
  contents: write
concurrency:
  group: wallet500-unified-verified-watch-v7
  cancel-in-progress: false

jobs:
  watch:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Validate unified watcher, collectors and intelligence fusion
        id: validate
        run: |
          python -m py_compile scripts/resilient_http.py scripts/new_chain_bootstrap_radar.py scripts/test_new_chain_bootstrap_contract.py scripts/resilient_unified_watch_runner.py scripts/deep_investigation_refresh.py scripts/narrative_dependency_collector.py scripts/unified_watch_engine.py scripts/spot_market_discovery_collector.py scripts/unified_candidate_bridge.py scripts/spot_cex_fast_handoff.py scripts/native_asset_intelligence.py scripts/cross_domain_intelligence_collector.py scripts/free_intelligence_collector.py scripts/derivatives_intelligence_collector.py scripts/public_alpha_source_collector.py scripts/alpha_caller_intake.py scripts/alpha_caller_reputation.py scripts/intelligence_fusion.py scripts/test_intelligence_fusion_contract.py scripts/cex_final_buy_lane.py scripts/user_watch_final_buy.py scripts/test_user_watch_final_buy_contract.py scripts/test_cex_final_buy_lane_contract.py
          for f in data/unified-watch-config.json data/user-watch-final-buy-state.json data/user-watch-final-buy-report.json data/unified-watch-state.json data/derivatives-intelligence-state.json data/alpha-caller-sources.json data/alpha-caller-source-state.json data/alpha-caller-inbox.json data/alpha-caller-candidates.json data/alpha-caller-reputation.json data/alpha-caller-call-history.json data/close-watch-intelligence-policy.json data/close-watch-events.json data/free-intelligence-collector-state.json data/buy-zone-close-watch-registry.json data/unified-dynamic-candidates.json data/cross-domain-intelligence-state.json data/narrative-dependency-state.json data/http-resilience-state.json data/new-chain-bootstrap-state.json data/new-chain-bootstrap-radar.json; do python -m json.tool "$f" >/dev/null; done

      - name: Test exact-identity intelligence fusion contract
        id: contract
        run: python scripts/test_intelligence_fusion_contract.py

      - name: Test user-requested FINAL BUY contracts
        id: user_buy_contract
        run: |
          python scripts/test_user_watch_final_buy_contract.py
          python scripts/test_cex_final_buy_lane_contract.py

      - name: Refresh persisted unified state before any sensor handoff
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:data/unified-watch-state.json > data/unified-watch-state.json
          python -m json.tool data/unified-watch-state.json >/dev/null
          echo 'UNIFIED_STATE_INITIALIZED_FROM_LATEST_MAIN'

      - name: Test new-chain bootstrap truth contract
        id: new_chain_bootstrap_contract
        run: python scripts/test_new_chain_bootstrap_contract.py

      - name: Discover broad non-leveraged Gate spot movers
        id: spot_discovery
        run: python scripts/spot_market_discovery_collector.py

      - name: Discover Arc and automatically bootstrap newly appearing chains
        id: new_chain_bootstrap
        run: python scripts/new_chain_bootstrap_radar.py

      - name: Collect configured plus final-BUY free intelligence
        id: free_intel
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/free_intelligence_collector.py

      - name: Stream free public alpha discoveries
        id: public_alpha
        run: python scripts/public_alpha_source_collector.py

      - name: Gate alpha caller signals into Wallet500 evidence
        id: alpha_intake
        run: python scripts/alpha_caller_intake.py

      - name: Bridge final BUY, new-chain bootstrap, Gate and alpha into exact-identity dynamic candidates
        id: candidate_bridge
        run: python scripts/unified_candidate_bridge.py

      - name: Fast handoff CEX volume and rank shocks into exact-pair close watch
        id: cex_sensor_handoff
        run: python scripts/spot_cex_fast_handoff.py

      - name: Verify native-asset CEX execution without requiring a dead DEX pair
        id: native_asset_intelligence
        run: python scripts/native_asset_intelligence.py

      - name: Collect holder wallet attention search and news intelligence
        id: cross_domain
        run: python scripts/cross_domain_intelligence_collector.py

      - name: Collect verified narrative dependency rotation intelligence
        id: narrative_dependency
        run: python scripts/narrative_dependency_collector.py

      - name: Collect Gate-stat plus Hyperliquid failover derivatives intelligence
        id: derivatives
        run: python scripts/derivatives_intelligence_collector.py

      - name: Update forward-only alpha caller reputation
        id: alpha_reputation
        run: python scripts/alpha_caller_reputation.py

      - name: Fuse cross-domain intelligence evidence
        id: fusion
        run: python scripts/intelligence_fusion.py

      - name: Run adaptive-cooldown fail-closed exact-pair market watchlist
        id: market_watch
        env:
          TELEGRAM_BOT_TOKEN: ''
          TELEGRAM_CHAT_ID: ''
        run: python scripts/resilient_unified_watch_runner.py

      - name: Evaluate and deliver user-requested FINAL BUY only
        id: user_watch_final_buy
        if: always()
        env:
          WALLET500_MARKET_WATCH_OUTCOME: ${{ steps.market_watch.outcome }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/user_watch_final_buy.py

      - name: Build unified runtime evidence manifest
        if: always()
        env:
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
          CONTRACT_OUTCOME: ${{ steps.contract.outcome }}
          SPOT_DISCOVERY_OUTCOME: ${{ steps.spot_discovery.outcome }}
          NEW_CHAIN_BOOTSTRAP_CONTRACT_OUTCOME: ${{ steps.new_chain_bootstrap_contract.outcome }}
          NEW_CHAIN_BOOTSTRAP_OUTCOME: ${{ steps.new_chain_bootstrap.outcome }}
          FREE_INTEL_OUTCOME: ${{ steps.free_intel.outcome }}
          PUBLIC_ALPHA_OUTCOME: ${{ steps.public_alpha.outcome }}
          ALPHA_INTAKE_OUTCOME: ${{ steps.alpha_intake.outcome }}
          CANDIDATE_BRIDGE_OUTCOME: ${{ steps.candidate_bridge.outcome }}
          CEX_SENSOR_HANDOFF_OUTCOME: ${{ steps.cex_sensor_handoff.outcome }}
          NATIVE_ASSET_INTELLIGENCE_OUTCOME: ${{ steps.native_asset_intelligence.outcome }}
          CROSS_DOMAIN_OUTCOME: ${{ steps.cross_domain.outcome }}
          NARRATIVE_OUTCOME: ${{ steps.narrative_dependency.outcome }}
          DERIVATIVES_OUTCOME: ${{ steps.derivatives.outcome }}
          ALPHA_REPUTATION_OUTCOME: ${{ steps.alpha_reputation.outcome }}
          FUSION_OUTCOME: ${{ steps.fusion.outcome }}
          MARKET_WATCH_OUTCOME: ${{ steps.market_watch.outcome }}
          USER_BUY_CONTRACT_OUTCOME: ${{ steps.user_buy_contract.outcome }}
          USER_WATCH_FINAL_BUY_OUTCOME: ${{ steps.user_watch_final_buy.outcome }}
          GH_RUN_ID: ${{ github.run_id }}
          GH_RUN_ATTEMPT: ${{ github.run_attempt }}
          GH_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path

          root = Path('.')
          def load(path):
              p = root / path
              if not p.exists():
                  return None
              try:
                  return json.loads(p.read_text())
              except Exception as e:
                  return {"_read_error": type(e).__name__}

          events = load('data/close-watch-events.json') or {}
          fusion = load('data/close-watch-intelligence.json')
          state = load('data/unified-watch-state.json')
          report = load('data/unified-watch-intelligence-report.json')
          spot = load('data/spot-market-discovery.json')
          bootstrap = load('data/new-chain-bootstrap-radar.json')
          dynamic = load('data/unified-dynamic-candidates.json')
          buy_registry = load('data/buy-zone-close-watch-registry.json')
          cross = load('data/cross-domain-intelligence-state.json')
          narrative = load('data/narrative-dependency-state.json')
          derivatives = load('data/derivatives-intelligence-state.json')
          http_state = load('data/http-resilience-state.json')
          cex_handoff = load('data/cex-sensor-handoff.json')
          native_asset = load('data/native-asset-close-watch.json')
          user_buy = load('data/user-watch-final-buy-report.json')
          outcomes = {
              'validate': os.getenv('VALIDATE_OUTCOME'),
              'contract': os.getenv('CONTRACT_OUTCOME'),
              'spot_discovery': os.getenv('SPOT_DISCOVERY_OUTCOME'),
              'new_chain_bootstrap_contract': os.getenv('NEW_CHAIN_BOOTSTRAP_CONTRACT_OUTCOME'),
              'new_chain_bootstrap': os.getenv('NEW_CHAIN_BOOTSTRAP_OUTCOME'),
              'free_intel': os.getenv('FREE_INTEL_OUTCOME'),
              'public_alpha': os.getenv('PUBLIC_ALPHA_OUTCOME'),
              'alpha_intake': os.getenv('ALPHA_INTAKE_OUTCOME'),
              'candidate_bridge': os.getenv('CANDIDATE_BRIDGE_OUTCOME'),
              'cex_sensor_handoff': os.getenv('CEX_SENSOR_HANDOFF_OUTCOME'),
              'native_asset_intelligence': os.getenv('NATIVE_ASSET_INTELLIGENCE_OUTCOME'),
              'cross_domain': os.getenv('CROSS_DOMAIN_OUTCOME'),
              'narrative_dependency': os.getenv('NARRATIVE_OUTCOME'),
              'derivatives': os.getenv('DERIVATIVES_OUTCOME'),
              'alpha_reputation': os.getenv('ALPHA_REPUTATION_OUTCOME'),
              'fusion': os.getenv('FUSION_OUTCOME'),
              'market_watch': os.getenv('MARKET_WATCH_OUTCOME'),
              'user_buy_contract': os.getenv('USER_BUY_CONTRACT_OUTCOME'),
              'user_watch_final_buy': os.getenv('USER_WATCH_FINAL_BUY_OUTCOME'),
          }
          manifest = {
              'version': 7,
              'generated_at': datetime.now(timezone.utc).isoformat(),
              'github_run_id': os.getenv('GH_RUN_ID'),
              'github_run_attempt': os.getenv('GH_RUN_ATTEMPT'),
              'github_sha': os.getenv('GH_SHA'),
              'stage_outcomes': outcomes,
              'first_failed_or_skipped_stage': next((k for k,v in outcomes.items() if v not in ('success',)), None),
              'evidence': {
                  'spot_discovery_exists': spot is not None,
                  'spot_discovery_generated_at': (spot or {}).get('generated_at') if isinstance(spot, dict) else None,
                  'spot_discovery_counts': (spot or {}).get('market_counts') if isinstance(spot, dict) else None,
                  'new_chain_bootstrap_status': (bootstrap or {}).get('status') if isinstance(bootstrap, dict) else None,
                  'new_chain_bootstrap_active_networks': (bootstrap or {}).get('active_networks') if isinstance(bootstrap, dict) else None,
                  'new_chain_bootstrap_counts': (bootstrap or {}).get('counts') if isinstance(bootstrap, dict) else None,
                  'dynamic_candidate_counts': (dynamic or {}).get('counts') if isinstance(dynamic, dict) else None,
                  'buy_close_watch_active': (buy_registry or {}).get('active_count') if isinstance(buy_registry, dict) else None,
                  'cross_domain_updated_at': (cross or {}).get('updated_at') if isinstance(cross, dict) else None,
                  'cross_domain_target_count': len((cross or {}).get('tokens') or {}) if isinstance(cross, dict) else None,
                  'narrative_dependency_updated_at': (narrative or {}).get('updated_at') if isinstance(narrative, dict) else None,
                  'narrative_dependency_reports': (narrative or {}).get('reports') if isinstance(narrative, dict) else None,
                  'derivatives_updated_at': (derivatives or {}).get('updated_at') if isinstance(derivatives, dict) else None,
                  'derivatives_provider_success': (derivatives or {}).get('provider_success') if isinstance(derivatives, dict) else None,
                  'derivatives_provider_health': (derivatives or {}).get('provider_health') if isinstance(derivatives, dict) else None,
                  'derivatives_healthy_providers': (derivatives or {}).get('healthy_providers') if isinstance(derivatives, dict) else None,
                  'derivatives_not_listed_targets': (derivatives or {}).get('not_listed_targets') if isinstance(derivatives, dict) else None,
                  'derivatives_provider_lookup_errors': (derivatives or {}).get('provider_lookup_errors') if isinstance(derivatives, dict) else None,
                  'http_resilience_strategy': (http_state or {}).get('strategy') if isinstance(http_state, dict) else None,
                  'http_resilience_metrics': (http_state or {}).get('metrics') if isinstance(http_state, dict) else None,
                  'close_watch_events_exists': (root/'data/close-watch-events.json').exists(),
                  'close_watch_event_count': len(events.get('events') or []) if isinstance(events, dict) else None,
                  'fusion_snapshot_exists': fusion is not None,
                  'fusion_token_count': len((fusion or {}).get('tokens') or []) if isinstance(fusion, dict) else None,
                  'fusion_generated_at': (fusion or {}).get('generated_at') if isinstance(fusion, dict) else None,
                  'unified_state_updated_at': (state or {}).get('updated_at') if isinstance(state, dict) else None,
                  'unified_report_exists': report is not None,
                  'unified_report_updated_at': (report or {}).get('updated_at') if isinstance(report, dict) else None,
                  'cex_sensor_handoff_generated_at': (cex_handoff or {}).get('generated_at') if isinstance(cex_handoff, dict) else None,
                  'cex_sensor_handoff_escalated': (cex_handoff or {}).get('escalated_close_watch') if isinstance(cex_handoff, dict) else None,
                  'native_asset_close_watch_count': (native_asset or {}).get('close_watch_count') if isinstance(native_asset, dict) else None,
                  'native_asset_prebuy_research_count': (native_asset or {}).get('prebuy_research_count') if isinstance(native_asset, dict) else None,
                  'dynamic_spot_targets_watched': (report or {}).get('dynamic_spot_targets') if isinstance(report, dict) else None,
                  'dynamic_bootstrap_targets_watched': (report or {}).get('dynamic_bootstrap_targets') if isinstance(report, dict) else None,
                  'dynamic_alpha_targets_watched': (report or {}).get('dynamic_alpha_targets') if isinstance(report, dict) else None,
                  'user_watch_final_buy_mode': (user_buy or {}).get('mode') if isinstance(user_buy, dict) else None,
                  'user_watch_final_buy_zone_count': (user_buy or {}).get('buy_zone_count') if isinstance(user_buy, dict) else None,
                  'cex_final_buy_candidate_count': (user_buy or {}).get('cex_candidate_count') if isinstance(user_buy, dict) else None,
                  'cex_final_buy_zone_count': (user_buy or {}).get('cex_buy_zone_count') if isinstance(user_buy, dict) else None,
                  'cex_final_pre_buy_count': (user_buy or {}).get('cex_pre_buy_count') if isinstance(user_buy, dict) else None,
                  'cex_final_buy_status': (user_buy or {}).get('cex_status') if isinstance(user_buy, dict) else None,
                  'user_watch_final_buy_delivered_count': (user_buy or {}).get('delivered_count') if isinstance(user_buy, dict) else None,
                  'user_watch_final_buy_error_count': (user_buy or {}).get('error_count') if isinstance(user_buy, dict) else None,
              },
          }
          Path('data/unified-watch-runtime-evidence.json').write_text(json.dumps(manifest, indent=2, ensure_ascii=False)+'\n')
          print('UNIFIED_RUNTIME_EVIDENCE', json.dumps(manifest, ensure_ascii=False))
          PY

      - name: Persist verified forward-only state, evidence and intelligence snapshot
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python scripts/serialized_publish.py \
            --message 'chore: update unified watch intelligence state [skip ci]' \
            data/unified-watch-state.json \
            data/unified-watch-intelligence-report.json \
            data/unified-watch-runtime-evidence.json \
            data/user-watch-final-buy-state.json \
            data/user-watch-final-buy-report.json \
            data/cex-sensor-handoff.json \
            data/native-asset-close-watch.json \
            data/derivatives-intelligence-state.json \
            data/http-resilience-state.json \
            data/close-watch-intelligence.json \
            data/close-watch-events.json \
            data/free-intelligence-collector-state.json \
            data/alpha-caller-source-state.json \
            data/alpha-caller-inbox.json \
            data/alpha-caller-candidates.json \
            data/alpha-caller-reputation.json \
            data/alpha-caller-call-history.json \
            data/spot-market-discovery.json \
            data/spot-market-discovery-state.json \
            data/new-chain-bootstrap-state.json \
            data/new-chain-bootstrap-radar.json \
            data/unified-dynamic-candidates.json \
            data/cross-domain-intelligence-state.json \
            data/narrative-dependency-state.json
          echo 'UNIFIED_WATCH_PERSIST_OK'
