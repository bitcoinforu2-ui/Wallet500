name: Wallet500 Weekly Experiment Telegram

on:
  push:
    branches: [main]
    paths:
      - 'data/weekly-experiment-alert.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wallet500-weekly-experiment-telegram
  cancel-in-progress: false

jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate, dedupe and deliver experiment alert
        id: deliver
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import json, os, urllib.parse, urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          alert_path = Path('data/weekly-experiment-alert.json')
          state_path = Path('data/weekly-experiment-telegram-state.json')
          if not alert_path.is_file():
              raise SystemExit('EXPERIMENT_ALERT_MISSING')

          alert = json.loads(alert_path.read_text(encoding='utf-8'))
          state = json.loads(state_path.read_text(encoding='utf-8')) if state_path.is_file() else {}

          status = str(alert.get('status') or '').strip().upper()
          if status in {'', 'NO_ALERT', 'NO_TRADE', 'WATCH'}:
              print('EXPERIMENT_TELEGRAM_NO_ACTION', status or 'EMPTY')
              with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as fh:
                  fh.write('sent=false\n')
              raise SystemExit(0)

          if status not in {'BUY', 'PRE_BUY'}:
              raise SystemExit(f'EXPERIMENT_ALERT_STATUS_INVALID:{status}')
          if alert.get('send_to_telegram') is not True:
              raise SystemExit('EXPERIMENT_TELEGRAM_SEND_FLAG_MISSING')
          if alert.get('hard_fail') is True:
              raise SystemExit('EXPERIMENT_HARD_FAIL_BLOCK')
          if alert.get('exact_identity_verified') is not True:
              raise SystemExit('EXPERIMENT_EXACT_IDENTITY_NOT_VERIFIED')
          if alert.get('manual_only') is not True:
              raise SystemExit('EXPERIMENT_MANUAL_ONLY_CONTRACT_MISSING')

          score = float(alert.get('score') or 0)
          if status == 'BUY' and score < 85:
              raise SystemExit('EXPERIMENT_BUY_SCORE_BELOW_85')
          if status == 'PRE_BUY' and not (78 <= score < 85):
              raise SystemExit('EXPERIMENT_PREBUY_SCORE_OUT_OF_RANGE')

          alert_id = str(alert.get('alert_id') or '').strip()
          symbol = str(alert.get('symbol') or '').strip().upper()
          chain = str(alert.get('chain') or '').strip()
          contract = str(alert.get('contract') or '').strip()
          exact_market = str(alert.get('exact_market') or '').strip()
          if not alert_id or not symbol or not chain or not (contract or exact_market):
              raise SystemExit('EXPERIMENT_IDENTITY_FIELDS_MISSING')

          if alert_id == str(state.get('last_alert_id') or ''):
              print('EXPERIMENT_TELEGRAM_DEDUPE', alert_id)
              with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as fh:
                  fh.write('sent=false\n')
              raise SystemExit(0)

          raw_ts = str(alert.get('generated_at') or '').strip()
          if raw_ts.endswith('Z'):
              raw_ts = raw_ts[:-1] + '+00:00'
          try:
              generated = datetime.fromisoformat(raw_ts)
          except Exception:
              raise SystemExit('EXPERIMENT_TIMESTAMP_INVALID')
          if generated.tzinfo is None:
              generated = generated.replace(tzinfo=timezone.utc)
          generated = generated.astimezone(timezone.utc)
          age = (datetime.now(timezone.utc) - generated).total_seconds()
          if age < -120 or age > 45 * 60:
              raise SystemExit(f'EXPERIMENT_ALERT_STALE age={age:.0f}s')

          bot = os.environ.get('TELEGRAM_BOT_TOKEN', '').strip()
          chat = os.environ.get('TELEGRAM_CHAT_ID', '').strip()
          if not bot or not chat:
              raise SystemExit('EXPERIMENT_TELEGRAM_SECRETS_NOT_CONFIGURED')

          prefix = '🟢🔥 BUY' if status == 'BUY' else '🟠⚡ PRE-BUY'
          lines = [
              f'{prefix} — {symbol} — WALLET500 $50→$100 EXPERIMENT',
              f'Score: {score:.0f}/100 | Chain: {chain}',
          ]
          if alert.get('price_usd') is not None:
              lines.append(f"Price: ${float(alert['price_usd']):.10g}")
          if alert.get('market_cap_usd') is not None:
              lines.append(f"Market cap: ${float(alert['market_cap_usd']):,.0f}")
          if alert.get('liquidity_usd') is not None:
              lines.append(f"Liquidity: ${float(alert['liquidity_usd']):,.0f}")
          if alert.get('volume_24h_usd') is not None:
              lines.append(f"Vol 24H: ${float(alert['volume_24h_usd']):,.0f}")
          if alert.get('entry_zone'):
              lines.append('Entry: ' + str(alert['entry_zone']))
          if alert.get('invalidation'):
              lines.append('Invalidation/Stop: ' + str(alert['invalidation']))
          if alert.get('target_1'):
              lines.append('Target 1: ' + str(alert['target_1']))
          if alert.get('target_2'):
              lines.append('Target 2: ' + str(alert['target_2']))
          if alert.get('position_size_usd') is not None:
              lines.append(f"Experiment position: ${float(alert['position_size_usd']):.2f}")
          if alert.get('reason'):
              lines.append('Why: ' + str(alert['reason']))
          if alert.get('catalyst'):
              lines.append('Catalyst: ' + str(alert['catalyst']))
          risks = [str(x) for x in (alert.get('risks') or []) if str(x).strip()]
          if risks:
              lines.append('Risks: ' + ' | '.join(risks[:4]))
          missing = str(alert.get('missing_trigger') or '').strip()
          if status == 'PRE_BUY' and missing:
              lines.append('Missing trigger: ' + missing)
          lines.append('Manual decision only. No automatic trade.')
          if contract:
              lines.append('CA: ' + contract)
          if exact_market:
              lines.append('Market: ' + exact_market)
          for url in (alert.get('source_urls') or [])[:3]:
              if str(url).strip():
                  lines.append(str(url).strip())

          text = '\n'.join(lines)[:4000]
          data = urllib.parse.urlencode({
              'chat_id': chat,
              'text': text,
              'disable_web_page_preview': 'true',
          }).encode()
          req = urllib.request.Request(
              f'https://api.telegram.org/bot{bot}/sendMessage',
              data=data,
              method='POST',
          )
          with urllib.request.urlopen(req, timeout=20) as response:
              body = json.loads(response.read().decode('utf-8'))
          if not body.get('ok'):
              raise SystemExit('EXPERIMENT_TELEGRAM_SEND_FAILED')

          now = datetime.now(timezone.utc).isoformat()
          state_path.write_text(json.dumps({
              'version': 1,
              'updated_at': now,
              'last_alert_id': alert_id,
              'last_status': status,
              'last_symbol': symbol,
              'delivered_at': now,
              'message_id': ((body.get('result') or {}).get('message_id')),
          }, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as fh:
              fh.write('sent=true\n')
          print('EXPERIMENT_TELEGRAM_SENT', {'alert_id': alert_id, 'status': status, 'symbol': symbol})
          PY

      - name: Persist experiment Telegram dedupe state atomically
        if: steps.deliver.outputs.sent == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'wallet500-truth-bot'
          git config user.email 'wallet500-truth-bot@users.noreply.github.com'
          python scripts/atomic_publish.py \
            --github-api-cas \
            --message 'telegram: persist weekly experiment delivery state [skip ci]' \
            data/weekly-experiment-telegram-state.json
