name: Wallet500 Liquidity Recovery Shadow V3

on:
  workflow_dispatch:
  schedule:
    - cron: '4,19,34,49 * * * *'
  pull_request:
    paths:
      - 'src/wallet500/liquidity_recovery_shadow.py'
      - 'tests/test_liquidity_recovery_shadow.py'
      - '.github/workflows/liquidity-recovery-shadow-v3.yml'
  push:
    branches: [main]
    paths:
      - 'src/wallet500/liquidity_recovery_shadow.py'
      - 'tests/test_liquidity_recovery_shadow.py'
      - '.github/workflows/liquidity-recovery-shadow-v3.yml'

permissions:
  contents: write

concurrency:
  group: wallet500-liquidity-recovery-v3-${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'publisher' }}
  cancel-in-progress: false

jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install and test V3 recovery
        run: |
          pip install -e . pytest
          python -m pytest -q tests/test_liquidity_recovery_shadow.py
      - name: Build forward-only V3 state
        if: github.event_name != 'pull_request'
        run: python -m wallet500.liquidity_recovery_shadow
      - name: Validate truth contract
        if: github.event_name != 'pull_request'
        run: |
          python - <<'PY'
          import json
          d=json.load(open('data/liquidity-recovery-shadow.json'))
          assert d['mode']=='RESEARCH_ONLY_LIQUIDITY_RECOVERY_SHADOW_V3'
          assert d['contract']=='LIQUIDITY_RECOVERY_FORWARD_ONLY_V3'
          assert d['production_gate_changed'] is False
          assert float(d['production_liquidity_gate_usd']) == 50000.0
          assert float(d['research_floor_usd']) == 15000.0
          assert d['automatic_buy'] is False
          assert d['no_hindsight'] is True
          assert d['recovery_rule']['exact_pair_locked'] is True
          assert d['recovery_rule']['forward_only'] is True
          print('LIQUIDITY_RECOVERY_V3_OK', d['counts'])
          PY
      - name: Publish V3 state atomically
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'wallet500-research-bot'
          git config user.email 'wallet500-research-bot@users.noreply.github.com'
          source_sha="$(git rev-parse HEAD)"
          set +e
          python scripts/atomic_publish.py \
            --base "$source_sha" \
            --fail-on-newer \
            --message 'research: refresh liquidity recovery shadow V3' \
            data/liquidity-recovery-shadow.json \
            data/liquidity-recovery-shadow-state.json
          rc=$?
          set -e
          if [ "$rc" -eq 75 ]; then
            echo 'LIQUIDITY_RECOVERY_SNAPSHOT_SUPERSEDED_BY_NEWER_STATE'
            exit 0
          fi
          exit "$rc"
