<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wallet500 Terminal</title><style>:root{--bg:#05080d;--p:#0a1119;--l:#1c2b38;--t:#edf6fc;--m:#8195a5;--g:#42dda0;--r:#ff6575;--y:#ffc857;--b:#45c4ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:13px Arial}.w{max-width:1200px;margin:auto;padding:10px}.bar,.k,.panel{background:var(--p);border:1px solid var(--l);border-radius:10px}.bar{padding:14px;display:flex;justify-content:space-between;gap:10px;align-items:center}h1{margin:0;font-size:23px}.mut{color:var(--m)}.live{color:var(--g);font-weight:900}.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:8px 0}.k{padding:10px}.lab{font-size:9px;color:var(--m);text-transform:uppercase}.num{font-size:21px;font-weight:900;margin-top:4px;direction:ltr;text-align:right}.panel{overflow:hidden}.tools{padding:9px;display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--l)}button{background:#0d1a25;color:var(--t);border:1px solid #27465d;padding:7px 10px;border-radius:7px}button.on{border-color:var(--b);color:var(--b)}.table{width:100%;border-collapse:collapse;direction:ltr}.table th,.table td{padding:9px 7px;border-bottom:1px solid #16232e;text-align:right;white-space:nowrap}.table th{font-size:9px;color:var(--m);position:sticky;top:0;background:#0a1119}.token{text-align:left!important;font-weight:800}.pos{color:var(--g)}.neg{color:var(--r)}.warn{color:var(--y)}a{color:var(--b);text-decoration:none;font-weight:800}.cards{display:none}.foot{padding:9px;color:var(--m);font-size:10px}@media(max-width:720px){.kpis{grid-template-columns:repeat(3,1fr)}.table{display:none}.cards{display:grid;gap:7px;padding:7px}.card{border:1px solid var(--l);border-radius:9px;padding:10px;background:#081019}.ct{display:flex;justify-content:space-between;gap:8px}.cn{font-size:16px;font-weight:900;direction:ltr}.roi{font-size:22px;font-weight:900;direction:ltr}.cg{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;margin-top:8px}.cv{border-top:1px solid var(--l);padding-top:5px;direction:ltr;text-align:right}.links{margin-top:8px;display:flex;gap:6px}.links a{border:1px solid #28506a;padding:6px 8px;border-radius:6px}.bar{align-items:flex-start;flex-direction:column}}</style><style id="w500-sticky-rubric-source">/* W500_FIXED_RUBRIC_V2 */#w500-experiment-rubric{position:fixed!important;top:0!important;left:0!important;right:0!important;width:100%!important;z-index:2147483000!important;background:rgba(2,8,13,.99)!important;box-shadow:0 4px 14px rgba(0,0,0,.55)!important;-webkit-overflow-scrolling:touch!important;box-sizing:border-box!important}body{padding-top:46px!important}</style></head><body><div class="w"><header class="bar"><div><h1>WALLET500 · INTELLIGENCE TERMINAL</h1><div class="mut">Verified Intelligence. The Pure Truth.</div></div><div id="status" class="warn">● SYNC</div></header><section class="kpis"><div class="k"><div class="lab">DISCOVERIES</div><div id="discoveries" class="num">—</div></div><div class="k"><div class="lab">QUALIFIED</div><div id="qualified" class="num">—</div></div><div class="k"><div class="lab">ACTIVE</div><div id="active" class="num">—</div></div><div class="k"><div class="lab">REJECTED</div><div id="rejected" class="num">—</div></div><div class="k"><div class="lab">MIN LIQ</div><div class="num">$50K</div></div><div class="k"><div class="lab">EXPERIMENT</div><div id="exp" class="num">—</div></div></section><section class="panel"><div class="tools"><button class="on" data-f="all">ALL</button><button data-f="solana">SOLANA</button><button data-f="bsc">BSC</button><button data-f="ethereum">ETH</button></div><table class="table"><thead><tr><th class="token">TOKEN</th><th>CHAIN</th><th>SCORE</th><th>PRICE</th><th>LIQUIDITY</th><th>VOL H1</th><th>BUYS</th><th>SELLS</th><th>STATUS</th><th>DEX</th></tr></thead><tbody id="rows"></tbody></table><div id="cards" class="cards"></div><div id="foot" class="foot">טוען נתוני אמת…</div></section></div><script>const $=x=>document.getElementById(x);let ALL=[],filter='all';const n=x=>Number(x||0),usd=x=>'$'+n(x).toLocaleString(undefined,{maximumFractionDigits:n(x)<1?8:0}),short=x=>x?String(x).slice(0,7)+'…'+String(x).slice(-5):'—',dex=x=>'https://dexscreener.com/'+String(x.chain||'').toLowerCase()+'/'+(x.pair_address||x.pair||'');async function get(f){let r=await fetch('../data/'+f+'?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error(f+' '+r.status);return r.json()}function arr(x){return Array.isArray(x)?x:Array.isArray(x.candidates)?x.candidates:Array.isArray(x.items)?x.items:[]}function field(x,...ks){for(let k of ks)if(x[k]!=null)return x[k];return null}function norm(x){return{...x,token:field(x,'token','token_address','mint','address'),chain:String(field(x,'chain','network')||'').toLowerCase(),pair_address:field(x,'pair_address','pair'),score:n(field(x,'final_score','score','intel_score','anomaly_score')),price:n(field(x,'price_usd','current_price_usd','price')),liq:n(field(x,'liquidity_usd','liquidity')),vol:n(field(x,'volume_h1_usd','volume_h1','h1_volume_usd')),buys:n(field(x,'buys_h1','h1_buys','buys')),sells:n(field(x,'sells_h1','h1_sells','sells')),status:String(field(x,'production_status','status','decision')||'QUALIFIED')}}function render(){let a=ALL.filter(x=>filter==='all'||x.chain===filter);$('rows').innerHTML=a.map(x=>`<tr><td class="token">${short(x.token)}</td><td>${x.chain.toUpperCase()}</td><td>${x.score.toFixed(1)}</td><td>${usd(x.price)}</td><td>${usd(x.liq)}</td><td>${usd(x.vol)}</td><td>${x.buys}</td><td>${x.sells}</td><td class="${/fail|reject|block/i.test(x.status)?'neg':/pending|caution|review/i.test(x.status)?'warn':'pos'}">${x.status}</td><td>${x.pair_address?`<a target="_blank" href="${dex(x)}">DEX ↗</a>`:'—'}</td></tr>`).join('');$('cards').innerHTML=a.map(x=>`<article class="card"><div class="ct"><div><div class="cn">${short(x.token)}</div><div class="mut">${x.chain.toUpperCase()} · SCORE ${x.score.toFixed(1)}</div></div><div class="roi ${x.liq>=50000?'pos':'warn'}">${x.status}</div></div><div class="cg"><div><div class="lab">PRICE</div><div class="cv">${usd(x.price)}</div></div><div><div class="lab">LIQ</div><div class="cv">${usd(x.liq)}</div></div><div><div class="lab">VOL H1</div><div class="cv">${usd(x.vol)}</div></div><div><div class="lab">BUYS</div><div class="cv">${x.buys}</div></div><div><div class="lab">SELLS</div><div class="cv">${x.sells}</div></div><div><div class="lab">SCORE</div><div class="cv">${x.score.toFixed(1)}</div></div></div><div class="links">${x.pair_address?`<a target="_blank" href="${dex(x)}">DexScreener ↗</a>`:''}</div></article>`).join('')}async function main(){try{let[r,a,l]=await Promise.all([get('run-summary.json'),get('active-qualified-candidates.json'),get('blocked-cohort-paper-ledger.json')]);ALL=arr(a).map(norm);$('discoveries').textContent=field(r,'market_scan','market_scanned','scanned')??'—';$('qualified').textContent=field(r,'qualified','quality_gate_qualified')??ALL.length;$('active').textContent=field(r,'active_qualified')??ALL.length;$('rejected').textContent=field(r,'rejected')??'—';$('exp').textContent=(l.positions||[]).length+'/10';$('status').textContent='● LIVE';$('status').className='live';$('foot').textContent='Updated '+new Date().toLocaleString()+' · '+ALL.length+' active candidate records';render()}catch(e){$('status').textContent='● DATA ERROR';$('status').className='neg';$('foot').textContent=e.message}}document.querySelectorAll('button').forEach(b=>b.onclick=()=>{document.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');filter=b.dataset.f;render()});main();setInterval(main,60000)</script></body></html>
