<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wallet500 · Narrative Radar</title><style>:root{color-scheme:dark;font-family:Arial}*{box-sizing:border-box}body{margin:0;background:#071018;color:#eef6fb}.w{max-width:980px;margin:auto;padding:12px}.p,.c{background:#0c1720;border:1px solid #243846;border-radius:14px;padding:13px;margin-bottom:10px}.top{display:flex;justify-content:space-between;gap:10px}.muted{color:#8fa7b5}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.k{text-align:center;padding:12px;border:1px solid #29404f;border-radius:11px}.n{font-size:28px;font-weight:900}.green{color:#58e5a8}.orange{color:#ffd166}.red{color:#ff7180}.light{font-size:18px;font-weight:900}.scores{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}.s{border:1px solid #243846;border-radius:8px;padding:7px;text-align:center}.s b{display:block;font-size:17px}.why{margin-top:9px;line-height:1.5}.btn{display:inline-block;color:#61d8ff;text-decoration:none;border:1px solid #31586b;border-radius:8px;padding:7px;margin-top:8px}@media(max-width:650px){.scores{grid-template-columns:1fr 1fr}.top{display:block}}</style></head><body><div class="w"><div class="p"><div class="top"><div><h2 style="margin:0">🧭 NARRATIVE RADAR</h2><div class="muted">סקר שוק חצי־שעתי · הצלבת Social / KOL / News · Research only</div></div><a class="btn" href="/Wallet500/">מסך ראשי</a></div><div id="time" class="muted" style="margin-top:8px">טוען…</div></div><div class="p"><div class="grid"><div class="k"><div class="green">🟢 ירוק</div><div class="n" id="g">—</div></div><div class="k"><div class="orange">🟠 כתום</div><div class="n" id="o">—</div></div><div class="k"><div class="red">🔴 אדום</div><div class="n" id="r">—</div></div></div></div><div id="cards"></div><div class="muted" style="text-align:center">הצבע הוא Narrative Context בלבד ואינו BUY. הוא לעולם לא עוקף Exact Pair, Liquidity ≥ $50K, Security או production gates.</div></div><script>const B='/Wallet500/';const e=s=>String(s??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){try{const q=Date.now(),x=await fetch(B+'data/narrative-decision.json?v='+q,{cache:'no-store'});if(!x.ok)throw Error(x.status);const d=await x.json(),c=d.counts||{};g.textContent=c.GREEN??0;o.textContent=c.ORANGE??0;r.textContent=c.RED??0;time.textContent='עדכון: '+new Date(d.generated_at).toLocaleString('he-IL')+' · כל '+(d.cadence_minutes||30)+' דקות';cards.innerHTML=(d.tokens||[]).map(x=>{const l=x.traffic_light,cl=l==='GREEN'?'green':l==='RED'?'red':'orange',he=l==='GREEN'?'ירוק':l==='RED'?'אדום':'כתום';return `<div class="c"><div class="top"><div><div class="light ${cl}">${l==='GREEN'?'🟢':l==='RED'?'🔴':'🟠'} ${he} · ${e(x.symbol||'TOKEN')}</div><div class="muted">${e(x.name||'')} · Pair ${e(x.pair_address||'—')}</div></div><b>${e(x.market_context)}</b></div><div class="scores"><div class="s">Narrative<b>${e(x.narrative_score)}</b></div><div class="s">Social Accel<b>${e(x.social_acceleration)}</b></div><div class="s">Source Confidence<b>${e(x.source_confidence)}</b></div><div class="s">Hype Risk<b>${e(x.hype_risk)}</b></div></div><div class="why">${e((x.reasons||[]).join(' · '))}</div><div class="muted">מקורות עצמאיים ${e(x.independent_sources)} · Authors ${e(x.independent_authors)} · News ${e(x.news_events)} · Freshness ${e(x.freshness_score)}</div>${x.dex_url?`<a class="btn" target="_blank" rel="noopener" href="${e(x.dex_url)}">DEX ↗</a>`:''}</div>`}).join('')||'<div class="c">אין כרגע מועמדים שעברו לשכבת Narrative.</div>'}catch(err){time.textContent='ממתין ל־Narrative snapshot הראשון';cards.innerHTML='<div class="c orange">ה־workflow עדיין לא פרסם snapshot.</div>'}}load();setInterval(load,60000)</script></body></html>
