<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050b12"><title>Wallet500 Intelligence</title><style>*{box-sizing:border-box}body{margin:0;background:#050b12;color:#eaf7ff;font:14px Arial}.w{max-width:1100px;margin:auto;padding:18px}h1{margin:4px 0;font-size:34px;color:#62e8bc}.tag{color:#9db4c6;margin-bottom:18px}.live{color:#62e8bc}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.c{background:#0b1724;border:1px solid #18344b;border-radius:14px;padding:14px}.n{font-size:27px;font-weight:700}.m{color:#8fa8ba;font-size:12px}.sec{margin-top:18px}h2{font-size:18px}.row{display:grid;grid-template-columns:80px 1fr 70px 70px;gap:8px;align-items:center;border-top:1px solid #173047;padding:11px 0}.buy{color:#62e8bc}.sell{color:#ff7587}.mint{font-family:monospace;overflow:hidden;text-overflow:ellipsis}.pill{background:#10263a;padding:4px 7px;border-radius:8px}.err{color:#ff9b9b}@media(max-width:650px){.grid{grid-template-columns:repeat(2,1fr)}.row{grid-template-columns:55px 1fr 55px 55px}h1{font-size:29px}}</style></head><body><div class="w"><h1>WALLET500 <span class="live">● LIVE</span></h1><div class="tag">Verified Intelligence. The Pure Truth. · Solana Mainnet</div><div class="grid"><div class="c"><div class="m">CANDIDATES</div><div class="n" id="cand">—</div></div><div class="c"><div class="m">ELITE</div><div class="n" id="elite">—</div></div><div class="c"><div class="m">TRADE EVENTS</div><div class="n" id="trades">—</div></div><div class="c"><div class="m">TOKEN SIGNALS</div><div class="n" id="signals">—</div></div></div><div class="sec c"><h2>Live Smart-Money Signals</h2><div id="feed">Loading real engine data…</div></div><div class="sec c"><h2>Engine</h2><div id="engine" class="m">Waiting for first scan…</div></div></div><script>const $=x=>document.getElementById(x),short=x=>x?x.slice(0,6)+'…'+x.slice(-5):'—';async function j(n){let r=await fetch('data/'+n+'?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error(n+' '+r.status);return r.json()}async function load(){try{let [s,g]=await Promise.all([j('run-summary.json'),j('token-signals.json')]);$('cand').textContent=s.wallet_candidates??0;$('elite').textContent=s.tiers?.ELITE??0;$('trades').textContent=s.trade_events??0;$('signals').textContent=s.token_signals??0;$('engine').textContent=`Chain: ${s.chain} · Watchlist: ${s.watchlist} · Scored: ${s.wallets_scored} · Live monitored: ${s.live_monitored} · refreshed ${new Date().toLocaleTimeString()}`;$('feed').innerHTML=g.length?g.slice(0,30).map(x=>`<div class="row"><b class="${x.side==='BUY'?'buy':'sell'}">${x.side}</b><span class="mint" title="${x.mint}">${short(x.mint)}</span><span class="pill">${x.wallet_count}W</span><b>${x.signal_score}</b></div>`).join(''):'No qualifying signals in latest real scan.'}catch(e){$('feed').innerHTML='<span class="err">No published engine data yet. Waiting for first successful scan.</span>';$('engine').textContent=e.message}}load();setInterval(load,60000)</script></body></html>
