<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#03080d">
  <title>Wallet500 Precursor Evidence</title>
  <style>
    :root{--bg:#03080d;--panel:#07131c;--line:#183847;--text:#edfbff;--mut:#7fa0ac;--g:#45e6a0;--y:#ffd166;--r:#ff7085;--c:#42dcff}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -15%,#103342,var(--bg) 45%);color:var(--text);font:13px Arial,sans-serif}.w{max-width:1150px;margin:auto;padding:8px}.hero,.card,.k{background:rgba(7,19,28,.97);border:1px solid var(--line);border-radius:12px}.hero{padding:13px}.title{font-size:22px;font-weight:900}.sub,.mut{color:var(--mut)}.truth{margin-top:7px;color:var(--c);font:700 10px monospace;direction:ltr}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin:7px 0}.k{padding:8px;text-align:center}.lab{font-size:9px;color:var(--mut);font-weight:800}.num{font-size:20px;font-weight:900;direction:ltr;margin-top:3px}.tools{display:flex;gap:6px;margin-bottom:7px}.tools input,.tools select{min-width:0;background:#061018;color:var(--text);border:1px solid #285369;border-radius:8px;padding:9px}.tools input{flex:1}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.card{padding:10px;overflow:hidden}.top{display:flex;justify-content:space-between;gap:8px}.status{font-size:14px;font-weight:900;direction:ltr}.lock{color:var(--g)}.unc{color:var(--r)}.sym{font-size:18px;font-weight:900;direction:ltr}.id{font:9px monospace;color:var(--mut);direction:ltr;word-break:break-all;margin:5px 0}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}.m{background:#071018;border:1px solid #153543;border-radius:7px;padding:6px;text-align:center}.v{font-size:15px;font-weight:900;direction:ltr;margin-top:2px}.t0{margin-top:7px;padding:7px;border:1px solid #31522e;background:#08160f;color:#b9e9c8;font-size:10px;direction:ltr}.chips{display:flex;gap:3px;flex-wrap:wrap;margin-top:6px}.chip{border:1px solid #63303c;color:#ff9aaa;padding:3px 5px;border-radius:5px;font:9px monospace}.empty{text-align:center;color:var(--mut);padding:30px}.foot{color:var(--mut);font-size:10px;padding:10px;text-align:center}@media(max-width:700px){.grid{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}.w{padding:6px}.title{font-size:19px}.metrics{gap:3px}.m{padding:5px 3px}}
  </style>
</head>
<body><main class="w">
  <section class="hero"><div class="title">WALLET500 · PRECURSOR EVIDENCE</div><div class="sub">תמונת האמת מרגע הגילוי: HOLDER · WALLETS · SOCIAL · Exact Mint/Pair · T0 נעול</div><div class="truth">RESEARCH ONLY · NO HINDSIGHT · MISSING ≠ ZERO · UNC CAN NEVER BECOME ACTIONABLE</div></section>
  <section class="kpis"><div class="k"><div class="lab">TARGETS</div><div id="targets" class="num">—</div></div><div class="k"><div class="lab">PAIR LOCKED</div><div id="locked" class="num lock">—</div></div><div class="k"><div class="lab">PRE-BREAKOUT</div><div id="pre" class="num lock">—</div></div><div class="k"><div class="lab">UNC BLOCKED</div><div id="unc" class="num unc">—</div></div></section>
  <div class="tools"><input id="q" placeholder="חיפוש SYMBOL / Mint"><select id="filter"><option value="ALL">כל הסטטוסים</option><option>HIGH_CONVICTION_PRECURSOR</option><option>PRE_BREAKOUT_CANDIDATE</option><option>EARLY_REVIVAL_WATCH</option><option>LATE_MOVE_DO_NOT_CHASE</option><option>IDENTITY_UNVERIFIED_RESEARCH_ONLY</option></select></div>
  <section id="grid" class="grid"><div class="empty">טוען snapshot…</div></section><div id="foot" class="foot">—</div>
</main><script>
const $=x=>document.getElementById(x),N=x=>Number(x||0),esc=x=>String(x??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let D=[],META={};
function value(ch){return ch?.verified===true&&ch.score!=null?N(ch.score).toFixed(0):'—'}
function metric(label,val){return `<div class="m"><div class="lab">${label}</div><div class="v">${val}</div></div>`}
function card(d){const e=d.evidence_snapshot||{},h=e.holders||{},w=e.wallets||{},s=e.social||{},hm=h.metrics||{},wm=w.metrics||{},sm=s.metrics||{},id=d.identity||{},t=d.t0||{},missing=d.missing_evidence||[];return `<article class="card"><div class="top"><div><div class="sym">${esc(d.symbol||'—')}</div><div class="status ${id.actionable_eligible?'lock':'unc'}">${esc(d.status)} · ${id.actionable_eligible?'LOCK':'UNC'}</div></div><div class="mut">ADJ ${N(d.confidence_adjusted_score).toFixed(0)} · COV ${N(d.evidence_coverage_pct).toFixed(0)}%</div></div><div class="id">MINT ${esc(d.token_address)}<br>PAIR ${esc(d.pair_address)}</div><div class="metrics">${metric('HOLDER',value(h))}${metric('WALLETS',value(w))}${metric('SOCIAL',value(s))}${metric('HOLDERS Δ',hm.holder_change_pct==null?'—':N(hm.holder_change_pct).toFixed(3)+'%')}${metric('WALLET Δ',wm.wallet_change_pct==null&&wm.unique_wallet_change_pct==null?'—':N(wm.wallet_change_pct??wm.unique_wallet_change_pct).toFixed(2)+'%')}${metric('MENTIONS',sm.mentions==null?'—':N(sm.mentions).toFixed(0))}${metric('SOC SOURCES',sm.sources==null?'—':N(sm.sources).toFixed(0))}${metric('24H',(N(d.change_24h_pct)>=0?'+':'')+N(d.change_24h_pct).toFixed(1)+'%')}${metric('7D',(N(d.change_7d_pct)>=0?'+':'')+N(d.change_7d_pct).toFixed(1)+'%')}</div><div class="t0">T0 ${esc(t.observed_at||'NOT CAPTURED')} · PRICE ${t.price_usd==null?'—':'$'+N(t.price_usd).toPrecision(5)} · PAIR ${esc(t.pair_address||'—')}</div><div class="chips">${missing.length?missing.map(x=>`<span class="chip">${esc(x)}</span>`).join(''):'<span class="lock">FULL VERIFIED COVERAGE</span>'}</div></article>`}
function render(){const q=$('q').value.trim().toLowerCase(),f=$('filter').value;const rows=D.filter(x=>(f==='ALL'||x.status===f)&&(!q||String(x.symbol||'').toLowerCase().includes(q)||String(x.token_address||'').toLowerCase().includes(q)));$('grid').innerHTML=rows.length?rows.map(card).join(''):'<div class="empty">אין רשומות מתאימות.</div>';$('foot').textContent=`מציג ${rows.length} מתוך ${D.length} · snapshot ${META.generated_at||'—'}`}
async function load(){try{const r=await fetch('../data/revival-precursor-latest.json?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);META=await r.json();if(META.no_hindsight!==true||META.production_portfolio_impact!=='NONE')throw Error('TRUTH CONTRACT REJECTED');D=Array.isArray(META.targets)?META.targets:[];$('targets').textContent=D.length;$('locked').textContent=D.filter(x=>x.identity?.actionable_eligible===true).length;$('pre').textContent=D.filter(x=>['HIGH_CONVICTION_PRECURSOR','PRE_BREAKOUT_CANDIDATE'].includes(x.status)).length;$('unc').textContent=D.filter(x=>x.identity?.actionable_eligible!==true).length;render()}catch(e){$('grid').innerHTML='<div class="empty unc">DATA ERROR · '+esc(e.message)+'</div>'}}
$('q').addEventListener('input',render);$('filter').addEventListener('change',render);load();setInterval(load,30000);
</script></body></html>
